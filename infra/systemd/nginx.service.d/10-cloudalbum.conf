# /etc/systemd/system/nginx.service.d/10-cloudalbum.conf — owned by ec2; modules never add nginx drop-ins.
[Unit]
# certificates (etc/tls) and the deny list live on the data volume (E11)
RequiresMountsFor=/var/lib/cloudalbum

[Service]
# nginx workers are in group cloudalbum (X-Accel-Redirect): hide the group-readable secrets from them (total outline 2.6).
# TLS private keys are in etc/tls/ and stay readable by the root master process. Restart (not reload) nginx after
# secrets.env has been replaced atomically: the mount namespace is built when the service starts.
InaccessiblePaths=-/var/lib/cloudalbum/etc/secrets.env -/var/lib/cloudalbum/etc/keys
