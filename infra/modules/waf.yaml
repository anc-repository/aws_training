AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudAlbum module "waf" - AWS WAF web ACL (managed rule groups, rate-based rules, IP sets, CloudWatch Logs) for the
  CloudFront distribution (stack waf-edge, us-east-1, Scope=CLOUDFRONT) or the ALB (stack waf-regional, Scope=REGIONAL).
  docs/modules/01-edge-network-scaling.md#waf

Metadata:
  CloudAlbum:
    module: waf
    registryVersion: 1
    # One template, two registry stacks (scripts/module selects them by registry stacks[].when; module-hooks/waf.ts):
    #   edge     us-east-1        Scope=CLOUDFRONT  when cdn            -> registry inject WebAclArn -> cdn (the distribution's
    #                                                                     WebACLId; CloudFront does not use WebACLAssociation)
    #   regional the app region   Scope=REGIONAL    when load-balancer  -> WebACLAssociation with the injected AlbArn
    #                                                                     (only with --param AlsoRegional=true when edge exists)
    # Injected parameters: AlbArn (load-balancer). No Export / ImportValue.
    # Tags: stack-level tags from scripts/module (Project, Env, Module, ModuleVersion, ManagedBy; platform mode adds atl:*)
    # propagate to the web ACL, the IP sets and the log group; each resource also carries a Name tag.
    # The IP set names are the fixed names of the module document (cloudalbum-blocklist, cloudalbum-lab-allow; cards B-24).
    # The log group is retained (data protection, 01#waf section 6 "disable"): a re-enable adopts it (CreateLogGroup=false,
    # decided by the scripts/module hook with logs:DescribeLogGroups).
    # WAF writes the CloudWatch Logs resource policy for delivery.logs.amazonaws.com itself when the logging configuration is
    # created (the deployer needs logs:PutResourcePolicy / logs:DescribeResourcePolicies, see labs/svc-waf permissions).

Parameters:
  Env:
    Type: String
    Default: lab
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  ModuleVersion:
    Type: String
    Default: '1'
  StackRole:
    Type: String
    Default: edge
    AllowedValues: [edge, regional]
    Description: registry stack name; part of the IAM policy name so that both stacks can exist side by side
  Scope:
    Type: String
    Default: CLOUDFRONT
    AllowedValues: [CLOUDFRONT, REGIONAL]
    Description: CLOUDFRONT web ACLs, their IP sets and their log group must be in us-east-1
  RuleAction:
    Type: String
    Default: count
    AllowedValues: [count, block]
    Description: >-
      OverrideAction of the AWS managed rule groups (WAF_RULE_ACTION). Start with count, read the COUNT records in the
      log group, then switch to block (scripts/module enable waf --param RuleAction=block).
  RateLimit:
    Type: Number
    Default: 300
    MinValue: 10
    MaxValue: 2000000000
    Description: rate-global - requests per evaluation window per client IP (WAF minimum 10)
  LoginRateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 2000000000
    Description: rate-login - POST /api/auth/* requests per evaluation window per client IP
  RateWindowSec:
    Type: Number
    Default: 300
    AllowedValues: [60, 120, 300, 600]
  RateKey:
    Type: String
    Default: IP
    AllowedValues: [IP, FORWARDED_IP]
    Description: FORWARDED_IP (X-Forwarded-For) for a REGIONAL web ACL on an ALB behind CloudFront
  LabAllowCidr:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$'
    Description: >-
      Lab machine allow list (01 convention 13, WAF_LAB_ALLOW_CIDR): comma separated IPv4 CIDRs, normally empty. The
      allow-lab rule (priority 0, Allow) skips EVERY other rule for these addresses - keep it empty for the waf experiments.
  AlbArn:
    Type: String
    Default: ''
    Description: Injected by load-balancer (REGIONAL scope only)
  CreateLogGroup:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: false = the retained log group of an earlier deployment already exists and is adopted
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Rules:
  EdgeIsCloudFront:
    RuleCondition: !Equals [!Ref StackRole, edge]
    Assertions:
      - Assert: !Equals [!Ref Scope, CLOUDFRONT]
        AssertDescription: the edge stack is the CLOUDFRONT scope
  RegionalIsRegional:
    RuleCondition: !Equals [!Ref StackRole, regional]
    Assertions:
      - Assert: !Equals [!Ref Scope, REGIONAL]
        AssertDescription: the regional stack is the REGIONAL scope

Conditions:
  IsRegional: !Equals [!Ref Scope, REGIONAL]
  ManagedBlock: !Equals [!Ref RuleAction, block]
  UseForwardedIp: !Equals [!Ref RateKey, FORWARDED_IP]
  HasLabAllow: !Not [!Equals [!Ref LabAllowCidr, '']]
  HasAlb: !Not [!Equals [!Ref AlbArn, '']]
  AssociateAlb: !And [!Condition IsRegional, !Condition HasAlb]
  CreateLogs: !Equals [!Ref CreateLogGroup, 'true']

Resources:
  # ---------------------------------------------------------------- IP sets (denylist.conf is the single source)
  BlockIpSet:
    Type: AWS::WAFv2::IPSet
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: cloudalbum-blocklist
      Scope: !Ref Scope
      IPAddressVersion: IPV4
      Addresses: []
      Description: CloudAlbum denylist - synced from security/denylist.conf by the waf BlocklistPort - do not edit by hand
      Tags:
        - { Key: Name, Value: cloudalbum-blocklist }

  LabAllowIpSet:
    Type: AWS::WAFv2::IPSet
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: cloudalbum-lab-allow
      Scope: !Ref Scope
      IPAddressVersion: IPV4
      Addresses: !If [HasLabAllow, !Split [',', !Ref LabAllowCidr], []]
      Description: CloudAlbum lab machine allow list - WAF-LAB-ALLOW-CIDR - normally empty
      Tags:
        - { Key: Name, Value: cloudalbum-lab-allow }

  # ---------------------------------------------------------------- web ACL (console: protection pack)
  WebAcl:
    Type: AWS::WAFv2::WebACL
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub 'cloudalbum-${Env}-acl'
      Scope: !Ref Scope
      Description: !Sub 'CloudAlbum ${Env} - managed rule groups ${RuleAction}, rate-login / rate-global, IP sets'
      # Allowed requests get x-amzn-waf-cloudalbum: inspected (WAF prefixes inserted headers with x-amzn-waf-);
      # Nginx 00-entry.conf then writes "waf" into the entry segment (cloudfront>waf>nginx).
      DefaultAction:
        Allow:
          CustomRequestHandling:
            InsertHeaders:
              - { Name: cloudalbum, Value: inspected }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'cloudalbum-${Env}-acl'
      CustomResponseBodies:
        rate-limited:
          ContentType: APPLICATION_JSON
          Content: '{"error":"RATE_LIMITED","blockedBy":"aws-waf"}'
        forbidden:
          ContentType: APPLICATION_JSON
          Content: '{"error":"FORBIDDEN","blockedBy":"aws-waf"}'
      Rules:
        - Name: allow-lab
          Priority: 0
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt LabAllowIpSet.Arn
              IPSetForwardedIPConfig: !If
                - UseForwardedIp
                - { HeaderName: X-Forwarded-For, FallbackBehavior: NO_MATCH, Position: FIRST }
                - !Ref AWS::NoValue
          Action:
            Allow:
              CustomRequestHandling:
                InsertHeaders:
                  - { Name: cloudalbum, Value: inspected }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: allow-lab }
        - Name: block-ip-set
          Priority: 1
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt BlockIpSet.Arn
              IPSetForwardedIPConfig: !If
                - UseForwardedIp
                - { HeaderName: X-Forwarded-For, FallbackBehavior: NO_MATCH, Position: FIRST }
                - !Ref AWS::NoValue
          Action:
            Block:
              CustomResponse:
                ResponseCode: 403
                CustomResponseBodyKey: forbidden
                ResponseHeaders:
                  - { Name: X-CloudAlbum-Path, Value: 'waf=aws:block-ip-set' }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: block-ip-set }
        - Name: rate-login
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: !Ref LoginRateLimit
              EvaluationWindowSec: !Ref RateWindowSec
              AggregateKeyType: !If [UseForwardedIp, FORWARDED_IP, IP]
              ForwardedIPConfig: !If
                - UseForwardedIp
                - { HeaderName: X-Forwarded-For, FallbackBehavior: MATCH }
                - !Ref AWS::NoValue
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/auth/
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations: [{ Priority: 0, Type: NONE }]
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate-limited
                ResponseHeaders:
                  - { Name: X-CloudAlbum-Path, Value: 'waf=aws:block-rate-login' }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-login }
        - Name: rate-global
          Priority: 3
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              EvaluationWindowSec: !Ref RateWindowSec
              AggregateKeyType: !If [UseForwardedIp, FORWARDED_IP, IP]
              ForwardedIPConfig: !If
                - UseForwardedIp
                - { HeaderName: X-Forwarded-For, FallbackBehavior: MATCH }
                - !Ref AWS::NoValue
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate-limited
                ResponseHeaders:
                  - { Name: X-CloudAlbum-Path, Value: 'waf=aws:block-rate-global' }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-global }
        # AWS managed rule groups: OverrideAction Count while observing (RuleAction=count), None = the group's own actions
        # (Block with the default 403 page: no X-CloudAlbum-Path header; checks use origin-side evidence instead).
        - Name: aws-ip-reputation
          Priority: 4
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          OverrideAction: !If [ManagedBlock, { None: {} }, { Count: {} }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-ip-reputation }
        - Name: aws-crs
          Priority: 5
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # SizeRestrictions_BODY blocks request bodies over 8 KB: photo uploads of storage=local go through
              # /api/storage/upload, so this one rule only counts (01#waf section 2, false-positive experiment).
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          OverrideAction: !If [ManagedBlock, { None: {} }, { Count: {} }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-crs }
        - Name: aws-known-bad-inputs
          Priority: 6
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          OverrideAction: !If [ManagedBlock, { None: {} }, { Count: {} }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-known-bad-inputs }
        - Name: aws-sqli
          Priority: 7
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet }
          OverrideAction: !If [ManagedBlock, { None: {} }, { Count: {} }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-sqli }
      Tags:
        - { Key: Name, Value: !Sub 'cloudalbum-${Env}-acl' }

  AlbAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: AssociateAlb
    Properties:
      ResourceArn: !Ref AlbArn
      WebACLArn: !GetAtt WebAcl.Arn

  # ---------------------------------------------------------------- logs (same region as the web ACL)
  LogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub 'aws-waf-logs-cloudalbum-${Env}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Name, Value: !Sub 'aws-waf-logs-cloudalbum-${Env}' }

  Logging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      # the destination ARN must not end with ":*" (LogGroup.Arn does): build it from the name
      LogDestinationConfigs:
        - !If
          - CreateLogs
          - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroup}'
          - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws-waf-logs-cloudalbum-${Env}'
      RedactedFields:
        - SingleHeader: { Name: authorization }
        - SingleHeader: { Name: cookie }
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition: { Action: BLOCK }
              - ActionCondition: { Action: COUNT }

  # ---------------------------------------------------------------- application policy (attached by scripts/module)
  AppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'cloudalbum-${Env}-waf-${StackRole}'
      Description: !Sub 'CloudAlbum ${Env} waf (${StackRole}) - read the web ACL, sync the denylist into the IP set'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadWebAcl
            Effect: Allow
            Action: [wafv2:GetWebACL, wafv2:GetSampledRequests, wafv2:ListResourcesForWebACL]
            Resource: !GetAtt WebAcl.Arn
          - Sid: SyncIpSets
            Effect: Allow
            Action: [wafv2:GetIPSet, wafv2:UpdateIPSet]
            Resource: [!GetAtt BlockIpSet.Arn, !GetAtt LabAllowIpSet.Arn]
          - Sid: ReadAssociationAndMetrics
            Effect: Allow
            Action: [cloudfront:ListDistributionsByWebACLId, cloudwatch:GetMetricData]
            Resource: '*'

Outputs:
  ModuleId:
    Value: waf
  ModuleVersion:
    Value: !Ref ModuleVersion
  PolicyArn:
    Value: !Ref AppPolicy
  EnvWafMode:
    Value: aws
  EnvWafScope:
    Value: !Ref Scope
  EnvWafWebAclArn:
    Description: injected into cdn (WebAclArn) when WAF_SCOPE=CLOUDFRONT
    Value: !GetAtt WebAcl.Arn
  EnvWafIpSetId:
    Value: !GetAtt BlockIpSet.Id
  EnvWafIpSetName:
    Value: cloudalbum-blocklist
  EnvWafLogGroup:
    Value: !Sub 'aws-waf-logs-cloudalbum-${Env}'
  EnvWafRuleAction:
    Value: !Ref RuleAction
  EnvWafRateLimit:
    Value: !Ref RateLimit
  EnvWafRateWindowSec:
    Value: !Ref RateWindowSec
  EnvWafLabAllowCidr:
    Value: !Ref LabAllowCidr
  InfoStackRole:
    Value: !Ref StackRole
  InfoWebAclName:
    Value: !Sub 'cloudalbum-${Env}-acl'
  InfoWebAclId:
    Value: !GetAtt WebAcl.Id
  InfoBlockIpSetArn:
    Value: !GetAtt BlockIpSet.Arn
  InfoLabAllowIpSetId:
    Value: !GetAtt LabAllowIpSet.Id
  InfoLabAllowIpSetArn:
    Value: !GetAtt LabAllowIpSet.Arn
  InfoLogGroupArn:
    Value: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws-waf-logs-cloudalbum-${Env}'
  InfoAssociation:
    Value: !If
      - IsRegional
      - !If [HasAlb, !Sub 'WebACLAssociation -> ${AlbArn}', 'none (inject AlbArn from load-balancer)']
      - 'CloudFront distribution WebACLId (registry inject WebAclArn -> cdn)'
  InfoRateKey:
    Value: !Ref RateKey
