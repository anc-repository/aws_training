# units: worker
# /etc/systemd/system/cloudalbum-worker.service.d/50-image-processing.conf — image-processing (worker tier) drop-in
# (registry systemdDropIns; 04#image-processing section 1). With cgroup v2, CPUWeight lets the API process win the CPU
# while thumbnails are rendered in the worker; Nice only acts inside the same cgroup, so both are set.
[Service]
CPUWeight=20
Nice=10
MemoryMax=1G
