AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudAlbum module "database" - Amazon RDS for PostgreSQL 16 (single-AZ by default, optional Multi-AZ and read
  replica), private, TLS enforced. docs/modules/03-data-storage.md#database

Metadata:
  CloudAlbum:
    module: database
    registryVersion: 1
    # Injected parameters: VpcId, SubnetIds (network data subnets; base context = default VPC subnets in >= 2 AZs),
    # KmsKeyArn (kms; must exist before the instance is created - kms.orderBefore), ClientSecurityGroupIds and
    # IamDatabaseAuthentication (db-proxy). Secret parameter: MasterUserPassword (logical name db-password; only
    # when the secrets module is not enabled - otherwise ManageMasterPassword=true and RDS manages the secret).

Parameters:
  Env:
    Type: String
    Default: lab
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  ModuleVersion:
    Type: String
    Default: '1'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs (DB subnet group requirement)
  InstanceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceAz:
    Type: String
    Default: ''
    Description: AZ of the EC2 instance; single-AZ RDS is placed there (fair latency comparison, no cross-AZ traffic)
  ClientSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Extra 5432 sources (db-proxy injects the RDS Proxy security group). Up to two entries.
  IamDatabaseAuthentication:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  MultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  CreateReadReplica:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  EngineVersion:
    Type: String
    Default: '16'
    AllowedPattern: '^16(\.[0-9]+)?$'
    Description: PostgreSQL 16 (the parameter group family is postgres16)
  DbName:
    Type: String
    Default: cloudalbum
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  DbUser:
    Type: String
    Default: cloudalbum
    AllowedPattern: '^[a-z][a-z0-9_]{0,15}$'
  ManageMasterPassword:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: true when the secrets module is enabled (RDS-managed master secret in Secrets Manager)
  MasterUserPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Generated by scripts/module (secretParams db-password); also written to secrets.env DB_PASSWORD
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  KmsKeyArn:
    Type: String
    Default: ''

Rules:
  PasswordWhenNotManaged:
    RuleCondition: !Equals [!Ref ManageMasterPassword, 'false']
    Assertions:
      - Assert: !Not [!Equals [!Ref MasterUserPassword, '']]
        AssertDescription: MasterUserPassword is required unless ManageMasterPassword=true

Conditions:
  IsMultiAz: !Equals [!Ref MultiAz, 'true']
  HasInstanceAz: !Not [!Equals [!Ref InstanceAz, '']]
  PinAz: !And [!Not [!Condition IsMultiAz], !Condition HasInstanceAz]
  HasReplica: !Equals [!Ref CreateReadReplica, 'true']
  HasKms: !Not [!Equals [!Ref KmsKeyArn, '']]
  Managed: !Equals [!Ref ManageMasterPassword, 'true']
  ManagedWithKms: !And [!Condition Managed, !Condition HasKms]
  HasClientSg1: !Not [!Equals [!Join ['', !Ref ClientSecurityGroupIds], '']]
  HasClientSg2: !Not
    - !Equals
      - !Select [1, !Split [',', !Sub ['${J},', { J: !Join [',', !Ref ClientSecurityGroupIds] }]]]
      - ''

Resources:
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'cloudalbum-${Env}-database'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref InstanceSecurityGroupId
          Description: CloudAlbum instance
      Tags:
        - { Key: Name, Value: !Sub 'cloudalbum-${Env}-database' }

  ClientIngress1:
    Condition: HasClientSg1
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Select [0, !Ref ClientSecurityGroupIds]
      Description: injected client (db-proxy)

  ClientIngress2:
    Condition: HasClientSg2
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Select [1, !Ref ClientSecurityGroupIds]
      Description: injected client (db-proxy)

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'cloudalbum-${Env}-database'
      SubnetIds: !Ref SubnetIds

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub 'cloudalbum-${Env}-database (postgres16)'
      Family: postgres16
      Parameters:
        rds.force_ssl: '1'                      # default since PostgreSQL 15; written out so learners can see it
        log_min_duration_statement: '500'       # slow query log (ms)

  DbInstance:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint: { config: { ignore_checks: [W1011] } }   # secretParams are NoEcho parameters by design (9.1, D5)
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'cloudalbum-${Env}-database'
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      StorageType: gp3
      AllocatedStorage: !Ref AllocatedStorage
      StorageEncrypted: true
      KmsKeyId: !If [HasKms, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
      EnableIAMDatabaseAuthentication: !Ref IamDatabaseAuthentication
      PubliclyAccessible: false
      MultiAZ: !Ref MultiAz
      AvailabilityZone: !If [PinAz, !Ref InstanceAz, !Ref 'AWS::NoValue']
      DBName: !Ref DbName
      MasterUsername: !Ref DbUser
      ManageMasterUserPassword: !If [Managed, true, false]
      MasterUserPassword: !If [Managed, !Ref 'AWS::NoValue', !Ref MasterUserPassword]
      MasterUserSecret: !If [ManagedWithKms, { KmsKeyId: !Ref KmsKeyArn }, !Ref 'AWS::NoValue']
      DBParameterGroupName: !Ref DbParameterGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: '18:00-18:30'            # UTC = 03:00 Asia/Tokyo
      PreferredMaintenanceWindow: 'sun:19:00-sun:19:30'
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: false                       # disable --purge takes a final snapshot (DeletionPolicy: Snapshot)
      Tags:
        - { Key: Backup, Value: 'true' }
        - { Key: DataClass, Value: metadata }

  ReadReplica:
    Condition: HasReplica
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete                            # a replica holds no unique data
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub 'cloudalbum-${Env}-database-replica'
      SourceDBInstanceIdentifier: !Ref DbInstance
      DBInstanceClass: !Ref DbInstanceClass
      StorageType: gp3
      KmsKeyId: !If [HasKms, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
      PubliclyAccessible: false
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      DBParameterGroupName: !Ref DbParameterGroup
      AutoMinorVersionUpgrade: true
      Tags:
        - { Key: DataClass, Value: metadata }

  AppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'cloudalbum-${Env}-database'   # attached by scripts/module (D2)
      Description: CloudAlbum database module - deep probe (and the RDS-managed master secret when enabled)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DeepProbe
            Effect: Allow
            Action: rds:DescribeDBInstances
            Resource: '*'
          - !If
            - Managed
            - Sid: ManagedMasterSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbInstance.MasterUserSecret.SecretArn
            - !Ref 'AWS::NoValue'
          - !If
            - ManagedWithKms
            - Sid: ManagedMasterSecretKms
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref KmsKeyArn
            - !Ref 'AWS::NoValue'

Outputs:
  ModuleId:
    Value: database
  ModuleVersion:
    Value: !Ref ModuleVersion
  PolicyArn:
    Value: !Ref AppPolicy
  EnvDbDriver:
    Value: postgres
  EnvDbHost:
    Value: !GetAtt DbInstance.Endpoint.Address
  EnvDbPort:
    Value: !GetAtt DbInstance.Endpoint.Port
  EnvDbName:
    Value: !Ref DbName
  EnvDbUser:
    Value: !Ref DbUser
  EnvDbSsl:
    Value: require
  EnvDbSslCa:
    Description: Public RDS CA bundle downloaded by scripts/module (not a secret)
    Value: /etc/cloudalbum/rds-ca.pem
  EnvDbPasswordSecretArn:
    Condition: Managed
    Value: !GetAtt DbInstance.MasterUserSecret.SecretArn
  EnvDbReadHost:
    Condition: HasReplica
    Value: !GetAtt ReadReplica.Endpoint.Address
  InfoDbInstanceId:
    Value: !Ref DbInstance
  InfoMultiAz:
    Value: !Ref MultiAz
  InfoReadReplicaId:
    Condition: HasReplica
    Value: !Ref ReadReplica
