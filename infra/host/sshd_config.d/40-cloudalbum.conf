# /etc/ssh/sshd_config.d/40-cloudalbum.conf — owned by ec2 (L0 hardening; smoke test S10).
# Installed by install-host-files.sh and activated only after `sshd -t` succeeds.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowUsers ec2-user
