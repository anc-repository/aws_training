# /etc/fail2ban/action.d/cloudalbum-denylist.conf — owned by ec2.
# Used for HTTP jails when the instance sits behind cdn / load-balancer: nftables would ban the proxy address (= every
# user), so the real client address (after realip) is written to the single Nginx deny list instead (05#threat-detection).
# The cloudalbum-denylist.path unit validates the file and reloads Nginx.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/lib/cloudalbum/denylist-edit.sh add <ip> fail2ban:<name>
actionunban = /usr/local/lib/cloudalbum/denylist-edit.sh remove <ip>
