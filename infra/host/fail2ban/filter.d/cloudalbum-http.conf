# /etc/fail2ban/filter.d/cloudalbum-http.conf — owned by ec2. Reads the Nginx JSON access log (cloudalbum_json).
# The leading field order "ts","rid","ip" is the contract with infra/nginx/cloudalbum.conf; the regex never anchors
# on the last field, so fields appended later (PM-18) do not break it.
# Matches authentication failures and requests rejected by the local WAF stand-in (401 / 403 / 429).
[Definition]
failregex = ^\{"ts":"[^"]*","rid":"[^"]*","ip":"<HOST>",.*"status":(401|403|429),
ignoreregex = "uri":"/(assets|media)/
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S
