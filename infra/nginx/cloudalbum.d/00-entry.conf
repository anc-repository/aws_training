# /etc/nginx/cloudalbum.d/00-entry.conf — owned by ec2 (00-ec2-base.md 6.7). Every map / geo below is defined ONCE here;
# modules can only fill the slot files it includes (slot-alb-hops.inc: load-balancer, slot-origin-verify.inc: cdn,
# slot-atl-frame-ancestors.inc: platform:apply-env). Module variables use the $ca_<id>_* prefix.

# Previous hop (the TCP peer before realip rewrote $remote_addr) belongs to the ALB VPC
geo $realip_remote_addr $ca_hop_vpc {
    default 0;
    include /etc/nginx/cloudalbum.d/slot-alb-hops.inc;
}

# Valid X-Origin-Verify (shared by the cdn 8080 listener and the CloudFront -> ALB entry)
map $http_x_origin_verify $ca_cdn_verified {
    default 0;
    include /etc/nginx/cloudalbum.d/slot-origin-verify.inc;
}

map $server_port $ca_via8080 {
    default 0;
    8080    1;
}

# entry segment of X-CloudAlbum-Path (total outline 7.2)
map "$ca_via8080$ca_hop_vpc$ca_cdn_verified:$http_x_amzn_trace_id" $ca_entry_base {
    default        nginx;
    "~^1"          "cloudfront>nginx";
    "~^010:.+"     "alb>nginx";
    "~^011:.+"     "cloudfront>alb>nginx";
}

# waf is written right after the resource it is attached to (01 convention 4)
map "$ca_entry_base:$http_x_amzn_waf_cloudalbum" $ca_entry {
    default                            $ca_entry_base;
    "cloudfront>nginx:inspected"       "cloudfront>waf>nginx";
    "cloudfront>alb>nginx:inspected"   "cloudfront>waf>alb>nginx";
    "alb>nginx:inspected"              "alb>waf>nginx";
}

# protocol seen by the client (01 convention 3)
map "$ca_via8080$ca_hop_vpc$ca_cdn_verified" $ca_proto {
    default  $scheme;
    "~^1"    https;
    "010"    $http_x_forwarded_proto;
    "011"    https;
}

# waf segment of the JSON 403 page
map "$ca_denied$ca_block" $ca_waf_seg {
    default "";
    "~^1"   ";waf=nginx:denylist";
    "01"    ";waf=nginx:badinput";
}

# ---- platform-mode revision (PM-18..20); active in both modes ----

# query strings with signatures / codes / tokens are never logged
map $args $ca_log_args {
    default $args;
    "~*(^|&)(sig|signature|token|code|state|x-amz-[a-z0-9-]*)=" "[redacted]";
}

# only a well-formed experiment run ID (ULID, 06 PM-18) is logged
map $http_x_experiment_run $ca_log_run {
    default "";
    "~^[0-9A-HJKMNP-TV-Z]{26}$" $http_x_experiment_run;
}

# platform probe requests
map "$http_x_atl_probe_token$http_x_atl_probe_nonce" $ca_probe {
    default 1;
    ""      0;
}

# plain-text DIRECT requests that the tls module may redirect (06 PM-19; TLS_FORCE_HTTPS fragments must use this variable):
# loopback (ATL-RunCheck and the local CLI use http://127.0.0.1/) and ACME HTTP-01 are never redirected; requests through
# CloudFront / ALB are not direct (their entry is not "nginx"). $realip_remote_addr is the TCP peer, so a forged
# X-Forwarded-For cannot claim loopback. The first matching regex wins.
map "$ca_proto|$ca_entry|$realip_remote_addr|$uri" $ca_https_redirect {
    default 0;
    "~^http\|nginx\|(127\.[0-9.]+|::1)\|"                     0;
    "~^http\|nginx\|[^|]*\|/\.well-known/acme-challenge/"     0;
    "~^http\|nginx\|"                                         1;
}

# Content-Security-Policy frame-ancestors for HTML responses (empty = header not sent)
map "" $ca_frame_csp {
    default "";
    include /etc/nginx/cloudalbum.d/slot-atl-frame-ancestors.inc;
}
