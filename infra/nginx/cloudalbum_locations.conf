# /etc/nginx/cloudalbum_locations.conf — owned by ec2; modules must not edit it (modular-design.md 2.5).
# Included by the 80/443 server (conf.d/cloudalbum.conf) and by the cdn 8080 origin server.

# Errors produced by Nginx itself are JSON and carry the waf segment (01#waf; 00-ec2-base.md 6.7)
error_page 429 @ca_429;
error_page 403 @ca_403;
# total outline 5.3: when the api exits with 78 (configuration rejected) the page tells the operator to run check-config
error_page 502 504 /_ca_errors/upstream.html;
location @ca_429 { default_type application/json;
                   add_header X-CloudAlbum-Path "entry=$ca_entry;waf=nginx:ratelimit" always;
                   return 429 '{"error":"RATE_LIMITED"}'; }
location @ca_403 { default_type application/json;
                   add_header X-CloudAlbum-Path "entry=$ca_entry$ca_waf_seg" always;
                   return 403 '{"error":"FORBIDDEN"}'; }
location = /_ca_errors/upstream.html { internal; root /opt/cloudalbum/infra/nginx;
                                       add_header Cache-Control "no-store" always;
                                       add_header Content-Security-Policy $ca_frame_csp always; }

# 1) SPA: hashed static assets are immutable, index.html is never cached; static files only carry the entry segment
location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable";
                         add_header X-CloudAlbum-Path "entry=$ca_entry"; try_files $uri =404; }
location = /index.html { add_header Cache-Control "no-cache"; add_header X-CloudAlbum-Path "entry=$ca_entry";
                         add_header Content-Security-Policy $ca_frame_csp always; }
location /             { try_files $uri $uri/ /index.html; }

# 2) API: general rate limit; authentication endpoints are stricter
location /api/auth/          { limit_req zone=ca_auth burst=5 nodelay;  include /etc/nginx/cloudalbum_proxy.conf; }
location /api/storage/upload { limit_req zone=ca_api burst=20 nodelay; proxy_request_buffering off;
                               include /etc/nginx/cloudalbum_proxy.conf; }
location /api/               { limit_req zone=ca_api burst=40 nodelay; include /etc/nginx/cloudalbum_proxy.conf; }
location /social/            { limit_req zone=ca_api burst=40 nodelay; include /etc/nginx/cloudalbum_proxy.conf; }
# ES256 public keys of auth=local (D8); exact match so the SPA fallback never swallows it
location = /.well-known/jwks.json { include /etc/nginx/cloudalbum_proxy.conf; }

# 3) Media: Node checks signature and permission, then answers X-Accel-Redirect; Nginx sends the file (zero copy).
#    Requires: nginx worker in group cloudalbum, directories 750, files 640 (UMask=0027 of the units, D6)
location /media/ { include /etc/nginx/cloudalbum_proxy.conf; }
location /_media_local/public/  { internal; alias /var/lib/cloudalbum/uploads/;
                                  add_header Cache-Control "public, max-age=86400"; }
location /_media_local/private/ { internal; alias /var/lib/cloudalbum/uploads/;
                                  add_header Cache-Control "private, max-age=300"; }
location /_media_efs/public/    { internal; alias /mnt/efs/cloudalbum/uploads/;
                                  add_header Cache-Control "public, max-age=86400"; }
location /_media_efs/private/   { internal; alias /mnt/efs/cloudalbum/uploads/;
                                  add_header Cache-Control "private, max-age=300"; }

# 4) Internal endpoints: exact locations generated from modules/registry.yaml internalEndpoints; every other
#    /internal/ path is 404. Node answers 404 when the module (or variant) is not enabled; HMAC is checked in Node
#    with a per-endpoint logical secret. Regenerate with: scripts/module nginx-internal-endpoints --write
# BEGIN internal-endpoints
location = /internal/legacy-auth { include /etc/nginx/cloudalbum-vpc-cidr.inc; deny all;   # auth, vpc-hmac (internal-hmac-key)
                                   include /etc/nginx/cloudalbum_proxy.conf; }
location = /internal/hooks/image-processed { include /etc/nginx/cloudalbum_proxy.conf; }   # image-processing, public-hmac (callback-hmac-key)
# END internal-endpoints
location ^~ /internal/ { return 404; }

# 5) Prometheus text metrics, local only
location = /metrics { allow 127.0.0.1; deny all; include /etc/nginx/cloudalbum_proxy.conf; }

# local health check of Nginx itself (ec2 detector, check "nginx")
location = /_ca/nginx-health { allow 127.0.0.1; allow ::1; deny all; access_log off; return 204; }

location ~ /\.(?!well-known) { deny all; }
