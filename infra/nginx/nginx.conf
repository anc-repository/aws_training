# /etc/nginx/nginx.conf — owned by ec2 (00-ec2-base.md 6.7, E10).
# Replaces the AL2023 distribution default: the default file ships its own `listen 80` server block that would
# conflict with (or win over) the `default_server` in conf.d/cloudalbum.conf.
user nginx;
worker_processes auto;
# fail2ban's nginx-limit-req jail reads this file
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    types_hash_max_size 4096;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Without any set_real_ip_from (L0, direct access) these have no effect. Trusted proxy ranges are added by
    # modules: load-balancer (cloudalbum.d/load-balancer-realip.conf) and cdn (inside its 8080 server block only).
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
