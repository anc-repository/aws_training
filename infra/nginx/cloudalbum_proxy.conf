# /etc/nginx/cloudalbum_proxy.conf — owned by ec2 (modular-design.md 2.5). Included inside locations.
proxy_pass http://cloudalbum_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# already resolved by realip to the real client address: Node only ever sees one address (trust proxy = loopback)
proxy_set_header X-Forwarded-For $remote_addr;
# computed per entry by 00-entry.conf (direct = $scheme; behind CloudFront / ALB = the trusted value)
proxy_set_header X-Forwarded-Proto $ca_proto;
proxy_set_header X-Request-Id $request_id;
# entry segment of X-CloudAlbum-Path (Node trusts it only from loopback; missing = entry=direct on dev machines)
proxy_set_header X-CloudAlbum-Entry $ca_entry;
# PM-18 (both modes): only echoed by /api/lab/probe/echo; the application must never trust it
proxy_set_header X-CA-Received-XFF $http_x_forwarded_for;
proxy_read_timeout 60s;
