# /etc/nginx/cloudalbum.server.d/00-acme-challenge.conf — owned by ec2 (80/443 only).
# Let's Encrypt HTTP-01 and certbot --webroot -w /var/lib/cloudalbum/acme (tls local tier / ACM ACME).
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/cloudalbum/acme;
    default_type text/plain;
    try_files $uri =404;
}
