# /etc/nginx/conf.d/cloudalbum.conf — owned by ec2 (modular-design.md 2.5; 00-ec2-base.md 6.7). Modules must not edit it.

# JSON access log: records headers injected by CloudFront / ALB for detectors, fail2ban and /lab statistics.
# The field ORDER is the fail2ban filter contract (infra/host/fail2ban/filter.d/cloudalbum-http.conf): only append.
# args / port / run / probe were appended by the platform-mode revision (PM-18, active in both modes).
log_format cloudalbum_json escape=json
  '{"ts":"$time_iso8601","rid":"$request_id","ip":"$remote_addr","xff":"$http_x_forwarded_for",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"urt":"$upstream_response_time","cf_id":"$http_x_amz_cf_id",'
  '"via":"$http_via","alb_trace":"$http_x_amzn_trace_id","path":"$upstream_http_x_cloudalbum_path",'
  '"args":"$ca_log_args","port":"$server_port","run":"$ca_log_run","probe":"$ca_probe"}';

limit_req_zone $binary_remote_addr zone=ca_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=ca_auth:10m rate=2r/s;
limit_req_status 429;

# Local stand-in for WAF: minimal signature blocking (a demo, not real protection)
map $request_uri $ca_block {
    default 0;
    "~*(union(\s|%20|\+)+select|<script|%3cscript|\.\./|%2e%2e%2f)" 1;
}

# The single IP deny list: written by the waf baseline (BlocklistPort=nginx) and by fail2ban's cloudalbum-denylist action.
# Each line "<IP or CIDR> 1;". cloudalbum-denylist.path validates it line by line before `nginx -t && reload`.
geo $ca_denied {
    default 0;
    include /var/lib/cloudalbum/security/denylist.conf;
}

upstream cloudalbum_api {
    # L0: server 127.0.0.1:3000; load-balancer local tier (LB_LOCAL_WORKERS=2) adds 3001
    include /etc/nginx/cloudalbum_upstream.conf;
    keepalive 32;
}

# http-level fragments: 00-entry.conf (ec2: $ca_entry, $ca_proto, ...) and <id>-*.conf (modules, e.g. the cdn 8080 server)
include /etc/nginx/cloudalbum.d/*.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # nginx < 1.25.1: install-host-files.sh rewrites this into `listen 443 ssl http2`
    http2 on;
    server_name _;
    server_tokens off;

    # self-signed in L0; the tls module only switches the two symlinks (letsencrypt | acm ACME)
    ssl_certificate     /etc/cloudalbum/tls/server.crt;
    ssl_certificate_key /etc/cloudalbum/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ca_ssl:5m;

    access_log /var/lib/cloudalbum/logs/nginx-access.json cloudalbum_json;
    client_max_body_size 30m;
    root /opt/cloudalbum/frontend/dist;

    if ($ca_denied) { return 403; }
    if ($ca_block)  { return 403; }

    # every location: shared by 80/443 and by the cdn 8080 listener
    include /etc/nginx/cloudalbum_locations.conf;
    # server-level fragments (80/443 only): 00-acme-challenge.conf (ec2), <id>-*.conf (modules)
    include /etc/nginx/cloudalbum.server.d/*.conf;
}
