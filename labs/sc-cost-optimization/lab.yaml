# labs/sc-cost-optimization/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: sc-cost-optimization
kind: scenario
version: 0.1.0
status: planned
title: 成本优化
subtitle: Budgets + Cost Explorer + S3 存储类别 + Spot / Graviton
summary: 先装护栏、再找钱花在哪，然后从存储类别、处理器架构与购买方式三个方向各省一次，并且清楚每种省法的代价
story: 项目上线三个月后，月账单比预期高出一截，但没人说得清钱花在哪：有人忘了关的实验资源，有人把所有原图都放在 S3 Standard，所有服务器都是 x86 按需实例。CFO 要求两件事：第一，以后超支之前要有人收到通知；第二，在不影响用户的前提下给出三条立竿见影的降本措施，并说明每条措施的风险。
scenario: {question: 一个视频转码服务：任务可以重试，处理量随白天上传量波动很大；另有一组稳定运行 24 小时的 API 服务器，预计三年不变。哪种购买方式组合成本最低且风险可控？}
difficulty: intermediate
estimatedMinutes: 120
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: budgets, role: primary, module: cost}
- {id: cost-explorer, role: supporting}
- id: s3
  role: supporting
  module: storage
  creditBy: [storage-classes]
- id: ec2
  role: supporting
  module: ec2
  creditBy: [graviton]
- {id: iam, role: context, module: iam}
modules:
  target: [cost]
  start: [iam]
  context: [storage]
  related: []
prerequisites:
  cards:
  - {id: svc-cost, kind: soft}
  - {id: svc-storage, kind: soft}
  learnerInputs:
  - {id: budget-amounts}
  - {id: alert-email}
  - {id: cost-tags-active}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - item: storage
    kind: module
    basis: context
    contextKind: protected-data
    set: {STORAGE_DRIVER: s3}
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: cost, driver: budgets}
expectedWarnings: []
cost: {tier: medium, tierWithOptional: high}
provision: {class: A}
platformOps:
- id: cost-activate-tags
  op: enable
  module: cost
  args: {activateCostAllocationTags: true}
  title: 激活成本分配标签
  optional: true
badge: {title: 成本优化, short: 省钱}
tracks: [cost-optimized, saa-main]
saa:
  domains: [cost, performance]
tags: [cost]
certificate: {enabled: false}
