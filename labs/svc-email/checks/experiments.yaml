checks:
  - id: exp-send-matrix-before
    title:
      zh-CN: send-matrix 的 before（outbox：全部写入本机）有一条有效结果
      ja: send-matrix の before（outbox：すべてローカルに書き込み）に有効な結果が 1 件ある
      en: "send-matrix has a valid before result (outbox: everything written locally)"
    type: experiment
    module: email
    experiment: send-matrix
    label: before
    accept: [valid]

  - id: exp-send-matrix-pair
    title:
      zh-CN: send-matrix 的 before 与 after 都有效且可比
      ja: send-matrix の before と after がどちらも有効で比較可能
      en: send-matrix before and after are both valid and comparable
    type: experiment
    module: email
    experiment: send-matrix
    pair: [before, after]
    accept: [valid]

  - id: exp-sandbox-after
    title:
      zh-CN: sandbox（发给未验证地址）有一条有效结果
      ja: sandbox（未検証のアドレスへの送信）に有効な結果が 1 件ある
      en: sandbox has a valid result (sending to an unverified address)
    type: experiment
    module: email
    experiment: sandbox
    label: after
    accept: [valid]

  - id: exp-register-after
    title:
      zh-CN: register-latency 的 after 有一条有效结果
      ja: register-latency の after に有効な結果が 1 件ある
      en: register-latency has a valid after result
    type: experiment
    module: email
    experiment: register-latency
    label: after
    required: false
    accept: [valid]
