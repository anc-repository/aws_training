checks:
  - id: exp-send-matrix-before
    title: send-matrix 的 before（outbox：全部写入本机）有一条有效结果
    type: experiment
    module: email
    experiment: send-matrix
    label: before
    accept: [valid]

  - id: exp-send-matrix-pair
    title: send-matrix 的 before 与 after 都有效且可比
    type: experiment
    module: email
    experiment: send-matrix
    pair: [before, after]
    accept: [valid]

  - id: exp-sandbox-after
    title: sandbox（发给未验证地址）有一条有效结果
    type: experiment
    module: email
    experiment: sandbox
    label: after
    accept: [valid]

  - id: exp-register-after
    title: register-latency 的 after 有一条有效结果
    type: experiment
    module: email
    experiment: register-latency
    label: after
    required: false
    accept: [valid]
