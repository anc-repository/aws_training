# labs/svc-workflow/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-workflow
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: AWS Step Functions
  ja: AWS Step Functions
  en: AWS Step Functions
function:
  zh-CN: 照片处理流程编排
  ja: 写真処理フローのオーケストレーション
  en: Photo processing orchestration
title:
  zh-CN: AWS Step Functions：照片处理流程编排
  ja: AWS Step Functions：写真処理フローのオーケストレーション
  en: "AWS Step Functions: photo processing orchestration"
summary:
  zh-CN: 把“缩略图 → 决定 → 写回”的编排从 EC2 进程内搬到 Step Functions：每一步的重试都看得见，EC2 上的应用中断时流程照样跑完。
  ja: 「サムネイル → 判定 → 書き戻し」のオーケストレーションを EC2 のプロセス内から Step Functions に移します。各ステップの再試行が見えるようになり、EC2 上のアプリが止まってもフローは最後まで実行されます。
  en: 'Move the "thumbnail → decide → write back" orchestration out of the EC2 process into Step Functions: every retry becomes visible, and the flow still finishes when the app on EC2 goes down.'
difficulty: intermediate
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- id: stepfunctions
  name:
    zh-CN: AWS Step Functions
    ja: AWS Step Functions
    en: AWS Step Functions
  role: primary
  module: workflow
- {id: iam, role: context, module: iam}
- {id: s3, role: context, module: storage}
modules:
  target: [workflow]
  start: [iam, storage]
  context: []
  related: [image-processing, queue]
prerequisites:
  cards:
  - {id: svc-storage, kind: soft}
  - {id: svc-image-processing, kind: soft}
  - {id: sc-image-pipeline, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: storage
    kind: module
    basis: closure
    rule: DEP-034
    set: {STORAGE_DRIVER: s3}
  - item: image-processing
    kind: local
    set: {IMAGE_PROCESSOR: worker}
  - item: queue
    kind: local
    set: {QUEUE_DRIVER: memory}
  - {item: featureFlags.lab.faults, kind: runtime, value: true}
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: workflow, driver: stepfunctions}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge:
  title:
    zh-CN: 流程编排
    ja: フローのオーケストレーション
    en: Workflow orchestration
tracks: [resilient, saa-main, serverless]
saa:
  domains: [resilient, performance]
tags: [workflow, stepfunctions]
certificate: {enabled: false}
