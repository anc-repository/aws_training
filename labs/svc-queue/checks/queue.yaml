checks:
  # ---- 起始状态（before 一律 once）
  - id: queue-memory-baseline
    title:
      zh-CN: 起始状态：任务队列是 api 进程内的 memory 本地档
      ja: 開始状態：ジョブキューは api プロセス内の memory ローカル階層
      en: "Start state: the job queue is the local memory tier inside the api process"
    type: capability
    module: queue
    drift: { policy: once }
    assert:
      - path: $.driver
        op: eq
        value: memory
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver
      - path: $.status
        op: eq
        value: 'off'
        label:
          zh-CN: 模块状态（本地档不是 AWS 实现）
          ja: モジュールの状態（ローカル階層は AWS の実装ではない）
          en: Module status (the local tier is not an AWS implementation)
    explain:
      zh-CN: memory 是本地档：任务排在 api 进程的内存里，接口立即返回，但进程一重启就丢。
      ja: memory はローカル階層です。ジョブは api プロセスのメモリに並び、API はすぐに応答しますが、プロセスが再起動すると失われます。
      en: "memory is a local tier: jobs wait in the api process's memory and the API returns immediately, but they are lost when the process restarts."

  - id: worker-tier
    title:
      zh-CN: 缩略图由独立的 worker 进程生成
      ja: サムネイルは独立した worker プロセスが生成する
      en: Thumbnails are generated by a separate worker process
    type: capability
    module: image-processing
    drift: { policy: once }
    assert:
      - path: $.driver
        op: eq
        value: worker
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver
    explain:
      zh-CN: worker 档让缩略图离开请求路径，批量上传时才能看出队列的作用。
      ja: worker 階層によってサムネイル生成がリクエストの経路から外れ、一括アップロード時にキューの効果が見えるようになります。
      en: The worker tier takes thumbnails off the request path, so the queue's effect shows during bulk uploads.

  # ---- 接入 SQS
  - id: queue-wired
    title:
      zh-CN: queue 已切换到 SQS，且状态正常
      ja: queue が SQS に切り替わり、状態が正常
      en: queue has switched to SQS and is healthy
    type: capability
    module: queue
    drift: { policy: must-hold, monitor: true }
    assert:
      - path: $.driver
        op: eq
        value: sqs
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver
      - path: $
        op: healthy
        label:
          zh-CN: 状态正常（本卡 expectedWarnings 为空，即必须是 ok）
          ja: 状態が正常（このカードの expectedWarnings は空なので ok でなければならない）
          en: Healthy (this card's expectedWarnings is empty, so it must be ok)
    reproduce: { run: 'curl -s http://127.0.0.1/api/capabilities | jq ".modules.queue | {driver, status, detail}"', runsOn: lab }

  - id: queue-path-seen
    title:
      zh-CN: 最近的真实请求把任务投进了 SQS
      ja: 最近の実際のリクエストがジョブを SQS に送った
      en: A recent real request sent a job to SQS
    type: local
    on: lab
    checkId: path-seen
    args: { segment: queue, pattern: 'sqs:queued', window: 15m, minCount: 1, excludeProbe: true }
    dependsOn: [queue-wired]
    drift: { policy: once }
    assert:
      - path: $.count
        op: gte
        value: 1
        label:
          zh-CN: 出现 queue=sqs:queued 的请求数
          ja: queue=sqs:queued が現れたリクエストの数
          en: Number of requests showing queue=sqs:queued
    explain:
      zh-CN: 在应用预览里上传任意一张照片即可满足；路径签名由应用按实际调用的驱动生成，探测请求不计入。
      ja: アプリのプレビューで写真を 1 枚アップロードすれば満たせます。経路の署名はアプリが実際に呼び出したドライバーに基づいて生成し、プローブのリクエストは数えません。
      en: Upload any photo in the App preview to satisfy this; the app builds the path signature from the driver it actually called, and probe requests do not count.

  - id: queue-attributes
    title:
      zh-CN: 本会话的任务队列配置了死信队列、长轮询与服务端加密
      ja: このセッションのジョブキューにデッドレターキュー、ロングポーリング、サーバー側の暗号化が設定されている
      en: This session's job queue has a dead-letter queue, long polling and server-side encryption
    type: aws-readonly
    service: sqs
    action: GetQueueAttributes
    region: app
    params: { QueueUrl: '{{ var.queueUrl }}', AttributeNames: [All] }
    ownership: { resource: '{{ var.queueArn }}', mode: session, createdAfter: session.readyAt }
    drift: { policy: must-hold }
    assert:
      - path: $.Attributes.RedrivePolicy
        op: matches
        value: '"maxReceiveCount":"?3"?'
        label:
          zh-CN: maxReceiveCount = 3
          ja: maxReceiveCount = 3
          en: maxReceiveCount = 3
      - path: $.Attributes.RedrivePolicy
        op: contains
        value: '{{ var.dlqArn }}'
        label:
          zh-CN: 死信队列是本会话的 DLQ
          ja: デッドレターキューがこのセッションの DLQ
          en: The dead-letter queue is this session's DLQ
      - path: $.Attributes.ReceiveMessageWaitTimeSeconds
        op: eq
        value: '20'
        label:
          zh-CN: 长轮询 20 秒
          ja: ロングポーリング 20 秒
          en: 20-second long polling
      - path: $.Attributes.SqsManagedSseEnabled
        op: eq
        value: 'true'
        label:
          zh-CN: SSE-SQS 加密
          ja: SSE-SQS 暗号化
          en: SSE-SQS encryption
    explain:
      zh-CN: 先确认队列是本会话的 queue 模块栈创建的，再核对重驱动策略、长轮询与加密。
      ja: まずキューがこのセッションの queue モジュールのスタックで作成されたことを確認し、次に再処理ポリシー、ロングポーリング、暗号化を確認します。
      en: First confirm that this session's queue module stack created the queue, then check the redrive policy, long polling and encryption.
    reproduce: { run: 'aws sqs get-queue-attributes --queue-url "{{ var.queueUrl }}" --attribute-names All --query "Attributes.[RedrivePolicy,ReceiveMessageWaitTimeSeconds,SqsManagedSseEnabled]"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [SQS, { zh-CN: 队列, ja: キュー, en: Queues }, 'cloudalbum-{{ session.env }}-queue-jobs', { zh-CN: 死信队列, ja: デッドレターキュー, en: Dead-letter queue }], region: app }
      observed:
        question:
          zh-CN: “最大接收数”显示多少？
          ja: 「最大受信数」はいくつと表示されていますか？
          en: What does "Maximum receives" show?
        options:
          - value: '3'
            label:
              zh-CN: '3'
              ja: "3"
              en: "3"
            expected: true
          - value: other
            label:
              zh-CN: 其他值或未配置
              ja: その他の値、または未設定
              en: Another value, or not configured
            fixHint:
              zh-CN: 不要在控制台修改栈管理的队列；重新执行 scripts/module enable queue
              ja: スタックが管理するキューをコンソールで変更しないでください。scripts/module enable queue を再実行してください
              en: Do not change the stack-managed queue in the console; run scripts/module enable queue again

  # ---- 死信队列
  - id: dlq-has-message
    title:
      zh-CN: 坏消息在接收 3 次后进入了死信队列
      ja: 不正なメッセージが 3 回受信された後にデッドレターキューに入った
      en: The bad message moved to the dead-letter queue after 3 receives
    type: aws-readonly
    service: sqs
    action: GetQueueAttributes
    region: app
    params: { QueueUrl: '{{ var.dlqUrl }}', AttributeNames: [ApproximateNumberOfMessages, MessageRetentionPeriod] }
    ownership: { resource: '{{ var.dlqArn }}', mode: session }
    wait: { typicalMinutes: 8, maxMinutes: 20 }
    pendingIf:
      - { path: $.Attributes.ApproximateNumberOfMessages, op: eq, value: '0' }
    drift: { policy: once }
    assert:
      - path: $.Attributes.ApproximateNumberOfMessages
        op: gte
        value: 1
        label:
          zh-CN: 死信队列中的可见消息数
          ja: デッドレターキューの表示可能なメッセージ数
          en: Visible messages in the dead-letter queue
      - path: $.Attributes.MessageRetentionPeriod
        op: eq
        value: '1209600'
        label:
          zh-CN: 死信队列保留 14 天（长于源队列）
          ja: デッドレターキューの保持期間は 14 日（元のキューより長い）
          en: The dead-letter queue keeps messages for 14 days (longer than the source queue)
    explain:
      zh-CN: worker 不删除无法解析的消息；接收次数超过 maxReceiveCount 后由 SQS 把它移入死信队列，源队列恢复畅通。
      ja: worker は解析できないメッセージを削除しません。受信回数が maxReceiveCount を超えると SQS がデッドレターキューに移し、元のキューは再び流れるようになります。
      en: The worker does not delete messages it cannot parse; once the receive count exceeds maxReceiveCount, SQS moves the message to the dead-letter queue and the source queue flows again.
    reproduce: { run: 'aws sqs get-queue-attributes --queue-url "{{ var.dlqUrl }}" --attribute-names ApproximateNumberOfMessages', runsOn: workstation }
    pitfalls: [poison-too-early]
    manualFallback:
      where: { breadcrumb: [SQS, { zh-CN: 队列, ja: キュー, en: Queues }, 'cloudalbum-{{ session.env }}-queue-jobs-dlq'], region: app }
      observed:
        question:
          zh-CN: 死信队列的“可用消息”数是多少？
          ja: デッドレターキューの「利用可能なメッセージ」はいくつですか？
          en: How many "Messages available" does the dead-letter queue show?
        options:
          - value: '1+'
            label:
              zh-CN: 1 条或更多
              ja: 1 件以上
              en: 1 or more
            expected: true
          - value: '0'
            label:
              zh-CN: '0'
              ja: "0"
              en: "0"
            fixHint:
              zh-CN: 接收 3 次、每次等可见性超时后才会进入死信队列，请再等几分钟
              ja: 3 回受信され、毎回可視性タイムアウトを待ってからデッドレターキューに入ります。あと数分待ってください
              en: The message is received 3 times, waiting for the visibility timeout each time, before it moves to the dead-letter queue; wait a few more minutes

  - id: dlq-move-task
    title:
      zh-CN: 从死信队列发起了重放（消息移动任务）
      ja: デッドレターキューから再処理（メッセージ移動タスク）を開始した
      en: A replay (message move task) was started from the dead-letter queue
    type: aws-readonly
    service: sqs
    action: ListMessageMoveTasks
    region: app
    params: { SourceArn: '{{ var.dlqArn }}' }
    dependsOn: [dlq-has-message]
    drift: { policy: once }
    assert:
      - path: $.Results
        op: len_gte
        value: 1
        label:
          zh-CN: 消息移动任务数
          ja: メッセージ移動タスクの数
          en: Number of message move tasks
    explain:
      zh-CN: 死信队列是本会话 queue 模块栈创建的（dlq-has-message 已确认归属），它的移动任务只可能来自本会话。
      ja: デッドレターキューはこのセッションの queue モジュールのスタックが作成したものです（dlq-has-message で所有を確認済み）。そのため、移動タスクはこのセッションからしか作られません。
      en: This session's queue module stack created the dead-letter queue (dlq-has-message has confirmed ownership), so its move tasks can only come from this session.
    reproduce: { run: 'aws sqs list-message-move-tasks --source-arn "{{ var.dlqArn }}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [SQS, { zh-CN: 队列, ja: キュー, en: Queues }, 'cloudalbum-{{ session.env }}-queue-jobs-dlq', { zh-CN: 开始 DLQ 重驱动, ja: DLQ 再処理の開始, en: Start DLQ redrive }], region: app }
      observed:
        question:
          zh-CN: 重驱动任务的状态是什么？
          ja: 再処理タスクのステータスは何ですか？
          en: What is the status of the redrive task?
        options:
          - value: done
            label:
              zh-CN: 已完成或正在运行
              ja: 完了または実行中
              en: Completed or running
            expected: true
          - value: none
            label:
              zh-CN: 没有任务
              ja: タスクがない
              en: No task
            fixHint:
              zh-CN: 先执行本步骤中的 start-message-move-task 命令
              ja: まずこのステップの start-message-move-task コマンドを実行してください
              en: Run the start-message-move-task command in this step first

  - id: dlq-outcome
    title:
      zh-CN: 说出重放之后坏消息去了哪里
      ja: 再処理の後、不正なメッセージがどこへ行ったかを答える
      en: Say where the bad message went after the replay
    type: manual
    spec:
      observed:
        question:
          zh-CN: handler 没有修复时，重放回源队列的坏消息最后去了哪里？
          ja: handler を直していない場合、元のキューに再処理された不正なメッセージは最終的にどこへ行きましたか？
          en: With the handler not fixed, where did the bad message replayed to the source queue end up?
        options:
          - value: dlq-again
            label:
              zh-CN: 再次被接收 3 次后回到死信队列
              ja: 再び 3 回受信された後、デッドレターキューに戻った
              en: Back in the dead-letter queue after another 3 receives
            expected: true
          - value: processed
            label:
              zh-CN: 被正常处理掉了
              ja: 正常に処理された
              en: It was processed normally
            fixHint:
              zh-CN: 消息本身无法解析，重放只是让它再试一遍
              ja: メッセージ自体が解析できないため、再処理はもう一度試させるだけです
              en: The message itself cannot be parsed; a replay only makes it try again
          - value: lost
            label:
              zh-CN: 消失了
              ja: 消えた
              en: It disappeared
            fixHint:
              zh-CN: 标准队列的消息在保留期内不会凭空消失；看看死信队列的消息数
              ja: 標準キューのメッセージは保持期間内に勝手に消えることはありません。デッドレターキューのメッセージ数を確認してください
              en: Standard queue messages do not vanish within the retention period; look at the dead-letter queue's message count

  # ---- 回收验证
  - id: queue-gone
    title:
      zh-CN: 本会话的任务队列已删除
      ja: このセッションのジョブキューが削除された
      en: This session's job queue has been deleted
    type: aws-readonly
    service: sqs
    action: GetQueueUrl
    region: app
    params: { QueueName: 'cloudalbum-{{ session.env }}-queue-jobs' }
    expectError: QueueDoesNotExist
    required: false
    reproduce: { run: 'aws sqs get-queue-url --queue-name cloudalbum-{{ session.env }}-queue-jobs', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [SQS, { zh-CN: 队列, ja: キュー, en: Queues }], region: app }
      observed:
        question:
          zh-CN: 列表中还能找到 cloudalbum-{{ session.env }}-queue-jobs 吗？
          ja: 一覧にまだ cloudalbum-{{ session.env }}-queue-jobs がありますか？
          en: Can you still find cloudalbum-{{ session.env }}-queue-jobs in the list?
        options:
          - value: gone
            label:
              zh-CN: 找不到
              ja: 見つからない
              en: Not found
            expected: true
          - value: present
            label:
              zh-CN: 还在
              ja: まだある
              en: Still there

pitfalls:
  - id: poison-too-early
    title:
      zh-CN: 坏消息还没进入死信队列
      ja: 不正なメッセージがまだデッドレターキューに入っていない
      en: The bad message has not reached the dead-letter queue yet
    match: [ { checkId: dlq-has-message, result: pending } ]
    cause:
      zh-CN: 每次接收后要等可见性超时（并按接收次数退避）才会再次可见，接收 3 次后才移入死信队列
      ja: 受信のたびに可視性タイムアウト（と受信回数に応じたバックオフ）を待ってから再び表示され、3 回受信された後にデッドレターキューに移ります
      en: After each receive the message becomes visible again only after the visibility timeout (plus a backoff by receive count), and it moves to the dead-letter queue after 3 receives
    fix:
      zh-CN: 等几分钟；期间可以在 /admin/jobs 看接收次数
      ja: 数分待ってください。その間に /admin/jobs で受信回数を確認できます
      en: Wait a few minutes; meanwhile you can watch the receive count in /admin/jobs
