# labs/svc-backup/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-backup
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: AWS Backup
  ja: AWS Backup
  en: AWS Backup
function:
  zh-CN: 盘外备份与恢复演练
  ja: ディスク外バックアップと復旧訓練
  en: Off-disk backups and restore drills
title:
  zh-CN: AWS Backup：盘外备份与恢复演练
  ja: AWS Backup：ディスク外バックアップと復旧訓練
  en: "AWS Backup: off-disk backups and restore drills"
summary:
  zh-CN: 对比“与数据同盘的本地备份”和“AWS Backup 盘外恢复点 + 灾备区域副本”，在克隆出的演练实例上模拟数据卷丢失，分别测 RPO 与 RTO。
  ja: 「データと同じディスクにあるローカルバックアップ」と「AWS Backup のディスク外の復旧ポイント＋ DR リージョンのコピー」を比べます。クローンした訓練用インスタンスでデータボリュームの喪失を再現し、それぞれの RPO と RTO を測ります。
  en: Compare a local backup on the same disk as the data with AWS Backup recovery points kept off the disk plus a copy in the DR Region. On a cloned drill instance, simulate losing the data volume and measure RPO and RTO for each.
difficulty: advanced
estimatedMinutes: 120
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
  extra: [dr-region]
services:
- {id: backup, name: { zh-CN: AWS Backup, ja: AWS Backup, en: AWS Backup }, role: primary, module: backup}
- {id: iam, role: context, module: iam}
modules:
  target: [backup]
  start: [iam]
  context: []
  related: [storage, database]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: sc-backup-dr, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- id: backup
  driver: aws
  params: {DrRegion: '${atl:drRegion}'}
expectedWarnings: []
platform:
  accountImpact:
  - id: backup-region-settings
    scope: region
    resource:
      zh-CN: AWS Backup 区域设置（资源类型 opt-in）
      ja: AWS Backup のリージョン設定（リソースタイプのオプトイン）
      en: AWS Backup Region settings (resource type opt-in)
    revert: keep
    note:
      zh-CN: 回收不改回
      ja: 回収時に元へ戻しません
      en: Not reverted on reclaim
cost: {tier: medium}
provision: {class: A}
badge: {title: { zh-CN: 恢复演练, ja: 復旧訓練, en: Restore drill }}
tracks: [operations, resilient, saa-main]
saa:
  domains: [resilient, secure, cost]
tags: [backup]
certificate: {enabled: false}
