# labs/svc-backup/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-backup
kind: service
version: 0.1.0
status: planned
service: AWS Backup
function: 盘外备份与恢复演练
title: AWS Backup：盘外备份与恢复演练
summary: 对比“与数据同盘的本地备份”和“AWS Backup 盘外恢复点 + 灾备区域副本”，在克隆出的演练实例上模拟数据卷丢失，分别测 RPO 与 RTO。
difficulty: advanced
estimatedMinutes: 120
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
  extra: [dr-region]
services:
- {id: backup, name: AWS Backup, role: primary, module: backup}
- {id: iam, role: context, module: iam}
modules:
  target: [backup]
  start: [iam]
  context: []
  related: [storage, database]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: sc-backup-dr, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- id: backup
  driver: aws
  params: {DrRegion: '${atl:drRegion}'}
expectedWarnings: []
platform:
  accountImpact:
  - {id: backup-region-settings, scope: region, resource: AWS Backup 区域设置（资源类型 opt-in）, revert: keep, note: 回收不改回}
cost: {tier: medium}
provision: {class: A}
badge: {title: 恢复演练}
tracks: [operations, resilient, saa-main]
saa:
  domains: [resilient, secure, cost]
tags: [backup]
certificate: {enabled: false}
