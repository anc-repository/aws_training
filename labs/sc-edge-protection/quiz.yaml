schema: atl.quiz/v1
version: 1.0.0
questions:
  - id: ep-mount-points
    domain: secure
    type: single
    kind: concept
    services: [waf]
    stem:
      zh-CN: 以下哪个资源**不能**直接关联 AWS WAF Web ACL？
      ja: AWS WAF の Web ACL を直接関連付けることが**できない**リソースはどれですか？
      en: Which resource **cannot** be associated directly with an AWS WAF Web ACL?
    options:
      - id: a
        text:
          zh-CN: Application Load Balancer
          ja: Application Load Balancer
          en: Application Load Balancer
      - id: b
        text:
          zh-CN: Amazon CloudFront 分配
          ja: Amazon CloudFront ディストリビューション
          en: An Amazon CloudFront distribution
      - id: c
        text:
          zh-CN: Network Load Balancer
          ja: Network Load Balancer
          en: Network Load Balancer
      - id: d
        text:
          zh-CN: Amazon API Gateway REST API
          ja: Amazon API Gateway REST API
          en: Amazon API Gateway REST API
    answer: [c]
    explain:
      zh-CN: WAF 是七层服务，可关联 CloudFront、ALB、API Gateway REST API、AppSync、Cognito User Pool 等；NLB、EC2、弹性 IP 不能关联。
      ja: WAF はレイヤー 7 のサービスで、CloudFront、ALB、API Gateway REST API、AppSync、Cognito User Pool などに関連付けられます。NLB、EC2、Elastic IP には関連付けられません。
      en: WAF is a layer 7 service that can be associated with CloudFront, ALB, API Gateway REST APIs, AppSync, Cognito user pools and more; NLB, EC2 and Elastic IPs cannot be associated.
    relatesTo: enable-waf
    difficulty: 1

  - id: ep-bypass
    domain: secure
    type: single
    kind: scenario
    services: [waf, cloudfront, ec2]
    stem:
      zh-CN: WAF 已挂在 CloudFront 上，但安全团队发现攻击者仍能绕过 WAF 访问应用。最可能的原因与修复是？
      ja: WAF はすでに CloudFront に関連付けられていますが、セキュリティチームは攻撃者がまだ WAF を迂回してアプリにアクセスできることに気づきました。最も考えられる原因と修正はどれですか？
      en: WAF is already on CloudFront, but the security team finds that attackers can still reach the app by going around it. What is the most likely cause and fix?
    options:
      - id: a
        text:
          zh-CN: Web ACL 建在了错误的区域，应改到 ap-northeast-1
          ja: Web ACL を間違ったリージョンに作成しているので、ap-northeast-1 に移すべき
          en: The Web ACL is in the wrong Region and should move to ap-northeast-1
      - id: b
        text:
          zh-CN: 源站仍对公网开放；应让源站只接受 CloudFront 托管前缀列表，并校验 CloudFront 添加的自定义请求头
          ja: オリジンがまだインターネットに開いている。オリジンが CloudFront のマネージドプレフィックスリストだけを受け付け、CloudFront が付けるカスタムリクエストヘッダーを検証するようにすべき
          en: The origin is still open to the internet; it should only accept the CloudFront managed prefix list and check a custom request header that CloudFront adds
      - id: c
        text:
          zh-CN: 未订阅 Shield Advanced，应立即订阅
          ja: Shield Advanced をサブスクライブしていないので、すぐにサブスクライブすべき
          en: Shield Advanced is not subscribed and should be subscribed right away
      - id: d
        text:
          zh-CN: CloudFront 的价格等级太低，应改为 PriceClass_All
          ja: CloudFront の料金クラスが低すぎるので、PriceClass_All にすべき
          en: CloudFront's price class is too low and should be PriceClass_All
    answer: [b]
    explain:
      zh-CN: 绕过的本质是直连源站。CLOUDFRONT 范围的 Web ACL 本来就必须在 us-east-1；只用前缀列表还不够（别人的分配也来自这些网段），要再校验自定义请求头；Shield Advanced 与价格等级都与绕过无关。
      ja: 迂回の本質はオリジンへの直接アクセスです。CLOUDFRONT スコープの Web ACL はもともと us-east-1 になければなりません。プレフィックスリストだけでは不十分で（他人のディストリビューションも同じアドレス範囲から来ます）、カスタムリクエストヘッダーも検証する必要があります。Shield Advanced も料金クラスも迂回とは関係ありません。
      en: The essence of the bypass is direct access to the origin. A CLOUDFRONT-scope Web ACL must be in us-east-1 anyway; the prefix list alone is not enough (other people's distributions come from the same ranges), so a custom request header must also be checked; neither Shield Advanced nor the price class has anything to do with the bypass.
    relatesTo: verify-lock
    difficulty: 2

  - id: ep-guardduty
    domain: secure
    type: multi
    kind: concept
    services: [guardduty]
    stem:
      zh-CN: 关于 Amazon GuardDuty，哪两项正确？
      ja: Amazon GuardDuty について、正しいものを 2 つ選んでください。
      en: Which two statements about Amazon GuardDuty are correct?
    options:
      - id: a
        text:
          zh-CN: 它分析 CloudTrail 管理事件、VPC 流日志与 DNS 日志，无需你自己开启这些日志
          ja: CloudTrail の管理イベント、VPC フローログ、DNS ログを分析し、自分でこれらのログを有効にする必要はない
          en: It analyzes CloudTrail management events, VPC Flow Logs and DNS logs without you turning those logs on yourself
      - id: b
        text:
          zh-CN: 它能检查 HTTP 请求体并阻断 SQL 注入
          ja: HTTP のリクエストボディを検査して SQL インジェクションをブロックできる
          en: It can inspect HTTP request bodies and block SQL injection
      - id: c
        text:
          zh-CN: 它只产生发现，自动响应需要借助 EventBridge 等服务
          ja: 検出結果を生成するだけで、自動対応には EventBridge などのサービスを使う必要がある
          en: It only produces findings, and automated response needs services such as EventBridge
      - id: d
        text:
          zh-CN: 它必须先在每台 EC2 上安装代理才能工作
          ja: 動作させるには、まずすべての EC2 にエージェントをインストールしなければならない
          en: It needs an agent installed on every EC2 instance before it works
    answer: [a, c]
    explain:
      zh-CN: GuardDuty 独立采集基础数据源，只检测不阻断；不分析 HTTP 内容；基础检测不需要代理（运行时监控等可选保护计划另说）。阻断七层攻击是 WAF 的工作。
      ja: GuardDuty は基本的なデータソースを独自に収集し、検出するだけでブロックはしません。HTTP の内容は分析しません。基本的な検出にエージェントは不要です（Runtime Monitoring などの任意の保護プランは別）。レイヤー 7 の攻撃をブロックするのは WAF の仕事です。
      en: GuardDuty collects its foundational data sources independently and only detects, never blocks; it does not analyze HTTP content; foundational detection needs no agent (optional protection plans such as Runtime Monitoring aside). Blocking layer 7 attacks is WAF's job.
    relatesTo: layers
    difficulty: 2

  - id: ep-login-rate
    domain: secure
    type: single
    kind: scenario
    services: [waf, cloudfront, elb, autoscaling]
    stem:
      zh-CN: 一个电商网站部署在 ALB 后面的 EC2 Auto Scaling 组中，前面有 CloudFront。登录接口遭受大量来自少数 IP 的撞库请求，同时有人直接访问 ALB 的 DNS 名称。要求在边缘限制每个 IP 的登录频率，并确保所有流量都经过防护。最合适的组合是？
      ja: ある EC サイトは ALB の背後の EC2 Auto Scaling グループにデプロイされ、前段に CloudFront があります。ログイン API が少数の IP からの大量のクレデンシャルスタッフィングを受けており、同時に ALB の DNS 名に直接アクセスする人もいます。エッジで IP ごとのログイン頻度を制限し、すべてのトラフィックが防御を通るようにする必要があります。最も適切な組み合わせはどれですか？
      en: An e-commerce site runs in an EC2 Auto Scaling group behind an ALB, with CloudFront in front. The sign-in API is hit by heavy credential stuffing from a few IPs, and some people access the ALB's DNS name directly. You must limit sign-in frequency per IP at the edge and make sure all traffic goes through the protection. What is the most suitable combination?
    options:
      - id: a
        text:
          zh-CN: 在 CloudFront 上关联 WAF，添加只作用于登录路径的基于速率的规则；ALB 安全组只允许 CloudFront 托管前缀列表，并用监听器规则校验自定义请求头
          ja: CloudFront に WAF を関連付け、ログインのパスだけを対象にしたレートベースのルールを追加する。ALB のセキュリティグループは CloudFront のマネージドプレフィックスリストだけを許可し、リスナールールでカスタムリクエストヘッダーを検証する
          en: Associate WAF with CloudFront and add a rate-based rule scoped to the sign-in path; let the ALB security group allow only the CloudFront managed prefix list, and check a custom request header with a listener rule
      - id: b
        text:
          zh-CN: 在 ALB 上关联 REGIONAL Web ACL，速率规则按源 IP 聚合；不修改 ALB 安全组
          ja: ALB に REGIONAL の Web ACL を関連付け、レートベースのルールは送信元 IP で集計する。ALB のセキュリティグループは変更しない
          en: Associate a REGIONAL Web ACL with the ALB, aggregating the rate-based rule by source IP; leave the ALB security group unchanged
      - id: c
        text:
          zh-CN: 在 EC2 安全组中逐个拒绝攻击 IP
          ja: EC2 のセキュリティグループで攻撃元の IP を 1 つずつ拒否する
          en: Deny the attacking IPs one by one in the EC2 security group
      - id: d
        text:
          zh-CN: 订阅 Shield Advanced 并启用自动应用层 DDoS 缓解
          ja: Shield Advanced をサブスクライブし、アプリケーション層の DDoS の自動緩和を有効にする
          en: Subscribe to Shield Advanced and turn on automatic application layer DDoS mitigation
    answer: [a]
    explain:
      zh-CN: A 在边缘按 IP 限速，并封住直连 ALB 的绕过路径。B：ALB 看到的源 IP 是 CloudFront 节点，应按 X-Forwarded-For（FORWARDED_IP）聚合，而且不锁定 ALB 仍可被绕过。C：安全组只有允许规则，不能写拒绝，在 CloudFront 后面看到的也是代理地址。D：撞库是低速率的应用层滥用，不是 DDoS；Shield Advanced 成本高，同样无法阻止直连 ALB。
      ja: A はエッジで IP ごとにレートを制限し、ALB への直接アクセスという迂回路も塞ぎます。B：ALB から見える送信元 IP は CloudFront のノードなので、X-Forwarded-For（FORWARDED_IP）で集計すべきで、しかも ALB をロックしなければ迂回されます。C：セキュリティグループには許可ルールしかなく拒否は書けず、CloudFront の背後で見えるのもプロキシのアドレスです。D：クレデンシャルスタッフィングは低レートのアプリケーション層の悪用で、DDoS ではありません。Shield Advanced は高コストで、ALB への直接アクセスも防げません。
      en: "A limits the rate per IP at the edge and closes the bypass of hitting the ALB directly. B: the source IP the ALB sees is a CloudFront node, so it should aggregate on X-Forwarded-For (FORWARDED_IP), and without locking the ALB it can still be bypassed. C: security groups only have allow rules and cannot deny, and behind CloudFront they only see proxy addresses. D: credential stuffing is low-rate application layer abuse, not DDoS; Shield Advanced is expensive and does not stop direct access to the ALB either."
    relatesTo: after
    difficulty: 2

  - id: ep-crs-upload
    domain: secure
    type: single
    kind: scenario
    services: [waf]
    stem:
      zh-CN: 安全审计要求“在不影响用户上传照片的前提下启用 AWS 托管的核心规则集”。上线当天用户反馈大图上传失败，WAF 日志显示命中 SizeRestrictions_BODY。正确的处理方式是？
      ja: セキュリティ監査で「ユーザーの写真のアップロードに影響を与えずに AWS マネージドのコアルールセットを有効にする」ことが求められました。公開当日、ユーザーから大きな画像のアップロードに失敗すると報告があり、WAF のログには SizeRestrictions_BODY への一致が記録されています。正しい対処はどれですか？
      en: A security audit requires "enabling the AWS managed core rule set without affecting users' photo uploads". On launch day users report that large image uploads fail, and the WAF logs show matches on SizeRestrictions_BODY. What is the right way to handle it?
    options:
      - id: a
        text:
          zh-CN: 删除整个核心规则集
          ja: コアルールセット全体を削除する
          en: Delete the whole core rule set
      - id: b
        text:
          zh-CN: 先把该规则组设为 Count 观察，再对 SizeRestrictions_BODY 做规则动作覆盖或为上传路径添加范围缩小语句，然后恢复 Block
          ja: まずそのルールグループを Count にして観察し、SizeRestrictions_BODY にルールアクションの上書きを行うか、アップロードのパスにスコープダウンステートメントを追加してから、Block に戻す
          en: First set that rule group to Count and observe, then add a rule action override for SizeRestrictions_BODY or a scope-down statement for the upload path, and switch back to Block
      - id: c
        text:
          zh-CN: 把上传改为浏览器经预签名 URL 直传 S3
          ja: アップロードを、ブラウザーから署名付き URL で S3 に直接送る方式に変える
          en: Change uploads to go straight from the browser to S3 with presigned URLs
      - id: d
        text:
          zh-CN: 提高 CloudFront 的源站读取超时
          ja: CloudFront のオリジンの読み取りタイムアウトを延ばす
          en: Increase CloudFront's origin read timeout
    answer: [b]
    explain:
      zh-CN: B 精确处理误杀，保留其余规则。A 放弃了全部 OWASP 类防护，范围过大。C 确实能让上传绕开 WAF（S3 不能关联 WAF），但需要改造存储方案，不是“启用规则集”的正确做法。D 与请求体检查无关。
      ja: B は誤検知を正確に処理し、それ以外のルールは残します。A は OWASP 系の防御をすべて手放すことになり、範囲が広すぎます。C は確かにアップロードに WAF を迂回させられますが（S3 には WAF を関連付けられません）、ストレージの方式の改修が必要で、「ルールセットを有効にする」正しいやり方ではありません。D はリクエストボディの検査とは関係ありません。
      en: B handles the false positive precisely and keeps the other rules. A gives up all OWASP-style protection, far too broad. C does let uploads bypass WAF (S3 cannot be associated with WAF), but it means redesigning storage and is not the right way to "enable the rule set". D has nothing to do with request body inspection.
    relatesTo: observe-count
    difficulty: 2
