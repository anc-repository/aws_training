# 分层（第 10 步）：Shield 与 GuardDuty 只讲解、不启用，用原生手动确认（04 §5.2.6）记录学员的判断
checks:
  - id: shield-scope
    title: 本场景中哪些 DDoS 防护已经自动生效、哪些需要付费订阅
    type: manual
    spec:
      where: { breadcrumb: [AWS WAF & Shield, Shield, 概览], region: global }
      observed:
        question: 完成本卡后，这个分配受到哪些 DDoS 防护？
        options:
          - { value: standard, label: Shield Standard 已自动生效；Shield Advanced 需要单独按年订阅（本卡不订阅）, expected: true }
          - { value: none, label: 没有任何 DDoS 防护，必须订阅 Shield Advanced, fixHint: Shield Standard 对所有 CloudFront 分配自动生效、不另收费，防常见的网络层与传输层攻击 }
          - { value: advanced, label: 关联 Web ACL 后自动获得 Shield Advanced, fixHint: Shield Advanced 需要按年订阅；WAF 与 Shield Advanced 是两个独立的服务 }
    explain: 撞库是七层滥用，靠 WAF 的速率规则与托管规则（必要时 Bot Control）；Shield Advanced 解决的是大规模 DDoS 的响应（DRT）与扩容费用保护。

  - id: guardduty-layer
    title: GuardDuty 在这个场景里能做什么、不能做什么
    type: manual
    spec:
      observed:
        question: 第 2、9 步的 SQL 注入与扫描载荷，GuardDuty 会怎样处理？
        options:
          - { value: not-http, label: 不分析 HTTP 内容，也不阻断；它看的是 CloudTrail、VPC 流日志与 DNS 日志里的异常行为, expected: true }
          - { value: blocks, label: 识别并阻断 SQL 注入, fixHint: GuardDuty 只产生发现（finding），自动响应要借助 EventBridge 等；七层阻断是 WAF 的工作 }
          - { value: needs-agent, label: 必须先在 EC2 上装代理才能看到这些请求, fixHint: 基础检测不需要代理（运行时监控是可选的保护计划），但无论如何都不检查 HTTP 请求体 }
    explain: threat-detection 模块本版尚未实现，本卡不启用 GuardDuty；它补的是“实例被入侵后对外的异常行为”，与 WAF 的七层过滤互补而不重叠。
