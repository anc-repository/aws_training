# 起点（before 一律 drift once，C3、04 §3.5 第 9 条）：防护只有实例上的 Nginx，入口就是实验机的弹性 IP
checks:
  - id: waf-nginx-start
    title:
      zh-CN: 起始状态：WAF 是实验机上的 Nginx（WAF_MODE=nginx）
      ja: 開始状態：WAF はラボ用インスタンス上の Nginx（WAF_MODE=nginx）
      en: "Start state: the WAF is Nginx on the lab instance (WAF_MODE=nginx)"
    type: capability
    module: waf
    drift: { policy: once }
    assert:
      - path: $.driver
        op: eq
        value: nginx
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver
    explain:
      zh-CN: 启用 AWS WAF 之前，限速（limit_req）、特征拦截与 denylist 都在实例上的 Nginx 完成，每个恶意请求都已经到达 EC2。
      ja: AWS WAF を有効にする前は、レート制限（limit_req）、シグネチャによるブロック、denylist はすべてインスタンス上の Nginx が行っており、悪意のあるリクエストはすべて EC2 に届いています。
      en: Before AWS WAF is enabled, rate limiting (limit_req), signature blocking and the denylist are all done by Nginx on the instance, and every malicious request has already reached EC2.
    reproduce: { run: 'curl -s http://127.0.0.1/api/capabilities | jq ".modules | {waf: .waf.driver, cdn: .cdn.driver}"', runsOn: lab }

  - id: origin-load-before
    title:
      zh-CN: 基线：直连攻击期间，登录请求（包括被 Nginx 拒绝的）全部记在实例的访问日志里
      ja: ベースライン：直接アクセスの攻撃中、ログインリクエスト（Nginx に拒否されたものを含む）はすべてインスタンスのアクセスログに記録されている
      en: "Baseline: during the direct attack, every sign-in request (including those Nginx refused) is recorded in the instance's access log"
    type: local
    on: lab
    checkId: nginx-log-summary
    args: { window: 30m, path: /api/auth/login }
    dependsOn: [exp-flood-before]
    drift: { policy: once }
    assert:
      - path: $.logPresent
        op: eq
        value: true
        label:
          zh-CN: 实例上有 Nginx 访问日志
          ja: インスタンスに Nginx のアクセスログがある
          en: The instance has an Nginx access log
      - path: $.counts.total
        op: gte
        value: 20
        label:
          zh-CN: 最近 30 分钟到达实例的登录请求数
          ja: 直近 30 分間にインスタンスに届いたログインリクエストの数
          en: Sign-in requests that reached the instance in the last 30 minutes
      - path: $.counts.byStatus.4xx
        op: gte
        value: 1
        label:
          zh-CN: 其中被拒绝（429 / 401）的请求同样到达了实例
          ja: そのうち拒否された（429 / 401）リクエストも同様にインスタンスに届いている
          en: The refused ones (429 / 401) reached the instance too
    explain:
      zh-CN: 服务端证据：flood 的每个请求都出现在实验机的访问日志里——不管 Nginx 最后回的是 429 还是 401，连接、TLS 与日志的开销都已经发生在 EC2 上。这就是“在进入区域之前挡住”要改变的东西。
      ja: サーバー側の証拠：flood のどのリクエストもラボ用インスタンスのアクセスログに現れます。Nginx が最終的に 429 を返しても 401 を返しても、接続、TLS、ログのコストはすでに EC2 で発生しています。これこそが「リージョンに入る前に止める」ことで変えたい点です。
      en: "Server-side evidence: every flood request appears in the lab instance's access log — whether Nginx finally answers 429 or 401, the cost of connections, TLS and logging has already been paid on EC2. That is exactly what \"stopping it before it enters the Region\" is meant to change."
    reproduce: { run: 'sudo tail -n 2000 /var/lib/cloudalbum/logs/nginx-access.json | jq -r "select(.uri==\"/api/auth/login\") | .status" | sort | uniq -c', runsOn: lab }
