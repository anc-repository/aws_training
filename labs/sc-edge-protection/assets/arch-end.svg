<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="完成后：流量经 CloudFront 与 us-east-1 的 Web ACL 检查后回源 8080；直连 80/443 只对管理员 IP 开放">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2B2B2B"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B23A2E"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E7D4F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="380" fill="#FFFFFF"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="13" fill="#2B2B2B">
    <text x="20" y="28" font-size="15" font-weight="700">完成后</text>

    <rect x="20" y="60" width="150" height="56" rx="8" fill="#FBEAE7" stroke="#B23A2E" stroke-width="1.5"/>
    <text x="95" y="84" text-anchor="middle" font-weight="700">攻击者 / 扫描器</text>
    <text x="95" y="103" text-anchor="middle" font-size="12">撞库 · 扫描 · 恶意载荷</text>

    <rect x="20" y="150" width="150" height="50" rx="8" fill="#F4F2EE" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="95" y="180" text-anchor="middle" font-weight="700">正常用户</text>

    <rect x="20" y="290" width="150" height="56" rx="8" fill="#E7F3EC" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="95" y="314" text-anchor="middle" font-weight="700">工作台（管理员 IP）</text>
    <text x="95" y="333" text-anchor="middle" font-size="12">CDN_ADMIN_CIDR</text>

    <rect x="230" y="70" width="170" height="120" rx="8" fill="#E8F0F6" stroke="#2F6690" stroke-width="1.5"/>
    <text x="315" y="96" text-anchor="middle" font-weight="700">CloudFront 边缘</text>
    <text x="315" y="118" text-anchor="middle" font-size="12">TLS 终止</text>
    <text x="315" y="138" text-anchor="middle" font-size="12">Shield Standard（自动）</text>
    <text x="315" y="166" text-anchor="middle" font-size="12">回源加 X-Origin-Verify</text>

    <rect x="450" y="60" width="190" height="140" rx="8" fill="#FFF6E5" stroke="#A35A12" stroke-width="1.5"/>
    <text x="545" y="86" text-anchor="middle" font-weight="700">AWS WAF Web ACL</text>
    <text x="545" y="105" text-anchor="middle" font-size="12">us-east-1 · CLOUDFRONT 范围</text>
    <text x="545" y="128" text-anchor="middle" font-size="12">rate-login · rate-global</text>
    <text x="545" y="146" text-anchor="middle" font-size="12">IP 集合 · 托管规则组</text>
    <text x="545" y="164" text-anchor="middle" font-size="12">先 Count，后 Block</text>
    <text x="545" y="186" text-anchor="middle" font-size="12">放行时插入 x-amzn-waf-*</text>

    <rect x="690" y="60" width="190" height="140" rx="8" fill="#F4F2EE" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="785" y="86" text-anchor="middle" font-weight="700">EC2 · Nginx :8080</text>
    <text x="785" y="108" text-anchor="middle" font-size="12">源站安全组：只放行</text>
    <text x="785" y="126" text-anchor="middle" font-size="12">CloudFront 托管前缀列表</text>
    <text x="785" y="148" text-anchor="middle" font-size="12">再校验 X-Origin-Verify</text>
    <text x="785" y="170" text-anchor="middle" font-size="12">entry=cloudfront&gt;waf&gt;nginx</text>
    <text x="785" y="188" text-anchor="middle" font-size="12">→ Node API</text>

    <rect x="690" y="260" width="190" height="72" rx="8" fill="#F4F2EE" stroke="#2B2B2B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="785" y="286" text-anchor="middle" font-weight="700">弹性 IP :80 / :443</text>
    <text x="785" y="306" text-anchor="middle" font-size="12">安全组只放行管理员 IP</text>
    <text x="785" y="323" text-anchor="middle" font-size="12">其他来源被丢弃（超时）</text>

    <path d="M170 88 L228 100" fill="none" stroke="#B23A2E" stroke-width="2" marker-end="url(#r)"/>
    <path d="M170 175 L228 160" fill="none" stroke="#2B2B2B" stroke-width="2" marker-end="url(#a)"/>
    <path d="M400 130 L448 130" fill="none" stroke="#2B2B2B" stroke-width="2" marker-end="url(#a)"/>
    <path d="M640 130 L688 130" fill="none" stroke="#2E7D4F" stroke-width="2" marker-end="url(#g)"/>
    <text x="664" y="122" text-anchor="middle" font-size="11" fill="#2E7D4F">Allow</text>

    <path d="M545 200 C 545 236, 200 236, 120 120" fill="none" stroke="#B23A2E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="340" y="250" text-anchor="middle" font-size="12" fill="#B23A2E">Block：429 / 403 在边缘返回，请求不进入区域</text>

    <path d="M170 96 C 420 280, 560 300, 686 292" fill="none" stroke="#B23A2E" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#r)"/>
    <text x="470" y="300" text-anchor="middle" font-size="12" fill="#B23A2E">直连：被安全组丢弃</text>
    <path d="M170 318 L686 312" fill="none" stroke="#2E7D4F" stroke-width="2" marker-end="url(#g)"/>
    <text x="430" y="332" text-anchor="middle" font-size="12" fill="#2E7D4F">管理员直连：运维与“直连 vs 边缘”对照</text>
  </g>
</svg>
