schema: atl.quiz/v1
version: 1.0.0
questions:
  - id: ip-destinations
    domain: resilient
    type: single
    kind: scenario
    services: [lambda, eventbridge, sqs]
    stem: 一个由 EventBridge 异步调用的 Lambda 函数偶尔失败，团队希望在重试用尽后保留失败事件以便分析，且不写额外代码。应该怎么做？
    options:
      - { id: a, text: 把函数超时改为 15 分钟 }
      - { id: b, text: 在函数的异步调用配置中设置失败目标（如 SQS 队列），并设置重试次数 }
      - { id: c, text: 改为同步调用 }
      - { id: d, text: 为函数配置预置并发 }
    answer: [b]
    explain: 异步调用支持 0～2 次重试与失败目标（Destinations）或 DLQ；同步调用的错误由调用方处理；预置并发只解决冷启动。
    relatesTo: failures
    difficulty: 1
  - id: ip-recursion
    domain: cost
    type: single
    kind: scenario
    services: [lambda, s3]
    stem: 一个由 S3 上传触发的 Lambda 把缩略图写回同一个桶的同一前缀，很快产生大量调用与费用。根本的修复是？
    options:
      - { id: a, text: 调大函数内存 }
      - { id: b, text: 把输出写到另一个桶，或写到不在触发范围内的前缀 }
      - { id: c, text: 关闭 S3 版本控制 }
      - { id: d, text: 给函数配置预置并发 }
    answer: [b]
    explain: 输出再次触发函数形成递归；输入与输出分开是根本解法，预留并发上限只能兜底。
    relatesTo: inspect
    difficulty: 1
  - id: ip-provisioned
    domain: performance
    type: single
    kind: scenario
    services: [lambda]
    stem: 一个面向用户的 Lambda API 在流量高峰时首个请求延迟明显升高（冷启动）。要消除这部分延迟，应使用？
    options:
      - { id: a, text: 预留并发 }
      - { id: b, text: 预置并发 }
      - { id: c, text: 把函数放进 VPC }
      - { id: d, text: 增加函数超时时间 }
    answer: [b]
    explain: 预置并发预先初始化执行环境，按时长计费；预留并发只是保底与上限，不消除冷启动。
    relatesTo: cold-start
    difficulty: 1
  - id: ip-reserved-zero
    domain: resilient
    type: single
    kind: concept
    services: [lambda]
    stem: 运维人员发现一个 Lambda 函数的下游数据库出现故障，希望立即停止该函数的所有调用、但保留函数与触发器配置。最直接的做法是？
    options:
      - { id: a, text: 把函数的预留并发设为 0 }
      - { id: b, text: 把预置并发设为 0 }
      - { id: c, text: 删除函数的执行角色 }
      - { id: d, text: 把函数超时设为 1 秒 }
    answer: [a]
    explain: 预留并发既是保底也是上限，设为 0 会限流所有调用（控制台的“限制”按钮就是这样做的）；删除执行角色会破坏配置，超时只会制造更多失败。
    relatesTo: throttle
    difficulty: 2
