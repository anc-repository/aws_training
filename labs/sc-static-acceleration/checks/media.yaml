# 本卡专属检查；cdn 的公共检查（分配归属、入口链、边缘命中、失效、回收）引用 svc-cdn 的同名检查
checks:
  # ---- 起点（before 一律 once）
  - id: storage-s3-start
    title:
      zh-CN: 起始状态：照片已经在 S3
      ja: 開始状態：写真はすでに S3 にある
      en: "Start state: the photos are already in S3"
    type: capability
    module: storage
    drift: { policy: once }
    assert:
      - path: $.driver
        op: eq
        value: s3
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver
      - path: $
        op: healthy
        label:
          zh-CN: 状态正常
          ja: 状態が正常
          en: Healthy
    explain:
      zh-CN: 起始状态预置了 storage(s3)（DEP-010），本卡只专注“桶前面加分配”。
      ja: 開始状態で storage(s3) を事前準備しているので（DEP-010）、このカードは「バケットの前にディストリビューションを置く」ことだけに集中します。
      en: The start state provisions storage(s3) (DEP-010), so this card focuses only on "putting a distribution in front of the bucket".

  - id: media-presigned-baseline
    title:
      zh-CN: 起点：缩略图 URL 是每次不同的 S3 预签名地址
      ja: 出発点：サムネイルの URL は毎回異なる S3 の署名付きアドレス
      en: "Starting point: thumbnail URLs are S3 presigned addresses that differ every time"
    type: http-header
    from: lab
    target: self
    path: /api/lab/probe/media-url
    method: GET
    drift: { policy: once }
    assert:
      - path: $.status
        op: eq
        value: 200
        label:
          zh-CN: 状态码
          ja: ステータスコード
          en: Status code
      - path: $.json.provider
        op: eq
        value: 'storage:s3'
        label:
          zh-CN: 签名方
          ja: 署名者
          en: Signer
      - path: $.json.signed
        op: eq
        value: true
        label:
          zh-CN: 预签名
          ja: 署名付き
          en: Presigned
      - path: $.json.cdn
        op: eq
        value: false
        label:
          zh-CN: 未经 CDN 改写
          ja: CDN による書き換えなし
          en: Not rewritten by the CDN
    explain:
      zh-CN: 每次请求都签出不同的 URL，浏览器与任何中间缓存都无法复用；字节从东京的桶直接跨洲传输。
      ja: リクエストのたびに異なる URL が署名されるため、ブラウザーも途中のキャッシュも再利用できません。バイトは東京のバケットから大陸をまたいで直接転送されます。
      en: Every request signs a different URL, so neither the browser nor any cache in between can reuse it; the bytes travel straight across continents from the bucket in Tokyo.

  # ---- 媒体源站切到 S3（OAC）
  - id: media-behavior-oac
    title:
      zh-CN: /media/* 行为指向 S3 源站，源站配置了 OAC，查看者协议重定向到 HTTPS
      ja: /media/* のビヘイビアが S3 オリジンを指し、オリジンに OAC が設定され、ビューワープロトコルは HTTPS にリダイレクトされる
      en: The /media/* behavior points to the S3 origin, the origin has OAC configured, and the viewer protocol redirects to HTTPS
    type: aws-readonly
    service: cloudfront
    action: GetDistributionConfig
    region: global
    params: { Id: '{{ var.distributionId }}' }
    dependsOn: [distribution-deployed]
    drift: { policy: must-hold }
    assert:
      - path: $.DistributionConfig.CacheBehaviors.Items
        where: { PathPattern: '/media/*', TargetOriginId: s3-media, ViewerProtocolPolicy: redirect-to-https }
        op: len_eq
        value: 1
        label:
          zh-CN: /media/* 行为
          ja: /media/* のビヘイビア
          en: /media/* behavior
      - path: $.DistributionConfig.Origins.Items
        where: { Id: s3-media, OriginAccessControlId: { op: matches, value: '^[A-Z0-9]{8,}$' } }
        op: len_eq
        value: 1
        label:
          zh-CN: S3 源站带 OAC
          ja: S3 オリジンに OAC がある
          en: S3 origin with OAC
      - path: $.DistributionConfig.Origins.Items
        where: { Id: s3-media, DomainName: { op: startsWith, value: '{{ var.mediaBucket }}.s3.' } }
        op: len_eq
        value: 1
        label:
          zh-CN: 源站是本会话的媒体桶（REST 端点，不是网站端点）
          ja: オリジンがこのセッションのメディアバケット（ウェブサイトエンドポイントではなく REST エンドポイント）
          en: The origin is this session's media bucket (REST endpoint, not website endpoint)
    explain:
      zh-CN: 分配是本会话创建的（distribution-deployed 已确认归属）。源站必须是 S3 REST 端点：网站端点只支持 HTTP，也不能配合 OAC。
      ja: ディストリビューションはこのセッションで作成したものです（distribution-deployed で所有を確認済み）。オリジンは S3 の REST エンドポイントでなければなりません。ウェブサイトエンドポイントは HTTP しか使えず、OAC とも組み合わせられません。
      en: "This session created the distribution (distribution-deployed has confirmed ownership). The origin must be an S3 REST endpoint: website endpoints only support HTTP and cannot be combined with OAC."
    reproduce: { run: 'aws cloudfront get-distribution-config --id {{ var.distributionId }} --query "DistributionConfig.{Behaviors:CacheBehaviors.Items[].[PathPattern,TargetOriginId],Origins:Origins.Items[].[Id,DomainName,OriginAccessControlId]}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudFront, { zh-CN: 分配, ja: ディストリビューション, en: Distributions }, '{{ var.distributionId }}', { zh-CN: 行为, ja: ビヘイビア, en: Behaviors }], region: global }
      observed:
        question:
          zh-CN: “/media/*”行为的源是什么？
          ja: 「/media/*」のビヘイビアのオリジンは何ですか？
          en: What is the origin of the "/media/*" behavior?
        options:
          - value: s3
            label:
              zh-CN: S3 媒体桶（s3-media）
              ja: S3 のメディアバケット（s3-media）
              en: The S3 media bucket (s3-media)
            expected: true
          - value: app
            label:
              zh-CN: 实验机（app-origin）
              ja: ラボ用インスタンス（app-origin）
              en: The lab instance (app-origin)
            fixHint:
              zh-CN: 用 --set CDN_MEDIA_ORIGIN=s3 重新执行 scripts/module enable cdn
              ja: --set CDN_MEDIA_ORIGIN=s3 を付けて scripts/module enable cdn を再実行してください
              en: Run scripts/module enable cdn again with --set CDN_MEDIA_ORIGIN=s3

  - id: bucket-policy-oac
    title:
      zh-CN: 媒体桶策略只允许本分配经 CloudFront 读取 variants/*
      ja: メディアバケットのポリシーは、このディストリビューションが CloudFront 経由で variants/* を読むことだけを許可している
      en: The media bucket policy only lets this distribution read variants/* through CloudFront
    type: aws-readonly
    service: s3
    action: GetBucketPolicy
    region: app
    params: { Bucket: '{{ var.mediaBucket }}' }
    ownership: { resource: 'arn:aws:s3:::{{ var.mediaBucket }}', mode: session-or-start }
    dependsOn: [media-behavior-oac]
    drift: { policy: must-hold }
    assert:
      - path: $.Policy
        op: contains
        value: cloudfront.amazonaws.com
        label:
          zh-CN: Principal 是 CloudFront 服务主体
          ja: プリンシパルが CloudFront のサービスプリンシパル
          en: The principal is the CloudFront service principal
      - path: $.Policy
        op: contains
        value: 'AWS:SourceArn'
        label:
          zh-CN: 用 AWS:SourceArn 限定分配
          ja: AWS:SourceArn でディストリビューションを限定
          en: Limits the distribution with AWS:SourceArn
      - path: $.Policy
        op: contains
        value: 'distribution/{{ var.distributionId }}'
        label:
          zh-CN: 限定的是本分配
          ja: 限定しているのはこのディストリビューション
          en: The limit is this distribution
      - path: $.Policy
        op: contains
        value: '/variants/*'
        label:
          zh-CN: 只开放 variants/*
          ja: variants/* だけを開放
          en: Only variants/* is open
    explain:
      zh-CN: 媒体桶由起始状态的 storage 栈创建；cdn 启用时把分配 ARN 注入 storage 栈，生成这条只读 variants/* 的语句，raw/ 与 reports/ 永远不经 CDN 暴露。
      ja: メディアバケットは開始状態の storage スタックが作成しました。cdn を有効にするとディストリビューションの ARN が storage スタックに注入され、variants/* だけを読み取れるこのステートメントが生成されます。raw/ と reports/ は決して CDN 経由で公開されません。
      en: The start state's storage stack created the media bucket; enabling cdn injects the distribution ARN into the storage stack, generating this statement that only allows reading variants/*, so raw/ and reports/ are never exposed through the CDN.
    reproduce: { run: 'aws s3api get-bucket-policy --bucket {{ var.mediaBucket }} --query Policy --output text | jq .', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [S3, { zh-CN: 存储桶, ja: バケット, en: Buckets }, '{{ var.mediaBucket }}', { zh-CN: 权限, ja: アクセス許可, en: Permissions }, { zh-CN: 存储桶策略, ja: バケットポリシー, en: Bucket policy }], region: app }
      observed:
        question:
          zh-CN: 允许 CloudFront 读取的语句，Resource 与 Condition 分别是什么？
          ja: CloudFront に読み取りを許可するステートメントの Resource と Condition はそれぞれ何ですか？
          en: In the statement that allows CloudFront to read, what are the Resource and the Condition?
        options:
          - value: ok
            label:
              zh-CN: 'Resource 是 variants/*，条件 AWS:SourceArn 等于本分配'
              ja: Resource は variants/* で、条件は AWS:SourceArn がこのディストリビューションと等しい
              en: Resource is variants/*, and the condition is AWS:SourceArn equals this distribution
            expected: true
          - value: other
            label:
              zh-CN: 其他
              ja: その他
              en: Something else
            fixHint:
              zh-CN: 不要手工编辑桶策略；重新执行 scripts/module enable cdn --set CDN_MEDIA_ORIGIN=s3
              ja: バケットポリシーを手動で編集しないでください。scripts/module enable cdn --set CDN_MEDIA_ORIGIN=s3 を再実行してください
              en: Do not edit the bucket policy by hand; run scripts/module enable cdn --set CDN_MEDIA_ORIGIN=s3 again

  # ---- 桶仍然私有
  - id: bucket-not-public
    title:
      zh-CN: 媒体桶的策略不是公开策略
      ja: メディアバケットのポリシーが公開ポリシーではない
      en: The media bucket policy is not a public policy
    type: aws-readonly
    service: s3
    action: GetBucketPolicyStatus
    region: app
    params: { Bucket: '{{ var.mediaBucket }}' }
    dependsOn: [bucket-policy-oac]
    drift: { policy: must-hold }
    assert:
      - path: $.PolicyStatus.IsPublic
        op: eq
        value: false
        label:
          zh-CN: IsPublic
          ja: IsPublic
          en: IsPublic
    explain:
      zh-CN: 只允许特定服务主体 + 特定 SourceArn 的语句不算公开；任何 Principal 为 * 的放行都会让 IsPublic 变为 true。
      ja: 特定のサービスプリンシパル + 特定の SourceArn だけを許可するステートメントは公開とはみなされません。Principal が * の許可が 1 つでもあると、IsPublic は true になります。
      en: A statement that only allows a specific service principal with a specific SourceArn does not count as public; any allow with Principal * makes IsPublic true.
    reproduce: { run: 'aws s3api get-bucket-policy-status --bucket {{ var.mediaBucket }}', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [S3, { zh-CN: 存储桶, ja: バケット, en: Buckets }], region: app }
      observed:
        question:
          zh-CN: 媒体桶的“访问”一栏显示什么？
          ja: メディアバケットの「アクセス」欄には何と表示されていますか？
          en: What does the media bucket's "Access" column show?
        options:
          - value: private
            label:
              zh-CN: 存储桶和对象不是公有的（或“仅授权用户”）
              ja: バケットとオブジェクトは非公開（または「許可されたユーザーのみ」）
              en: Bucket and objects not public (or "Only authorized users")
            expected: true
          - value: public
            label:
              zh-CN: 公开
              ja: 公開
              en: Public
            fixHint:
              zh-CN: 桶策略被改过；重新执行 scripts/module enable cdn --set CDN_MEDIA_ORIGIN=s3
              ja: バケットポリシーが変更されています。scripts/module enable cdn --set CDN_MEDIA_ORIGIN=s3 を再実行してください
              en: The bucket policy has been changed; run scripts/module enable cdn --set CDN_MEDIA_ORIGIN=s3 again

  - id: bucket-bpa
    title:
      zh-CN: 媒体桶的四项“阻止公有访问”全部开启
      ja: メディアバケットの「パブリックアクセスのブロック」の 4 項目がすべて有効
      en: All four Block Public Access settings are on for the media bucket
    type: aws-readonly
    service: s3
    action: GetPublicAccessBlock
    region: app
    params: { Bucket: '{{ var.mediaBucket }}' }
    dependsOn: [bucket-policy-oac]
    drift: { policy: must-hold }
    assert:
      - path: $.PublicAccessBlockConfiguration.BlockPublicAcls
        op: eq
        value: true
        label:
          zh-CN: BlockPublicAcls
          ja: BlockPublicAcls
          en: BlockPublicAcls
      - path: $.PublicAccessBlockConfiguration.IgnorePublicAcls
        op: eq
        value: true
        label:
          zh-CN: IgnorePublicAcls
          ja: IgnorePublicAcls
          en: IgnorePublicAcls
      - path: $.PublicAccessBlockConfiguration.BlockPublicPolicy
        op: eq
        value: true
        label:
          zh-CN: BlockPublicPolicy
          ja: BlockPublicPolicy
          en: BlockPublicPolicy
      - path: $.PublicAccessBlockConfiguration.RestrictPublicBuckets
        op: eq
        value: true
        label:
          zh-CN: RestrictPublicBuckets
          ja: RestrictPublicBuckets
          en: RestrictPublicBuckets
    explain:
      zh-CN: OAC 让 CloudFront 以服务身份读取私有桶，所以四项 BPA 可以保持全开。
      ja: OAC によって CloudFront はサービスの ID でプライベートバケットを読めるので、BPA の 4 項目はすべて有効のままにできます。
      en: OAC lets CloudFront read the private bucket with a service identity, so all four BPA settings can stay on.
    reproduce: { run: 'aws s3api get-public-access-block --bucket {{ var.mediaBucket }}', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [S3, { zh-CN: 存储桶, ja: バケット, en: Buckets }, '{{ var.mediaBucket }}', { zh-CN: 权限, ja: アクセス許可, en: Permissions }, { zh-CN: 阻止公有访问, ja: パブリックアクセスをブロック, en: Block public access }], region: app }
      observed:
        question:
          zh-CN: “阻止所有公开访问”是否为“开启”？
          ja: 「パブリックアクセスをすべてブロック」は「オン」ですか？
          en: Is "Block all public access" "On"?
        options:
          - value: 'on'
            label:
              zh-CN: 开启
              ja: オン
              en: On
            expected: true
          - value: 'off'
            label:
              zh-CN: 关闭
              ja: オフ
              en: Off
            fixHint:
              zh-CN: 不要关闭 BPA；OAC 不需要公开访问
              ja: BPA をオフにしないでください。OAC に公開アクセスは不要です
              en: Do not turn BPA off; OAC does not need public access

  - id: media-url-cdn
    title:
      zh-CN: 应用签发的缩略图 URL 改为分配域名下的稳定地址
      ja: アプリが発行するサムネイルの URL が、ディストリビューションのドメイン名の固定のアドレスに変わった
      en: Thumbnail URLs issued by the app have changed to stable addresses on the distribution's domain name
    type: http-header
    from: lab
    target: self
    path: /api/lab/probe/media-url
    method: GET
    dependsOn: [cap-cdn-healthy]
    drift: { policy: must-hold }
    assert:
      - path: $.status
        op: eq
        value: 200
        label:
          zh-CN: 状态码
          ja: ステータスコード
          en: Status code
      - path: $.json.cdn
        op: eq
        value: true
        label:
          zh-CN: 经 CDN 改写
          ja: CDN によって書き換え済み
          en: Rewritten by the CDN
      - path: $.json.host
        op: eq
        value: '{{ var.cdnDomain }}'
        label:
          zh-CN: 主机是本分配
          ja: ホストがこのディストリビューション
          en: The host is this distribution
      - path: $.json.scheme
        op: eq
        value: https
        label:
          zh-CN: HTTPS
          ja: HTTPS
          en: HTTPS
      - path: $.json.signed
        op: eq
        value: false
        label:
          zh-CN: 不再带签名参数
          ja: 署名パラメーターがもう付いていない
          en: No signature parameters any more
    explain:
      zh-CN: 公开可见的缩略图改为 https://<分配域名>/media/variants/…，URL 稳定，边缘与浏览器都能缓存；原图仍走预签名 URL。
      ja: 公開されているサムネイルは https://<ディストリビューションのドメイン名>/media/variants/… に変わり、URL が固定されるので、エッジでもブラウザーでもキャッシュできます。元画像は引き続き署名付き URL を使います。
      en: Public thumbnails change to https://<distribution domain>/media/variants/…, so the URL is stable and both the edge and the browser can cache it; originals still use presigned URLs.
    reproduce: { run: 'curl -s -o /dev/null -D - "http://127.0.0.1/api/feed?limit=1" | grep -i "^x-cloudalbum-path:"', runsOn: lab }
