cleanup:
  summary:
    zh-CN: 结束实验后，平台删除 tls 栈：ACME 端点删除时一并删除 EAB、域验证与已注册的 ACME 账户；回退分支的 us-east-1 集成证书在 CloudFront 解除挂载后删除。过期的 ACME 证书 ACM 会在一年后自动删除。你在自己 DNS 中添加的 A 记录与验证 CNAME 平台无权删除，请自己删掉。
    ja: ラボの終了後、プラットフォームが tls スタックを削除します。ACME エンドポイントを削除するときに、EAB、ドメイン検証、登録済みの ACME アカウントも一緒に削除されます。フォールバックの分岐の us-east-1 の統合証明書は、CloudFront から外された後に削除されます。期限切れの ACME 証明書は ACM が 1 年後に自動で削除します。自分の DNS に追加した A レコードと検証用の CNAME はプラットフォームには削除する権限がないので、自分で削除してください。
    en: "When the lab ends, the platform deletes the tls stack: deleting the ACME endpoint also deletes the EAB, the domain validation and the registered ACME account; the fallback branch's us-east-1 integrated certificate is deleted after it is detached from CloudFront. ACM deletes expired ACME certificates automatically after a year. The platform cannot delete the A record and validation CNAME you added in your own DNS, so delete them yourself."
  autoReclaim: true
  dataRisk:
    - zh-CN: 没有业务数据；证书私钥只在实验机的数据卷上（ACME 分支），随实验机删除
      ja: 業務データはありません。証明書の秘密鍵はラボ用インスタンスのデータボリュームにだけあり（ACME の分岐）、ラボ用インスタンスとともに削除されます
      en: No business data; the certificate's private key only lives on the lab instance's data volume (ACME branch) and is deleted with the instance
  learnerCreatedHints:
    - resourceType: 'AWS::CertificateManager::Certificate'
      how:
        zh-CN: 选做：结束前在实验机上执行 certbot revoke 吊销仍有效的 ACME 证书（ACM 的 RevokeCertificate 对它无效）
        ja: 任意：終了前にラボ用インスタンスで certbot revoke を実行し、まだ有効な ACME 証明書を失効させます（ACM の RevokeCertificate はこれには効きません）
        en: "Optional: before the lab ends, run certbot revoke on the lab instance to revoke the still-valid ACME certificate (ACM's RevokeCertificate does not work on it)"
  verify:
    - tls-stack-gone

saa:
  domains: [secure, performance]
  topics:
    - id: acm-integrated
      title:
        zh-CN: ACM 公有证书用于集成服务时免费、自动续期，私钥不可导出
        ja: ACM のパブリック証明書は統合サービスで使う場合は無料で自動更新され、秘密鍵はエクスポートできない
        en: ACM public certificates are free and auto-renewed when used with integrated services, and their private keys cannot be exported
      domain: secure
      relatesTo: two-columns
    - id: cert-region
      title:
        zh-CN: CloudFront（与 Cognito 托管登录页自定义域名）的证书必须在 us-east-1
        ja: CloudFront（と Cognito のマネージドログインページのカスタムドメイン）の証明書は us-east-1 になければならない
        en: Certificates for CloudFront (and custom domains for the Cognito managed login page) must be in us-east-1
      domain: secure
      relatesTo: enable-tls
    - id: dns-validation
      title:
        zh-CN: DNS 验证与邮件验证；验证记录必须保留才能续期
        ja: DNS 検証と E メール検証。更新には検証レコードを残しておく必要がある
        en: DNS vs email validation; validation records must stay in place for renewal
      domain: secure
      relatesTo: enable-tls
    - id: hsts
      title:
        zh-CN: HSTS 与 80→443 跳转的风险
        ja: HSTS と 80→443 リダイレクトのリスク
        en: The risks of HSTS and 80→443 redirects
      domain: secure
      relatesTo: force-https
    - id: edge-tls
      title:
        zh-CN: 在边缘终止 TLS 降低远端用户的握手延迟
        ja: エッジで TLS を終端して、遠方のユーザーのハンドシェイク遅延を減らす
        en: Terminating TLS at the edge reduces handshake latency for distant users
      domain: performance
      relatesTo: after
  confusables:
    - a:
        zh-CN: ACM 集成证书
        ja: ACM 統合証明書
        en: ACM integrated certificate
      b:
        zh-CN: ACM ACME 证书
        ja: ACM ACME 証明書
        en: ACM ACME certificate
      rule:
        zh-CN: 集成证书挂在 CloudFront / ALB / API Gateway 上、由 ACM 托管续期；ACME 证书装在自管服务器上、由客户端续期，反过来不能挂到集成服务上
        ja: 統合証明書は CloudFront / ALB / API Gateway に付け、ACM が更新を管理します。ACME 証明書は自己管理のサーバーに導入し、クライアントが更新します。逆に統合サービスに付けることはできません
        en: Integrated certificates attach to CloudFront / ALB / API Gateway and ACM manages their renewal; ACME certificates are installed on self-managed servers and renewed by the client, and cannot be attached to integrated services
    - a:
        zh-CN: 导入的第三方证书
        ja: インポートしたサードパーティーの証明書
        en: Imported third-party certificate
      b:
        zh-CN: ACM 签发的证书
        ja: ACM が発行した証明書
        en: ACM-issued certificate
      rule:
        zh-CN: 导入的证书不会自动续期，要自己重新导入；ACM 签发的集成证书自动续期
        ja: インポートした証明書は自動更新されないので、自分で再インポートする必要があります。ACM が発行した統合証明書は自動で更新されます
        en: Imported certificates are not renewed automatically and must be re-imported yourself; ACM-issued integrated certificates renew automatically

tags: [tls, acm, acme, https, certificate]

