# labs/svc-tls/lab.yaml —— AWS Certificate Manager：HTTPS 证书（cards/service-cards-1 §6）
# 与卡片设计的差异（实现核对，见 implementation-notes wave1-route53-acm）：
#   - 回退变体 acme-off 的 targetModules 另含 dns（本地档 external，学员在第 2 步启用）：DEP-005 ③ 的 “dns | 外部 DNS” 由学员
#     满足，不进起始状态（04 §3.2.3 规则 6），起始状态的闭包因此只加 cdn。
#   - 两个变体的目标都写 TLS_DOMAIN = learner.inputs.domain：DEP-005 ① 由学员的前置输入满足（推导时不再报“无法自动满足”）。
#   - 直连证书用本机 tls-handshake（不带 SNI：Nginx 只有一张证书）；CloudFront / 域名入口由平台发起 http-header 请求。
#   - ACME 证书的控制面证据：acm:ListCertificates（CertificateKeyPairOrigins=ACME）找出证书，再 acm:DescribeCertificate 带 ownership。
schema: atl.lab/v2
id: svc-tls
kind: service
version: 1.0.0
status: beta
service:
  zh-CN: AWS Certificate Manager
  ja: AWS Certificate Manager
  en: AWS Certificate Manager
function:
  zh-CN: HTTPS 证书
  ja: HTTPS 証明書
  en: HTTPS certificates
title:
  zh-CN: AWS Certificate Manager：HTTPS 证书
  ja: AWS Certificate Manager：HTTPS 証明書
  en: "AWS Certificate Manager: HTTPS certificates"
subtitle:
  zh-CN: 自签名 → ACM（ACME → Nginx，或 CloudFront 上的集成证书）
  ja: 自己署名 → ACM（ACME → Nginx、または CloudFront 上の統合証明書）
  en: Self-signed → ACM (ACME → Nginx, or an integrated certificate on CloudFront)
summary:
  zh-CN: 从浏览器拦截页到地址栏的锁：用 ACM 的 ACME 端点把受信任证书装到 Nginx，并分清“考试结论”和“2026 新能力”。
  ja: ブラウザーの警告ページからアドレスバーの鍵マークへ。ACM の ACME エンドポイントで信頼された証明書を Nginx に導入し、「試験の結論」と「2026 年の新機能」を区別します。
  en: "From the browser's warning page to the padlock in the address bar: install a trusted certificate in Nginx through ACM's ACME endpoint, and tell \"the exam answer\" from \"the 2026 capability\"."
story:
  zh-CN: |
    L0 的 443 是 User Data 生成的自签名证书：流量虽然加密，浏览器却显示“不安全”，跨源 fetch 与 Cognito 回调都会失败。
    这张卡片用 ACM 给你的域名签发受信任证书：ACME 端点可用时证书经 certbot 装进 Nginx（45 天，客户端续期）；
    不可用时回到考试中的经典形态——证书挂在 CloudFront 上，必须在 us-east-1。
  ja: |
    L0 の 443 は User Data が生成した自己署名証明書です。通信は暗号化されていますが、ブラウザーには「保護されていない通信」と表示され、クロスオリジンの fetch や Cognito のコールバックは失敗します。
    このカードでは ACM であなたのドメインに信頼された証明書を発行します。ACME エンドポイントが使える場合、証明書は certbot で Nginx に導入されます（45 日、クライアント側で更新）。
    使えない場合は試験でおなじみの形に戻ります。証明書は CloudFront に付け、us-east-1 になければなりません。
  en: |
    L0's port 443 uses a self-signed certificate generated by User Data: traffic is encrypted, but the browser says "Not secure", and cross-origin fetches and Cognito callbacks fail.
    This card has ACM issue a trusted certificate for your domain: when the ACME endpoint is available, certbot installs the certificate in Nginx (45 days, renewed by the client);
    when it is not, you fall back to the classic exam setup — the certificate is attached to CloudFront and must be in us-east-1.
objectives:
  - text:
      zh-CN: 区分自签名、Let's Encrypt 与 ACM 证书在信任与续期上的差别
      ja: 自己署名、Let's Encrypt、ACM の証明書について、信頼と更新の違いを説明できる
      en: Distinguish self-signed, Let's Encrypt and ACM certificates in terms of trust and renewal
    domain: secure
    relatesTo: before
  - text:
      zh-CN: 用 ACME 端点 + 预先批准的 DNS 域验证 + EAB 给自管服务器签发证书
      ja: ACME エンドポイント + 事前承認された DNS ドメイン検証 + EAB で、自己管理のサーバーに証明書を発行できる
      en: Issue a certificate for a self-managed server with the ACME endpoint + pre-approved DNS domain validation + EAB
    domain: secure
    relatesTo: enable-tls
  - text:
      zh-CN: 记住考试结论：ACM 公有证书只挂在集成服务上，CloudFront 的证书在 us-east-1
      ja: 試験の結論を説明できる：ACM のパブリック証明書は統合サービスにしか付けられず、CloudFront の証明書は us-east-1 にある
      en: "Remember the exam answer: ACM public certificates only attach to integrated services, and CloudFront's certificate is in us-east-1"
    domain: secure
    relatesTo: two-columns
  - text:
      zh-CN: 理解证书续期由谁负责，以及 HSTS 的风险
      ja: 証明書の更新を誰が担当するか、そして HSTS のリスクを説明できる
      en: Understand who is responsible for renewal, and the risks of HSTS
    domain: secure
    relatesTo: after
difficulty: intermediate
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: { maxCount: 2, minutesEach: 30 }
retain:
  allowed: true
  maxHours: 24
  reason:
    zh-CN: 证书与域验证可以在保留的环境中继续使用；ACME 证书每次签发按域名计费，不必重复签发
    ja: 証明書とドメイン検証は保持した環境で引き続き使えます。ACME 証明書は発行のたびにドメインごとに課金されるので、再発行する必要はありません
    en: The certificate and domain validation keep working in a kept environment; ACME certificates are billed per domain at each issuance, so there is no need to reissue
regions:
  supported: [ap-northeast-1]
  alsoUses: [global, us-east-1]
services:
  - id: acm
    name:
      zh-CN: AWS Certificate Manager
      ja: AWS Certificate Manager
      en: AWS Certificate Manager
    role: primary
    module: tls
  - id: iam
    name:
      zh-CN: AWS IAM（实例角色与 ACME 签发角色）
      ja: AWS IAM（インスタンスロールと ACME 発行ロール）
      en: AWS IAM (instance role and ACME issuer role)
    role: context
    module: iam
  - id: cloudfront
    name:
      zh-CN: Amazon CloudFront（仅回退分支）
      ja: Amazon CloudFront（フォールバックの分岐のみ）
      en: Amazon CloudFront (fallback branch only)
    role: context
    module: cdn
    optional: true
  - id: ssm-session-manager
    name:
      zh-CN: AWS Systems Manager Session Manager（平台管理通道）
      ja: AWS Systems Manager Session Manager（プラットフォームの管理チャネル）
      en: AWS Systems Manager Session Manager (platform management channel)
    role: observed
modules: { target: [tls], start: [iam], context: [], related: [dns, cdn, load-balancer] }
prerequisites:
  cards:
    - { id: svc-dns, kind: soft }
    - { id: svc-cdn, kind: soft }
  learnerInputs:
    - { id: domain }
    - { id: hosted-zone, required: false }
  knowledge:
    - zh-CN: HTTPS 与证书链的基本概念
      ja: HTTPS と証明書チェーンの基本
      en: basics of HTTPS and certificate chains
    - zh-CN: 在你的 DNS 中添加 A 与 CNAME 记录的方法
      ja: 自分の DNS に A レコードと CNAME レコードを追加する方法
      en: how to add A and CNAME records in your DNS

startProfile:
  provisions:
    - item: iam
      kind: module
      basis: credential
      set: { IAM_CREDENTIALS: role }
      reason:
        zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色；证书续期状态的控制面感知因此可用
        ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています。これにより証明書の更新状態をコントロールプレーンから検知できます
        en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role, which makes control plane sensing of certificate renewal status possible
    - item: mgmt-channel
      kind: platform
      reason:
        zh-CN: 实验机挂只含 AmazonSSMManagedInstanceCore 的 CloudAlbumAppRole，是平台的管理通道，不是应用权限
        ja: ラボ用インスタンスには AmazonSSMManagedInstanceCore だけを含む CloudAlbumAppRole が付いています。これはプラットフォームの管理チャネルであり、アプリの権限ではありません
        en: The lab instance carries CloudAlbumAppRole with only AmazonSSMManagedInstanceCore. It is the platform's management channel, not an app permission
    - item: workstation
      kind: platform
      reason:
        zh-CN: 每个会话一台工作台，用于运行 scripts/module、AWS CLI 与对比实验
        ja: セッションごとに 1 台のワークベンチがあり、scripts/module、AWS CLI、比較実験の実行に使います
        en: Each session has one workbench for running scripts/module, the AWS CLI and comparison experiments
    - item: check-bundle
      kind: platform
      reason:
        zh-CN: 检查包随 CloudAlbum 发布包安装在实验机的 /opt/atl（06 PM-04）
        ja: チェックパッケージは CloudAlbum のリリースパッケージとともにラボ用インスタンスの /opt/atl にインストールされます（06 PM-04）
        en: The check package is installed with the CloudAlbum release package in /opt/atl on the lab instance (06 PM-04)
  platform: { preview: { directHttps: 'off' } }
  reason:
    zh-CN: ACME 端点可用时 tls 没有模块依赖，起始状态只有实例角色；本卡要从自签名讲起，所以关闭平台的方案 B 预览（预览在新标签页打开 http://<EIP>）。域名是你的前置输入，不在起始状态里
    ja: ACME エンドポイントが使えるとき tls にはモジュールの依存がなく、開始状態はインスタンスロールだけです。このカードは自己署名から始めるので、プラットフォームの方式 B のプレビューを無効にします（プレビューは新しいタブで http://<EIP> を開きます）。ドメイン名はあなたが事前に入力するもので、開始状態には含まれません
    en: When the ACME endpoint is available, tls has no module dependencies and the start state is just the instance role; this card starts from self-signed, so the platform's option B preview is turned off (the preview opens http://<EIP> in a new tab). The domain is your prerequisite input, not part of the start state
  variants:
    - id: acme-off
      title:
        zh-CN: ACME 端点不可用：证书挂在 CloudFront 上（考试形态）
        ja: ACME エンドポイントが使えない：証明書を CloudFront に付ける（試験の形）
        en: "ACME endpoint unavailable: the certificate goes on CloudFront (the exam setup)"
      select: preflight
      when: "preflight.tlsAcme == 'off'"
      provisions:
        - item: iam
          kind: module
          basis: credential
          set: { IAM_CREDENTIALS: role }
          reason:
            zh-CN: 同默认变体
            ja: デフォルトのバリアントと同じ
            en: Same as the default variant
        - item: cdn
          kind: module
          basis: closure
          rule: DEP-005
          set: {}
          reason:
            zh-CN: 'TLS_ACME=off 时 tls 的最小依赖退回“dns 或外部 DNS”与“cdn 或 load-balancer”；选 cdn：不按小时计费，集成证书必须在 us-east-1，正是考点'
            ja: TLS_ACME=off のとき、tls の最小の依存は「dns または外部 DNS」と「cdn または load-balancer」に戻ります。cdn を選ぶのは、時間課金がなく、統合証明書が us-east-1 になければならないという試験のポイントそのものだからです
            en: With TLS_ACME=off, tls's minimal dependencies fall back to "dns or external DNS" and "cdn or load-balancer"; cdn is chosen because it is not billed hourly and its integrated certificate must be in us-east-1, which is exactly the exam point
        - item: mgmt-channel
          kind: platform
          reason:
            zh-CN: 同默认变体
            ja: デフォルトのバリアントと同じ
            en: Same as the default variant
        - item: workstation
          kind: platform
          reason:
            zh-CN: 同默认变体
            ja: デフォルトのバリアントと同じ
            en: Same as the default variant
        - item: check-bundle
          kind: platform
          reason:
            zh-CN: 同默认变体
            ja: デフォルトのバリアントと同じ
            en: Same as the default variant
      targetModules:
        - { id: dns, driver: external, set: { APP_BASE_URL: 'http://{{ learner.inputs.domain }}' }, wireStep: domain }
        - { id: tls, driver: acm, set: { TLS_ACME: 'off', TLS_DOMAIN: '{{ learner.inputs.domain }}' }, wireStep: enable-tls }
      reason:
        zh-CN: 账号预检发现 ACME 端点不可用时，起始状态再加 cdn（EC2 为源站）；外部 DNS 的本地档由你在第 2 步写入
        ja: アカウントの事前チェックで ACME エンドポイントが使えないとわかった場合、開始状態に cdn（EC2 がオリジン）を追加します。外部 DNS のローカル階層はステップ 2 であなたが書き込みます
        en: When the account preflight finds the ACME endpoint unavailable, the start state adds cdn (with EC2 as the origin); you write the external DNS local tier in step 2
targetModules:
  - id: tls
    driver: acm
    set: { TLS_ACME: 'on', TLS_DOMAIN: '{{ learner.inputs.domain }}' }
    wireStep: enable-tls
    adoptsExisting: false
expectedWarnings: []
workstation: { required: true, tools: [aws-cli, node, jq], savingsMode: degraded }
platform:
  consoleLinks: [ec2.instance, cloudfront.distribution]
provision: { class: A, cleanupBudgetMinutes: 30 }

variables:
  acmeDirectoryUrl:
    label:
      zh-CN: ACME 目录 URL
      ja: ACME ディレクトリの URL
      en: ACME directory URL
    from: derived
    fillFrom: envfile.tls.TLS_ACME_DIRECTORY_URL
    pattern: '^https://[A-Za-z0-9.-]+/[A-Za-z0-9._~/-]*$'
    example: https://acm-acme-enroll.ap-northeast-1.api.aws/0123456789abcdef/directory
    help:
      zh-CN: 启用 tls（ACME 分支）后由 tls 栈输出自动取得；回退分支为空
      ja: tls（ACME の分岐）を有効にすると tls スタックの出力から自動で取得します。フォールバックの分岐では空です
      en: Taken automatically from the tls stack outputs once tls is enabled (ACME branch); empty in the fallback branch

cost:
  currency: USD
  tier: low
  mainDrivers:
    - zh-CN: ACME 证书（按证书中的域名，在签发与每次续期时计费）
      ja: ACME 証明書（証明書内のドメインごとに、発行時と更新のたびに課金）
      en: ACME certificates (billed per domain in the certificate, at issuance and every renewal)
    - zh-CN: 回退分支的 CloudFront 按量
      ja: フォールバックの分岐の CloudFront の使用量課金
      en: CloudFront usage in the fallback branch
  basis:
    - ref: start-profile
      note:
        zh-CN: 实验机 EC2、EBS（根卷与数据卷）、公网 IPv4；回退变体另有 CloudFront 分配（按量）
        ja: ラボ用インスタンスの EC2、EBS（ルートボリュームとデータボリューム）、パブリック IPv4。フォールバックのバリアントでは CloudFront ディストリビューション（使用量課金）も加わります
        en: Lab instance EC2, EBS (root and data volumes) and public IPv4; the fallback variant adds a CloudFront distribution (billed by usage)
    - ref: workstation
      note:
        zh-CN: 工作台 EC2、EBS、公网 IPv4
        ja: ワークベンチの EC2、EBS、パブリック IPv4
        en: Workbench EC2, EBS and public IPv4
  assumptions:
    - zh-CN: ACME 证书按证书中的域名在签发与每次续期时各计一次（第 5 步的续期演练会多签发一次）；用于 CloudFront / ALB 的集成证书免费；以官方定价页为准
      ja: ACME 証明書は証明書内のドメインごとに、発行時と更新のたびに 1 回ずつ課金されます（ステップ 5 の更新の演習で 1 回多く発行します）。CloudFront / ALB 用の統合証明書は無料です。正確な料金は公式の料金ページを確認してください
      en: ACME certificates are billed once per domain in the certificate at issuance and at each renewal (the renewal drill in step 5 issues one more); integrated certificates for CloudFront / ALB are free; check the official pricing page
    - zh-CN: 报价中暂无 ACM ACME 的计费维度（labs/_pricing 待补），金额以 ACM 定价页为准
      ja: 見積もりにはまだ ACM ACME の課金ディメンションがありません（labs/_pricing は今後追加）。金額は ACM の料金ページを確認してください
      en: The quote does not yet include an ACM ACME billing dimension (labs/_pricing to be added); see the ACM pricing page for amounts

steps:
  - id: before
    type: experiment
    title:
      zh-CN: before：自签名证书，浏览器拦截
      ja: before：自己署名証明書、ブラウザーがブロック
      en: "before: self-signed certificate, blocked by the browser"
    manual: manual/10-before.md
    experiment: { module: tls, id: inspect, label: before }
    panel: terminal-workstation
    estMinutes: 10
    checks: [tls-off, direct-selfsigned, exp-inspect-before]

  - id: domain
    type: observe
    title:
      zh-CN: 准备域名：A 记录指向实验机（回退分支另写外部 DNS 本地档）
      ja: ドメインを準備：A レコードをラボ用インスタンスに向ける（フォールバックの分岐では外部 DNS のローカル階層も書き込む）
      en: "Prepare the domain: point an A record at the lab instance (the fallback branch also writes the external DNS local tier)"
    manual: manual/20-domain.md
    panel: terminal-workstation
    estMinutes: 10
    checks: [domain-a-record, dns-external-env, cap-dns-external]

  - id: which-path
    type: cli
    title:
      zh-CN: 先判断走哪条路：ACME 端点可用吗
      ja: まずどの道を進むか判断：ACME エンドポイントは使えるか
      en: "First decide which path: is the ACME endpoint available?"
    manual: manual/30-which-path.md
    panel: terminal-workstation
    estMinutes: 5
    checks: [acme-decision]

  - id: enable-tls
    type: script
    wire: true
    title:
      zh-CN: 启用 tls：ACME 证书装进 Nginx（或集成证书挂到 CloudFront）
      ja: tls を有効にする：ACME 証明書を Nginx に導入（または統合証明書を CloudFront に付ける）
      en: "Enable tls: install the ACME certificate in Nginx (or attach an integrated certificate to CloudFront)"
    manual: manual/40-enable-tls.md
    methods: [script]
    requires: { steps: [domain] }
    panel: terminal-workstation
    estMinutes: 25
    startsBilling:
      class: usage
      pricingKeys: []
      note:
        zh-CN: ACME 证书按域名在签发时计费一次（以官方定价为准）
        ja: ACME 証明書は発行時にドメインごとに 1 回課金されます（公式の料金を確認してください）
        en: ACME certificates are billed once per domain at issuance (check the official pricing)
    wait:
      typicalMinutes: 5
      maxMinutes: 30
      text:
        zh-CN: 等待域验证（你添加的 CNAME 生效）与签发
        ja: ドメイン検証（あなたが追加した CNAME の反映）と発行を待ちます
        en: Wait for domain validation (your CNAME taking effect) and issuance
    checks: [cap-tls-healthy, tls-module-state, tls-stack, tls-edge-stack, direct-acme-cert, tls-domain-entry, cdn-alias-entry, acme-cert-listed, acme-cert-issued, edge-cert-issued]

  - id: after
    type: experiment
    title:
      zh-CN: after 与续期：受信任证书，certbot 续期后证书 ARN 不变
      ja: after と更新：信頼された証明書。certbot で更新しても証明書の ARN は変わらない
      en: "after and renewal: a trusted certificate whose ARN stays the same after certbot renews it"
    manual: manual/50-after.md
    experiment: { module: tls, id: inspect, label: after }
    requires: { steps: [enable-tls] }
    panel: terminal-workstation
    estMinutes: 15
    checks: [exp-inspect-pair, exp-renew-drill]

  - id: two-columns
    type: observe
    title:
      zh-CN: 两栏对照：考试结论与 2026 新能力
      ja: 2 列で比較：試験の結論と 2026 年の新機能
      en: "Two columns: the exam answer and the 2026 capability"
    manual: manual/60-two-columns.md
    requires: { steps: [enable-tls] }
    panel: terminal-workstation
    estMinutes: 5
    checks: [exam-vs-new]

  - id: force-https
    type: script
    title:
      zh-CN: （选做）强制 HTTPS 与 HSTS
      ja: HTTPS の強制と HSTS
      en: Force HTTPS and HSTS
    manual: manual/70-force-https.md
    optional:
      reason:
        zh-CN: 不影响完成；HSTS 会被浏览器记住，结束前必须关闭
        ja: 完了には影響しません。HSTS はブラウザーに記憶されるので、終了前に必ず無効にしてください
        en: Does not affect completion; browsers remember HSTS, so turn it off before the lab ends
      when: "session.variant != 'acme-off'"
    requires: { steps: [enable-tls] }
    panel: terminal-workstation
    estMinutes: 10
    checks: [ { ref: http-redirects-https, required: false }, { ref: no-dep-015, required: false } ]

finalChecks:
  - no-world-ssh
  - { ref: cap-tls-healthy, as: final-tls-healthy }

experiments:
  - module: tls
    id: inspect
    labels:
      - { id: before, role: baseline, requires: { tls: selfsigned } }
      - { id: after, role: treatment, requires: { tls: acm } }
    pairs: [[before, after]]
    required: true
    runner: workstation
    validity: functional
    corroborateWith: [cap-tls-healthy]
