# 起始状态（before）断言：一律 drift once（C3、04 §3.5 第 9 条）
checks:
  - id: tls-off
    title: 起始状态：tls 未启用，Nginx 用自签名证书
    type: capability
    module: tls
    drift: { policy: once }
    assert:
      - { path: $.driver, op: eq, value: selfsigned, label: 驱动 }
      - { path: $.status, op: eq, value: 'off', label: 状态 }
    explain: 本卡关闭了平台的方案 B 预览，所以起点是 L0 的自签名证书（TLS_MODE=selfsigned）。
    reproduce: { run: 'curl -s http://127.0.0.1/api/capabilities | jq "{https, tls: .modules.tls | {driver, status}}"', runsOn: lab }

  - id: direct-selfsigned
    title: 起始状态：实验机 443 上的证书由 CN=cloudalbum-l0 自签名，不受信任
    type: local
    on: lab
    checkId: tls-handshake
    args: { target: self }
    drift: { policy: once }
    assert:
      - { path: $.issuer, op: eq, value: cloudalbum-l0, label: 签发者 }
      - { path: $.authorized, op: eq, value: false, label: 不受信任 }
    explain: 从实验机本机握手 127.0.0.1:443 读出证书（等价于 openssl s_client）；自签名证书的签发者就是它自己。
    reproduce: { run: 'openssl s_client -connect 127.0.0.1:443 </dev/null 2>/dev/null | openssl x509 -noout -issuer -subject -dates', runsOn: lab }
