# 回收后的验证（04 §3.2.12）：只允许 aws-readonly + expectError，结果写进报告的“清理”一节
checks:
  - id: tls-stack-gone
    title:
      zh-CN: 本会话的 tls 栈已删除
      ja: このセッションの tls スタックが削除された
      en: This session's tls stack has been deleted
    type: aws-readonly
    service: cloudformation
    action: DescribeStacks
    region: app
    params: { StackName: 'cloudalbum-{{ session.env }}-tls' }
    expectError: ValidationError
    required: false
    explain:
      zh-CN: 回收完成后按栈名查询，期望返回“栈不存在”；ACME 端点随栈删除时一并删除 EAB、域验证与 ACME 账户。
      ja: 回収の完了後にスタック名で問い合わせ、「スタックが存在しない」が返ることを期待します。ACME エンドポイントはスタックとともに削除され、EAB、ドメイン検証、ACME アカウントも一緒に削除されます。
      en: After reclaim finishes, query by stack name and expect "stack does not exist"; the ACME endpoint is deleted with the stack, together with the EAB, domain validation and ACME account.
    reproduce: { run: 'aws cloudformation describe-stacks --stack-name cloudalbum-{{ session.env }}-tls', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudFormation, { zh-CN: 栈, ja: スタック, en: Stacks }], region: app }
      observed:
        question:
          zh-CN: '列表中还能找到 cloudalbum-{{ session.env }}-tls 吗？'
          ja: 一覧にまだ cloudalbum-{{ session.env }}-tls がありますか？
          en: Can you still find cloudalbum-{{ session.env }}-tls in the list?
        options:
          - value: gone
            label:
              zh-CN: 找不到
              ja: 見つからない
              en: Not found
            expected: true
          - value: present
            label:
              zh-CN: 还在
              ja: まだある
              en: Still there
            fixHint:
              zh-CN: 回收需要一点时间
              ja: 回収には少し時間がかかります
              en: Reclaim takes a little while
