# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: sc-threat-compliance
kind: scenario
version: 0.1.0
status: planned
title:
  zh-CN: 威胁检测与合规
  ja: 脅威検出とコンプライアンス
  en: Threat detection and compliance
subtitle:
  zh-CN: GuardDuty + Inspector + Config + CloudTrail
  ja: GuardDuty + Inspector + Config + CloudTrail
  en: GuardDuty + Inspector + Config + CloudTrail
summary:
  zh-CN: 四个“只检测、不阻断”的服务各看一个方向——异常行为、软件漏洞、配置违规、操作记录——用金丝雀逐个触发，再把发现汇总成一条响应链
  ja: 「検出のみでブロックしない」4 つのサービスが、それぞれ異常な振る舞い、ソフトウェアの脆弱性、設定違反、操作記録という 1 つの方向を見張ります。カナリアで 1 つずつ発火させ、検出結果を 1 本の対応の流れにまとめます
  en: Four detect-only services each watch one direction — anomalous behavior, software vulnerabilities, configuration violations and the record of actions; trigger each one with a canary and then combine the findings into a single response chain
story:
  zh-CN: 安全团队收到一份客户问卷：“你们如何发现被入侵的服务器？如何管理软件漏洞？如何确保配置不偏离基线？发生事件后如何追溯是谁做的？”团队目前只有 fail2ban 和每天一次的 `dnf updateinfo`，而且它们都跑在被保护的那台服务器上。目标是在一个下午搭起一套账号级、与实例解耦的检测体系，并用演练证明每一类问题都能在可接受的时间内被发现、被通知、被追溯。
  ja: セキュリティチームに顧客から質問票が届きました。「侵害されたサーバーをどのように発見しますか？ソフトウェアの脆弱性をどう管理していますか？設定がベースラインから外れないことをどう保証しますか？インシデントの後、誰がやったのかをどう追跡しますか？」現在あるのは fail2ban と 1 日 1 回の `dnf updateinfo` だけで、しかもどちらも保護対象のサーバー上で動いています。目標は、アカウント単位でインスタンスから切り離された検出の仕組みを午後のうちに構築し、訓練によって、各種類の問題が許容できる時間内に検出・通知・追跡できることを示すことです。
  en: 'The security team receives a customer questionnaire: "How do you detect a compromised server? How do you manage software vulnerabilities? How do you make sure configuration does not drift from the baseline? After an incident, how do you trace who did it?" All the team has today is fail2ban and a daily `dnf updateinfo`, and both run on the very server they protect. The goal is to build an account-level detection setup, decoupled from the instance, in one afternoon, and prove with drills that each kind of problem is detected, notified and traced within an acceptable time.'
scenario:
  question:
    zh-CN: 一家公司有几十个 AWS 账号，安全团队希望在一个地方集中查看 GuardDuty、Inspector、Config 等服务的发现，按严重程度排序，并对照安全最佳实践标准打分。最合适的是？
    ja: ある企業には数十の AWS アカウントがあります。セキュリティチームは GuardDuty、Inspector、Config などのサービスの検出結果を 1 か所でまとめて確認し、重大度順に並べ、セキュリティのベストプラクティス標準に照らしてスコアを付けたいと考えています。最も適切なのはどれですか？
    en: A company has dozens of AWS accounts. The security team wants to see findings from GuardDuty, Inspector, Config and other services in one place, sorted by severity and scored against security best-practice standards. What is the most suitable choice?
difficulty: intermediate
estimatedMinutes: 120
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
