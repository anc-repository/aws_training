schema: atl.lab/v2
id: sc-security-baseline
kind: scenario
version: 0.1.0
status: planned
title:
  zh-CN: 安全基线
  ja: セキュリティベースライン
  en: Security baseline
subtitle:
  zh-CN: IAM + KMS + Secrets Manager + CloudTrail + Config
  ja: IAM + KMS + Secrets Manager + CloudTrail + Config
  en: IAM + KMS + Secrets Manager + CloudTrail + Config
summary:
  zh-CN: 从“机密和主密钥都躺在数据卷上”出发，依次建立临时凭证、客户托管密钥、集中的机密管理、不可篡改的操作审计与持续的配置合规检查
  ja: 「シークレットもマスターキーもデータボリューム上にある」状態から出発し、一時的な認証情報、カスタマー管理キー、シークレットの一元管理、改ざんできない操作の監査、継続的な設定のコンプライアンスチェックを順に整えます
  en: Start from "secrets and the master key both sit on the data volume" and build up, in order, temporary credentials, a customer managed key, central secrets management, tamper-proof audit of actions, and continuous configuration compliance checks
story:
  zh-CN: 公司准备接受客户的安全审查，问卷里有五个问题：服务器用什么身份访问 AWS，密钥会不会泄露？数据库密码、JWT 签名密钥放在哪里，多久轮换一次？敏感字段的加密密钥由谁保管，能否一键吊销？谁在什么时候删除了哪个资源，日志能否被篡改？安全组有没有对全网开放 22，发现了多久能知道？目前的答案几乎全是“在服务器上的一个文件里”。
  ja: 会社は顧客のセキュリティ審査を受ける準備をしています。質問票には 5 つの質問があります。サーバーはどの ID で AWS にアクセスしていて、キーが漏れることはないか。データベースのパスワードや JWT 署名キーはどこにあり、どのくらいの頻度でローテーションしているか。機密フィールドの暗号化キーは誰が保管し、ワンクリックで無効にできるか。誰がいつどのリソースを削除したか、そのログは改ざんできないか。セキュリティグループで 22 番ポートがインターネット全体に開いていないか、開いていたらどれくらいで気づけるか。現在の答えはほとんどが「サーバー上のあるファイルの中」です。
  en: 'The company is preparing for a customer security review, and the questionnaire has five questions: Which identity does the server use to access AWS, and can its keys leak? Where are the database password and the JWT signing key, and how often are they rotated? Who holds the encryption key for sensitive fields, and can it be revoked with one click? Who deleted which resource when, and can those logs be tampered with? Does any security group open port 22 to the whole internet, and how soon would you know? Today almost every answer is "in a file on the server".'
scenario:
  question:
    zh-CN: 审计要求：所有 S3 中的敏感数据必须使用公司自己控制的密钥加密，能够审计每一次解密，并在发生安全事件时立即让所有数据不可读。最合适的是？
    ja: 監査要件：S3 内のすべての機密データを会社自身が管理するキーで暗号化し、すべての復号を監査でき、セキュリティインシデントの発生時にはすべてのデータを直ちに読めなくできること。最も適切なのはどれですか？
    en: "Audit requirement: all sensitive data in S3 must be encrypted with a key the company controls, every decryption must be auditable, and in a security incident all of the data must be made unreadable immediately. What is the most suitable choice?"
difficulty: intermediate
estimatedMinutes: 120
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: kms, role: primary, module: kms}
- {id: secretsmanager, role: primary, module: secrets}
- {id: cloudtrail, role: primary, module: audit}
- {id: config, role: primary, module: compliance}
- {id: iam, role: context, module: iam}
modules:
  target: [kms, secrets, audit, compliance]
  start: [iam]
  context: []
  related: []
prerequisites:
  cards:
  - {id: svc-iam, kind: soft}
  - {id: svc-kms, kind: soft}
  - {id: svc-secrets, kind: soft}
  learnerInputs:
  - {id: alert-email}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: kms, driver: kms}
- {id: secrets, driver: secretsmanager}
- {id: audit, driver: cloudtrail}
- {id: compliance, driver: config}
expectedWarnings: []
cost: {tier: medium}
provision: {class: A}
platformOps:
- id: iam-keys-on
  op: enable
  module: iam
  args: {keysModeOn: true}
  title:
    zh-CN: 演示长期访问密钥
    ja: 長期アクセスキーのデモ
    en: Demonstrate a long-term access key
  optional: true
- id: iam-keys-off
  op: enable
  module: iam
  args: {keysModeOff: true}
  title:
    zh-CN: 删除演示用访问密钥
    ja: デモ用アクセスキーを削除
    en: Delete the demo access key
  optional: true
badge:
  title:
    zh-CN: 安全基线
    ja: セキュリティベースライン
    en: Security baseline
  short:
    zh-CN: 安全基线
    ja: ベースライン
    en: Baseline
tracks: [saa-main, secure]
saa:
  domains: [secure]
tags: [audit, compliance, kms, secrets]
certificate: {enabled: false}
