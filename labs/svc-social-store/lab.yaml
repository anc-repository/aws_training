# labs/svc-social-store/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-social-store
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: Amazon DynamoDB
  ja: Amazon DynamoDB
  en: Amazon DynamoDB
function:
  zh-CN: 点赞、评论与分享链接
  ja: いいね、コメント、共有リンク
  en: Likes, comments and share links
title:
  zh-CN: Amazon DynamoDB：点赞、评论与分享链接
  ja: Amazon DynamoDB：いいね、コメント、共有リンク
  en: "Amazon DynamoDB: likes, comments and share links"
summary:
  zh-CN: 把点赞、评论、分享链接从关系库搬进一张按需计费的 DynamoDB 单表，用条件写入与事务保证幂等计数，用 TTL 让过期链接自动离场。
  ja: いいね、コメント、共有リンクをリレーショナルデータベースからオンデマンド課金の DynamoDB 単一テーブルに移します。条件付き書き込みとトランザクションで冪等なカウントを保証し、TTL で期限切れのリンクを自動的に消します。
  en: "Move likes, comments and share links from the relational database into a single on-demand DynamoDB table: conditional writes and transactions keep counts idempotent, and TTL removes expired links automatically."
difficulty: beginner
estimatedMinutes: 60
timeLimitMinutes: 90
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- id: dynamodb
  name:
    zh-CN: Amazon DynamoDB
    ja: Amazon DynamoDB
    en: Amazon DynamoDB
  role: primary
  module: social-store
- {id: iam, role: context, module: iam}
modules:
  target: [social-store]
  start: [iam]
  context: []
  related: [social-api]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: svc-iam, kind: soft}
  - {id: sc-serverless-api, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: social-store, driver: dynamodb}
expectedWarnings: []
cost: {tier: low, tierWithOptional: medium}
provision: {class: A}
badge:
  title:
    zh-CN: 单表设计
    ja: 単一テーブル設計
    en: Single-table design
tracks: [cost-optimized, performant, saa-main, serverless]
saa:
  domains: [performance, resilient, cost]
tags: [social-store, dynamodb]
certificate: {enabled: false}
