# labs/svc-db-proxy/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-db-proxy
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: Amazon RDS Proxy
  ja: Amazon RDS Proxy
  en: Amazon RDS Proxy
function:
  zh-CN: 数据库连接池
  ja: データベース接続プール
  en: Database connection pooling
title:
  zh-CN: Amazon RDS Proxy：数据库连接池
  ja: Amazon RDS Proxy：データベース接続プール
  en: "Amazon RDS Proxy: database connection pooling"
summary:
  zh-CN: 从“每个进程一个连接池”到本机 PgBouncer，再到托管的 RDS Proxy：数据库实际连接数从随进程线性增长变成一条平线。
  ja: 「プロセスごとの接続プール」からホスト上の PgBouncer、さらにマネージドな RDS Proxy へ進みます。データベースの実接続数は、プロセス数に比例して増える線から平らな線に変わります。
  en: Go from one connection pool per process to PgBouncer on the host, and then to the managed RDS Proxy. The number of real database connections stops growing with the process count and becomes a flat line.
difficulty: advanced
estimatedMinutes: 90
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 12}
regions:
  supported: [ap-northeast-1]
services:
- {id: rds-proxy, name: { zh-CN: Amazon RDS Proxy, ja: Amazon RDS Proxy, en: Amazon RDS Proxy }, role: primary, module: db-proxy}
- {id: iam, role: context, module: iam}
- {id: secretsmanager, role: context, module: secrets}
- {id: rds, role: context, module: database}
modules:
  target: [db-proxy]
  start: [iam, secrets, database]
  context: []
  related: [database, cache]
prerequisites:
  cards:
  - {id: svc-database, kind: soft}
  - {id: svc-secrets, kind: soft}
  - {id: sc-db-performance, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: secrets
    kind: module
    basis: closure
    rule: DEP-033
    set: {SECRETS_DRIVER: secretsmanager}
  - item: database
    kind: module
    basis: closure
    rule: DEP-032
    set: {DB_DRIVER: postgres}
  - item: load-balancer
    kind: local
    set: {LB_LOCAL_WORKERS: 2}
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- id: db-proxy
  driver: rds-proxy
  set: {DB_PROXY_AUTH: secrets}
expectedWarnings: []
cost: {tier: high}
provision: {class: C}
badge: {title: { zh-CN: 连接池调度, ja: 接続プールの采配, en: Connection pooling }}
tracks: [cost-optimized, performant, saa-main]
saa:
  domains: [performance, resilient, secure]
tags: [db-proxy, rds-proxy]
certificate: {enabled: false}
