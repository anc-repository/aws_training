# labs/svc-db-proxy/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-db-proxy
kind: service
version: 0.1.0
status: planned
service: Amazon RDS Proxy
function: 数据库连接池
title: Amazon RDS Proxy：数据库连接池
summary: 从“每个进程一个连接池”到本机 PgBouncer，再到托管的 RDS Proxy：数据库实际连接数从随进程线性增长变成一条平线。
difficulty: advanced
estimatedMinutes: 90
timeLimitMinutes: 180
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 12}
regions:
  supported: [ap-northeast-1]
services:
- {id: rds-proxy, name: Amazon RDS Proxy, role: primary, module: db-proxy}
- {id: iam, role: context, module: iam}
- {id: secretsmanager, role: context, module: secrets}
- {id: rds, role: context, module: database}
modules:
  target: [db-proxy]
  start: [iam, secrets, database]
  context: []
  related: [database, cache]
prerequisites:
  cards:
  - {id: svc-database, kind: soft}
  - {id: svc-secrets, kind: soft}
  - {id: sc-db-performance, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - item: secrets
    kind: module
    basis: closure
    rule: DEP-033
    set: {SECRETS_DRIVER: secretsmanager}
  - item: database
    kind: module
    basis: closure
    rule: DEP-032
    set: {DB_DRIVER: postgres}
  - item: load-balancer
    kind: local
    set: {LB_LOCAL_WORKERS: 2}
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- id: db-proxy
  driver: rds-proxy
  set: {DB_PROXY_AUTH: secrets}
expectedWarnings: []
cost: {tier: high}
provision: {class: C}
badge: {title: 连接池调度}
tracks: [cost-optimized, performant, saa-main]
saa:
  domains: [performance, resilient, secure]
tags: [db-proxy, rds-proxy]
certificate: {enabled: false}
