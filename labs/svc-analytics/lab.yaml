services:
- {id: firehose, name: Amazon Data Firehose, role: primary, module: analytics}
- {id: iam, role: context, module: iam}
modules:
  target: [analytics]
  start: [iam]
  context: []
  related: [storage]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: svc-iam, kind: soft}
  - {id: sc-analytics, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- id: analytics
  driver: firehose
  params: {OutputFormat: json}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge: {title: 数据湖投递}
tracks: [cost-optimized, performant, saa-main]
saa:
  domains: [performance, cost, resilient]
tags: [analytics, firehose]
