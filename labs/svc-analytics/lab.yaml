# labs/svc-analytics/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-analytics
kind: service
version: 0.1.0
status: planned
service: Amazon Data Firehose
function: 点击流采集与投递
title: Amazon Data Firehose：点击流采集与投递
summary: 点击事件不再写进业务库，改由 EC2 批量转发给 Data Firehose 落到 S3 数据湖，再用 Athena 按分区查询，看清分析负载如何离开 OLTP 库。
difficulty: intermediate
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
