    title: feed-read 的 before（无缓存）有一条有效结果
    type: experiment
    module: cache
    experiment: feed-read
    label: before
    accept: [valid]

  - id: exp-memory
    title: feed-read 的 memory（进程内 LRU）有一条有效结果
    type: experiment
    module: cache
