checks:
  - id: exp-before
    title:
      zh-CN: feed-read 的 before（无缓存）有一条有效结果
      ja: feed-read の before（キャッシュなし）に有効な結果が 1 件ある
      en: feed-read has a valid before result (no cache)
    type: experiment
    module: cache
    experiment: feed-read
    label: before
    accept: [valid]

  - id: exp-memory
    title:
      zh-CN: feed-read 的 memory（进程内 LRU）有一条有效结果
      ja: feed-read の memory（プロセス内 LRU）に有効な結果が 1 件ある
      en: feed-read has a valid memory result (in-process LRU)
    type: experiment
    module: cache
    experiment: feed-read
    label: memory
    accept: [valid]

  - id: exp-pair
    title:
      zh-CN: feed-read 的 before 与 after 都有效且可比
      ja: feed-read の before と after がどちらも有効で比較可能
      en: feed-read before and after are both valid and comparable
    type: experiment
    module: cache
    experiment: feed-read
    pair: [before, after]
    accept: [valid]

  - id: exp-fail-open
    title:
      zh-CN: fail-open 的 after（缓存故障期间错误率为 0）有一条有效结果
      ja: fail-open の after（キャッシュ故障中のエラー率が 0）に有効な結果が 1 件ある
      en: fail-open has a valid after result (0 errors while the cache is down)
    type: experiment
    module: cache
    experiment: fail-open
    label: after
    accept: [valid]
