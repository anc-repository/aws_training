# labs/svc-cache/lab.yaml —— Amazon ElastiCache：共享缓存（cards/service-cards-2 svc-cache）
# 实现核对（implementation-notes platform-content）：
# - 起始状态不含本地档 LB_LOCAL_WORKERS=2：scripts/module 的 SINGLE_LOCAL_SETTINGS 只有 queue，服务卡声明的 local 预置不会被采用；
#   因此 stale-read（需要两个 api 进程）与 memory 对照改为选做，必需实验只保留 feed-read 的 before / after（--ab）。
# - 卡片第 1 步的 `node dist/cli.js lab:seed` 在 backend/src/cli.ts 中不存在；改为观察步骤，feed-read 使用运行器自己的实验用户。
# - ttl-sweep 是手工实验（不能上传），本卡不设步骤；fail-open 的故障脚本在工作台执行（--fault-via local）。
schema: atl.lab/v2
id: svc-cache
kind: service
version: 1.0.0
status: beta
service: Amazon ElastiCache
function: 共享缓存
title: Amazon ElastiCache：共享缓存
subtitle: 每次查库 → ElastiCache（Valkey）旁路缓存
summary: 给时间线加上 ElastiCache（Valkey），用同一部署里的逐请求 A/B 看“命中省掉几次查库”，再看清谁能连到缓存、缓存故障时请求为什么不失败。
story: |
  L0 的时间线每次都查库。读多写少的接口最适合旁路缓存：先读缓存，未命中再查库并回填。
  这张卡片在默认 VPC 里建一个单节点的 ElastiCache（Valkey），用同一部署里的逐请求 A/B 对比命中与不命中，
  再确认只有实验机的安全组能连到 6379，以及缓存故障时应用按未命中处理（fail-open）。
objectives:
  - { text: 用旁路缓存与 TTL 解释“命中时 DB 查询为 0”, domain: performance, relatesTo: after }
  - { text: 说清 ElastiCache 只能在 VPC 内访问，以及安全组链的作用, domain: secure, relatesTo: inspect }
  - { text: 理解非权威端口的 fail-open：缓存故障不能让请求失败, domain: resilient, relatesTo: enable }
  - { text: 比较进程内缓存与共享缓存的取舍, domain: performance, relatesTo: memory }
difficulty: intermediate
estimatedMinutes: 90
timeLimitMinutes: 150
extensions: { maxCount: 2, minutesEach: 30 }
retain: { allowed: true, maxHours: 8, reason: 节点按小时计费；保留后可以在 sc-db-performance 中继续 }
regions:
  supported: [ap-northeast-1]
services:
  - { id: elasticache, name: Amazon ElastiCache（Valkey，节点模式）, role: primary, module: cache }
  - { id: vpc, name: Amazon VPC（默认 VPC、sg-cache）, role: observed }
  - { id: iam, name: AWS IAM（实例角色，深度探针的 Describe 权限）, role: context, module: iam }
  - { id: cloudwatch, name: Amazon CloudWatch（CacheHits、CacheMisses）, role: observed }
modules: { target: [cache], start: [iam], context: [], related: [database, load-balancer, autoscaling] }
prerequisites:
  cards:
    - { id: svc-ec2, kind: soft }
  knowledge: [键值存储与 TTL, 安全组的来源可以是另一个安全组]

startProfile:
  provisions:
    - { item: iam, kind: module, basis: credential, set: { IAM_CREDENTIALS: role },
        reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）；ElastiCache 的深度探针（Describe）因此可用 }
    - { item: mgmt-channel, kind: platform, reason: 实验机挂只含 AmazonSSMManagedInstanceCore 的 CloudAlbumAppRole，是平台的管理通道，不是应用权限 }
    - { item: workstation, kind: platform, reason: 每个会话一台工作台，用于运行 scripts/module、AWS CLI 与对比实验 }
    - { item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书；本卡不涉及 tls，保持开启 }
  platform: { preview: { directHttps: 'on' } }
  reason: cache 的 requires 为空，子网与 sg-cache 在默认 VPC 中；起始状态是 L0 + 实例角色（档位 atl/svc-cache/default）
targetModules:
  - { id: cache, driver: redis, wireStep: enable, adoptsExisting: false }
expectedWarnings: []
workstation: { required: true, tools: [aws-cli, node, jq], savingsMode: degraded }
platform:
  consoleLinks: [ec2.securityGroup]
provision: { class: A }

variables:
  redisUrl: { label: 缓存地址, from: derived, fillFrom: stack.cache.EnvRedisUrl }
  replicationGroupId: { label: 复制组 ID, from: derived, fillFrom: stack.cache.InfoReplicationGroupId }

cost:
  currency: USD
  tier: medium
  mainDrivers: [ElastiCache 节点小时（单节点 cache.t4g.micro）]
  basis:
    - { ref: start-profile, note: 实验机 EC2、EBS（根卷与数据卷）、公网 IPv4 }
    - { ref: workstation, note: 工作台 EC2、EBS、公网 IPv4 }
    - { key: elasticache-node, pricingKey: elasticache.node, billing: hourly, quantity: 1, source: target, whenRetained: true,
        note: cache.t4g.micro 单节点、无副本；从创建开始按小时计费 }
  assumptions:
    - 节点模式、Replicas=0；Serverless 变体只在手册中选读（有最低存储计费量），以官方定价为准

steps:
  - id: orient
    type: observe
    title: 观察没有缓存的时间线
    manual: manual/10-orient.md
    panel: preview
    estMinutes: 5
    checks: [cache-none-baseline]

  - id: baseline
    type: experiment
    title: 记录 before：时间线读压测（无缓存）
    manual: manual/20-baseline.md
    experiment: { module: cache, id: feed-read, label: before }
    requires: { steps: [orient] }
    panel: terminal-workstation
    estMinutes: 8
    checks: [exp-before]

  - id: memory
    type: experiment
    title: （选做）进程内缓存对照：本地档 memory
    manual: manual/30-memory.md
    optional: { reason: 单进程下只能看到命中延迟，看不到多进程的不一致 }
    experiment: { module: cache, id: feed-read, label: memory }
    requires: { steps: [baseline] }
    estMinutes: 10
    checks: [ { ref: cache-memory, required: false }, { ref: exp-memory, required: false } ]

  - id: enable
    type: script
    wire: true
    title: 接入 ElastiCache：建复制组并切换驱动
    manual: manual/40-enable.md
    methods: [script]
    requires: { steps: [baseline] }
    panel: terminal-workstation
    estMinutes: 20
    startsBilling: { class: hourly, pricingKeys: [elasticache.node], note: 节点从创建开始按小时计费 }
    wait: { typicalMinutes: 10, maxMinutes: 25, text: 创建复制组、写 env、重启、SET / GET / DEL 探针 }
    checks: [cache-wired, cache-hit-probe, cache-replication-group]

  - id: inspect
    type: cli
    title: 谁能连到缓存
    manual: manual/50-inspect.md
    requires: { steps: [enable] }
    panel: terminal-workstation
    estMinutes: 10
    checks: [cache-cluster, cache-sg-rule, who-can-connect]

  - id: after
    type: experiment
    title: 记录 after：同一部署内逐请求 A/B
    manual: manual/60-after.md
    experiment: { module: cache, id: feed-read, label: after }
    requires: { steps: [enable] }
    panel: terminal-workstation
    estMinutes: 8
    checks: [exp-pair]

  - id: fail-open
    type: experiment
    title: （选做）缓存故障：撤销 sg-cache 入站规则，请求仍然成功
    manual: manual/70-fail-open.md
    optional: { reason: 需要在工作台临时修改安全组；时间不足时跳过 }
    experiment: { module: cache, id: fail-open, label: after }
    requires: { steps: [enable] }
    estMinutes: 10
    checks: [ { ref: exp-fail-open, required: false } ]

finalChecks:
  - no-world-ssh
  - { ref: cache-wired, as: final-cache-wired }
  - { ref: cache-sg-rule, as: final-cache-sg-rule }

experiments:
  - module: cache
    id: feed-read
    labels:
      - { id: before, role: baseline, requires: { cache: none } }
      - { id: memory, role: treatment, requires: { cache: memory } }
      - { id: after, role: treatment, requires: { cache: redis } }
    pairs: [[before, after]]
    requiredLabels: [before, after]
    required: true
    runner: workstation
    allowSimulatedBaseline: false
    corroboration: { minServerRatio: 0.9 }
  - module: cache
    id: fail-open
    labels: [ { id: after, role: single } ]
    required: false
    runner: workstation
    validity: functional
    corroborateWith: [cache-wired]

quiz: { file: quiz.yaml, draw: 3 }
badge: { title: 缓存命中, icon: assets/badge.svg }
tracks: [performant, quick-compare, saa-main]

cleanup:
  summary: 结束实验后，平台删除本次会话的复制组、子网组与 sg-cache（缓存没有权威数据）。
  autoReclaim: true
  dataRisk: [缓存中的数据随复制组删除；权威数据在数据库中，不受影响]
  learnerCreatedHints: []
  verify:
    - cache-gone

saa:
  domains: [performance, resilient, cost]
  topics:
    - { id: cache-aside, title: 旁路缓存、TTL 与用版本号失效, domain: performance, relatesTo: after }
    - { id: vpc-only, title: ElastiCache 只能在 VPC 内访问；安全组链、TLS、AUTH / RBAC, domain: secure, relatesTo: inspect }
    - { id: fail-open, title: 非权威端口的 fail-open；击穿与 single-flight, domain: resilient, relatesTo: fail-open }
    - { id: engines, title: Valkey / Redis OSS 与 Memcached；节点模式与 Serverless, domain: cost, relatesTo: enable }
  confusables:
    - { a: ElastiCache, b: DAX, rule: DAX 是 DynamoDB 专用、API 兼容的直通缓存；ElastiCache 需要应用自己实现缓存逻辑 }
    - { a: Valkey / Redis OSS, b: Memcached, rule: 节点式 Memcached 多线程、无复制、无持久化；Valkey / Redis OSS 支持副本、Multi-AZ 故障转移与快照 }

tags: [cache, elasticache, valkey, cache-aside, vpc]

permissions:
  learner:
    - cloudformation:CreateChangeSet
    - cloudformation:DescribeChangeSet
    - cloudformation:ExecuteChangeSet
    - cloudformation:DescribeStacks
    - cloudformation:DescribeStackEvents
    - elasticache:CreateReplicationGroup
    - elasticache:CreateCacheSubnetGroup
    - elasticache:DescribeReplicationGroups
    - elasticache:DescribeCacheClusters
    - elasticache:AddTagsToResource
    - ec2:CreateSecurityGroup
    - ec2:AuthorizeSecurityGroupIngress
    - ec2:RevokeSecurityGroupIngress
    - ec2:DescribeSecurityGroupRules
    - iam:CreatePolicy
    - iam:AttachRolePolicy
    - ssm:SendCommand
  notes: ElastiCache 数据面不使用 IAM；fail-open 的故障脚本在工作台用学员身份撤销 / 恢复 sg-cache 的入站规则

certificate: { enabled: false }
owners: [cloudalbum-maintainers]
