schema: atl.quiz/v1
version: 1.0.0
questions:
  - id: cache-session
    domain: performance
    type: single
    kind: scenario
    services: [elasticache, ec2]
    stem: Auto Scaling 组中的 Web 实例把会话保存在本机内存里，缩容后用户被随机登出。要以最低延迟解决，应该怎么做？
    options:
      - { id: a, text: 在 ALB 上开启粘性会话 }
      - { id: b, text: 把会话放进 Amazon ElastiCache（Valkey / Redis OSS） }
      - { id: c, text: 把会话写进每台实例的 EBS 卷 }
      - { id: d, text: 把会话写进 S3 }
    answer: [b]
    explain: 会话外置到共享的内存存储，实例才是无状态的。粘性会话在缩容或实例故障时仍会丢会话；EBS 不共享；S3 延迟高。
    relatesTo: after
    difficulty: 1
  - id: cache-engines
    domain: resilient
    type: multi
    kind: concept
    services: [elasticache]
    stem: 在自行设计的节点式集群（非 Serverless）中，与 ElastiCache for Memcached 相比，只有 Valkey / Redis OSS 引擎提供的能力是哪两项？
    options:
      - { id: a, text: 副本与 Multi-AZ 自动故障转移 }
      - { id: b, text: 多线程的简单键值缓存 }
      - { id: c, text: 备份与恢复（快照） }
      - { id: d, text: 在 VPC 内通过安全组控制访问 }
    answer: [a, c]
    explain: 节点式 Memcached 是多线程、无复制、无持久化的纯缓存；两种引擎都部署在 VPC 内、都用安全组控制。
    relatesTo: enable
    difficulty: 2
  - id: cache-dax
    domain: performance
    type: single
    kind: scenario
    services: [dynamodb]
    stem: 一个读多写少的 DynamoDB 表需要微秒级读延迟，并且希望不改写应用的缓存逻辑。应选择？
    options:
      - { id: a, text: ElastiCache for Valkey 旁路缓存 }
      - { id: b, text: DynamoDB Accelerator（DAX） }
      - { id: c, text: DynamoDB 全局表 }
      - { id: d, text: 提高预置的读容量 }
    answer: [b]
    explain: DAX 是 DynamoDB 专用、API 兼容的直通缓存；ElastiCache 需要应用自己实现缓存逻辑；全局表解决多区域，不解决延迟到微秒。
    difficulty: 1
  - id: cache-sg-source
    domain: secure
    type: single
    kind: scenario
    services: [elasticache, vpc]
    stem: 只允许应用服务器访问 ElastiCache，且应用服务器会随 Auto Scaling 增减、IP 不固定。缓存安全组的入站规则应该怎么写？
    options:
      - { id: a, text: 来源为 0.0.0.0/0，依靠 AUTH 令牌保护 }
      - { id: b, text: 来源为应用服务器所在子网的 CIDR }
      - { id: c, text: 来源为应用服务器的安全组 }
      - { id: d, text: 给缓存分配公网端点并用 IAM 策略限制 }
    answer: [c]
    explain: 安全组可以引用另一个安全组，只有挂着该安全组的网卡被放行，与 IP 无关；子网 CIDR 会放行同子网的其他资源；ElastiCache 没有公网端点。
    relatesTo: inspect
    difficulty: 1
