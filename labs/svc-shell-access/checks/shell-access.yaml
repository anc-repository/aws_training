checks:
  # ---- 起始状态（before 一律 once）
  - id: cap-ssh-baseline
    title:
      zh-CN: 起始状态：运维通道仍是 SSH，shell-access 未启用
      ja: 開始状態：運用チャネルはまだ SSH で、shell-access は有効になっていない
      en: "Start state: the operator channel is still SSH and shell-access is not enabled"
    type: capability
    module: shell-access
    drift: { policy: once }
    assert:
      - path: $.driver
        op: eq
        value: ssh
        label:
          zh-CN: 驱动（SHELL_ACCESS_MODE）
          ja: ドライバー（SHELL_ACCESS_MODE）
          en: Driver (SHELL_ACCESS_MODE)
      - path: $.status
        op: eq
        value: 'off'
        label:
          zh-CN: 模块状态（本地实现）
          ja: モジュールの状態（ローカル実装）
          en: Module status (local implementation)
    explain:
      zh-CN: 纯基础设施型模块没有端口和驱动，capabilities 的 driver 就是声明型开关 SHELL_ACCESS_MODE 的取值。
      ja: 純粋なインフラ型のモジュールにはポートもドライバーもないため、capabilities の driver は宣言型スイッチ SHELL_ACCESS_MODE の値そのものです。
      en: A pure infrastructure module has no port or driver, so the driver in capabilities is simply the value of the declarative switch SHELL_ACCESS_MODE.
    reproduce: { run: 'curl -s http://127.0.0.1/api/capabilities | jq ".modules[\"shell-access\"] | {driver, status}"', runsOn: lab }

  - id: sshd-listening
    title:
      zh-CN: sshd 在监听 22，且禁止密码登录（05 §1 的加固片段）
      ja: sshd が 22 で待ち受けていて、パスワードログインが禁止されている（05 §1 の強化設定）
      en: sshd listens on 22 and password login is disabled (the hardening snippet in 05 §1)
    type: local
    on: lab
    checkId: sshd-state
    drift: { policy: once }
    assert:
      - path: $.active
        op: eq
        value: true
        label:
          zh-CN: sshd 运行中
          ja: sshd が動作中
          en: sshd running
      - path: $.port22Listening
        op: eq
        value: true
        label:
          zh-CN: 监听 22
          ja: 22 で待ち受け
          en: Listening on 22
      - path: $.passwordAuth
        op: eq
        value: false
        label:
          zh-CN: 密码登录
          ja: パスワードログイン
          en: Password login
    explain:
      zh-CN: 启用 shell-access 后 sshd 默认仍在运行（便于回滚），关掉的是安全组的 22 端口入站规则，所以这一项只描述起始状态。
      ja: shell-access を有効にしても sshd はデフォルトで動き続けます（ロールバックしやすくするため）。閉じるのはセキュリティグループの 22 番ポートの受信ルールなので、この項目は開始状態だけを表します。
      en: sshd keeps running by default after shell-access is enabled (to make rollback easy); what gets closed is the security group's inbound rule for port 22, so this item only describes the start state.

  - id: sg-22-workstation-only
    title:
      zh-CN: 实例安全组的 22 端口只对 /32 开放（工作台私网地址）
      ja: インスタンスのセキュリティグループの 22 番ポートは /32（ワークベンチのプライベートアドレス）にだけ開いている
      en: The instance security group only opens port 22 to a /32 (the workbench's private address)
    type: aws-readonly
    service: ec2
    action: DescribeSecurityGroupRules
    region: app
    params: { Filters: [ { Name: group-id, Values: ['{{ target.sgId }}'] } ] }
    ownership: { resource: 'arn:aws:ec2:{{ session.region }}:{{ session.accountId }}:security-group/{{ target.sgId }}', mode: session-or-start }
    drift: { policy: once }
    assert:
      - path: $.SecurityGroupRules
        where: { IsEgress: false, FromPort: { op: lte, value: 22 }, ToPort: { op: gte, value: 22 } }
        op: len_gte
        value: 1
        label:
          zh-CN: 存在覆盖 22 的入站规则
          ja: 22 を含む受信ルールがある
          en: An inbound rule covers 22
      - path: $.SecurityGroupRules
        where: { IsEgress: false, FromPort: { op: lte, value: 22 }, ToPort: { op: gte, value: 22 } }
        op: every
        value: { path: $.CidrIpv4, op: endsWith, value: /32 }
        label:
          zh-CN: 覆盖 22 的规则来源都是 /32
          ja: 22 を含むルールの送信元はすべて /32
          en: Every rule covering 22 has a /32 source
      - path: '$.SecurityGroupRules[*].CidrIpv4'
        op: nin
        value: ['0.0.0.0/0']
        label:
          zh-CN: 没有对全网开放
          ja: インターネット全体には開いていない
          en: Not open to the whole internet
    explain:
      zh-CN: 起始状态的事实，只需成立一次：第 3 步会删除这条规则。
      ja: 開始状態の事実で、一度成り立てば十分です。ステップ 3 でこのルールは削除されます。
      en: "A start-state fact that only needs to hold once: step 3 deletes this rule."
    reproduce: { run: 'aws ec2 describe-security-group-rules --filters Name=group-id,Values={{ target.sgId }} --query "SecurityGroupRules[?IsEgress==\`false\`].[IpProtocol,FromPort,ToPort,CidrIpv4]" --output table', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [EC2, { zh-CN: 安全组, ja: セキュリティグループ, en: Security groups }, '{{ target.sgId }}', { zh-CN: 入站规则, ja: インバウンドルール, en: Inbound rules }], region: app }
      observed:
        question:
          zh-CN: 22 端口的入站规则来源是什么？
          ja: 22 番ポートの受信ルールの送信元は何ですか？
          en: What is the source of the inbound rule for port 22?
        options:
          - value: '32'
            label:
              zh-CN: 一个 x.x.x.x/32 地址（工作台）
              ja: x.x.x.x/32 のアドレス 1 つ（ワークベンチ）
              en: A single x.x.x.x/32 address (the workbench)
            expected: true
          - value: wide
            label:
              zh-CN: 更宽的网段或 0.0.0.0/0
              ja: もっと広い範囲または 0.0.0.0/0
              en: A wider range or 0.0.0.0/0
            fixHint:
              zh-CN: 不要放宽 22 端口；起始状态由平台设置
              ja: 22 番ポートを広げないでください。開始状態はプラットフォームが設定しています
              en: Do not widen port 22; the platform sets the start state

  # ---- 接入
  - id: cap-ssm-ok
    title:
      zh-CN: 应用确认运维通道已是 Session Manager 且无管理端口入站
      ja: 運用チャネルがすでに Session Manager で、管理ポートの受信がないことをアプリが確認している
      en: The app confirms that the operator channel is Session Manager with no management ports open inbound
    type: capability
    module: shell-access
    drift: { policy: must-hold, monitor: true }
    assert:
      - path: $.driver
        op: eq
        value: ssm
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver
      - path: $
        op: healthy
        label:
          zh-CN: 状态正常（本卡 expectedWarnings 为空，即必须是 ok）
          ja: 状態が正常（このカードの expectedWarnings は空なので ok でなければならない）
          en: Healthy (this card's expectedWarnings is empty, so it must be ok)
      - path: $.detail
        op: contains
        value: 无管理端口入站
        label:
          zh-CN: detail
          ja: detail
          en: detail
    explain:
      zh-CN: 感知器查 ssm:DescribeInstanceInformation（PingStatus）、ec2:DescribeSecurityGroups（22 端口入站）与会话首选项的日志组；控制面结果在后台刷新，首个请求较慢时先报 degraded。
      ja: 検知処理は ssm:DescribeInstanceInformation（PingStatus）、ec2:DescribeSecurityGroups（22 番ポートの受信）、セッション設定のロググループを調べます。コントロールプレーンの結果はバックグラウンドで更新されるため、最初のリクエストが遅いときはまず degraded を報告します。
      en: The sensor checks ssm:DescribeInstanceInformation (PingStatus), ec2:DescribeSecurityGroups (inbound port 22) and the session preferences' log group; control plane results refresh in the background, so it reports degraded first if the first request is slow.
    reproduce: { run: 'curl -s http://127.0.0.1/api/capabilities | jq ".modules[\"shell-access\"] | {driver, status, detail}"', runsOn: lab }

  - id: module-state-ssm
    title:
      zh-CN: 实验机上 shell-access 已启用（平台模式下投递通道始终是 SSM，不作为判据）
      ja: ラボ用インスタンスで shell-access が有効（プラットフォームモードでは配信チャネルは常に SSM なので、判定基準にはしない）
      en: shell-access is enabled on the lab instance (in platform mode the delivery channel is always SSM, so it is not used as a criterion)
    type: local
    on: lab
    checkId: module-state
    args: { module: shell-access }
    drift: { policy: must-hold }
    assert:
      - path: $.modules.shell-access.enabled
        op: eq
        value: true
        label:
          zh-CN: 已启用
          ja: 有効
          en: Enabled
      - path: $.modules.shell-access.driver
        op: eq
        value: ssm
        label:
          zh-CN: 驱动
          ja: ドライバー
          en: Driver

  - id: sg-no-22
    title:
      zh-CN: 安全组没有任何覆盖 22 的入站规则
      ja: セキュリティグループに 22 を含む受信ルールが 1 つもない
      en: The security group has no inbound rule covering 22
    type: aws-readonly
    service: ec2
    action: DescribeSecurityGroupRules
    region: app
    params: { Filters: [ { Name: group-id, Values: ['{{ target.sgId }}'] } ] }
    ownership: { resource: 'arn:aws:ec2:{{ session.region }}:{{ session.accountId }}:security-group/{{ target.sgId }}', mode: session-or-start }
    drift: { policy: must-hold, monitor: true }
    assert:
      - path: $.SecurityGroupRules
        where: { IsEgress: false, FromPort: { op: lte, value: 22 }, ToPort: { op: gte, value: 22 } }
        op: len_eq
        value: 0
        label:
          zh-CN: 22 端口无入站
          ja: 22 番ポートの受信なし
          en: No inbound port 22
      - path: $.SecurityGroupRules
        where: { IsEgress: false, IpProtocol: '-1' }
        op: len_eq
        value: 0
        label:
          zh-CN: 没有“全部流量”入站规则
          ja: 「すべてのトラフィック」の受信ルールがない
          en: No "All traffic" inbound rule
    explain:
      zh-CN: scripts/module 在 SSM 通道验证成功后把基础栈参数 SshIngressCidr 置空，模板的 Condition 删除 22 端口规则；协议为 -1 的规则同样放开了 22。
      ja: scripts/module は SSM チャネルの検証に成功した後、基盤スタックのパラメーター SshIngressCidr を空にし、テンプレートの Condition が 22 番ポートのルールを削除します。プロトコルが -1 のルールも 22 を開いてしまいます。
      en: After the SSM channel is verified, scripts/module clears the base stack parameter SshIngressCidr and the template's Condition removes the port 22 rule; a rule with protocol -1 would also open 22.
    reproduce: { run: 'aws ec2 describe-security-group-rules --filters Name=group-id,Values={{ target.sgId }} --query "SecurityGroupRules[?IsEgress==\`false\`].[IpProtocol,FromPort,ToPort,CidrIpv4]" --output table', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [EC2, { zh-CN: 安全组, ja: セキュリティグループ, en: Security groups }, '{{ target.sgId }}', { zh-CN: 入站规则, ja: インバウンドルール, en: Inbound rules }], region: app }
      observed:
        question:
          zh-CN: 入站规则里还有端口 22（或“全部流量”）的规则吗？
          ja: 受信ルールにまだポート 22（または「すべてのトラフィック」）のルールがありますか？
          en: Is there still an inbound rule for port 22 (or "All traffic")?
        options:
          - value: none
            label:
              zh-CN: 没有
              ja: ない
              en: No
            expected: true
          - value: present
            label:
              zh-CN: 有
              ja: ある
              en: Yes
            fixHint:
              zh-CN: 不要手工加 22 规则；用 KeepSsh=true 启用时 22 会保留，请重新按默认方式 enable
              ja: 22 のルールを手動で追加しないでください。KeepSsh=true で有効にすると 22 は残るので、デフォルトの方法で enable し直してください
              en: Do not add a 22 rule by hand; enabling with KeepSsh=true keeps 22, so enable again the default way

  - id: session-log-group
    title:
      zh-CN: 会话日志组由本会话创建，并设置了保留期
      ja: セッションログのロググループがこのセッションで作成され、保持期間が設定されている
      en: The session log group was created by this session and has a retention period
    type: aws-readonly
    service: logs
    action: DescribeLogGroups
    region: app
    params: { logGroupNamePrefix: '/cloudalbum/{{ session.env }}/ssm-sessions' }
    ownership: { resource: 'arn:aws:logs:{{ session.region }}:{{ session.accountId }}:log-group:/cloudalbum/{{ session.env }}/ssm-sessions', mode: session }
    drift: { policy: must-hold }
    assert:
      - path: $.logGroups
        where: { logGroupName: '/cloudalbum/{{ session.env }}/ssm-sessions' }
        op: len_eq
        value: 1
        label:
          zh-CN: 会话日志组存在
          ja: セッションログのロググループが存在する
          en: Session log group exists
      - path: $.logGroups
        op: some
        label:
          zh-CN: 设置了保留期（不是永不过期）
          ja: 保持期間が設定されている（失効しないではない）
          en: Retention is set (not never-expire)
        value:
          - { path: $.logGroupName, op: eq, value: '/cloudalbum/{{ session.env }}/ssm-sessions' }
          - { path: $.retentionInDays, op: gte, value: 1 }
    explain:
      zh-CN: 会话首选项 SSM-SessionManagerRunShell 的 cloudWatchLogGroupName 指向这个日志组，shell 会话的命令与输出边执行边上传。
      ja: セッション設定 SSM-SessionManagerRunShell の cloudWatchLogGroupName がこのロググループを指しており、シェルセッションのコマンドと出力は実行しながらアップロードされます。
      en: The cloudWatchLogGroupName of the session preferences SSM-SessionManagerRunShell points to this log group, and shell session commands and output are uploaded as they run.
    reproduce: { run: 'aws logs describe-log-groups --log-group-name-prefix /cloudalbum/{{ session.env }}/ssm-sessions', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudWatch, { zh-CN: 日志组, ja: ロググループ, en: Log groups }], region: app }
      observed:
        question:
          zh-CN: '/cloudalbum/{{ session.env }}/ssm-sessions 存在吗？保留列显示多少？'
          ja: /cloudalbum/{{ session.env }}/ssm-sessions は存在しますか？保持の列には何と表示されていますか？
          en: Does /cloudalbum/{{ session.env }}/ssm-sessions exist? What does the retention column show?
        options:
          - value: ok
            label:
              zh-CN: 存在，保留 1 个月（30 天）
              ja: 存在し、保持は 1 か月（30 日）
              en: It exists, with 1 month (30 days) retention
            expected: true
          - value: missing
            label:
              zh-CN: 不存在
              ja: 存在しない
              en: It does not exist
            fixHint:
              zh-CN: 重新执行 scripts/module enable shell-access
              ja: scripts/module enable shell-access を再実行してください
              en: Run scripts/module enable shell-access again

  # ---- 会话
  - id: start-session-trailed
    title:
      zh-CN: CloudTrail 记录了你从工作台发起的 StartSession
      ja: ワークベンチから開始した StartSession が CloudTrail に記録された
      en: CloudTrail recorded the StartSession you started from the workbench
    type: aws-readonly
    service: cloudtrail
    action: LookupEvents
    region: app
    params: { LookupAttributes: [ { AttributeKey: EventName, AttributeValue: StartSession } ], MaxResults: 50 }
    wait: { typicalMinutes: 5, maxMinutes: 20 }
    drift: { policy: once }
    pendingIf:
      - { path: $.Events, where: { Username: { op: startsWith, value: 'atl-{{ session.id }}-ws' } }, op: len_eq, value: 0 }
    assert:
      - path: $.Events
        where: { Username: { op: startsWith, value: 'atl-{{ session.id }}-ws' } }
        op: len_gte
        value: 1
        label:
          zh-CN: 发起者是你的工作台会话
          ja: 開始者があなたのワークベンチのセッション
          en: The initiator is your workbench session
      - path: $.Events
        op: some
        label:
          zh-CN: 目标是本实验机
          ja: 対象がこのラボ用インスタンス
          en: The target is this lab instance
        severity: warn
        value: { path: $.CloudTrailEvent, op: contains, value: '{{ target.instanceId }}' }
    explain:
      zh-CN: StartSession 是管理事件，事件历史默认就能查到（不需要 trail）；发起者是 IAM 身份而不是“某一把 SSH 私钥”。实例 ID 在事件的 requestParameters.target 中。
      ja: StartSession は管理イベントなので、イベント履歴でデフォルトで検索できます（証跡は不要です）。開始者は「ある SSH の秘密鍵」ではなく IAM ID です。インスタンス ID はイベントの requestParameters.target にあります。
      en: StartSession is a management event, so Event History shows it by default (no trail needed); the initiator is an IAM identity, not "some SSH private key". The instance ID is in the event's requestParameters.target.
    reproduce: { run: 'aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=StartSession --max-results 5', runsOn: workstation }
    pitfalls: [trail-delay]
    manualFallback:
      where: { breadcrumb: [CloudTrail, { zh-CN: 事件历史, ja: イベント履歴, en: Event history }, StartSession], region: app }
      observed:
        question:
          zh-CN: 事件历史里能找到用户名以 atl-…-ws 开头的 StartSession 事件吗？
          ja: イベント履歴に、ユーザー名が atl-…-ws で始まる StartSession イベントはありますか？
          en: Can you find a StartSession event in Event History whose user name starts with atl-…-ws?
        options:
          - value: present
            label:
              zh-CN: 能
              ja: ある
              en: Yes
            expected: true
          - value: absent
            label:
              zh-CN: 还没有
              ja: まだない
              en: Not yet
            fixHint:
              zh-CN: 事件有几分钟到十几分钟的延迟；确认你用 aws ssm start-session 登录过
              ja: イベントには数分から十数分の遅延があります。aws ssm start-session でログインしたことを確認してください
              en: Events lag by a few minutes to over ten minutes; make sure you signed in with aws ssm start-session

  - id: runas-ops
    title:
      zh-CN: 会话以 cloudalbum-ops 身份打开，读取 secrets.env 被拒绝
      ja: セッションが cloudalbum-ops として開き、secrets.env の読み取りが拒否された
      en: The session opened as cloudalbum-ops and reading secrets.env was denied
    type: manual
    spec:
      where: { panel: terminal-workstation }
      confirm:
        zh-CN: 在 aws ssm start-session 打开的会话里执行下面的命令，粘贴它输出的一行 JSON
        ja: aws ssm start-session で開いたセッションで次のコマンドを実行し、出力された 1 行の JSON を貼り付けてください
        en: In the session opened with aws ssm start-session, run the command below and paste the one line of JSON it prints
      evidence:
        command: { run: 'printf ''{"user":"%s","secretsRc":%d}\n'' "$(id -un)" "$(sudo -n cat /etc/cloudalbum/secrets.env >/dev/null 2>&1; echo $?)"', runsOn: lab }
        parse: json
        assert:
          - path: $.user
            op: eq
            value: cloudalbum-ops
            label:
              zh-CN: 会话用户
              ja: セッションのユーザー
              en: Session user
          - path: $.secretsRc
            op: gte
            value: 1
            label:
              zh-CN: 读取机密的返回码（非 0 = 被拒绝）
              ja: シークレット読み取りのリターンコード（0 以外 = 拒否）
              en: Return code of reading the secrets (non-zero = denied)

  - id: port-forward-ok
    title:
      zh-CN: 经端口转发在工作台访问实验机的 /api/health/ready
      ja: ポートフォワーディング経由でワークベンチからラボ用インスタンスの /api/health/ready にアクセスする
      en: Reach the lab instance's /api/health/ready from the workbench through port forwarding
    type: manual
    spec:
      where: { panel: terminal-workstation }
      confirm:
        zh-CN: 端口转发会话保持打开，在另一个工作台终端执行下面的命令，粘贴输出
        ja: ポートフォワーディングのセッションを開いたまま、別のワークベンチのターミナルで次のコマンドを実行し、出力を貼り付けてください
        en: Keep the port-forwarding session open, run the command below in another workbench terminal and paste the output
      evidence:
        command: { run: 'curl -s -o /dev/null -w ''{"status":%{http_code}}'' http://localhost:13000/api/health/ready', runsOn: workstation }
        parse: json
        assert:
          - path: $.status
            op: eq
            value: 200
            label:
              zh-CN: HTTP 状态码
              ja: HTTP ステータスコード
              en: HTTP status code

  # ---- 审计链
  - id: session-logged
    title:
      zh-CN: 会话日志组中有你的会话日志流
      ja: セッションログのロググループにあなたのセッションのログストリームがある
      en: The session log group has your session's log stream
    type: aws-readonly
    service: logs
    action: DescribeLogStreams
    region: app
    params: { logGroupName: '/cloudalbum/{{ session.env }}/ssm-sessions', logStreamNamePrefix: 'atl-{{ session.id }}-ws' }
    ownership: { resource: 'arn:aws:logs:{{ session.region }}:{{ session.accountId }}:log-group:/cloudalbum/{{ session.env }}/ssm-sessions', mode: session }
    wait: { typicalMinutes: 1, maxMinutes: 10 }
    pendingIf:
      - { path: $.logStreams, op: len_eq, value: 0 }
    drift: { policy: must-hold }
    assert:
      - path: $.logStreams
        op: len_gte
        value: 1
        label:
          zh-CN: 至少一个会话日志流
          ja: 少なくとも 1 つのセッションログストリーム
          en: At least one session log stream
    explain:
      zh-CN: 日志流名 = 会话 ID，前缀是发起者的会话名（以实测为准）；端口转发会话不记录内容，只有 shell 会话有日志流。
      ja: ログストリーム名 = セッション ID で、プレフィックスは開始者のセッション名です（実測を優先してください）。ポートフォワーディングのセッションは内容を記録せず、ログストリームがあるのはシェルセッションだけです。
      en: The log stream name = the session ID, prefixed with the initiator's session name (go by what you observe); port-forwarding sessions do not record content, so only shell sessions have log streams.
    reproduce: { run: 'aws logs describe-log-streams --log-group-name /cloudalbum/{{ session.env }}/ssm-sessions --log-stream-name-prefix atl-{{ session.id }}-ws', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudWatch, { zh-CN: 日志组, ja: ロググループ, en: Log groups }, '/cloudalbum/{{ session.env }}/ssm-sessions', { zh-CN: 日志流, ja: ログストリーム, en: Log streams }], region: app }
      observed:
        question:
          zh-CN: 有以 atl-…-ws 开头的日志流吗？
          ja: atl-…-ws で始まるログストリームはありますか？
          en: Is there a log stream starting with atl-…-ws?
        options:
          - value: present
            label:
              zh-CN: 有
              ja: ある
              en: Yes
            expected: true
          - value: absent
            label:
              zh-CN: 没有
              ja: ない
              en: No
            fixHint:
              zh-CN: 用默认文档（不带 --document-name）打开一次 shell 会话，执行几条命令后 exit
              ja: デフォルトのドキュメント（--document-name なし）でシェルセッションを 1 回開き、コマンドをいくつか実行してから exit してください
              en: Open a shell session once with the default document (no --document-name), run a few commands and exit

  # ---- 回收验证
  - id: shell-access-stack-gone
    title:
      zh-CN: 本会话的 shell-access 栈已删除
      ja: このセッションの shell-access スタックが削除された
      en: This session's shell-access stack has been deleted
    type: aws-readonly
    service: cloudformation
    action: DescribeStacks
    region: app
    params: { StackName: 'cloudalbum-{{ session.env }}-shell-access' }
    expectError: ValidationError
    required: false
    reproduce: { run: 'aws cloudformation describe-stacks --stack-name cloudalbum-{{ session.env }}-shell-access', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudFormation, { zh-CN: 堆栈, ja: スタック, en: Stacks }], region: app }
      observed:
        question:
          zh-CN: 还能找到 cloudalbum-{{ session.env }}-shell-access 吗？
          ja: cloudalbum-{{ session.env }}-shell-access はまだ見つかりますか？
          en: Can you still find cloudalbum-{{ session.env }}-shell-access?
        options:
          - value: gone
            label:
              zh-CN: 找不到
              ja: 見つからない
              en: Not found
            expected: true
          - value: present
            label:
              zh-CN: 还在
              ja: まだある
              en: Still there

pitfalls:
  - id: trail-delay
    title:
      zh-CN: StartSession 事件还没出现
      ja: StartSession イベントがまだ現れない
      en: The StartSession event has not appeared yet
    match: [ { checkId: start-session-trailed, result: pending } ]
    cause:
      zh-CN: CloudTrail 事件历史有几分钟到十几分钟的投递延迟
      ja: CloudTrail のイベント履歴には数分から十数分の配信遅延があります
      en: CloudTrail Event History has a delivery delay of a few minutes to over ten minutes
    fix:
      zh-CN: 先做端口转发步骤，回来再看；确认登录用的是 aws ssm start-session
      ja: 先にポートフォワーディングのステップを行ってから戻って確認してください。ログインに aws ssm start-session を使ったことも確認してください
      en: Do the port-forwarding step first and come back; also make sure you signed in with aws ssm start-session
