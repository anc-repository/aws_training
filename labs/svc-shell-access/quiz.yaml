schema: atl.quiz/v1
version: 1.0.0
questions:
  - id: ssm-no-inbound
    domain: secure
    type: single
    kind: scenario
    services: [ssm-session-manager, ec2]
    stem: 公司要求运维人员登录私有子网中的 EC2 实例，不得开放任何入站端口、不分发 SSH 密钥，并且要记录会话中执行的命令。最合适的方案是？
    options:
      - { id: a, text: 在公有子网部署堡垒机，安全组只放行公司出口 IP 的 22 端口 }
      - { id: b, text: 为实例配置带 SSM 托管节点权限的实例角色，创建 ssm、ssmmessages 接口端点，使用 Session Manager 并把会话日志写入 CloudWatch Logs 或 S3 }
      - { id: c, text: 使用浏览器方式的 EC2 Instance Connect }
      - { id: d, text: 在安全组中开放 22 端口，用 CloudTrail 记录登录后执行的命令 }
    answer: [b]
    explain: Session Manager 由 Agent 主动出站建立通道，安全组无需入站规则，身份来自 IAM，会话日志记录命令与输出。A 需要入站端口和密钥；C 需要 22 端口对 Instance Connect 的服务地址段开放；D 错在 CloudTrail 只记录 AWS API 调用，不记录操作系统内执行的命令。
    relatesTo: wire
    difficulty: 1
  - id: ssm-managed-node
    domain: secure
    type: multi
    kind: concept
    services: [ssm-session-manager, ec2, iam]
    stem: 要让 EC2 实例成为 SSM 托管节点并能打开 Session Manager 会话，必须满足哪些条件？（选三项）
    options:
      - { id: a, text: 实例上运行 SSM Agent }
      - { id: b, text: 实例有带 SSM 托管节点权限的 IAM 角色（或启用了默认主机管理配置） }
      - { id: c, text: 实例能以 HTTPS 访问 ssm 与 ssmmessages 端点（经 NAT 或接口端点） }
      - { id: d, text: 安全组放行来自 Systems Manager 服务的 443 入站 }
      - { id: e, text: 实例必须有公网 IPv4 地址 }
    answer: [a, b, c]
    explain: 所有连接都由实例上的 Agent 发起，安全组有状态，回包自动放行，所以不需要任何入站规则（D 错）；私有子网实例经 NAT 或接口端点即可（E 错）。
    relatesTo: orient
    difficulty: 1
  - id: ssm-port-forward-rds
    domain: secure
    type: single
    kind: scenario
    services: [ssm-session-manager]
    stem: 开发者需要从笔记本临时访问私有子网中的 RDS for PostgreSQL 排障，要求不把数据库暴露到公网、不新建堡垒机。最佳做法是？
    options:
      - { id: a, text: 把 RDS 改为可公开访问，并在安全组中只放行开发者 IP }
      - { id: b, text: 通过 Session Manager 的 AWS-StartPortForwardingSessionToRemoteHost，经同一 VPC 中的托管实例把本地端口转发到 RDS 端点 }
      - { id: c, text: 建立 Site-to-Site VPN }
      - { id: d, text: 在 RDS 实例上安装 SSM Agent }
    answer: [b]
    explain: 端口转发到远程主机让托管实例充当跳板，数据库安全组只需放行该实例；A 增加暴露面；C 运维成本高、属于长期网络方案；D 不可行，RDS 是托管服务，不能安装代理。
    relatesTo: port-forward
    difficulty: 2
  - id: ssm-runas
    domain: secure
    type: single
    kind: concept
    services: [ssm-session-manager]
    stem: Session Manager 默认以 ssm-user 打开 shell，它有免密 sudo。要降低会话中的权限，下列做法正确的是？
    options:
      - { id: a, text: 在会话首选项中启用 runAs，指定一个只有受限 sudoers 的专用 OS 用户 }
      - { id: b, text: 把 runAs 改成 AL2023 的 ec2-user }
      - { id: c, text: 从实例角色中删除 ssmmessages 权限 }
      - { id: d, text: 在安全组中关闭 443 端口 }
    answer: [a]
    explain: ec2-user 同样有免密 sudo，换成它并不能降权；删除 ssmmessages 权限或关 443 会让会话根本打不开。本卡的 cloudalbum-ops 只允许查看与重启 cloudalbum 服务。
    relatesTo: session
    difficulty: 2
