      scope: region
      resource:
        zh-CN: SSM-SessionManagerRunShell
        ja: SSM-SessionManagerRunShell
        en: SSM-SessionManagerRunShell
      preexisting: not-applicable
      revert: restore
      note:
        zh-CN: 模块修改前把原值（或“原本不存在”）备份到环境状态桶的 <envName>/backups/（06 PM-M28），回收时还原
        ja: モジュールは変更前に元の値（または「もともと存在しない」こと）を環境状態バケットの <envName>/backups/ にバックアップし（06 PM-M28）、回収時に元に戻します
        en: Before changing it, the module backs up the original value (or "did not exist") to <envName>/backups/ in the environment state bucket (06 PM-M28) and restores it at reclaim

