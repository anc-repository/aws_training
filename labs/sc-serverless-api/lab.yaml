    zh-CN: 无服务器 API
    ja: サーバーレス API
    en: Serverless API
  short:
    zh-CN: 无服务器
    ja: サーバーレス
    en: Serverless
tracks: [performant, saa-main, serverless]
saa:
  domains: [performance, resilient, cost]
