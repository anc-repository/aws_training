# labs/svc-waf/lab.yaml —— AWS WAF：Web 应用防护（cards/service-cards-1 §7）
# 实现核对（docs/implementation-notes.md wave1-waf）：
#   - 锁定源站用 `scripts/module enable cdn --set CDN_DIRECT_ACCESS=admin-ip --set CDN_ADMIN_CIDR=…`（cdn hook 读 --set，不是 --param；
#     卡片文档写的 --param DirectAccess 与代码不符，以代码为准）；
#   - 切到 Block 用 `scripts/module enable waf --param RuleAction=block`（§9.2 没有 set 子命令，等价于以新参数重新 enable，附录 B-27）；
#   - 托管规则组 Block 返回 CloudFront 的 403，不带 X-CloudAlbum-Path：block 步骤用服务端证据（源站 nonce 计数为 0），路径头降为 warn（R-16）；
#   - waf 的 migration 是 scripts/waf/sync-denylist（afterDeploy 首次全量导入），enable 不需要 --no-migrate。
schema: atl.lab/v2
id: svc-waf
kind: service
version: 1.0.0
status: beta
service:
  zh-CN: AWS WAF
  ja: AWS WAF
  en: AWS WAF
function:
  zh-CN: Web 应用防护
  ja: Web アプリケーションの保護
  en: Web application protection
title:
  zh-CN: AWS WAF：Web 应用防护
  ja: AWS WAF：Web アプリケーションの保護
  en: "AWS WAF: web application protection"
subtitle:
  zh-CN: Nginx limit_req → CloudFront 边缘的 AWS WAF
  ja: Nginx の limit_req → CloudFront のエッジの AWS WAF
  en: Nginx limit_req → AWS WAF at the CloudFront edge
summary:
  zh-CN: 同一套攻击脚本分别打向“只有 Nginx 限速”和“CloudFront + AWS WAF”：看被拦截的请求还会不会到达 EC2。
  ja: 同じ攻撃スクリプトを「Nginx のレート制限だけ」と「CloudFront + AWS WAF」にそれぞれ向けて実行し、ブロックされたリクエストがまだ EC2 に届くかどうかを確かめます。
  en: Point the same attack script at "Nginx rate limiting only" and at "CloudFront + AWS WAF", and see whether blocked requests still reach EC2.
story:
  zh-CN: |
    L0 的“防火墙”是 EC2 上的 Nginx：limit_req 限速加几条正则，每个恶意请求都已经到达实例，消耗连接、TLS、日志与带宽。
    这张卡片把 AWS WAF 挂在 CloudFront 上，在边缘按托管规则与速率规则拦截；前提是源站已经锁定，否则攻击者可以绕过。
  ja: |
    L0 の「ファイアウォール」は EC2 上の Nginx です。limit_req によるレート制限と数個の正規表現だけで、悪意のあるリクエストはすべてインスタンスに届き、接続、TLS、ログ、帯域を消費します。
    このカードでは AWS WAF を CloudFront に付け、エッジでマネージドルールとレートベースのルールによってブロックします。前提はオリジンがロックされていることで、そうでないと攻撃者は迂回できます。
  en: |
    L0's "firewall" is Nginx on EC2: limit_req rate limiting plus a few regular expressions, and every malicious request has already reached the instance, consuming connections, TLS, logs and bandwidth.
    This card attaches AWS WAF to CloudFront to block at the edge with managed rules and rate-based rules — provided the origin is locked down, or attackers can go around it.
objectives:
  - text:
      zh-CN: 说清 WAF 能挂在哪里（CloudFront / ALB / API Gateway），不能挂在哪里（EC2 / EIP / NLB）
      ja: WAF をどこに付けられるか（CloudFront / ALB / API Gateway）、どこに付けられないか（EC2 / EIP / NLB）を説明できる
      en: Explain where WAF can be attached (CloudFront / ALB / API Gateway) and where it cannot (EC2 / EIP / NLB)
    domain: secure
    relatesTo: enable
  - text:
      zh-CN: 用服务端证据区分“边缘拦截”和“源站 Nginx 的 403/429”
      ja: サーバー側の証拠で「エッジでのブロック」と「オリジンの Nginx の 403/429」を区別できる
      en: Use server-side evidence to tell "blocked at the edge" from "403/429 from Nginx at the origin"
    domain: secure
    relatesTo: switch-block
  - text:
      zh-CN: 理解托管规则组先 Count 后 Block，以及 CRS 对大请求体的误杀
      ja: マネージドルールグループはまず Count、その後 Block にすること、そして CRS による大きなリクエストボディの誤検知を説明できる
      en: Understand that managed rule groups go Count first and Block later, and how CRS falsely blocks large request bodies
    domain: secure
    relatesTo: observe-count
  - text:
      zh-CN: 理解速率规则按窗口聚合、有检测延迟，与 Nginx 精确限速的差别
      ja: レートベースのルールがウィンドウで集計され検知に遅延があること、Nginx の正確なレート制限との違いを説明できる
      en: Understand that rate-based rules aggregate over a window with a detection delay, unlike Nginx's precise rate limiting
    domain: performance
    relatesTo: after
  - text:
      zh-CN: 理解源站锁定与“绕过 WAF”
      ja: オリジンのロックと「WAF の迂回」を説明できる
      en: Understand origin lock-down and "bypassing WAF"
    domain: secure
    relatesTo: lock-origin
difficulty: intermediate
estimatedMinutes: 90
timeLimitMinutes: 150
extensions: { maxCount: 2, minutesEach: 30 }
retain:
  allowed: true
  maxHours: 24
  reason:
    zh-CN: Web ACL 按月计费（按存续折算）；保留后可在 sc-edge-protection 中继续
    ja: Web ACL は月額課金です（存続期間で按分）。保持すれば sc-edge-protection で続きから使えます
    en: The Web ACL is billed monthly (prorated by lifetime); if you keep the environment, you can continue in sc-edge-protection
regions:
  supported: [ap-northeast-1]
  alsoUses: [global, us-east-1]
services:
  - id: waf
    name:
      zh-CN: AWS WAF（Web ACL、托管规则组、速率规则、IP 集合、日志）
      ja: AWS WAF（Web ACL、マネージドルールグループ、レートベースのルール、IP セット、ログ）
      en: AWS WAF (Web ACL, managed rule groups, rate-based rules, IP sets, logging)
    role: primary
    module: waf
  - id: cloudfront
    name:
      zh-CN: Amazon CloudFront（前置挂载点）
      ja: Amazon CloudFront（前段の関連付け先）
      en: Amazon CloudFront (the front-end attachment point)
    role: supporting
    module: cdn
  - id: cloudwatch-logs
    name:
      zh-CN: Amazon CloudWatch Logs（WAF 日志，us-east-1）
      ja: Amazon CloudWatch Logs（WAF のログ、us-east-1）
      en: Amazon CloudWatch Logs (WAF logs, us-east-1)
    role: observed
  - id: iam
    name:
      zh-CN: AWS IAM（实例角色）
      ja: AWS IAM（インスタンスロール）
      en: AWS IAM (instance role)
    role: context
    module: iam
  - id: shield
    name:
      zh-CN: AWS Shield Standard（只讲解）
      ja: AWS Shield Standard（解説のみ）
      en: AWS Shield Standard (explained only)
    role: observed
modules: { target: [waf], start: [iam, cdn], context: [], related: [cdn, threat-detection, logging, monitoring] }
prerequisites:
  cards: [ { id: svc-cdn, kind: soft } ]
  knowledge:
    - zh-CN: HTTP 状态码与请求头
      ja: HTTP ステータスコードとリクエストヘッダー
      en: HTTP status codes and request headers
    - zh-CN: 七层与三/四层防护的区别
      ja: レイヤー 7 とレイヤー 3/4 の防御の違い
      en: layer 7 vs layer 3/4 protection
    - zh-CN: 正则与编码变体
      ja: 正規表現とエンコードのバリエーション
      en: regular expressions and encoding variants

startProfile:
  provisions:
    - item: iam
      kind: module
      basis: credential
      set: { IAM_CREDENTIALS: role }
      reason:
        zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）；管理后台封禁 IP 同步到 IP 集合、拦截计数 GetWebACL 因此可用
        ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）。これにより、管理画面でブロックした IP の IP セットへの同期と、ブロック数を数える GetWebACL が使えます
        en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3), which makes syncing IPs blocked in the admin console to the IP set and counting blocks with GetWebACL possible
    - item: cdn
      kind: module
      basis: closure
      rule: DEP-006
      reason:
        zh-CN: 'WAF 不能直接关联 EC2，需要 CloudFront 作为挂载点（DEP-006 的 cdn | load-balancer 取第一个可自动满足、不引入按小时计费的分支）；cdn 以默认 CDN_DIRECT_ACCESS=open 起步，让学员亲眼看到 DEP-018“可被绕过”，第 4 步再收紧'
        ja: WAF は EC2 に直接関連付けられず、CloudFront を関連付け先にする必要があります（DEP-006 の cdn | load-balancer のうち、自動で満たせて時間課金を持ち込まない最初の分岐）。cdn はデフォルトの CDN_DIRECT_ACCESS=open で始め、DEP-018 の「迂回できる」状態を受講者に自分の目で見てもらい、ステップ 4 で締めます
        en: WAF cannot be associated with EC2 directly and needs CloudFront as the attachment point (the first branch of DEP-006's cdn | load-balancer that can be satisfied automatically without adding hourly billing); cdn starts with the default CDN_DIRECT_ACCESS=open so learners see DEP-018's "can be bypassed" for themselves, and step 4 tightens it
    - item: mgmt-channel
      kind: platform
      reason:
        zh-CN: 实验机挂只含 AmazonSSMManagedInstanceCore 的 CloudAlbumAppRole，是平台的管理通道，不是应用权限
        ja: ラボ用インスタンスには AmazonSSMManagedInstanceCore だけを含む CloudAlbumAppRole が付いています。これはプラットフォームの管理チャネルであり、アプリの権限ではありません
        en: The lab instance carries CloudAlbumAppRole with only AmazonSSMManagedInstanceCore. It is the platform's management channel, not an app permission
    - item: workstation
      kind: platform
      reason:
        zh-CN: 每个会话一台工作台，用于运行 scripts/module、AWS CLI 与对比实验
        ja: セッションごとに 1 台のワークベンチがあり、scripts/module、AWS CLI、比較実験の実行に使います
        en: Each session has one workbench for running scripts/module, the AWS CLI and comparison experiments
    - item: check-bundle
      kind: platform
      reason:
        zh-CN: 检查包随 CloudAlbum 发布包安装在实验机的 /opt/atl（06 PM-04）
        ja: チェックパッケージは CloudAlbum のリリースパッケージとともにラボ用インスタンスの /opt/atl にインストールされます（06 PM-04）
        en: The check package is installed with the CloudAlbum release package in /opt/atl on the lab instance (06 PM-04)
    - item: preview-direct-https
      kind: platform
      reason:
        zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）；本卡不涉及 tls，保持开启
        ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）。このカードは tls に関係しないため、有効のままにします
        en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2); this card does not involve tls, so it stays on
  platform: { preview: { directHttps: 'on' } }
  reason:
    zh-CN: 起始状态是 L0 + 实例角色 + cdn（源站 = EC2，入口未锁定，CDN_DIRECT_ACCESS 取默认 open）；档位 atl/svc-waf/default
    ja: 開始状態は L0 + インスタンスロール + cdn（オリジン = EC2、入口はロックされておらず、CDN_DIRECT_ACCESS はデフォルトの open）です。プロファイル atl/svc-waf/default
    en: The start state is L0 plus the instance role plus cdn (origin = EC2, entry not locked, CDN_DIRECT_ACCESS at its default open); profile atl/svc-waf/default
targetModules:
  - { id: waf, driver: aws, set: { WAF_RULE_ACTION: count }, params: { Scope: CLOUDFRONT }, wireStep: enable, adoptsExisting: false }
expectedWarnings: [DEP-018]
workstation: { required: true, tools: [aws-cli, node, jq], savingsMode: degraded }
platform:
  consoleLinks: [cloudfront.distribution, ec2.securityGroup]
provision: { class: B, cleanupBudgetMinutes: 90 }

variables:
  webAclArn:
    label:
      zh-CN: Web ACL ARN
      ja: Web ACL の ARN
      en: Web ACL ARN
    from: derived
    fillFrom: stack.waf.EnvWafWebAclArn
    pattern: '^arn:aws[a-z-]*:wafv2:us-east-1:\d{12}:global/webacl/[^/]+/[0-9a-f-]+$'
  webAclId:
    label:
      zh-CN: Web ACL ID
      ja: Web ACL の ID
      en: Web ACL ID
    from: derived
    fillFrom: stack.waf.InfoWebAclId
  webAclName:
    label:
      zh-CN: Web ACL 名称
      ja: Web ACL の名前
      en: Web ACL name
    from: derived
    fillFrom: stack.waf.InfoWebAclName
    example: cloudalbum-e7k2m9qx-acl
  ipSetName:
    label:
      zh-CN: IP 集合名称
      ja: IP セットの名前
      en: IP set name
    from: derived
    fillFrom: stack.waf.EnvWafIpSetName
    example: cloudalbum-blocklist
  logGroup:
    label:
      zh-CN: WAF 日志组
      ja: WAF のロググループ
      en: WAF log group
    from: derived
    fillFrom: stack.waf.EnvWafLogGroup
    example: aws-waf-logs-cloudalbum-e7k2m9qx
  cdnDomain:
    label:
      zh-CN: 分配域名
      ja: ディストリビューションのドメイン名
      en: Distribution domain name
    from: derived
    fillFrom: stack.cdn.InfoDistributionDomainName
    pattern: '^[a-z0-9]+\.cloudfront\.net$'
  distributionId:
    label:
      zh-CN: 分配 ID
      ja: ディストリビューション ID
      en: Distribution ID
    from: derived
    fillFrom: stack.cdn.EnvCdnDistributionId
    pattern: '^E[A-Z0-9]{8,20}$'

cost:
  currency: USD
  tier: low
  mainDrivers:
    - zh-CN: WAF Web ACL 与规则（按月，按存续折算）
      ja: WAF の Web ACL とルール（月額、存続期間で按分）
      en: WAF Web ACL and rules (monthly, prorated by lifetime)
    - zh-CN: WAF 请求检查（按百万请求）
      ja: WAF のリクエスト検査（100 万リクエスト単位）
      en: WAF request inspection (per million requests)
    - zh-CN: WAF 日志写入 CloudWatch Logs
      ja: WAF のログの CloudWatch Logs への書き込み
      en: WAF logs written to CloudWatch Logs
    - zh-CN: CloudFront 请求与出网
      ja: CloudFront のリクエストとデータ転送（アウト）
      en: CloudFront requests and data transfer out
  basis:
    - ref: start-profile
      note:
        zh-CN: 实验机 EC2、EBS（根卷与数据卷）、公网 IPv4；cdn 的 CloudFront 按量
        ja: ラボ用インスタンスの EC2、EBS（ルートボリュームとデータボリューム）、パブリック IPv4。cdn の CloudFront は使用量課金
        en: Lab instance EC2, EBS (root and data volumes) and public IPv4; cdn's CloudFront billed by usage
    - ref: workstation
      note:
        zh-CN: 工作台 EC2、EBS、公网 IPv4
        ja: ワークベンチの EC2、EBS、パブリック IPv4
        en: Workbench EC2, EBS and public IPv4
    - key: waf-acl
      pricingKey: waf.web-acl
      billing: monthly
      quantity: 1
      unit: month
      source: target
      whenRetained: true
      note:
        zh-CN: Web ACL 按月（按存续折算）；6 条自定义规则各按月，AWS 托管规则组不另收订阅费
        ja: Web ACL は月額（存続期間で按分）。6 つのカスタムルールはそれぞれ月額で、AWS マネージドルールグループには別途サブスクリプション料金はかかりません
        en: The Web ACL is monthly (prorated by lifetime); each of the 6 custom rules is monthly, and AWS managed rule groups have no extra subscription fee
    - key: waf-requests
      pricingKey: waf.requests
      billing: usage
      quantity: 1
      unit: requests
      assumedUsagePerHour: 3000
      source: target
      whenRetained: false
      note:
        zh-CN: 按百万请求检查
        ja: 100 万リクエスト単位で検査
        en: Inspection per million requests
    - key: waf-logs
      pricingKey: logs.ingestion
      billing: usage
      quantity: 1
      unit: GB
      assumedUsagePerHour: 0.02
      source: target
      whenRetained: false
      note:
        zh-CN: 只投递 BLOCK/COUNT
        ja: BLOCK/COUNT だけを配信
        en: Only BLOCK/COUNT is delivered
  assumptions:
    - zh-CN: Web ACL 与规则按月计费、按会话存续时间折算；实验流量低，以官方定价为准
      ja: Web ACL とルールは月額課金で、セッションの存続時間で按分されます。実験のトラフィックは少量です。正確な料金は公式の料金表を確認してください
      en: The Web ACL and rules are billed monthly and prorated by session lifetime; lab traffic is low; check the official pricing
    - zh-CN: CloudFront 后面的 ALB 纵深防御（本卡不启用）会使 WAF 费用翻倍
      ja: CloudFront の背後の ALB による多層防御（このカードでは有効にしない）では WAF の費用が倍になります
      en: Defense in depth with an ALB behind CloudFront (not enabled in this card) would double the WAF cost

steps:
  - id: orient
    type: observe
    title:
      zh-CN: 起始状态：WAF 是 EC2 上的 Nginx，源站未锁定
      ja: 開始状態：WAF は EC2 上の Nginx で、オリジンはロックされていない
      en: "Start state: the WAF is Nginx on EC2, and the origin is not locked"
    manual: manual/10-orient.md
    panel: preview
    estMinutes: 5
    checks: [waf-nginx-baseline, cdn-open-baseline]

  - id: baseline
    type: experiment
    title:
      zh-CN: 记录 before：Nginx 的限速
      ja: before を記録：Nginx のレート制限
      en: "Record before: Nginx rate limiting"
    manual: manual/20-baseline.md
    experiment: { module: waf, id: flood, label: before }
    panel: terminal-workstation
    estMinutes: 8
    checks: [exp-flood-before]

  - id: baseline-payloads
    type: experiment
    title:
      zh-CN: 记录 before：Nginx 的特征拦截（编码变体有漏网）
      ja: before を記録：Nginx のシグネチャによるブロック（エンコードのバリエーションは素通り）
      en: "Record before: Nginx signature blocking (encoding variants slip through)"
    manual: manual/22-baseline-payloads.md
    experiment: { module: waf, id: payloads, label: before }
    requires: { steps: [orient] }
    panel: terminal-workstation
    estMinutes: 5
    checks: [exp-payloads-before]

  - id: bypass-before
    type: experiment
    title:
      zh-CN: 绕过检查：源站未锁定时直连可达
      ja: 迂回の確認：オリジンがロックされていないと直接アクセスで到達できる
      en: "Bypass check: with the origin unlocked, direct access gets through"
    manual: manual/25-bypass.md
    experiment: { module: waf, id: bypass, label: before }
    requires: { steps: [orient] }
    panel: terminal-workstation
    estMinutes: 6
    checks: [exp-bypass-before]

  - id: enable
    type: script
    wire: true
    title:
      zh-CN: 启用 AWS WAF（Count 模式，关联到 CloudFront）
      ja: AWS WAF を有効にする（Count モード、CloudFront に関連付け）
      en: Enable AWS WAF (Count mode, associated with CloudFront)
    manual: manual/30-enable.md
    methods: [script]
    requires: { steps: [baseline] }
    panel: terminal-workstation
    estMinutes: 12
    startsBilling:
      class: usage
      pricingKeys: [waf.web-acl, waf.requests]
      note:
        zh-CN: Web ACL 按月、请求按量
        ja: Web ACL は月額、リクエストは使用量課金
        en: Web ACL monthly, requests billed by usage
    wait:
      typicalMinutes: 6
      maxMinutes: 20
      text:
        zh-CN: 部署 us-east-1 的 Web ACL，再把 WebAclArn 注入 cdn 栈，分配重新部署
        ja: us-east-1 に Web ACL をデプロイし、WebAclArn を cdn スタックに注入して、ディストリビューションを再デプロイします
        en: Deploy the Web ACL in us-east-1, inject WebAclArn into the cdn stack, and redeploy the distribution
    checks: [cap-waf-wired, entry-waf, webacl-count, distribution-webacl]

  - id: lock-origin
    type: script
    title:
      zh-CN: 锁定源站（否则可以绕过 WAF）
      ja: オリジンをロックする（しないと WAF を迂回できる）
      en: Lock down the origin (otherwise WAF can be bypassed)
    manual: manual/40-lock-origin.md
    methods: [script]
    requires: { steps: [enable] }
    panel: terminal-workstation
    estMinutes: 8
    wait:
      typicalMinutes: 5
      maxMinutes: 20
      text:
        zh-CN: cdn 栈更新安全组与直连策略，分配重新部署
        ja: cdn スタックがセキュリティグループと直接アクセスのポリシーを更新し、ディストリビューションを再デプロイします
        en: The cdn stack updates the security group and the direct access policy, and redeploys the distribution
    checks: [cap-waf-locked]

  - id: bypass-after
    type: experiment
    title:
      zh-CN: 锁定后再验证：直连不可达，无法绕过 WAF
      ja: ロック後に再確認：直接アクセスでは到達できず、WAF は迂回できない
      en: "Verify after locking: direct access is unreachable, and WAF cannot be bypassed"
    manual: manual/45-bypass-after.md
    experiment: { module: waf, id: bypass, label: after }
    requires: { steps: [lock-origin] }
    panel: terminal-workstation
    estMinutes: 4
    checks: [exp-bypass-pair]

  - id: observe-count
    type: experiment
    title:
      zh-CN: 观察 Count 与误杀
      ja: Count と誤検知を観察する
      en: Observe Count and false positives
    manual: manual/50-observe-count.md
    experiment: { module: waf, id: false-positive, label: after }
    requires: { steps: [lock-origin] }
    panel: terminal-workstation
    estMinutes: 10
    checks: [exp-false-positive-after, false-positive-rule]

  - id: switch-block
    type: script
    title:
      zh-CN: 切换为 Block，并用服务端证据确认拦截在边缘
      ja: Block に切り替え、サーバー側の証拠でエッジでブロックされたことを確認する
      en: Switch to Block and confirm with server-side evidence that blocking happens at the edge
    manual: manual/60-switch-block.md
    methods: [script]
    requires: { steps: [observe-count] }
    panel: terminal-workstation
    estMinutes: 10
    wait:
      typicalMinutes: 3
      maxMinutes: 10
      text:
        zh-CN: Web ACL 更新托管规则组动作
        ja: Web ACL がマネージドルールグループのアクションを更新します
        en: The Web ACL updates the managed rule group's action
    checks: [webacl-block, block-not-at-origin]

  - id: after
    type: experiment
    title:
      zh-CN: 记录 after：限速（经 WAF 的源站负载平稳）
      ja: after を記録：レート制限（WAF 経由のオリジンの負荷は安定）
      en: "Record after: rate limiting (origin load through WAF stays steady)"
    manual: manual/70-after.md
    experiment: { module: waf, id: flood, label: after }
    requires: { steps: [switch-block] }
    panel: terminal-workstation
    estMinutes: 8
    checks: [exp-flood-pair]

  - id: after-payloads
    type: experiment
    title:
      zh-CN: 记录 after：载荷识别（托管规则组对编码变体更强）
      ja: after を記録：攻撃ペイロードの識別（マネージドルールグループはエンコードのバリエーションに強い）
      en: "Record after: payload detection (managed rule groups handle encoding variants better)"
    manual: manual/75-after-payloads.md
    experiment: { module: waf, id: payloads, label: after }
    requires: { steps: [switch-block] }
    panel: terminal-workstation
    estMinutes: 5
    checks: [exp-payloads-pair]

  - id: blocklist
    type: observe
    title:
      zh-CN: （选做）封禁 IP 与 Shield
      ja: IP のブロックと Shield
      en: IP blocking and Shield
    manual: manual/80-blocklist.md
    optional:
      reason:
        zh-CN: 不影响完成
        ja: 完了には影響しません
        en: Does not affect completion
    requires: { steps: [enable] }
    panel: terminal-lab
    estMinutes: 8
    checks: [ { ref: blocklist-synced, required: false } ]

finalChecks:
  - no-world-ssh
  - { ref: cap-waf-locked, as: final-waf-healthy }

