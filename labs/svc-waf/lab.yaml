# labs/svc-waf/lab.yaml —— AWS WAF：Web 应用防护（cards/service-cards-1 §7）
# 实现核对（docs/implementation-notes.md wave1-waf）：
#   - 锁定源站用 `scripts/module enable cdn --set CDN_DIRECT_ACCESS=admin-ip --set CDN_ADMIN_CIDR=…`（cdn hook 读 --set，不是 --param；
#     卡片文档写的 --param DirectAccess 与代码不符，以代码为准）；
#   - 切到 Block 用 `scripts/module enable waf --param RuleAction=block`（§9.2 没有 set 子命令，等价于以新参数重新 enable，附录 B-27）；
#   - 托管规则组 Block 返回 CloudFront 的 403，不带 X-CloudAlbum-Path：block 步骤用服务端证据（源站 nonce 计数为 0），路径头降为 warn（R-16）；
#   - waf 的 migration 是 scripts/waf/sync-denylist（afterDeploy 首次全量导入），enable 不需要 --no-migrate。
schema: atl.lab/v2
id: svc-waf
kind: service
version: 1.0.0
status: beta
service: AWS WAF
function: Web 应用防护
title: AWS WAF：Web 应用防护
subtitle: Nginx limit_req → CloudFront 边缘的 AWS WAF
summary: 同一套攻击脚本分别打向“只有 Nginx 限速”和“CloudFront + AWS WAF”：看被拦截的请求还会不会到达 EC2。
story: |
  L0 的“防火墙”是 EC2 上的 Nginx：limit_req 限速加几条正则，每个恶意请求都已经到达实例，消耗连接、TLS、日志与带宽。
  这张卡片把 AWS WAF 挂在 CloudFront 上，在边缘按托管规则与速率规则拦截；前提是源站已经锁定，否则攻击者可以绕过。
objectives:
  - { text: 说清 WAF 能挂在哪里（CloudFront / ALB / API Gateway），不能挂在哪里（EC2 / EIP / NLB）, domain: secure, relatesTo: enable }
  - { text: 用服务端证据区分“边缘拦截”和“源站 Nginx 的 403/429”, domain: secure, relatesTo: switch-block }
  - { text: 理解托管规则组先 Count 后 Block，以及 CRS 对大请求体的误杀, domain: secure, relatesTo: observe-count }
  - { text: 理解速率规则按窗口聚合、有检测延迟，与 Nginx 精确限速的差别, domain: performance, relatesTo: after }
  - { text: 理解源站锁定与“绕过 WAF”, domain: secure, relatesTo: lock-origin }
difficulty: intermediate
estimatedMinutes: 90
timeLimitMinutes: 150
extensions: { maxCount: 2, minutesEach: 30 }
retain: { allowed: true, maxHours: 24, reason: Web ACL 按月计费（按存续折算）；保留后可在 sc-edge-protection 中继续 }
regions:
  supported: [ap-northeast-1]
  alsoUses: [global, us-east-1]
services:
  - { id: waf, name: AWS WAF（Web ACL、托管规则组、速率规则、IP 集合、日志）, role: primary, module: waf }
  - { id: cloudfront, name: Amazon CloudFront（前置挂载点）, role: supporting, module: cdn }
  - { id: cloudwatch-logs, name: Amazon CloudWatch Logs（WAF 日志，us-east-1）, role: observed }
  - { id: iam, name: AWS IAM（实例角色）, role: context, module: iam }
  - { id: shield, name: AWS Shield Standard（只讲解）, role: observed }
modules: { target: [waf], start: [iam, cdn], context: [], related: [cdn, threat-detection, logging, monitoring] }
prerequisites:
  cards: [ { id: svc-cdn, kind: soft } ]
  knowledge: [HTTP 状态码与请求头, 七层与三/四层防护的区别, 正则与编码变体]

startProfile:
  provisions:
    - { item: iam, kind: module, basis: credential, set: { IAM_CREDENTIALS: role },
        reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）；管理后台封禁 IP 同步到 IP 集合、拦截计数 GetWebACL 因此可用 }
    - { item: cdn, kind: module, basis: closure, rule: DEP-006,
        reason: 'WAF 不能直接关联 EC2，需要 CloudFront 作为挂载点（DEP-006 的 cdn | load-balancer 取第一个可自动满足、不引入按小时计费的分支）；cdn 以默认 CDN_DIRECT_ACCESS=open 起步，让学员亲眼看到 DEP-018“可被绕过”，第 4 步再收紧' }
    - { item: mgmt-channel, kind: platform, reason: 实验机挂只含 AmazonSSMManagedInstanceCore 的 CloudAlbumAppRole，是平台的管理通道，不是应用权限 }
    - { item: workstation, kind: platform, reason: 每个会话一台工作台，用于运行 scripts/module、AWS CLI 与对比实验 }
    - { item: check-bundle, kind: platform, reason: 检查包随 CloudAlbum 发布包安装在实验机的 /opt/atl（06 PM-04） }
    - { item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）；本卡不涉及 tls，保持开启 }
  platform: { preview: { directHttps: 'on' } }
  reason: 起始状态是 L0 + 实例角色 + cdn（源站 = EC2，入口未锁定，CDN_DIRECT_ACCESS 取默认 open）；档位 atl/svc-waf/default
targetModules:
  - { id: waf, driver: aws, set: { WAF_RULE_ACTION: count }, params: { Scope: CLOUDFRONT }, wireStep: enable, adoptsExisting: false }
expectedWarnings: [DEP-018]
workstation: { required: true, tools: [aws-cli, node, jq], savingsMode: degraded }
platform:
  consoleLinks: [cloudfront.distribution, ec2.securityGroup]
provision: { class: B, cleanupBudgetMinutes: 90 }

variables:
  webAclArn: { label: Web ACL ARN, from: derived, fillFrom: stack.waf.EnvWafWebAclArn, pattern: '^arn:aws[a-z-]*:wafv2:us-east-1:\d{12}:global/webacl/[^/]+/[0-9a-f-]+$' }
  webAclId: { label: Web ACL ID, from: derived, fillFrom: stack.waf.InfoWebAclId }
  webAclName: { label: Web ACL 名称, from: derived, fillFrom: stack.waf.InfoWebAclName, example: cloudalbum-e7k2m9qx-acl }
  ipSetName: { label: IP 集合名称, from: derived, fillFrom: stack.waf.EnvWafIpSetName, example: cloudalbum-blocklist }
  logGroup: { label: WAF 日志组, from: derived, fillFrom: stack.waf.EnvWafLogGroup, example: aws-waf-logs-cloudalbum-e7k2m9qx }
  cdnDomain: { label: 分配域名, from: derived, fillFrom: stack.cdn.InfoDistributionDomainName, pattern: '^[a-z0-9]+\.cloudfront\.net$' }
  distributionId: { label: 分配 ID, from: derived, fillFrom: stack.cdn.EnvCdnDistributionId, pattern: '^E[A-Z0-9]{8,20}$' }

cost:
  currency: USD
  tier: low
  mainDrivers: [WAF Web ACL 与规则（按月，按存续折算）, WAF 请求检查（按百万请求）, WAF 日志写入 CloudWatch Logs, CloudFront 请求与出网]
  basis:
    - { ref: start-profile, note: 实验机 EC2、EBS（根卷与数据卷）、公网 IPv4；cdn 的 CloudFront 按量 }
    - { ref: workstation, note: 工作台 EC2、EBS、公网 IPv4 }
    - { key: waf-acl, pricingKey: waf.web-acl, billing: monthly, quantity: 1, unit: month, source: target, whenRetained: true, note: Web ACL 按月（按存续折算）；6 条自定义规则各按月，AWS 托管规则组不另收订阅费 }
    - { key: waf-requests, pricingKey: waf.requests, billing: usage, quantity: 1, unit: requests, assumedUsagePerHour: 3000, source: target, whenRetained: false, note: 按百万请求检查 }
    - { key: waf-logs, pricingKey: logs.ingestion, billing: usage, quantity: 1, unit: GB, assumedUsagePerHour: 0.02, source: target, whenRetained: false, note: 只投递 BLOCK/COUNT }
  assumptions:
    - Web ACL 与规则按月计费、按会话存续时间折算；实验流量低，以官方定价为准
    - CloudFront 后面的 ALB 纵深防御（本卡不启用）会使 WAF 费用翻倍

steps:
  - id: orient
    type: observe
    title: 起始状态：WAF 是 EC2 上的 Nginx，源站未锁定
    manual: manual/10-orient.md
    panel: preview
    estMinutes: 5
    checks: [waf-nginx-baseline, cdn-open-baseline]

  - id: baseline
    type: experiment
    title: 记录 before：Nginx 的限速
    manual: manual/20-baseline.md
    experiment: { module: waf, id: flood, label: before }
    panel: terminal-workstation
    estMinutes: 8
    checks: [exp-flood-before]

  - id: baseline-payloads
    type: experiment
    title: 记录 before：Nginx 的特征拦截（编码变体有漏网）
    manual: manual/22-baseline-payloads.md
    experiment: { module: waf, id: payloads, label: before }
    requires: { steps: [orient] }
    panel: terminal-workstation
    estMinutes: 5
    checks: [exp-payloads-before]

  - id: bypass-before
    type: experiment
    title: 绕过检查：源站未锁定时直连可达
    manual: manual/25-bypass.md
    experiment: { module: waf, id: bypass, label: before }
    requires: { steps: [orient] }
    panel: terminal-workstation
    estMinutes: 6
    checks: [exp-bypass-before]

  - id: enable
    type: script
    wire: true
    title: 启用 AWS WAF（Count 模式，关联到 CloudFront）
    manual: manual/30-enable.md
    methods: [script]
    requires: { steps: [baseline] }
    panel: terminal-workstation
    estMinutes: 12
    startsBilling: { class: usage, pricingKeys: [waf.web-acl, waf.requests], note: Web ACL 按月、请求按量 }
    wait: { typicalMinutes: 6, maxMinutes: 20, text: 部署 us-east-1 的 Web ACL，再把 WebAclArn 注入 cdn 栈，分配重新部署 }
    checks: [cap-waf-wired, entry-waf, webacl-count, distribution-webacl]

  - id: lock-origin
    type: script
    title: 锁定源站（否则可以绕过 WAF）
    manual: manual/40-lock-origin.md
    methods: [script]
    requires: { steps: [enable] }
    panel: terminal-workstation
    estMinutes: 8
    wait: { typicalMinutes: 5, maxMinutes: 20, text: cdn 栈更新安全组与直连策略，分配重新部署 }
    checks: [cap-waf-locked]

  - id: bypass-after
    type: experiment
    title: 锁定后再验证：直连不可达，无法绕过 WAF
    manual: manual/45-bypass-after.md
    experiment: { module: waf, id: bypass, label: after }
    requires: { steps: [lock-origin] }
    panel: terminal-workstation
    estMinutes: 4
    checks: [exp-bypass-pair]

  - id: observe-count
    type: experiment
    title: 观察 Count 与误杀
    manual: manual/50-observe-count.md
    experiment: { module: waf, id: false-positive, label: after }
    requires: { steps: [lock-origin] }
    panel: terminal-workstation
    estMinutes: 10
    checks: [exp-false-positive-after, false-positive-rule]

  - id: switch-block
    type: script
    title: 切换为 Block，并用服务端证据确认拦截在边缘
    manual: manual/60-switch-block.md
    methods: [script]
    requires: { steps: [observe-count] }
    panel: terminal-workstation
    estMinutes: 10
    wait: { typicalMinutes: 3, maxMinutes: 10, text: Web ACL 更新托管规则组动作 }
    checks: [webacl-block, block-not-at-origin]

  - id: after
    type: experiment
    title: 记录 after：限速（经 WAF 的源站负载平稳）
    manual: manual/70-after.md
    experiment: { module: waf, id: flood, label: after }
    requires: { steps: [switch-block] }
    panel: terminal-workstation
    estMinutes: 8
    checks: [exp-flood-pair]

  - id: after-payloads
    type: experiment
    title: 记录 after：载荷识别（托管规则组对编码变体更强）
    manual: manual/75-after-payloads.md
    experiment: { module: waf, id: payloads, label: after }
    requires: { steps: [switch-block] }
    panel: terminal-workstation
    estMinutes: 5
    checks: [exp-payloads-pair]

  - id: blocklist
    type: observe
    title: （选做）封禁 IP 与 Shield
    manual: manual/80-blocklist.md
    optional: { reason: 不影响完成 }
    requires: { steps: [enable] }
    panel: terminal-lab
    estMinutes: 8
    checks: [ { ref: blocklist-synced, required: false } ]

finalChecks:
  - no-world-ssh
  - { ref: cap-waf-locked, as: final-waf-healthy }

experiments:
  - module: waf
    id: flood
    labels:
      - { id: before, role: baseline, requires: { waf: nginx } }
      - { id: after, role: treatment, requires: { waf: aws } }
    pairs: [[before, after]]
    requiredLabels: [before, after]
    required: true
    runner: workstation
    allowSimulatedBaseline: false
    corroboration: { minServerRatio: 0.9 }
  - module: waf
    id: payloads
    labels:
      - { id: before, role: baseline, requires: { waf: nginx } }
      - { id: after, role: treatment, requires: { waf: aws } }
    pairs: [[before, after]]
    requiredLabels: [before, after]
    required: true
    runner: workstation
    allowSimulatedBaseline: false
  - module: waf
    id: bypass
    labels:
      - { id: before, role: baseline, requires: { waf: nginx } }
      - { id: after, role: treatment, requires: { waf: aws } }
    pairs: [[before, after]]
    required: true
    runner: workstation
  - module: waf
    id: false-positive
    labels: [ { id: after, role: single, requires: { waf: aws } } ]
    required: true
    runner: workstation
    validity: functional
    corroborateWith: [cap-waf-locked]

quiz: { file: quiz.yaml, draw: 3 }
badge: { title: 边缘防护, icon: assets/badge.svg }
tracks: [networking, saa-main, secure]

cleanup:
  summary: 结束实验后，平台先用空的 WebAclArn 更新 cdn 栈解除关联（分配重新部署数分钟），再删除 us-east-1 的 Web ACL 与 IP 集合；仍处于关联状态的 Web ACL 无法删除。WAF 日志组按数据保护约定保留。
  autoReclaim: true
  dataRisk: [没有业务数据；denylist.conf 与实验机随会话删除，报告中保留证据摘要]
  learnerCreatedHints:
    - { resourceType: 'AWS::WAFv2::WebACL', how: 先用空的 WebAclArn 更新 cdn 栈解除关联，再删除 }
    - { resourceType: 'AWS::Logs::LogGroup', how: 日志组保留（us-east-1）；不需要时手动删除 aws-waf-logs-cloudalbum-<env> }
  verify:
    - webacl-gone

saa:
  domains: [secure, resilient]
  topics:
    - { id: mount-points, title: WAF 的挂载点与不能挂载的资源, domain: secure, relatesTo: enable }
    - { id: cloudfront-scope, title: CLOUDFRONT 范围的 Web ACL、IP 集合、日志组都在 us-east-1, domain: secure, relatesTo: enable }
    - { id: count-then-block, title: 托管规则组先 Count 后 Block；CRS 对大请求体的误杀, domain: secure, relatesTo: observe-count }
    - { id: rate-based, title: 基于速率的规则按窗口聚合、有检测延迟, domain: performance, relatesTo: after }
    - { id: origin-lock, title: 源站锁定与绕过 WAF, domain: secure, relatesTo: lock-origin }
  confusables:
    - { a: 安全组 / NACL, b: AWS WAF, rule: 安全组与 NACL 工作在三/四层按 IP / 端口；WAF 在七层按 URI、请求头、速率与托管规则判断 }
    - { a: Shield Standard, b: Shield Advanced, rule: Standard 自动免费防网络 / 传输层 DDoS；Advanced 付费，含 DDoS 响应团队与成本保护 }
    - { a: WAF Web ACL, b: Network Load Balancer, rule: WAF 不能关联 NLB / EC2 / EIP；可关联 CloudFront、ALB、API Gateway REST API、Cognito User Pool 等 }

tags: [waf, web-acl, rate-based, managed-rules, edge, secure]

permissions:
  learner:
    - cloudformation:CreateChangeSet
    - cloudformation:DescribeChangeSet
    - cloudformation:ExecuteChangeSet
    - cloudformation:DescribeStacks
    - cloudformation:DescribeStackEvents
    - wafv2:CreateWebACL
    - wafv2:UpdateWebACL
    - wafv2:GetWebACL
    - wafv2:DeleteWebACL
    - wafv2:CreateIPSet
    - wafv2:GetIPSet
    - wafv2:UpdateIPSet
    - wafv2:DeleteIPSet
    - wafv2:PutLoggingConfiguration
    - wafv2:GetLoggingConfiguration
    - wafv2:TagResource
    - wafv2:ListResourcesForWebACL
    - cloudfront:GetDistribution
    - cloudfront:GetDistributionConfig
    - cloudfront:UpdateDistribution
    - cloudfront:ListDistributionsByWebACLId
    - ec2:DescribeSecurityGroupRules
    - ec2:AuthorizeSecurityGroupIngress
    - ec2:RevokeSecurityGroupIngress
    - logs:CreateLogGroup
    - logs:DescribeLogGroups
    - logs:PutResourcePolicy
    - logs:DescribeResourcePolicies
    - iam:CreatePolicy
    - iam:AttachRolePolicy
    - ssm:SendCommand
    - ssm:GetCommandInvocation
  notes: >-
    CLOUDFRONT 范围的 wafv2 / logs 调用在 us-east-1（01 §6.5 的 UsEast1EdgeOnly 放行、护栏 UsEast1LabStacksOnly 只允许 stack/cloudalbum-*）；
    wafv2:GetIPSet 不在 04 §5.7 的 aws-readonly 白名单中，选做的封禁步骤只用本地与管理端点证据，不为它扩充。

certificate: { enabled: false }
owners: [cloudalbum-maintainers]
