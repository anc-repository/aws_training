quiz: { file: quiz.yaml, draw: 3 }
badge:
  title:
    zh-CN: 边缘防护
    ja: エッジでの防御
    en: Edge protection
  icon: assets/badge.svg
tracks: [networking, saa-main, secure]

cleanup:
  summary:
    zh-CN: 结束实验后，平台先用空的 WebAclArn 更新 cdn 栈解除关联（分配重新部署数分钟），再删除 us-east-1 的 Web ACL 与 IP 集合；仍处于关联状态的 Web ACL 无法删除。WAF 日志组按数据保护约定保留。
    ja: ラボの終了後、プラットフォームはまず空の WebAclArn で cdn スタックを更新して関連付けを解除し（ディストリビューションの再デプロイに数分）、その後 us-east-1 の Web ACL と IP セットを削除します。関連付けられたままの Web ACL は削除できません。WAF のロググループはデータ保護の取り決めにより保持されます。
    en: When the lab ends, the platform first updates the cdn stack with an empty WebAclArn to disassociate it (the distribution redeploys for a few minutes), then deletes the Web ACL and IP set in us-east-1; a Web ACL that is still associated cannot be deleted. The WAF log group is kept under the data protection convention.
  autoReclaim: true
  dataRisk:
    - zh-CN: 没有业务数据；denylist.conf 与实验机随会话删除，报告中保留证据摘要
      ja: 業務データはありません。denylist.conf とラボ用インスタンスはセッションとともに削除され、レポートには証拠の要約が残ります
      en: No business data; denylist.conf and the lab instance are deleted with the session, and the report keeps an evidence summary
  learnerCreatedHints:
    - resourceType: 'AWS::WAFv2::WebACL'
      how:
        zh-CN: 先用空的 WebAclArn 更新 cdn 栈解除关联，再删除
        ja: まず空の WebAclArn で cdn スタックを更新して関連付けを解除し、その後削除します
        en: First update the cdn stack with an empty WebAclArn to disassociate, then delete
    - resourceType: 'AWS::Logs::LogGroup'
      how:
        zh-CN: 日志组保留（us-east-1）；不需要时手动删除 aws-waf-logs-cloudalbum-<env>
        ja: ロググループは保持されます（us-east-1）。不要なら aws-waf-logs-cloudalbum-<env> を手動で削除してください
        en: The log group is kept (us-east-1); delete aws-waf-logs-cloudalbum-<env> by hand if you do not need it
  verify:
    - webacl-gone

saa:
  domains: [secure, resilient]
  topics:
    - id: mount-points
      title:
        zh-CN: WAF 的挂载点与不能挂载的资源
        ja: WAF の関連付け先と関連付けられないリソース
        en: Where WAF can be attached, and which resources it cannot
      domain: secure
      relatesTo: enable
    - id: cloudfront-scope
      title:
        zh-CN: CLOUDFRONT 范围的 Web ACL、IP 集合、日志组都在 us-east-1
        ja: CLOUDFRONT スコープの Web ACL、IP セット、ロググループはすべて us-east-1 にある
        en: CLOUDFRONT-scope Web ACLs, IP sets and log groups are all in us-east-1
      domain: secure
      relatesTo: enable
    - id: count-then-block
      title:
        zh-CN: 托管规则组先 Count 后 Block；CRS 对大请求体的误杀
        ja: マネージドルールグループはまず Count、その後 Block。CRS による大きなリクエストボディの誤検知
        en: Managed rule groups go Count first, then Block; CRS false positives on large request bodies
      domain: secure
      relatesTo: observe-count
    - id: rate-based
      title:
        zh-CN: 基于速率的规则按窗口聚合、有检测延迟
        ja: レートベースのルールはウィンドウで集計され、検知に遅延がある
        en: Rate-based rules aggregate over a window with a detection delay
      domain: performance
      relatesTo: after
    - id: origin-lock
      title:
        zh-CN: 源站锁定与绕过 WAF
        ja: オリジンのロックと WAF の迂回
        en: Origin lock-down and bypassing WAF
      domain: secure
      relatesTo: lock-origin
  confusables:
    - a:
        zh-CN: 安全组 / NACL
        ja: セキュリティグループ / NACL
        en: Security groups / NACLs
      b:
        zh-CN: AWS WAF
        ja: AWS WAF
        en: AWS WAF
      rule:
        zh-CN: 安全组与 NACL 工作在三/四层按 IP / 端口；WAF 在七层按 URI、请求头、速率与托管规则判断
        ja: セキュリティグループと NACL はレイヤー 3/4 で IP / ポートに基づいて動作します。WAF はレイヤー 7 で URI、リクエストヘッダー、レート、マネージドルールに基づいて判断します
        en: Security groups and NACLs work at layers 3/4 on IPs and ports; WAF decides at layer 7 on URIs, request headers, rates and managed rules
    - a:
        zh-CN: Shield Standard
        ja: Shield Standard
        en: Shield Standard
      b:
        zh-CN: Shield Advanced
        ja: Shield Advanced
        en: Shield Advanced
      rule:
        zh-CN: Standard 自动免费防网络 / 传输层 DDoS；Advanced 付费，含 DDoS 响应团队与成本保护
        ja: Standard は自動・無料でネットワーク層 / トランスポート層の DDoS を防ぎます。Advanced は有料で、DDoS レスポンスチームとコスト保護が付きます
        en: Standard automatically protects against network/transport-layer DDoS at no cost; Advanced is paid and includes the DDoS response team and cost protection
    - a:
        zh-CN: WAF Web ACL
        ja: WAF Web ACL
        en: WAF Web ACL
      b:
        zh-CN: Network Load Balancer
        ja: Network Load Balancer
        en: Network Load Balancer
      rule:
        zh-CN: WAF 不能关联 NLB / EC2 / EIP；可关联 CloudFront、ALB、API Gateway REST API、Cognito User Pool 等
        ja: WAF は NLB / EC2 / EIP には関連付けられません。CloudFront、ALB、API Gateway REST API、Cognito User Pool などには関連付けられます
        en: WAF cannot be associated with NLB / EC2 / EIP; it can be associated with CloudFront, ALB, API Gateway REST APIs, Cognito user pools and more

tags: [waf, web-acl, rate-based, managed-rules, edge, secure]

