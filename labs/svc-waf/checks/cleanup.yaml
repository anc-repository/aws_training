# 回收后的验证（04 §3.2.12）：只允许 aws-readonly + expectError，结果写进报告的“清理”一节
checks:
  - id: webacl-gone
    title: 本会话的 Web ACL 已删除（us-east-1）
    type: aws-readonly
    service: wafv2
    action: GetWebACL
    region: us-east-1
    params: { Name: '{{ var.webAclName }}', Scope: CLOUDFRONT, Id: '{{ var.webAclId }}' }
    expectError: WAFNonexistentItemException
    required: false
    explain: 回收会先用空的 WebAclArn 更新 cdn 栈解除关联，再删除 Web ACL；之后按名称 / ID 查询应返回 WAFNonexistentItemException。
    reproduce: { run: 'aws wafv2 get-web-acl --region us-east-1 --scope CLOUDFRONT --name {{ var.webAclName }} --id {{ var.webAclId }}', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [WAF, Web ACLs, 'Global (CloudFront)'], region: us-east-1 }
      observed:
        question: 列表里还能找到这个 Web ACL 吗？
        options:
          - { value: gone, label: 找不到, expected: true }
          - { value: present, label: 还在（可能仍在解除关联）, fixHint: 仍处于关联状态的 Web ACL 无法删除，需要等分配重新部署完成 }
