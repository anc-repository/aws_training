checks:
  - id: exp-flood-before
    title:
      zh-CN: flood 的 before（Nginx limit_req）有一条有效结果
      ja: flood の before（Nginx の limit_req）に有効な結果が 1 件ある
      en: flood has one valid before result (Nginx limit_req)
    type: experiment
    module: waf
    experiment: flood
    label: before
    accept: [valid]

  - id: exp-flood-pair
    title:
      zh-CN: flood 的 before 与 after 都有效且可比
      ja: flood の before と after がどちらも有効で比較できる
      en: flood before and after are both valid and comparable
    type: experiment
    module: waf
    experiment: flood
    pair: [before, after]
    accept: [valid]

  - id: exp-payloads-before
    title:
      zh-CN: payloads 的 before（Nginx 正则：编码变体有漏网）有一条有效结果
      ja: payloads の before（Nginx の正規表現：エンコードのバリエーションが素通り）に有効な結果が 1 件ある
      en: "payloads has one valid before result (Nginx regexes: encoding variants slip through)"
    type: experiment
    module: waf
    experiment: payloads
    label: before
    accept: [valid]

  - id: exp-payloads-pair
    title:
      zh-CN: payloads 的 before 与 after 都有效且可比（AWS 托管规则组识别更强）
      ja: payloads の before と after がどちらも有効で比較できる（AWS マネージドルールグループのほうが識別に強い）
      en: payloads before and after are both valid and comparable (AWS managed rule groups detect more)
    type: experiment
    module: waf
    experiment: payloads
    pair: [before, after]
    accept: [valid]

  - id: exp-bypass-before
    title:
      zh-CN: bypass 的 before（源站未锁定，直连可达）有一条有效结果
      ja: bypass の before（オリジンがロックされておらず、直接アクセスで到達できる）に有効な結果が 1 件ある
      en: bypass has one valid before result (origin not locked, direct access reachable)
    type: experiment
    module: waf
    experiment: bypass
    label: before
    accept: [valid]

  - id: exp-bypass-pair
    title:
      zh-CN: bypass 的 before 与 after 成对（锁定后直连不可达）
      ja: bypass の before と after が組になっている（ロック後は直接アクセスで到達できない）
      en: bypass before and after form a pair (direct access unreachable after locking)
    type: experiment
    module: waf
    experiment: bypass
    pair: [before, after]
    accept: [valid]

  - id: exp-false-positive-after
    title:
      zh-CN: false-positive（Count 下大请求体放行）有一条有效结果
      ja: false-positive（Count のもとで大きなリクエストボディが通過）に有効な結果が 1 件ある
      en: false-positive has one valid result (large request body allowed under Count)
    type: experiment
    module: waf
    experiment: false-positive
    label: after
    accept: [valid]
