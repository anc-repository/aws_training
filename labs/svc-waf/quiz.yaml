schema: atl.quiz/v1
version: 1.0.0
questions:
  - id: waf-rate-at-edge
    domain: secure
    type: single
    kind: scenario
    services: [waf, cloudfront]
    stem: 网站在 CloudFront 后面。需要在请求到达 EC2 之前，限制单个 IP 对 `/api/auth/` 的 POST 请求速率。应该？
    options:
      - { id: a, text: 在关联到 CloudFront 的 Web ACL 中添加基于速率的规则，并把范围缩小为该路径与方法 }
      - { id: b, text: 在实例安全组中限制来源 }
      - { id: c, text: 在子网 NACL 中按 IP 拒绝 }
      - { id: d, text: 依赖 Shield Standard 自动处理 }
    answer: [a]
    explain: 安全组与 NACL 工作在三/四层，无法按 URI 与速率判断，而且在 CloudFront 后面看到的是边缘地址；Shield Standard 防网络 / 传输层 DDoS，不做应用层限速。
    relatesTo: after
    difficulty: 1
  - id: waf-mount-points
    domain: secure
    type: single
    kind: concept
    services: [waf]
    stem: AWS WAF 的 Web ACL **不能**直接关联到下列哪个资源？
    options:
      - { id: a, text: Network Load Balancer }
      - { id: b, text: Application Load Balancer }
      - { id: c, text: CloudFront 分配 }
      - { id: d, text: API Gateway REST API }
    answer: [a]
    explain: WAF 工作在七层，可关联 CloudFront、ALB、API Gateway REST API、AppSync、Cognito User Pool 等；不能关联 NLB、EC2 或 EIP。
    relatesTo: enable
    difficulty: 1
  - id: waf-cloudfront-scope
    domain: secure
    type: multi
    kind: concept
    services: [waf, cloudfront]
    stem: 关于 CLOUDFRONT 范围的 Web ACL，下列说法正确的是（选 2 项）？
    options:
      - { id: a, text: Web ACL 必须创建在 us-east-1 }
      - { id: b, text: 日志写入 CloudWatch Logs 时，日志组名称必须以 aws-waf-logs- 开头 }
      - { id: c, text: 只能关联 ALB }
      - { id: d, text: 不能使用 AWS 托管规则组 }
    answer: [a, b]
    explain: CLOUDFRONT 范围的 Web ACL、IP 集合、日志目标都在 us-east-1，日志目标名称要以 aws-waf-logs- 开头；它关联 CloudFront 分配（关联 ALB 要用 REGIONAL 范围，C 错）；托管规则组两种范围都能用，新启用时先 Count 再 Block（D 错）。
    relatesTo: enable
    difficulty: 2
  - id: waf-count-first
    domain: secure
    type: single
    kind: scenario
    services: [waf]
    stem: 刚在 CloudFront 上启用了 AWS 托管的通用规则组（CRS），随后用户反映部分照片上传失败。最合理的第一步是？
    options:
      - { id: a, text: 先用 Count 模式观察哪条规则命中（通常是 SizeRestrictions_BODY），再决定覆盖或排除 }
      - { id: b, text: 立即删除整个 Web ACL }
      - { id: c, text: 把实例的 client_max_body_size 调小 }
      - { id: d, text: 关闭 CloudFront }
    answer: [a]
    explain: CRS 的 SizeRestrictions_BODY 会拦掉超过 8 KB 的请求体，导致上传失败；先 Count 观察、再用 RuleActionOverrides 改为 Count 或范围缩小排除上传路径，而不是停用防护。
    relatesTo: observe-count
    difficulty: 2
