checks:
  - id: exp-mixed-before
    title:
      zh-CN: mixed-rw 的 before（SQLite）有一条有效结果
      ja: mixed-rw の before（SQLite）に有効な結果が 1 件ある
      en: mixed-rw has a valid before result (SQLite)
    type: experiment
    module: database
    experiment: mixed-rw
    label: before
    accept: [valid]

  - id: exp-failover-before
    title:
      zh-CN: failover 的 before（重启 api）有一条有效结果
      ja: failover の before（api の再起動）に有効な結果が 1 件ある
      en: failover has a valid before result (api restart)
    type: experiment
    module: database
    experiment: failover
    label: before
    accept: [valid]

  - id: exp-mixed-pair
    title:
      zh-CN: mixed-rw 的 before 与 after 都有效且可比
      ja: mixed-rw の before と after がどちらも有効で比較可能
      en: mixed-rw before and after are both valid and comparable
    type: experiment
    module: database
    experiment: mixed-rw
    pair: [before, after]
    accept: [valid]

  - id: exp-failover-pair
    title:
      zh-CN: failover 的 before 与 after 都有效且可比
      ja: failover の before と after がどちらも有効で比較可能
      en: failover before and after are both valid and comparable
    type: experiment
    module: database
    experiment: failover
    pair: [before, after]
    accept: [valid]

  - id: exp-replica-read
    title:
      zh-CN: replica-read 的 after（读走只读副本）有一条有效结果
      ja: replica-read の after（読み取りをリードレプリカに送る）に有効な結果が 1 件ある
      en: replica-read has a valid after result (reads go to the read replica)
    type: experiment
    module: database
    experiment: replica-read
    label: after
    accept: [valid]
