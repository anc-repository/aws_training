checks:
  - id: exp-mixed-before
    title: mixed-rw 的 before（SQLite）有一条有效结果
    type: experiment
    module: database
    experiment: mixed-rw
    label: before
    accept: [valid]

  - id: exp-failover-before
    title: failover 的 before（重启 api）有一条有效结果
    type: experiment
    module: database
    experiment: failover
    label: before
    accept: [valid]

  - id: exp-mixed-pair
    title: mixed-rw 的 before 与 after 都有效且可比
    type: experiment
    module: database
    experiment: mixed-rw
    pair: [before, after]
    accept: [valid]

  - id: exp-failover-pair
    title: failover 的 before 与 after 都有效且可比
    type: experiment
    module: database
    experiment: failover
    pair: [before, after]
    accept: [valid]

  - id: exp-replica-read
    title: replica-read 的 after（读走只读副本）有一条有效结果
    type: experiment
    module: database
    experiment: replica-read
    label: after
    accept: [valid]
