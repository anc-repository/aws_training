# labs/svc-logging/lab.yaml —— Amazon CloudWatch Logs：集中日志（cards/service-cards-3 svc-logging）
# 实现核对（docs/implementation-notes.md ## wave1-logs-ssm）：
# - 本版没有 /lab 日志查看器页面：第 1 步在实验机终端直接看数据卷上的日志文件；两侧的查询经 GET /api/lab/logs
#   （仅管理员，logging 模块的侧路端点）由对比实验调用，服务端给出用时、扫描字节与 CloudWatch 的 ingestionTime。
# - 应用不按请求写日志行，5xx 故障只出现在 Nginx 访问日志里：第 5 步看指标过滤器 Nginx5xx（命名空间 CloudAlbum/Logs），
#   而不是卡片写的 AppErrors（AppErrors 统计应用的 level=error 行，同样由栈创建，最终复核不依赖它）。
# - logging 不出现在 X-CloudAlbum-Path 中：接入证据是一次真实请求（http-probe）+ 本实例的 access 日志流出现在本会话的日志组里。
schema: atl.lab/v2
id: svc-logging
kind: service
version: 1.0.0
status: beta
service:
  zh-CN: Amazon CloudWatch Logs
  ja: Amazon CloudWatch Logs
  en: Amazon CloudWatch Logs
function:
  zh-CN: 集中日志
  ja: ログの一元管理
  en: Centralized logging
title:
  zh-CN: Amazon CloudWatch Logs：集中日志
  ja: Amazon CloudWatch Logs：ログの一元管理
  en: "Amazon CloudWatch Logs: centralized logging"
subtitle:
  zh-CN: EBS 上的日志文件 → CloudWatch Logs（本地文件照写）
  ja: EBS 上のログファイル → CloudWatch Logs（ローカルファイルへの書き込みも継続）
  en: Log files on EBS → CloudWatch Logs (local files still written)
summary:
  zh-CN: 把只躺在 EBS 文件里的日志批量送进 CloudWatch Logs：跨实例检索、Logs Insights 聚合、指标过滤器把日志变成指标。
  ja: EBS のファイルにしかないログを CloudWatch Logs にまとめて送ります。インスタンスをまたいだ検索、Logs Insights による集計、メトリクスフィルターによるログのメトリクス化を行います。
  en: "Batch-ship logs that only live in files on EBS to CloudWatch Logs: search across instances, aggregate with Logs Insights, and turn logs into metrics with metric filters."
story:
  zh-CN: |
    出了 5xx，你登录实验机 grep 日志：只能看到这一台、最近两天的文件；实例一旦被替换，日志跟着消失，Lambda 的日志根本不在本地。
    这张卡片让应用把同一份结构化日志批量送进 CloudWatch Logs（本地文件照写，回滚没有数据缺口），并亲手量一量摄取延迟与查询的扫描量。
  ja: |
    5xx が出たら、ラボ用インスタンスにログインしてログを grep します。見えるのはこの 1 台の直近 2 日分のファイルだけです。インスタンスが置き換えられればログも消え、Lambda のログはそもそもローカルにありません。
    このカードでは、アプリに同じ構造化ログを CloudWatch Logs へまとめて送らせ（ローカルファイルへの書き込みも続けるので、ロールバックしてもデータの欠落はありません）、取り込みの遅延とクエリのスキャン量を自分で測ります。
  en: |
    When a 5xx happens, you sign in to the lab instance and grep the logs: you only see this one machine's files from the last two days; when the instance is replaced the logs vanish with it, and Lambda logs are not local at all.
    This card has the app batch-ship the same structured logs to CloudWatch Logs (local files are still written, so a rollback leaves no gap), and you measure the ingestion latency and the amount of data your queries scan.
objectives:
  - text:
      zh-CN: 说清 EC2 上的日志为什么要靠 SDK 或 CloudWatch Agent 才能进入 CloudWatch Logs
      ja: EC2 上のログが CloudWatch Logs に入るには SDK か CloudWatch エージェントが必要な理由を説明できる
      en: Explain why logs on EC2 need the SDK or the CloudWatch agent to reach CloudWatch Logs
    domain: resilient
    relatesTo: wire
  - text:
      zh-CN: 测量摄取延迟，理解“本地立即可见、云端秒级延迟”
      ja: 取り込みの遅延を測定し、「ローカルでは即時、クラウドでは秒単位の遅延」を理解する
      en: Measure ingestion latency and understand "immediate locally, seconds of delay in the cloud"
    domain: performance
    relatesTo: ingest
  - text:
      zh-CN: 用指标过滤器把日志变成指标，并知道它不回溯
      ja: メトリクスフィルターでログをメトリクスに変え、過去にはさかのぼらないことを知る
      en: Turn logs into metrics with metric filters, knowing that they do not apply retroactively
    domain: resilient
    relatesTo: insights
  - text:
      zh-CN: 区分 Logs Insights、订阅过滤器与导出到 S3
      ja: Logs Insights、サブスクリプションフィルター、S3 へのエクスポートを区別する
      en: Tell Logs Insights, subscription filters and export to S3 apart
    domain: cost
    relatesTo: after
difficulty: beginner
estimatedMinutes: 45
timeLimitMinutes: 90
extensions: { maxCount: 2, minutesEach: 30 }
retain:
  allowed: true
  maxHours: 24
  reason:
    zh-CN: 只有按量计费的日志摄取、存储与 Insights 扫描；保留后可以继续 svc-monitoring
    ja: 使用量課金のログの取り込み、保存、Insights のスキャンだけです。保持すれば svc-monitoring に進めます
    en: Only usage-billed log ingestion, storage and Insights scans; if you keep the environment, you can continue with svc-monitoring
regions:
  supported: [ap-northeast-1]
services:
  - id: cloudwatch-logs
    name:
      zh-CN: Amazon CloudWatch Logs
      ja: Amazon CloudWatch Logs
      en: Amazon CloudWatch Logs
    role: primary
    module: logging
  - id: cloudwatch
    name:
      zh-CN: Amazon CloudWatch（指标过滤器生成的指标）
      ja: Amazon CloudWatch（メトリクスフィルターが生成するメトリクス）
      en: Amazon CloudWatch (metrics generated by metric filters)
    role: supporting
    featureOf: cloudwatch-logs
  - id: ec2
    name:
      zh-CN: Amazon EC2（数据卷上的日志文件）
      ja: Amazon EC2（データボリューム上のログファイル）
      en: Amazon EC2 (log files on the data volume)
    role: observed
    module: ec2
  - id: iam
    name:
      zh-CN: AWS IAM（实例角色）
      ja: AWS IAM（インスタンスロール）
      en: AWS IAM (instance role)
    role: context
    module: iam
modules: { target: [logging], start: [iam], context: [], related: [monitoring, autoscaling] }
prerequisites:
  cards:
    - { id: svc-iam, kind: soft }
    - { id: svc-monitoring, kind: soft }
    - { id: sc-observability, kind: soft }
  learnerInputs: []
  knowledge:
    - zh-CN: JSON 日志
      ja: JSON 形式のログ
      en: JSON logs
    - zh-CN: 正则或关键字检索
      ja: 正規表現またはキーワードでの検索
      en: Searching with regular expressions or keywords

startProfile:
  provisions:
    - item: iam
      kind: module
      basis: credential
      set: { IAM_CREDENTIALS: role }
      reason:
        zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）；logging 本身也是 credentials required（CRED-001）
        ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）。logging 自体も credentials required です（CRED-001）
        en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3); logging itself is also credentials required (CRED-001)
    - item: featureFlags.lab.faults
      kind: runtime
      value: true
      reason:
        zh-CN: query-compare 先用共享故障注入接口制造 5xx（error5xx），再比较两侧的查询
        ja: query-compare では、まず共有の障害注入 API で 5xx を発生させ（error5xx）、その後で両側のクエリを比較します
        en: query-compare first uses the shared fault injection API to cause 5xx (error5xx), then compares the queries on both sides
    - item: mgmt-channel
      kind: platform
      reason:
        zh-CN: 实验机挂只含 AmazonSSMManagedInstanceCore 的 CloudAlbumAppRole，是平台的管理通道，不是应用权限
        ja: ラボ用インスタンスには AmazonSSMManagedInstanceCore だけを含む CloudAlbumAppRole が付いています。これはプラットフォームの管理チャネルであり、アプリの権限ではありません
        en: The lab instance carries CloudAlbumAppRole with only AmazonSSMManagedInstanceCore. It is the platform's management channel, not an app permission
    - item: workstation
      kind: platform
      reason:
        zh-CN: 每个会话一台工作台，用于运行 scripts/module 与对比实验
        ja: セッションごとに 1 台のワークベンチがあり、scripts/module と比較実験の実行に使います
        en: Each session has one workbench for running scripts/module and comparison experiments
    - item: preview-direct-https
      kind: platform
      reason:
        zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书；本卡不涉及 tls，保持开启
        ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います。このカードは tls に関係しないため、有効のままにします
        en: The preview uses the option B Let's Encrypt IP certificate; this card does not involve tls, so it stays on
  platform: { preview: { directHttps: 'on' } }
  reason:
    zh-CN: logging 的 requires 为空；起始状态是 L0 + 实例角色 + 故障注入开关（档位 atl/svc-logging/default）
    ja: logging の requires は空です。開始状態は L0 ＋インスタンスロール＋障害注入スイッチです（プロファイル atl/svc-logging/default）
    en: logging has no requires; the start state is L0 plus the instance role plus the fault injection switch (profile atl/svc-logging/default)
targetModules:
  - { id: logging, driver: cloudwatch, fromDriver: file, params: { RetentionInDays: 14 }, wireStep: wire, adoptsExisting: false }
expectedWarnings: []
workstation: { required: true, tools: [aws-cli, node, jq], savingsMode: degraded }
platform:
  consoleLinks: [logs.group]
provision: { class: A }

variables:
  appGroup:
    label:
      zh-CN: 应用日志组
      ja: アプリのロググループ
      en: App log group
    from: derived
    fillFrom: stack.logging.EnvLogCwGroupApp
  nginxGroup:
    label:
      zh-CN: Nginx 日志组
      ja: Nginx のロググループ
      en: Nginx log group
    from: derived
    fillFrom: stack.logging.EnvLogCwGroupNginx

cost:
  currency: USD
  tier: low
  mainDrivers:
    - zh-CN: 日志摄取量（GB）
      ja: ログの取り込み量（GB）
      en: Log ingestion (GB)
    - zh-CN: 日志存储（GB-月）
      ja: ログの保存（GB 月）
      en: Log storage (GB-month)
    - zh-CN: Logs Insights 扫描量
      ja: Logs Insights のスキャン量
      en: Logs Insights data scanned
    - zh-CN: 指标过滤器生成的自定义指标
      ja: メトリクスフィルターが生成するカスタムメトリクス
      en: Custom metrics generated by metric filters
  basis:
    - ref: start-profile
      note:
        zh-CN: 实验机 EC2、EBS（根卷与数据卷）、公网 IPv4
        ja: ラボ用インスタンスの EC2、EBS（ルートボリュームとデータボリューム）、パブリック IPv4
        en: Lab instance EC2, EBS (root and data volumes) and public IPv4
    - ref: workstation
      note:
        zh-CN: 工作台 EC2、EBS、公网 IPv4
        ja: ワークベンチの EC2、EBS、パブリック IPv4
        en: Workbench EC2, EBS and public IPv4
    - key: logs-ingest
      pricingKey: logs.ingestion
      billing: usage
      quantity: 1
      unit: GB
      assumedUsagePerHour: 0.01
      source: target
      whenRetained: true
      note:
        zh-CN: 应用与 Nginx 访问日志；调成 debug 级别会让摄取量上升
        ja: アプリと Nginx のアクセスログ。debug レベルにすると取り込み量が増えます
        en: App and Nginx access logs; switching to debug level raises the ingestion volume
    - key: log-metrics
      pricingKey: cloudwatch.metrics
      billing: monthly
      quantity: 3
      unit: Metrics
      source: target
      whenRetained: true
      note:
        zh-CN: AppErrors、Nginx5xx、AuthLoginFailed 三个自定义指标
        ja: AppErrors、Nginx5xx、AuthLoginFailed の 3 つのカスタムメトリクス
        en: "Three custom metrics: AppErrors, Nginx5xx and AuthLoginFailed"
  assumptions:
    - zh-CN: 学习规模的摄取与 Insights 扫描量通常很小，以官方定价为准；CloudWatch Agent 本身免费
      ja: 学習規模の取り込み量と Insights のスキャン量は通常ごくわずかです。正確な料金は公式の料金表を確認してください。CloudWatch エージェント自体は無料です
      en: Learning-scale ingestion and Insights scans are usually tiny; check the official pricing; the CloudWatch agent itself is free

steps:
  - id: orient
    type: observe
    title:
      zh-CN: 观察本地日志：只在数据卷上、只有这一台
      ja: ローカルのログを観察：データボリューム上にしかなく、この 1 台分だけ
      en: "Observe local logs: only on the data volume, and only for this one instance"
    manual: manual/10-orient.md
    panel: terminal-lab
    estMinutes: 5
    checks: [cap-logging-file, api-log-local]

  - id: baseline
    type: experiment
    title:
      zh-CN: 记录 before：5xx 故障 + 恒定负载，只能查本地
      ja: before を記録：5xx 障害 + 一定の負荷で、ローカルしか検索できない
      en: "Record before: 5xx fault + constant load, with only local search"
    manual: manual/20-baseline.md
    experiment: { module: logging, id: query-compare, label: before }
    requires: { steps: [orient] }
    panel: terminal-workstation
    estMinutes: 6
    checks: [exp-query-before]

  - id: wire
    type: script
    wire: true
    title:
      zh-CN: 接入 CloudWatch Logs（保留 14 天）
      ja: CloudWatch Logs を組み込む（保持期間 14 日）
      en: Wire in CloudWatch Logs (14-day retention)
    manual: manual/30-wire.md
    methods: [script]
    requires: { steps: [baseline] }
    panel: terminal-workstation
    estMinutes: 6
    startsBilling:
      class: usage
      pricingKeys: [logs.ingestion, cloudwatch.metrics]
      note:
        zh-CN: 按摄取量、存储量与扫描量计费
        ja: 取り込み量、保存量、スキャン量に応じた課金
        en: Billed by ingestion, storage and data scanned
    wait:
      typicalMinutes: 3
      maxMinutes: 10
      text:
        zh-CN: 部署日志组与指标过滤器、附加策略、重启 api 与 worker
        ja: ロググループとメトリクスフィルターをデプロイし、ポリシーをアタッチし、api と worker を再起動します
        en: Deploy the log groups and metric filters, attach the policy, restart the api and worker
    checks: [cap-logging-cloudwatch, module-state-logging, log-traffic, nginx-stream-shipped, log-groups-retention, metric-filters]

  - id: ingest
    type: experiment
    title:
      zh-CN: 记录 after：摄取延迟
      ja: after を記録：取り込みの遅延
      en: "Record after: ingestion latency"
    manual: manual/40-ingest.md
    experiment: { module: logging, id: ingest-lag, label: after }
    requires: { steps: [wire] }
    panel: terminal-workstation
    estMinutes: 5
    checks: [exp-ingest-after]

  - id: insights
    type: console
    title:
      zh-CN: Logs Insights 与指标过滤器
      ja: Logs Insights とメトリクスフィルター
      en: Logs Insights and metric filters
    manual: manual/50-insights.md
    methods: [console]
    requires: { steps: [wire] }
    panel: console
    estMinutes: 8
    wait:
      typicalMinutes: 5
      maxMinutes: 10
      text:
        zh-CN: 指标过滤器生成的指标要等几分钟才出现在指标列表中
        ja: メトリクスフィルターが生成するメトリクスがメトリクス一覧に現れるまで数分かかります
        en: Metrics generated by metric filters take a few minutes to appear in the metrics list
    checks: [metric-nginx5xx, insights-read]

  - id: after
    type: experiment
    title:
      zh-CN: 记录 after：同一查询在两侧并排执行
      ja: after を記録：同じクエリを両側で並べて実行
      en: "Record after: the same queries run side by side on both sides"
    manual: manual/60-after.md
    experiment: { module: logging, id: query-compare, label: after }
    requires: { steps: [wire] }
    panel: terminal-workstation
    estMinutes: 6
    checks: [exp-query-pair]

  - id: agent
    type: script
    title:
      zh-CN: （选做）改用 CloudWatch Agent 采集
      ja: （任意）CloudWatch エージェントでの収集に切り替える
      en: (Optional) Switch to collection with the CloudWatch agent
    manual: manual/70-agent.md
    methods: [script]
    optional:
      reason:
        zh-CN: 学习 CloudWatch Agent；sdk 方式已经完成对比
        ja: CloudWatch エージェントを学ぶためのものです。比較は sdk 方式ですでに完了しています
        en: For learning the CloudWatch agent; the comparison is already done with the sdk method
    requires: { steps: [after] }
    panel: terminal-workstation
    estMinutes: 8
    checks: [agent-running, { ref: cap-logging-cloudwatch, as: cap-logging-agent, required: false }]

finalChecks:
  - no-world-ssh
  - { ref: cap-logging-cloudwatch, as: final-cap-logging }
  - { ref: log-groups-retention, as: final-log-groups-retention }

experiments:
  - module: logging
    id: query-compare
    labels:
      - { id: before, role: baseline, requires: { logging: file } }
      - { id: after, role: treatment, requires: { logging: cloudwatch } }
    pairs: [[before, after]]
    requiredLabels: [before, after]
    required: true
    runner: workstation
    allowSimulatedBaseline: false
  - module: logging
    id: ingest-lag
    labels:
      - { id: after, role: single, requires: { logging: cloudwatch } }
    required: true
    runner: workstation

quiz: { file: quiz.yaml, draw: 3 }
badge:
  title:
    zh-CN: 日志不随实例消失
    ja: インスタンスとともに消えないログ
    en: Logs that outlive the instance
  icon: assets/badge.svg
tracks: [operations, saa-main]

cleanup:
  summary:
    zh-CN: 结束后平台删除 logging 栈；两个日志组是 DeletionPolicy Retain，回收器按 RETAINED 来源删除。CloudWatch Agent 片段随 hostSetup revert 移除，实验机随会话删除。
    ja: 終了後、プラットフォームが logging スタックを削除します。2 つのロググループは DeletionPolicy Retain なので、回収処理が RETAINED のソースとして削除します。CloudWatch エージェントの設定断片は hostSetup の revert で取り除かれ、ラボ用インスタンスはセッションとともに削除されます。
    en: After the lab ends, the platform deletes the logging stack; the two log groups have DeletionPolicy Retain, so the reclaimer deletes them as RETAINED sources. The CloudWatch agent snippet is removed by the hostSetup revert, and the lab instance is deleted with the session.
  autoReclaim: true
  dataRisk:
    - zh-CN: 日志组中的日志随回收删除；报告中只保留查询的统计与证据摘要
      ja: ロググループのログは回収時に削除されます。レポートにはクエリの統計と証拠の要約だけが残ります
      en: Logs in the log groups are deleted at reclaim; the report keeps only query statistics and an evidence summary
  learnerCreatedHints:
    - resourceType: 'AWS::Logs::LogGroup'
      how:
        zh-CN: 两个日志组 DeletionPolicy=Retain，回收器按 RETAINED 来源删除（02 §7.1）
        ja: 2 つのロググループは DeletionPolicy=Retain で、回収処理が RETAINED のソースとして削除します（02 §7.1）
        en: Both log groups have DeletionPolicy=Retain, and the reclaimer deletes them as RETAINED sources (02 §7.1)
    - resourceType: 'AWS::KinesisFirehose::DeliveryStream'
      how:
        zh-CN: 如果为了归档自己建过订阅过滤器与 Firehose，结束前自己删除
        ja: アーカイブのために自分でサブスクリプションフィルターや Firehose を作成した場合は、終了前に自分で削除してください
        en: If you created a subscription filter or Firehose for archiving yourself, delete them before the lab ends
  verify: [logging-stack-gone]

saa:
  domains: [resilient, secure, cost]
  topics:
    - id: centralized-logs
      title:
        zh-CN: 集中日志与可替换实例（ASG）
        ja: ログの一元管理と置き換え可能なインスタンス（ASG）
        en: Centralized logs and replaceable instances (ASG)
      domain: resilient
      relatesTo: wire
    - id: agent-vs-sdk
      title:
        zh-CN: EC2 日志需要 CloudWatch Agent 或 SDK；Lambda 日志自动进入
        ja: EC2 のログには CloudWatch エージェントか SDK が必要。Lambda のログは自動で入る
        en: EC2 logs need the CloudWatch agent or an SDK; Lambda logs arrive automatically
      domain: resilient
      relatesTo: agent
    - id: metric-filter
      title:
        zh-CN: 指标过滤器 → 指标 → 告警；不回溯历史日志
        ja: メトリクスフィルター → メトリクス → アラーム。過去のログにはさかのぼらない
        en: Metric filter → metric → alarm; no retroactive matching of past logs
      domain: resilient
      relatesTo: insights
    - id: retention
      title:
        zh-CN: 日志组保留期（默认永不过期）与 KMS 加密
        ja: ロググループの保持期間（デフォルトは失効しない）と KMS 暗号化
        en: Log group retention (never expires by default) and KMS encryption
      domain: cost
      relatesTo: wire
    - id: insights-cost
      title:
        zh-CN: Logs Insights 按扫描量计费；订阅过滤器与导出到 S3
        ja: Logs Insights はスキャン量で課金。サブスクリプションフィルターと S3 へのエクスポート
        en: Logs Insights is billed by data scanned; subscription filters and export to S3
      domain: cost
      relatesTo: after
  confusables:
    - a:
        zh-CN: CloudWatch Logs
        ja: CloudWatch Logs
        en: CloudWatch Logs
      b:
        zh-CN: CloudTrail
        ja: CloudTrail
        en: CloudTrail
      rule:
        zh-CN: 前者是应用与系统的运行日志；后者是 AWS API 调用的审计记录
        ja: 前者はアプリとシステムの稼働ログ、後者は AWS API 呼び出しの監査記録です
        en: The former holds application and system logs; the latter is the audit record of AWS API calls
    - a:
        zh-CN: 订阅过滤器
        ja: サブスクリプションフィルター
        en: Subscription filter
      b:
        zh-CN: CreateExportTask
        ja: CreateExportTask
        en: CreateExportTask
      rule:
        zh-CN: 订阅过滤器近实时投递到 Kinesis / Firehose / Lambda；导出任务是批量、非实时的
        ja: サブスクリプションフィルターは Kinesis / Firehose / Lambda にほぼリアルタイムで配信します。エクスポートタスクはバッチ処理でリアルタイムではありません
        en: Subscription filters deliver to Kinesis / Firehose / Lambda in near real time; export tasks are batch and not real time
    - a:
        zh-CN: 指标过滤器
        ja: メトリクスフィルター
        en: Metric filter
      b:
        zh-CN: Logs Insights
        ja: Logs Insights
        en: Logs Insights
      rule:
        zh-CN: 指标过滤器在摄取时匹配、只对之后的日志生效；Insights 是对已存日志的交互式查询
        ja: メトリクスフィルターは取り込み時に照合し、作成後のログにだけ適用されます。Insights は保存済みのログに対する対話型のクエリです
        en: Metric filters match at ingestion and only apply to later logs; Insights is an interactive query over stored logs

tags: [logging, cloudwatch-logs, logs-insights, metric-filter, observability]

permissions:
  learner:
    - cloudformation:CreateChangeSet
    - cloudformation:DescribeChangeSet
    - cloudformation:ExecuteChangeSet
    - cloudformation:DescribeStacks
    - cloudformation:DescribeStackEvents
    - logs:CreateLogGroup
    - logs:PutRetentionPolicy
    - logs:PutMetricFilter
    - logs:PutQueryDefinition
    - logs:DescribeLogGroups
    - logs:DescribeLogStreams
    - logs:DescribeMetricFilters
    - logs:DescribeQueryDefinitions
    - logs:StartQuery
    - logs:GetQueryResults
    - cloudwatch:ListMetrics
    - cloudwatch:GetMetricData
    - iam:CreatePolicy
    - iam:AttachRolePolicy
    - ssm:SendCommand
    - ssm:GetCommandInvocation
  notes: 日志组、指标过滤器与保存的查询由 logging 栈创建；对比实验的查询经应用的 /api/lab/logs 以实例角色执行，学员身份只在控制台查看 Insights

certificate: { enabled: false }
owners: [cloudalbum-maintainers]
