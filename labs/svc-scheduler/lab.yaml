# labs/svc-scheduler/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-scheduler
kind: service
version: 0.1.0
status: planned
service: Amazon EventBridge Scheduler
function: 不漏跑的定时任务
title: Amazon EventBridge Scheduler：不漏跑的定时任务
summary: 把 worker 里的 node-cron 换成 EventBridge Scheduler + 模块自带的 tick 队列，亲手制造一次“触发时刻 worker 不在线”，看 cron 漏跑、Scheduler 补跑。
difficulty: beginner
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: scheduler, name: Amazon EventBridge Scheduler, role: primary, module: scheduler}
- {id: iam, role: context, module: iam}
modules:
  target: [scheduler]
  start: [iam]
  context: []
  related: [queue]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: svc-iam, kind: soft}
  - {id: svc-queue, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - item: scheduler
    kind: local
    set: {SCHEDULER_COMPARE_HEARTBEAT: 'on'}
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: scheduler, driver: eventbridge}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge: {title: 准时补跑}
tracks: [operations, saa-main, serverless]
saa:
  domains: [resilient, performance]
tags: [scheduler]
certificate: {enabled: false}
