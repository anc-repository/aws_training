# labs/svc-shared-fs/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-shared-fs
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: Amazon EFS
  ja: Amazon EFS
  en: Amazon EFS
function:
  zh-CN: 多实例共享文件系统
  ja: 複数インスタンスで共有するファイルシステム
  en: File system shared by several instances
title:
  zh-CN: Amazon EFS：多实例共享文件系统
  ja: Amazon EFS：複数インスタンスで共有するファイルシステム
  en: "Amazon EFS: a file system shared by several instances"
summary:
  zh-CN: 把上传目录从 EBS 换到 EFS，不改一行业务代码，让第二台实例读到第一台刚写入的照片，并量一量 NFS 的小文件延迟。
  ja: アップロード用ディレクトリを EBS から EFS に切り替えます。業務コードを 1 行も変えずに、1 台目が書き込んだばかりの写真を 2 台目から読めるようにし、NFS での小さなファイルのレイテンシーも測ります。
  en: Move the upload directory from EBS to EFS without changing a line of application code, so a second instance can read the photo the first one just wrote, and measure NFS latency for small files.
difficulty: intermediate
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- id: efs
  name:
    zh-CN: Amazon EFS
    ja: Amazon EFS
    en: Amazon EFS
  role: primary
  module: shared-fs
- {id: iam, role: context, module: iam}
modules:
  target: [shared-fs]
  start: [iam]
  context: []
  related: [storage, autoscaling]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: svc-storage, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: shared-fs, driver: efs}
expectedWarnings: []
cost: {tier: medium}
provision: {class: A}
badge:
  title:
    zh-CN: 共享目录
    ja: 共有ディレクトリ
    en: Shared directory
tracks: [performant, resilient, saa-main]
saa:
  domains: [resilient, performance, cost]
tags: [shared-fs, efs]
certificate: {enabled: false}
