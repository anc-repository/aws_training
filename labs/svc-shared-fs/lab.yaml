# labs/svc-shared-fs/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-shared-fs
kind: service
version: 0.1.0
status: planned
service: Amazon EFS
function: 多实例共享文件系统
title: Amazon EFS：多实例共享文件系统
summary: 把上传目录从 EBS 换到 EFS，不改一行业务代码，让第二台实例读到第一台刚写入的照片，并量一量 NFS 的小文件延迟。
difficulty: intermediate
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: efs, name: Amazon EFS, role: primary, module: shared-fs}
- {id: iam, role: context, module: iam}
modules:
  target: [shared-fs]
  start: [iam]
  context: []
  related: [storage, autoscaling]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: svc-storage, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: shared-fs, driver: efs}
expectedWarnings: []
cost: {tier: medium}
provision: {class: A}
badge: {title: 共享目录}
tracks: [performant, resilient, saa-main]
saa:
  domains: [resilient, performance, cost]
tags: [shared-fs, efs]
certificate: {enabled: false}
