# labs/svc-config/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-config
kind: service
version: 0.1.0
status: planned
service: AWS Systems Manager Parameter Store
function: 运行时配置
title: AWS Systems Manager Parameter Store：运行时配置
summary: 把横幅、维护模式、缓存 TTL、日志级别这些运行时热键从 `runtime.json` 搬到 Parameter Store：不登录服务器就能改，带版本、有审计，写错的值会被拒绝。
difficulty: beginner
estimatedMinutes: 45
timeLimitMinutes: 90
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: ssm-parameter-store, name: AWS Systems Manager Parameter Store, role: primary, module: config}
- {id: iam, role: context, module: iam}
modules:
  target: [config]
  start: [iam]
  context: []
  related: [secrets]
prerequisites:
  cards:
  - {id: svc-iam, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: config, driver: ssm}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge: {title: 远程开关}
tracks: [operations, saa-main, secure]
saa:
  domains: [secure, resilient]
tags: [config, ssm-parameter-store]
certificate: {enabled: false}
