# labs/svc-config/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-config
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: AWS Systems Manager Parameter Store
  ja: AWS Systems Manager Parameter Store
  en: AWS Systems Manager Parameter Store
function:
  zh-CN: 运行时配置
  ja: 実行時設定
  en: Runtime configuration
title:
  zh-CN: AWS Systems Manager Parameter Store：运行时配置
  ja: AWS Systems Manager Parameter Store：実行時設定
  en: "AWS Systems Manager Parameter Store: runtime configuration"
summary:
  zh-CN: 把横幅、维护模式、缓存 TTL、日志级别这些运行时热键从 `runtime.json` 搬到 Parameter Store：不登录服务器就能改，带版本、有审计，写错的值会被拒绝。
  ja: バナー、メンテナンスモード、キャッシュ TTL、ログレベルといった実行時に切り替える設定を `runtime.json` から Parameter Store に移します。サーバーにログインせずに変更でき、バージョンと監査記録が残り、不正な値は拒否されます。
  en: Move runtime switches such as the banner, maintenance mode, cache TTL and log level from `runtime.json` to Parameter Store. You can change them without logging in to the server, every change is versioned and audited, and invalid values are rejected.
difficulty: beginner
estimatedMinutes: 45
timeLimitMinutes: 90
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: ssm-parameter-store, name: { zh-CN: AWS Systems Manager Parameter Store, ja: AWS Systems Manager Parameter Store, en: AWS Systems Manager Parameter Store }, role: primary, module: config}
- {id: iam, role: context, module: iam}
modules:
  target: [config]
  start: [iam]
  context: []
  related: [secrets]
prerequisites:
  cards:
  - {id: svc-iam, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: config, driver: ssm}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge: {title: { zh-CN: 远程开关, ja: リモートスイッチ, en: Remote switch }}
tracks: [operations, saa-main, secure]
saa:
  domains: [secure, resilient]
tags: [config, ssm-parameter-store]
certificate: {enabled: false}
