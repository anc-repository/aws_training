# labs/svc-social-api/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-social-api
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: Amazon API Gateway
  ja: Amazon API Gateway
  en: Amazon API Gateway
function:
  zh-CN: 社交 API 托管入口
  ja: ソーシャル API のマネージドな入口
  en: Managed entry point for the social API
title:
  zh-CN: Amazon API Gateway：社交 API 托管入口
  ja: Amazon API Gateway：ソーシャル API のマネージドな入口
  en: "Amazon API Gateway: a managed entry point for the social API"
summary:
  zh-CN: 在点赞评论接口前加一层 API Gateway HTTP API（代理回源 EC2），把限流、授权与访问日志前移到网关，看 429 和 401 在哪一层发生。
  ja: いいね・コメントの API の前に API Gateway HTTP API（EC2 へのプロキシ）を置き、スロットリング、認可、アクセスログをゲートウェイに移します。429 と 401 がどの層で発生するかを確かめます。
  en: Put an API Gateway HTTP API (proxying to EC2) in front of the like and comment APIs, move throttling, authorization and access logs to the gateway, and see at which layer 429 and 401 happen.
difficulty: beginner
estimatedMinutes: 60
timeLimitMinutes: 90
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- id: apigateway
  name:
    zh-CN: Amazon API Gateway
    ja: Amazon API Gateway
    en: Amazon API Gateway
  role: primary
  module: social-api
- {id: iam, role: context, module: iam}
modules:
  target: [social-api]
  start: [iam]
  context: []
  related: [social-store]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
  - {id: sc-serverless-api, kind: soft}
  - {id: sc-edge-protection, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: social-api, driver: apigw}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge:
  title:
    zh-CN: API 网关
    ja: API ゲートウェイ
    en: API gateway
tracks: [performant, saa-main, serverless]
saa:
  domains: [secure, performance, resilient]
tags: [social-api, apigateway]
certificate: {enabled: false}
