checks:
  # ---- 认识实验机
  - id: instance-shape
    title: 实验机强制 IMDSv2、跳数 1、挂两块卷，实例配置文件只用于平台管理
    type: aws-readonly
    service: ec2
    action: DescribeInstances
    region: app
    params: { InstanceIds: ['{{ target.instanceId }}'] }
    ownership: { resource: 'arn:aws:ec2:{{ session.region }}:{{ session.accountId }}:instance/{{ target.instanceId }}', mode: session-or-start }
    drift: { policy: once }
    assert:
      - { path: '$.Reservations[0].Instances[0].MetadataOptions.HttpTokens', op: eq, value: required, label: IMDSv2 必需 }
      - { path: '$.Reservations[0].Instances[0].MetadataOptions.HttpPutResponseHopLimit', op: eq, value: 1, label: 跳数 }
      - { path: '$.Reservations[0].Instances[0].BlockDeviceMappings', op: len_eq, value: 2, label: 根卷 + 数据卷 }
      - { path: '$.Reservations[0].Instances[0].IamInstanceProfile.Arn', op: endsWith, value: '/CloudAlbumAppRole', label: 实例配置文件 }
    explain: 读取实验机的元数据选项、挂载的卷与实例配置文件；实验机由平台在会话开始时创建（session-or-start）。
    reproduce: { run: 'aws ec2 describe-instances --instance-ids {{ target.instanceId }} --query "Reservations[0].Instances[0].{Metadata:MetadataOptions,Volumes:BlockDeviceMappings[].DeviceName,Profile:IamInstanceProfile.Arn}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [EC2, 实例, '{{ target.instanceId }}', 安全], region: app }
      observed:
        question: 实例元数据服务的“IMDSv2”一项显示什么？
        options:
          - { value: required, label: 必需, expected: true }
          - { value: optional, label: 可选, fixHint: 实验机被改过；在“操作 → 实例设置 → 修改实例元数据选项”中改回“必需” }

  - id: data-volume-shape
    title: 数据卷已加密、带 Backup=true 标签，且不随实例终止而删除
    type: aws-readonly
    service: ec2
    action: DescribeVolumes
    region: app
    params:
      Filters:
        - { Name: attachment.instance-id, Values: ['{{ target.instanceId }}'] }
    dependsOn: [instance-shape]
    drift: { policy: once }
    assert:
      - { path: $.Volumes, op: len_eq, value: 2, label: 挂载的卷数 }
      - path: $.Volumes
        op: every
        label: 两块卷都已加密
        value:
          - { path: $.Encrypted, op: eq, value: true }
      - path: $.Volumes
        op: some
        label: 数据卷带 Backup=true 且 DeleteOnTermination=false
        value:
          - path: $.Tags
            op: some
            value:
              - { path: $.Key, op: eq, value: Backup }
              - { path: $.Value, op: eq, value: 'true' }
          - path: $.Attachments
            op: some
            value:
              - { path: $.DeleteOnTermination, op: eq, value: false }
    explain: 根卷随实例终止删除；数据卷是独立的 EBS 卷，生命周期与实例无关，可以卸下改挂到新实例、单独快照与扩容。
    reproduce: { run: 'aws ec2 describe-volumes --filters Name=attachment.instance-id,Values={{ target.instanceId }} --query "Volumes[].{Id:VolumeId,Size:Size,Encrypted:Encrypted,DeleteOnTermination:Attachments[0].DeleteOnTermination,Tags:Tags}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [EC2, 实例, '{{ target.instanceId }}', 存储], region: app }
      observed:
        question: 两块卷中，哪一块的“终止时删除”为“否”？
        options:
          - { value: data, label: 数据卷（较晚挂载的那块）, expected: true }
          - { value: root, label: 根卷, fixHint: 根卷默认随实例终止删除；再看一次两块卷的设备名 }

  - id: mgmt-role-understood
    title: 说出实验机上的 CloudAlbumAppRole 是给谁用的
    type: manual
    spec:
      observed:
        question: 实验机的实例配置文件 CloudAlbumAppRole 目前只有 AmazonSSMManagedInstanceCore。它是给谁用的？
        options:
          - { value: platform, label: 给平台的管理通道（SSM Agent），应用并不使用它, expected: true }
          - { value: app, label: 给 CloudAlbum 应用调用 AWS API, fixHint: 应用的 IAM_CREDENTIALS=none，从不读取实例角色；svc-iam 才会让应用用上它 }

  # ---- 用一遍相册
  - id: entry-direct
    title: 从公网访问弹性 IP，入口链只有 nginx
    type: http-header
    from: platform
    target: public-ip
    path: /api/health/ready
    method: GET
    drift: { policy: must-hold }
    assert:
      - { path: $.status, op: eq, value: 200, label: 状态码 }
      - { path: $.pathSegments.entry, op: eq, value: nginx, label: 入口链 }
    explain: 平台从公网请求实验机弹性 IP 上的就绪检查，确认 Nginx 直接把请求交给 api。
    reproduce: { run: 'curl -sk -o /dev/null -D - "https://{{ target.publicIp }}/api/health/ready" | grep -i "^x-cloudalbum-path:"', runsOn: workstation }

  - id: cap-ec2-healthy
    title: ec2 模块正常
    type: capability
    module: ec2
    drift: { policy: must-hold }
    assert:
      - { path: $.driver, op: eq, value: single, label: 驱动 }
      - { path: $, op: healthy, label: 状态正常（本卡 expectedWarnings 为空，即必须是 ok） }
    explain: 感知器只读本机（IMDSv2、挂载、磁盘、内存、定时器等），不调用任何 AWS API。

  - id: cap-iam-none
    title: 应用没有使用任何 AWS 凭证
    type: capability
    module: iam
    drift: { policy: must-hold }
    assert:
      - { path: $.driver, op: eq, value: none, label: 驱动 }
      - { path: $.status, op: eq, value: 'off', label: 模块状态 }
    explain: 实例挂着平台管理角色，但应用的 IAM_CREDENTIALS=none，从不读取它。

  # ---- 主机巡检
  - id: data-volume-mounted
    title: 数据目录是独立的数据卷，/etc/cloudalbum 指向数据卷
    type: capability
    module: ec2
    view: admin
    drift: { policy: must-hold }
    assert:
      - path: $.checks
        where: { id: data-volume, status: ok }
        op: len_eq
        value: 1
        label: data-volume 检查项
    explain: 感知器核对 /var/lib/cloudalbum 是独立挂载点（设备不同于根卷）、可读写，且 /etc/cloudalbum 指向数据卷上的 etc。

  - id: secrets-file-mode
    title: 机密文件在数据卷上，权限 0640、属主 root
    type: local
    on: lab
    checkId: file-stat
    args: { path: /etc/cloudalbum/secrets.env }
    drift: { policy: must-hold }
    assert:
      - { path: $.exists, op: eq, value: true, label: 文件存在 }
      - { path: $.mode, op: eq, value: '0640', label: 权限 }
      - { path: $.owner, op: eq, value: 0, label: 属主 UID（root） }
    explain: 检查只读取元数据，从不读取文件内容。机密在数据卷上，换实例不会重新生成密钥。

  - id: api-loopback-only
    title: api 进程只监听本机回环地址
    type: local
    on: lab
    checkId: port-listen
    args: { port: 3000 }
    drift: { policy: must-hold }
    assert:
      - { path: $.listening, op: eq, value: true, label: 正在监听 }
      - path: $.addresses
        op: every
        label: 只监听 127.0.0.1
        value:
          - { path: $, op: startsWith, value: '127.0.0.1:' }
    explain: 外部流量只能经 Nginx 进入；即使安全组放开了 3000，也连不到 api。

  # ---- IMDSv2
  - id: imdsv2-enforced
    title: 不带令牌访问 IMDS 返回 401
    type: local
    on: lab
    checkId: imds-get
    args: { path: instance-id, checkV1Rejected: true }
    drift: { policy: must-hold }
    assert:
      - { path: $.status, op: eq, value: 200, label: 带令牌的状态码 }
      - { path: $.v1Status, op: eq, value: 401, label: 不带令牌的状态码 }
    explain: IMDSv2 先要用 PUT 取会话令牌；只能让服务器发 GET 的 SSRF 拿不到令牌。

  # ---- 单点故障
  - id: spof-observed
    title: 说出停机期间网站的状态
    type: manual
    spec:
      observed:
        question: 实例停止期间，从工作台访问 /api/health/live 得到什么结果？
        options:
          - { value: down, label: 连接超时或被拒绝（全站不可用）, expected: true }
          - { value: up, label: 仍然返回 200, fixHint: 确认实例状态确实变成了“已停止”，并且请求的是弹性 IP }

  - id: stop-start-events
    title: CloudTrail 记录了对实验机的停止与启动
    type: aws-readonly
    service: cloudtrail
    action: LookupEvents
    region: app
    params:
      LookupAttributes:
        - { AttributeKey: ResourceName, AttributeValue: '{{ target.instanceId }}' }
      MaxResults: 50
    wait: { typicalMinutes: 10, maxMinutes: 20 }
    pendingIf:
      - path: $.Events
        where: { EventName: StartInstances }
        op: len_eq
        value: 0
    drift: { policy: once }
    assert:
      - path: $.Events
        where: { EventName: StopInstances }
        op: len_gte
        value: 1
        label: StopInstances 事件
      - path: $.Events
        where: { EventName: StartInstances }
        op: len_gte
        value: 1
        label: StartInstances 事件
    explain: 事件按资源名（实验机的实例 ID）查找；实验机在本会话开始时创建，这些事件只可能来自本会话。CloudTrail 事件历史有几分钟到十几分钟的延迟。
    reproduce: { run: 'aws cloudtrail lookup-events --lookup-attributes AttributeKey=ResourceName,AttributeValue={{ target.instanceId }} --max-results 20 --query "Events[].[EventTime,EventName,Username]" --output table', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudTrail, 事件历史], region: app }
      observed:
        question: 按“资源名称 = {{ target.instanceId }}”筛选，能看到 StopInstances 与 StartInstances 吗？
        options:
          - { value: both, label: 两个都能看到, expected: true }
          - { value: none, label: 还看不到, fixHint: 事件历史有延迟，几分钟后再查 }

  - id: eip-unchanged
    title: 停止再启动后，实验机仍关联同一个弹性 IP
    type: aws-readonly
    service: ec2
    action: DescribeAddresses
    region: app
    params:
      Filters:
        - { Name: public-ip, Values: ['{{ target.publicIp }}'] }
    dependsOn: [stop-start-events]
    drift: { policy: must-hold }
    assert:
      - path: $.Addresses
        where: { InstanceId: '{{ target.instanceId }}' }
        op: len_eq
        value: 1
        label: EIP 关联在实验机上
    explain: 没有 EIP 时，停止再启动后自动分配的公网 IPv4 通常会改变；EIP 让地址保持不变（它同样按小时计费）。
    reproduce: { run: 'aws ec2 describe-addresses --filters Name=public-ip,Values={{ target.publicIp }} --query "Addresses[].[PublicIp,InstanceId]"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [EC2, 弹性 IP], region: app }
      observed:
        question: 弹性 IP {{ target.publicIp }} 关联的实例 ID 是否就是实验机？
        options:
          - { value: 'yes', label: 是, expected: true }
          - { value: 'no', label: 否或未关联, fixHint: 实例可能还没启动完成 }
