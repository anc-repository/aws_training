# labs/_tracks/operations.yaml —— 运维与可观测（tracks-and-catalog §4.5）
schema: atl.track/v2
id: operations
version: 1.0.0
title: 运维与可观测
summary: 把 Systems Manager、CloudWatch、X-Ray、CloudTrail、Image Builder、Backup 串成“日常运维”视角，费用为低或中。
audience: 负责日常运维、想系统掌握运维登录、日志指标追踪与审计的学员
stages:
  - id: s1-observe
    title: 登录、日志、指标与追踪
    items:
      - { card: svc-shell-access, role: required }
      - { card: svc-logging, role: required }
      - { card: svc-monitoring, role: required }
      - { card: svc-tracing, role: required }
      - { card: sc-observability, role: required }
  - id: s2-govern
    title: 配置与审计
    items:
      - { card: svc-config, role: required }
      - { card: svc-audit, role: required }
      - { card: svc-scheduler, role: optional }
      - { card: svc-compliance, role: optional }
      - { card: sc-threat-compliance, role: optional }
  - id: s3-resilience
    title: 运维弹性
    items:
      - { group: g-ops, title: 运维弹性, pick: 1, cards: [svc-backup, svc-ami] }
completion: { allowManual: true, minAutoRatio: 0.8, excludeSelfReported: true }
certificate: { enabled: true, title: 运维与可观测路径证书 }
