# labs/_tracks/cost-optimized.yaml —— 成本优化专项（tracks-and-catalog §4.3）
schema: atl.track/v2
id: cost-optimized
version: 1.0.0
title: 成本优化专项
summary: 补强“设计成本优化的架构”：费用护栏、计费方式、存储类别、网络与数据传输费用，最后在结业卡中亲手省钱。
audience: 想补强 SAA“设计成本优化的架构”领域的学员
domain: cost
stages:
  - id: s1-billing
    title: 护栏与计费方式
    note: 平台动作 cost-activate-tags 需在 svc-cost 前一到两天执行
    items:
      - { card: svc-cost, role: required }
      - { card: svc-ec2, role: required, note: Graviton、突发积分、公网 IPv4 计费 }
      - { card: svc-storage, role: required, note: 存储类别与生命周期 }
      - { card: svc-image-processing, role: required, note: 按调用计费 vs 常开实例 }
      - { card: svc-social-store, role: required, note: 按需容量 }
  - id: s2-transfer
    title: 网络与数据费用
    items:
      - { group: g-network-cost, title: 网络费用, pick: 1, cards: [svc-network, sc-private-network] }
      - { group: g-data-cost, title: 数据费用, pick: 1, cards: [svc-cdn, svc-analytics, sc-analytics] }
      - { card: svc-autoscaling, role: optional, note: 混合实例策略，费用高 }
      - { card: svc-db-proxy, role: optional }
  - id: s3-capstone
    title: 结业
    items:
      - { card: sc-cost-optimization, role: required, note: Graviton 与 Spot 在本卡亲手做 }
completion: { allowManual: true, minAutoRatio: 0.8, excludeSelfReported: true }
certificate: { enabled: true, title: 成本优化专项证书 }
