# labs/_tracks/saa-main.yaml —— SAA 主线（atl.track/v2，tracks-and-catalog §4.2；legacyLab 取自 05 §5.1）
schema: atl.track/v2
id: saa-main
version: 1.0.0
title: SAA 主线
summary: 按原 Lab 0～25 的顺序系统学习：从一台 EC2 出发，逐个服务亲手对比“有”与“没有”，最后做成本复盘。
audience: 备考 SAA-C03、希望系统学完全部服务的学员
stages:
  - id: s1-base
    title: 基线与运维
    legacyLabs: [0, 1, 2, 3]
    note: 开始本路径前（或至少在 svc-cost 前一到两天）执行平台动作 cost-activate-tags
    items:
      - { card: svc-ec2, role: required, legacyLab: 0 }
      - { card: svc-iam, role: required, legacyLab: 1 }
      - { card: svc-cost, role: required, legacyLab: 1 }
      - { card: svc-shell-access, role: required, legacyLab: 2 }
      - { card: svc-logging, role: required, legacyLab: 3 }
      - { card: svc-monitoring, role: required, legacyLab: 3 }
  - id: s2-edge
    title: 存储与边缘
    legacyLabs: [4, 5, 6, 7]
    items:
      - { card: svc-storage, role: required, legacyLab: 4 }
      - { card: svc-cdn, role: required, legacyLab: 5 }
      - { card: svc-dns, role: optional, legacyLab: 6, note: 需要域名 }
      - { card: svc-tls, role: optional, legacyLab: 6, note: 需要域名 }
      - { card: svc-waf, role: required, legacyLab: 7 }
      - { group: s2-scenario, title: 阶段综合, pick: 1, cards: [sc-edge-protection, sc-static-acceleration] }
  - id: s3-identity
    title: 身份与消息
    legacyLabs: [8, 9]
    items:
      - { card: svc-auth, role: required, legacyLab: 8 }
      - { card: svc-identity-pool, role: required, legacyLab: 8 }
      - { card: svc-notification, role: required, legacyLab: 9 }
      - { card: svc-email, role: required, legacyLab: 9 }
      - { group: s3-scenario, title: 阶段综合, pick: 1, cards: [sc-user-identity, sc-event-fanout] }
  - id: s4-async
    title: 异步与事件
    legacyLabs: [10, 11, 12]
    items:
      - { card: svc-queue, role: required, legacyLab: 10 }
      - { card: svc-image-processing, role: required, legacyLab: 11 }
      - { card: svc-tagging, role: required, legacyLab: 11 }
      - { card: svc-workflow, role: optional, legacyLab: 11, note: 原 Lab 11 的扩展 }
      - { card: svc-scheduler, role: required, legacyLab: 12 }
      - { group: s4-scenario, title: 阶段综合, pick: 1, cards: [sc-decoupling, sc-image-pipeline] }
  - id: s5-protect
    title: 数据保护
    legacyLabs: [13]
    items:
      - { card: svc-kms, role: required, legacyLab: 13 }
      - { card: svc-secrets, role: required, legacyLab: 13 }
      - { card: svc-config, role: required, legacyLab: 13 }
  - id: s6-network-data
    title: 网络与数据
    legacyLabs: [14, 15, 16, 18]
    note: 含按小时计费的资源，建议一张卡片做完立即结束，不要保留环境过夜
    items:
      - { card: svc-network, role: required, legacyLab: 14 }
      - { card: svc-database, role: required, legacyLab: 15 }
      - { card: svc-db-proxy, role: optional, legacyLab: 15, note: 原 Lab 15 的扩展 }
      - { card: svc-cache, role: required, legacyLab: 16 }
      - { card: svc-analytics, role: required, legacyLab: 18 }
      - { group: s6-scenario, title: 阶段综合, pick: 1, cards: [sc-db-performance, sc-analytics] }
  - id: s7-serverless
    title: Serverless
    legacyLabs: [17]
    items:
      - { card: svc-social-store, role: required, legacyLab: 17 }
      - { card: svc-social-api, role: required, legacyLab: 17 }
      - { card: sc-serverless-api, role: required, legacyLab: 17 }
  - id: s8-ha
    title: 高可用与私有化
    legacyLabs: [19, 20, 21]
    note: 含按小时计费的资源，建议一张卡片做完立即结束
    items:
      - { card: svc-load-balancer, role: required, legacyLab: 19 }
      - { card: sc-private-network, role: required, legacyLab: 20 }
      - { card: svc-autoscaling, role: required, legacyLab: 21 }
      - { card: sc-ha-web, role: optional, legacyLab: 21, note: 推荐；与 svc-autoscaling 重叠、费用高，但最接近考试的高可用题 }
      - { card: svc-shared-fs, role: optional, legacyLab: 21, note: 原 Lab 21 的 EFS 变体 }
      - { card: svc-ami, role: optional, legacyLab: 21, note: 原 Lab 21 的扩展 }
  - id: s9-ops
    title: 可观测、审计与恢复
    legacyLabs: [22, 23, 24, 25]
    items:
      - { card: svc-tracing, role: required, legacyLab: 22 }
      - { card: svc-audit, role: required, legacyLab: 23 }
      - { card: svc-threat-detection, role: required, legacyLab: 23 }
      - { card: svc-backup, role: required, legacyLab: 24 }
      - { card: svc-compliance, role: optional, legacyLab: 25, note: 原 Lab 25 本就可选 }
      - { card: svc-vuln-scan, role: optional, legacyLab: 25, note: 原 Lab 25 本就可选 }
      - { group: s9-scenario, title: 阶段综合, pick: 1, cards: [sc-observability, sc-security-baseline, sc-threat-compliance, sc-backup-dr] }
  - id: s10-capstone
    title: 结业
    items:
      - { card: sc-cost-optimization, role: required, note: 利用此前各次实验在账号中留下的账单数据做跨会话复盘 }
completion: { allowManual: true, minAutoRatio: 0.7, excludeSelfReported: true }
certificate: { enabled: true, title: SAA 主线结业证书 }
