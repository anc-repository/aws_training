quiz: { file: quiz.yaml, draw: 3 }
badge: { title: { zh-CN: 直传 S3, ja: S3 への直接アップロード, en: Direct to S3 }, icon: assets/badge.svg }
tracks: [saa-main, secure]

cleanup:
  summary:
    zh-CN: 结束实验后，平台删除本次会话的 identity-pool 栈（身份池、Uploader 角色、暂存桶），以及起始状态的 storage、auth 栈；暂存桶先清空、中止未完成的分片上传再删除。
    ja: ラボを終了すると、プラットフォームがこのセッションの identity-pool スタック（Identity Pool、Uploader ロール、ステージングバケット）と、開始状態の storage、auth のスタックを削除します。ステージングバケットは中身を空にし、未完了のマルチパートアップロードを中止してから削除します。
    en: When you end the lab, the platform deletes this session's identity-pool stack (identity pool, Uploader role, staging bucket) and the start state's storage and auth stacks; the staging bucket is emptied and unfinished multipart uploads are aborted before it is deleted.
  autoReclaim: true
  dataRisk:
    - zh-CN: 暂存桶里未完成导入的对象随回收删除（本来 1 天后也会过期）；已导入原图桶的照片随 storage 的桶一起回收
      ja: ステージングバケットにある取り込み前のオブジェクトは回収時に削除されます（もともと 1 日で期限切れになります）。元画像バケットに取り込んだ写真は storage のバケットとともに回収されます
      en: Objects in the staging bucket that were never imported are deleted on reclaim (they would expire after 1 day anyway); photos imported into the original-image bucket are reclaimed with storage's bucket
    - zh-CN: 浏览器拿到的临时凭证在约一小时内过期；角色删除后立即失效
      ja: ブラウザーが受け取った一時的な認証情報は約 1 時間で期限切れになり、ロールを削除した時点ですぐに無効になります
      en: The temporary credentials the browser received expire within about an hour and stop working as soon as the role is deleted
  learnerCreatedHints: []
  verify:
    - identity-pool-gone

saa:
  domains: [secure, performance]
  topics:
    - id: pools
      title:
        zh-CN: User Pool 与 Identity Pool 的分工；Web 身份联合
        ja: User Pool と Identity Pool の役割分担。ウェブ ID フェデレーション
        en: How the User Pool and Identity Pool divide the work; web identity federation
      domain: secure
      relatesTo: enable
    - id: policy-variable
      title:
        zh-CN: 'IAM 策略变量 ${cognito-identity.amazonaws.com:sub}'
        ja: IAM ポリシー変数 ${cognito-identity.amazonaws.com:sub}
        en: The IAM policy variable ${cognito-identity.amazonaws.com:sub}
      domain: secure
      relatesTo: read-policy
    - id: trust-conditions
      title:
        zh-CN: 信任策略中的 aud、amr 条件；访客（未认证）身份的风险
        ja: 信頼ポリシーの aud、amr の条件。ゲスト（未認証）ID のリスク
        en: aud and amr conditions in the trust policy; the risk of guest (unauthenticated) identities
      domain: secure
      relatesTo: read-policy
    - id: direct-upload
      title:
        zh-CN: 预签名 URL、应用自签令牌与临时凭证的取舍
        ja: 署名付き URL、アプリが署名するトークン、一時的な認証情報のトレードオフ
        en: Trade-offs between presigned URLs, app-signed tokens and temporary credentials
      domain: performance
      relatesTo: after-bench
    - id: multipart
      title:
        zh-CN: S3 分片上传、CORS 暴露 ETag、生命周期规则清理未完成的分片
        ja: S3 のマルチパートアップロード、CORS での ETag の公開、ライフサイクルルールによる未完了のパートの削除
        en: S3 multipart upload, exposing ETag in CORS, cleaning up unfinished parts with lifecycle rules
      domain: performance
      relatesTo: resume
    - id: sse-kms
      title:
        zh-CN: SSE-KMS 下分片上传还需要 kms:Decrypt
        ja: SSE-KMS ではマルチパートアップロードに kms:Decrypt も必要
        en: With SSE-KMS, multipart uploads also need kms:Decrypt
      domain: secure
      relatesTo: read-policy
  confusables:
    - a:
        zh-CN: Cognito User Pool
        ja: Cognito User Pool
        en: Cognito User Pool
      b:
        zh-CN: Cognito Identity Pool
        ja: Cognito Identity Pool
        en: Cognito Identity Pool
      rule:
        zh-CN: User Pool 负责认证（你是谁，签发 JWT）；Identity Pool 把已认证身份换成 AWS 临时凭证（能做什么由 IAM 角色决定）
        ja: User Pool は認証（あなたは誰か、JWT を発行）を担当し、Identity Pool は認証済みの ID を AWS の一時的な認証情報に交換します（何ができるかは IAM ロールが決めます）
        en: The User Pool handles authentication (who you are; it issues JWTs); the Identity Pool exchanges an authenticated identity for temporary AWS credentials (what you can do is decided by the IAM role)
    - a:
        zh-CN: 预签名 URL
        ja: 署名付き URL
        en: Presigned URL
      b:
        zh-CN: STS 临时凭证
        ja: STS の一時的な認証情報
        en: STS temporary credentials
      rule:
        zh-CN: 预签名 URL 是一次请求的授权（后端逐个签发）；临时凭证在有效期内可以发任意多次请求，范围由角色策略限定
        ja: 署名付き URL は 1 回のリクエストに対する認可です（バックエンドが 1 つずつ発行）。一時的な認証情報は有効期間内なら何回でもリクエストでき、範囲はロールのポリシーで制限されます
        en: A presigned URL authorizes one request (the backend issues them one by one); temporary credentials allow any number of requests while valid, limited by the role's policy
    - a:
        zh-CN: User Pool 的 sub
        ja: User Pool の sub
        en: The User Pool sub
      b:
        zh-CN: '${cognito-identity.amazonaws.com:sub}'
        ja: ${cognito-identity.amazonaws.com:sub}
        en: ${cognito-identity.amazonaws.com:sub}
      rule:
        zh-CN: 前者是用户池里的用户 ID；策略变量是 Identity Pool 的 Identity ID（形如 ap-northeast-1:uuid），前缀必须用它
        ja: 前者はユーザープール内のユーザー ID です。ポリシー変数のほうは Identity Pool の Identity ID（ap-northeast-1:uuid の形式）で、プレフィックスにはこちらを使う必要があります
        en: The former is the user's ID in the user pool; the policy variable is the Identity Pool's Identity ID (like ap-northeast-1:uuid), and the prefix must use it

tags: [identity-pool, cognito-identity-pool, sts, s3-multipart, iam-policy-variables]

