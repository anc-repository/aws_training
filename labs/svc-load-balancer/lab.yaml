# labs/svc-load-balancer/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-load-balancer
kind: service
version: 0.1.0
status: planned
service: Elastic Load Balancing
function: 负载均衡（ALB）
title: Elastic Load Balancing：负载均衡（ALB）
summary: 在实例前放一个跨 AZ 的 ALB：看健康检查、失效开放，以及“只有一个目标时 ALB 并不带来高可用”。
difficulty: intermediate
estimatedMinutes: 60
timeLimitMinutes: 90
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: elb, name: Elastic Load Balancing, role: primary, module: load-balancer}
- {id: iam, role: context, module: iam}
modules:
  target: [load-balancer]
  start: [iam]
  context: []
  related: [autoscaling, network]
prerequisites:
  cards:
  - {id: svc-ec2, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: load-balancer, driver: alb}
expectedWarnings: [SEC-002, DEP-011]
cost: {tier: medium}
provision: {class: A}
badge: {title: 负载均衡}
tracks: [networking, resilient, saa-main]
saa:
  domains: [resilient, performance]
tags: [load-balancer, elb]
certificate: {enabled: false}
