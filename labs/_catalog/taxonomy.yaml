  # D 计算、异步与通知
  - id: lambda
    abbr: λ
    name: { zh-CN: AWS Lambda, ja: AWS Lambda, en: AWS Lambda }
    short: { zh-CN: Lambda, ja: Lambda, en: Lambda }
