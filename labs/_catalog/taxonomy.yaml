provisionClasses:
  - id: A
    label: { zh-CN: 环境准备较快, ja: 環境準備が速い, en: Fast setup }
    hint: { zh-CN: 只有 L0 与快速创建的模块（IAM、S3、SQS 等）, ja: L0 と、すぐに作成できるモジュール（IAM、S3、SQS など）だけ, en: "Only L0 and quick-to-create modules (IAM, S3, SQS, and so on)" }
  - id: B
    label: { zh-CN: 环境准备中等, ja: 環境準備は普通, en: Moderate setup }
    hint: { zh-CN: 含 CloudFront 分配、ALB、Cognito 用户池或实例替换中的一两项, ja: CloudFront ディストリビューション、ALB、Cognito ユーザープール、インスタンスの置き換えのうち 1～2 項目を含む, en: "Includes one or two of a CloudFront distribution, an ALB, a Cognito user pool, or an instance replacement" }
  - id: C
    label: { zh-CN: 环境准备较慢, ja: 環境準備が遅め, en: Slow setup }
    hint: { zh-CN: 含 RDS 或 ElastiCache 之一, ja: RDS または ElastiCache のどちらかを含む, en: Includes RDS or ElastiCache }
  - id: D
    label: { zh-CN: 环境准备很慢, ja: 環境準備がかなり遅い, en: Very slow setup }
    hint: { zh-CN: RDS / ElastiCache 再叠加 ALB、另一个数据库或实例替换, ja: RDS / ElastiCache に加えて、ALB、別のデータベース、またはインスタンスの置き換えを含む, en: "RDS / ElastiCache plus an ALB, another database, or an instance replacement" }

