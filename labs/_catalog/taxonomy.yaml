domains:
  - id: secure
    label: { zh-CN: 设计安全的架构, ja: セキュアなアーキテクチャの設計, en: Design Secure Architectures }
    weight: 30
    track: secure
  - id: resilient
    label: { zh-CN: 设计弹性的架构, ja: 回復性の高いアーキテクチャの設計, en: Design Resilient Architectures }
    weight: 26
    track: resilient
  - id: performance
    label: { zh-CN: 设计高性能的架构, ja: 高パフォーマンスなアーキテクチャの設計, en: Design High-Performing Architectures }
    weight: 24
    track: performant
  - id: cost
    label: { zh-CN: 设计成本优化的架构, ja: コストを最適化したアーキテクチャの設計, en: Design Cost-Optimized Architectures }
    weight: 20
    track: cost-optimized

durationBuckets:
  - id: short
    label: { zh-CN: 1 小时以内, ja: 1 時間以内, en: Up to 1 hour }
    maxMinutes: 60
  - id: medium
    label: { zh-CN: 1～2 小时, ja: 1～2 時間, en: 1–2 hours }
    maxMinutes: 120
  - id: long
    label: { zh-CN: 2 小时以上, ja: 2 時間以上, en: Over 2 hours }

# 05 §3.3：只看计费结构，不看单价。weights 的键是 pricingKey 前缀（最长匹配），缺省权重 1；按月折算的小额固定项取 0。
costTier:
  highUnits: 2
  weights:
    kms.: 0
    secretsmanager.: 0
    route53.: 0
    waf.: 0
    dynamodb.provisioned: 0
    cognito.: 0
  accountScopedKeys: [guardduty., config., inspector.]
  labels:
    low: { zh-CN: $ 低, ja: "$ 低", en: "$ Low" }
    medium: { zh-CN: $$ 中, ja: "$$ 中", en: "$$ Medium" }
    high: { zh-CN: $$$ 高, ja: "$$$ 高", en: "$$$ High" }

# 05 §3.4、02 §11.1：起始状态中模块栈的部署速度（卡内创建的慢资源不影响部署等级）
provisionSpeed:
  ec2: base
  iam: fast
  storage: fast
  secrets: fast
  config: fast
  kms: fast
  queue: fast
  social-store: fast
  notification: fast
  email: fast
  scheduler: fast
  tagging: fast
  logging: fast
  monitoring: fast
  tracing: fast
  audit: fast
