# labs/_catalog/taxonomy.yaml —— 卡片目录的分类法（手写；05 §8.2 是权威，本文件是它的数据形态）
#
# - services：40 个服务格（有 module，顺序即服务地图与卡片网格中的顺序）+ 附属服务（featureOf 或独立）。
#   id 不直接用 IAM 前缀（shell-access 与 config 都是 ssm），iamPrefix 单独保存，供权限边界与回收器对照。
# - consoleHome 只写 03 §5.4 深链接注册表中已登记、且不需要参数的 linkId（05 §8.7 C-14）。
# - costTier / provisionSpeed / provisionClassRules：05 §3.3、§3.4 的费用档位与部署等级算法的参数（labs:derive DRV-11 使用）。
schema: atl.taxonomy/v1
version: 1.0.0

categories:
  - id: base
    label: { zh-CN: 基础（EC2）, ja: 基盤（EC2）, en: Base (EC2) }
    token: --cat-base
    symbol: square
  - id: A
    label: { zh-CN: 入口、网络与扩展, ja: 入口・ネットワーク・スケーリング, en: "Entry, networking, and scaling" }
    token: --cat-a
    symbol: triangle
  - id: B
    label: { zh-CN: 身份与安全, ja: ID とセキュリティ, en: Identity and security }
    token: --cat-b
    symbol: diamond
  - id: C
    label: { zh-CN: 数据与存储, ja: データとストレージ, en: Data and storage }
    token: --cat-c
    symbol: circle
  - id: D
    label: { zh-CN: 计算、异步与通知, ja: コンピューティング・非同期・通知, en: "Compute, async, and notifications" }
    token: --cat-d
    symbol: hexagon
  - id: E
    label: { zh-CN: 运维与监控, ja: 運用と監視, en: Operations and monitoring }
    token: --cat-e
    symbol: plus
  - id: F
    label: { zh-CN: 治理、成本与交付, ja: ガバナンス・コスト・デリバリー, en: "Governance, cost, and delivery" }
    token: --cat-f
    symbol: bars

services:
  # 基础
  - id: ec2
    abbr: EC2
    name: { zh-CN: Amazon EC2, ja: Amazon EC2, en: Amazon EC2 }
    short: { zh-CN: EC2, ja: EC2, en: EC2 }
    function: { zh-CN: 运行整个应用, ja: アプリ全体を実行, en: Runs the whole app }
    category: base
    module: ec2
    iamPrefix: ec2
  # A 入口、网络与扩展
  - id: vpc
    abbr: VPC
    name: { zh-CN: Amazon VPC, ja: Amazon VPC, en: Amazon VPC }
    short: { zh-CN: VPC, ja: VPC, en: VPC }
    function: { zh-CN: 网络隔离, ja: ネットワーク分離, en: Network isolation }
    category: A
    module: network
    iamPrefix: ec2
  - id: cloudfront
    abbr: CF
    name: { zh-CN: Amazon CloudFront, ja: Amazon CloudFront, en: Amazon CloudFront }
    short: { zh-CN: CloudFront, ja: CloudFront, en: CloudFront }
    function: { zh-CN: 内容分发与边缘缓存, ja: コンテンツ配信とエッジキャッシュ, en: Content delivery and edge caching }
    category: A
    module: cdn
    iamPrefix: cloudfront
  - id: route53
    abbr: R53
    name: { zh-CN: Amazon Route 53, ja: Amazon Route 53, en: Amazon Route 53 }
    short: { zh-CN: Route 53, ja: Route 53, en: Route 53 }
    function: { zh-CN: 域名解析, ja: ドメイン名の解決, en: Domain name resolution }
    category: A
    module: dns
    iamPrefix: route53
  - id: acm
    abbr: ACM
    name: { zh-CN: AWS Certificate Manager, ja: AWS Certificate Manager, en: AWS Certificate Manager }
    short: { zh-CN: ACM, ja: ACM, en: ACM }
    function: { zh-CN: HTTPS 证书, ja: HTTPS 証明書, en: HTTPS certificates }
    category: A
    module: tls
    iamPrefix: acm
  - id: waf
    abbr: WAF
    name: { zh-CN: AWS WAF, ja: AWS WAF, en: AWS WAF }
    short: { zh-CN: WAF, ja: WAF, en: WAF }
    function: { zh-CN: Web 应用防护, ja: Web アプリケーションの保護, en: Web application protection }
    category: A
    module: waf
    iamPrefix: wafv2
    consoleHome: wafv2.webAcls
  - id: elb
    abbr: ALB
    name: { zh-CN: Elastic Load Balancing, ja: Elastic Load Balancing, en: Elastic Load Balancing }
    short: { zh-CN: ALB, ja: ALB, en: ALB }
    function: { zh-CN: 负载均衡（ALB）, ja: 負荷分散（ALB）, en: Load balancing (ALB) }
    category: A
    module: load-balancer
    iamPrefix: elasticloadbalancing
    consoleHome: ec2.loadBalancers
  - id: autoscaling
    abbr: ASG
    name: { zh-CN: Amazon EC2 Auto Scaling, ja: Amazon EC2 Auto Scaling, en: Amazon EC2 Auto Scaling }
    short: { zh-CN: Auto Scaling, ja: Auto Scaling, en: Auto Scaling }
    function: { zh-CN: 弹性伸缩, ja: 自動スケーリング, en: Automatic scaling }
    category: A
    module: autoscaling
    iamPrefix: autoscaling
  # B 身份与安全
  - id: iam
    abbr: IAM
    name: { zh-CN: AWS IAM, ja: AWS IAM, en: AWS IAM }
    short: { zh-CN: IAM, ja: IAM, en: IAM }
    function: { zh-CN: 服务器访问 AWS 的凭证, ja: サーバーが AWS にアクセスする認証情報, en: Server credentials for AWS }
    category: B
    module: iam
    iamPrefix: iam
  - id: cognito-user-pool
    abbr: CUP
    name: { zh-CN: Amazon Cognito User Pool, ja: Amazon Cognito User Pool, en: Amazon Cognito User Pool }
    short: { zh-CN: User Pool, ja: User Pool, en: User Pool }
    function: { zh-CN: 用户注册登录, ja: ユーザー登録とサインイン, en: User sign-up and sign-in }
    category: B
    module: auth
    iamPrefix: cognito-idp
  - id: cognito-identity-pool
    abbr: CIP
    name: { zh-CN: Amazon Cognito Identity Pool, ja: Amazon Cognito Identity Pool, en: Amazon Cognito Identity Pool }
    short: { zh-CN: Identity Pool, ja: Identity Pool, en: Identity Pool }
