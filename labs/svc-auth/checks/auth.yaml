checks:
  # ---- 起始状态（before 一律 once）
  - id: auth-local-baseline
    title: 起始状态：账号由 EC2 本地管理（local）
    type: capability
    module: auth
    drift: { policy: once }
    assert:
      - { path: $.driver, op: eq, value: local, label: 驱动 }
    explain: local 档在 users 表里保存 argon2id 哈希，用自己的 ES256 密钥签发 JWT，验证邮件写入本地 outbox。

  # ---- 启用 Cognito
  - id: auth-wired
    title: auth 已切换到 Cognito，只允许预期的 DEP-013 警告
    type: capability
    module: auth
    drift: { policy: must-hold, monitor: true }
    assert:
      - { path: $.driver, op: eq, value: cognito, label: 驱动 }
      - { path: $, op: healthy, label: 状态正常（DEP-013 是本卡的预期警告） }
    explain: L0 的 EMAIL_DRIVER=outbox 与 AUTH_DRIVER=cognito 同时出现会触发 DEP-013（Cognito 自己发验证码，outbox 看不到），模块因此是 degraded；其他警告都不允许。
    reproduce: { run: 'curl -s http://127.0.0.1/api/capabilities | jq ".modules.auth | {driver, status, detail}"', runsOn: lab }

  - id: auth-probe-cognito
    title: 应用的认证端口指向本会话的 User Pool（sdk 子模式）
    type: http-header
    from: lab
    target: self
    path: /api/lab/probe/auth
    method: GET
    dependsOn: [auth-wired]
    drift: { policy: must-hold }
    assert:
      - { path: $.status, op: eq, value: 200, label: 状态码 }
      - { path: $.json.driver, op: eq, value: cognito, label: 认证驱动 }
      - { path: $.json.loginMode, op: eq, value: sdk, label: 登录方式 }
      - { path: $.json.userPoolId, op: eq, value: '{{ var.userPoolId }}', label: User Pool }
      - { path: $.pathSegments.auth, op: startsWith, value: cognito, label: 路径段 auth }
    explain: 由实验机本地请求探测端点（引擎自动附带本机令牌）；User Pool ID 必须是本会话 auth 栈的输出。
    reproduce: { run: 'curl -s -o /dev/null -D - "http://127.0.0.1/api/feed?limit=1" | grep -i "^x-cloudalbum-path:"', runsOn: lab }

  - id: user-pool
    title: User Pool 是本会话创建的，开启了删除保护，用户名是邮箱
    type: aws-readonly
    service: cognito-idp
    action: DescribeUserPool
    region: app
    params: { UserPoolId: '{{ var.userPoolId }}' }
    ownership: { resource: '{{ $.UserPool.Arn }}', mode: session, createdAfter: session.readyAt }
    drift: { policy: must-hold }
    assert:
      - { path: $.UserPool.DeletionProtection, op: eq, value: ACTIVE, label: 删除保护 }
      - { path: $.UserPool.UsernameAttributes, op: contains, value: email, label: 用邮箱作为用户名 }
      - { path: $.UserPool.Policies.PasswordPolicy.MinimumLength, op: gte, value: 10, label: 密码最小长度 }
    explain: 先确认 User Pool 由本会话的 auth 模块栈创建；删除保护防止误删整个用户目录，回收器会先关闭它再删除。
    reproduce: { run: 'aws cognito-idp describe-user-pool --user-pool-id "{{ var.userPoolId }}" --query "UserPool.{Protection:DeletionProtection,Username:UsernameAttributes,MinLength:Policies.PasswordPolicy.MinimumLength}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [Amazon Cognito, 用户池, 'cloudalbum-{{ session.env }}-users', 设置], region: app }
      observed:
        question: 用户池的“删除保护”显示什么？
        options:
          - { value: active, label: 已激活, expected: true }
          - { value: inactive, label: 未激活, fixHint: 不要在控制台修改栈管理的用户池；重新执行 scripts/module enable auth }

  # ---- 应用客户端
  - id: spa-client
    title: 应用客户端是公有客户端，用户不能改写 custom:plan 与 custom:app_uid
    type: aws-readonly
    service: cognito-idp
    action: DescribeUserPoolClient
    region: app
    params: { UserPoolId: '{{ var.userPoolId }}', ClientId: '{{ var.clientId }}' }
    dependsOn: [user-pool]
    drift: { policy: must-hold }
    assert:
      - { path: $.UserPoolClient.ClientSecret, op: absent, label: 没有客户端密钥（公有客户端） }
      - path: $.UserPoolClient.WriteAttributes
        op: every
        label: 可写属性不含 custom:plan、custom:app_uid
        value:
          - { path: $, op: nin, value: ['custom:plan', 'custom:app_uid'] }
      - { path: $.UserPoolClient.EnableTokenRevocation, op: eq, value: true, label: 允许吊销 refresh token }
    explain: 客户端 ID 与 User Pool 来自同一个模块栈的输出（user-pool 已确认归属）。可写属性是应用的责任：放开 custom:plan 等于让用户自己升级套餐。
    reproduce: { run: 'aws cognito-idp describe-user-pool-client --user-pool-id "{{ var.userPoolId }}" --client-id "{{ var.clientId }}" --query "UserPoolClient.{Write:WriteAttributes,Flows:ExplicitAuthFlows,Access:AccessTokenValidity,Revocation:EnableTokenRevocation}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [Amazon Cognito, 用户池, 'cloudalbum-{{ session.env }}-users', 应用程序客户端, cloudalbum-spa, 属性读写权限], region: app }
      observed:
        question: “写入”一栏勾选了哪些属性？
        options:
          - { value: email-only, label: 只有 email, expected: true }
          - { value: custom, label: 包括 custom:plan 或 custom:app_uid, fixHint: 不要在控制台修改栈管理的客户端；重新执行 scripts/module enable auth }

  - id: why-not-write-plan
    title: 说出为什么不能让客户端写 custom:plan
    type: manual
    spec:
      observed:
        question: 如果应用客户端的可写属性包含 custom:plan，会发生什么？
        options:
          - { value: escalation, label: 用户可以用自己的 access token 调用 UpdateUserAttributes 把自己升级成付费套餐, expected: true }
          - { value: nothing, label: 没有影响，Cognito 会自动校验, fixHint: Cognito 只按客户端的可写属性放行；业务含义由应用负责（共享责任） }

  # ---- 注册与验证码
  - id: dep013-observed
    title: auth 因预期的 DEP-013 而处于 degraded
    type: capability
    module: auth
    drift: { policy: once }
    assert:
      - { path: $.status, op: eq, value: degraded, label: 状态 }
      - { path: $, op: healthy, label: 降级只来自预期警告 }
    explain: Cognito 自己发送验证码，本地 outbox 看不到这些邮件——这正是 DEP-013 提示的内容；改用 SES 发信时（email 模块）提示消失。

  - id: signup-code
    title: 确认收到 Cognito 发出的验证码邮件
    type: manual
    spec:
      observed:
        question: 用你的邮箱注册后，验证码出现在哪里？
        options:
          - { value: mailbox, label: 我的邮箱收到了 Cognito 发来的邮件，/me/outbox 里没有, expected: true }
          - { value: outbox, label: 只在 /me/outbox 里看到, fixHint: 确认 auth 已是 cognito（auth-wired 通过）后重新注册 }
          - { value: none, label: 都没有收到, fixHint: Cognito 默认发件的每日额度很低；查看垃圾邮件，或稍后再试 }

  # ---- 令牌
  - id: jwks-alg
    title: 说出两种驱动的令牌签名算法
    type: manual
    spec:
      observed:
        question: Cognito 的 JWKS 中密钥的 alg 是什么？本地驱动（第 1 步记录的 /.well-known/jwks.json）呢？
        options:
          - { value: rs256-es256, label: Cognito 是 RS256，本地是 ES256, expected: true }
          - { value: same, label: 两者相同, fixHint: 再看一次两个 JWKS 的 alg 字段 }

  - id: revoke-semantics
    title: 说出登出后旧 access token 的命运
    type: manual
    spec:
      observed:
        question: Cognito 下用户登出（GlobalSignOut）后，后端本地验签的旧 access token 会怎样？
        options:
          - { value: until-exp, label: refresh token 立即失效；access token 在过期前（本卡配置 15 分钟）仍能通过本地验签, expected: true }
          - { value: immediate, label: 立即失效, fixHint: 本地验签只看签名与 exp，不会询问 Cognito；本地驱动靠 tv（令牌版本）检查才做到立即失效 }

  # ---- 回收验证
  - id: user-pool-gone
    title: 本会话的 User Pool 已删除
    type: aws-readonly
    service: cognito-idp
    action: DescribeUserPool
    region: app
    params: { UserPoolId: '{{ var.userPoolId }}' }
    expectError: ResourceNotFoundException
    required: false
    reproduce: { run: 'aws cognito-idp describe-user-pool --user-pool-id "{{ var.userPoolId }}"', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [Amazon Cognito, 用户池], region: app }
      observed:
        question: 列表中还能找到 cloudalbum-{{ session.env }}-users 吗？
        options:
          - { value: gone, label: 找不到, expected: true }
          - { value: present, label: 还在 }
