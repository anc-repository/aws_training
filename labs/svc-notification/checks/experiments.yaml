checks:
  - id: exp-fanout-before
    title:
      zh-CN: fanout 的 before（db：逐个调用 EmailPort）有一条有效结果
      ja: fanout の before（db：EmailPort を 1 件ずつ呼び出す）に有効な結果が 1 件ある
      en: "fanout has one valid before result (db: calling EmailPort per recipient)"
    type: experiment
    module: notification
    experiment: fanout
    label: before
    accept: [valid]

  - id: exp-fanout-pair
    title:
      zh-CN: fanout 的 before 与 after 都有效且可比
      ja: fanout の before と after がどちらも有効で比較できる
      en: fanout before and after are both valid and comparable
    type: experiment
    module: notification
    experiment: fanout
    pair: [before, after]
    accept: [valid]

  - id: exp-filter-after
    title:
      zh-CN: filter（只发给 u1）有一条有效结果
      ja: filter（u1 だけに送る）に有効な結果が 1 件ある
      en: filter (send to u1 only) has one valid result
    type: experiment
    module: notification
    experiment: filter
    label: after
    accept: [valid]
