# labs/svc-secrets/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-secrets
kind: service
version: 0.1.0
status: planned
service: AWS Secrets Manager
function: 密码与密钥管理
title: AWS Secrets Manager：密码与密钥管理
summary: 把数据卷上的 `secrets.env` 搬进 Secrets Manager：磁盘上不再有明文，轮换 JWT 签名密钥不用重启、用户不掉线，每次读取都有审计。
difficulty: intermediate
estimatedMinutes: 60
timeLimitMinutes: 90
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: secretsmanager, name: AWS Secrets Manager, role: primary, module: secrets}
- {id: iam, role: context, module: iam}
modules:
  target: [secrets]
  start: [iam]
  context: []
  related: [kms, database]
prerequisites:
  cards:
  - {id: svc-iam, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
  - {item: preview-direct-https, kind: platform, reason: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）}
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: secrets, driver: secretsmanager}
expectedWarnings: []
cost: {tier: low}
provision: {class: A}
badge: {title: 机密托管}
tracks: [saa-main, secure]
saa:
  domains: [secure]
tags: [secrets, secretsmanager]
certificate: {enabled: false}
