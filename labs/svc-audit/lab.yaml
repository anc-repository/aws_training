# labs/svc-audit/lab.yaml —— 目录占位（status: planned）：只有目录元数据，可在目录中显示但不能开始实验；
# 取值来自 05 §4 与 cards/ 逐卡文档。步骤、手册、检查与小测在后续批次补齐，届时 status 改为 beta 并提升版本。
schema: atl.lab/v2
id: svc-audit
kind: service
version: 0.1.0
status: planned
service:
  zh-CN: AWS CloudTrail
  ja: AWS CloudTrail
  en: AWS CloudTrail
function:
  zh-CN: AWS API 操作审计
  ja: AWS API 操作の監査
  en: AWS API activity auditing
title:
  zh-CN: AWS CloudTrail：AWS API 操作审计
  ja: AWS CloudTrail：AWS API 操作の監査
  en: "AWS CloudTrail: AWS API activity auditing"
summary:
  zh-CN: 在“知道最终用户”的应用审计表旁边加上“知道 AWS 身份”的 CloudTrail trail：多区域长期留存、日志文件完整性验证，并把两层审计对齐。
  ja: 「エンドユーザーを知っている」アプリの監査テーブルの隣に、「AWS の ID を知っている」CloudTrail の証跡を追加します。マルチリージョンでの長期保管とログファイルの整合性検証を有効にし、2 層の監査を突き合わせます。
  en: Next to the app's audit table, which knows the end user, add a CloudTrail trail, which knows the AWS identity. Keep multi-Region logs long term, validate log file integrity, and line up the two audit layers.
difficulty: intermediate
estimatedMinutes: 75
timeLimitMinutes: 120
extensions: {maxCount: 2, minutesEach: 30}
retain: {allowed: true, maxHours: 24}
regions:
  supported: [ap-northeast-1]
services:
- {id: cloudtrail, name: { zh-CN: AWS CloudTrail, ja: AWS CloudTrail, en: AWS CloudTrail }, role: primary, module: audit}
- {id: iam, role: context, module: iam}
modules:
  target: [audit]
  start: [iam]
  context: []
  related: [compliance]
prerequisites:
  cards:
  - {id: svc-iam, kind: soft}
  - {id: svc-threat-detection, kind: soft}
  - {id: sc-security-baseline, kind: soft}
  - {id: sc-threat-compliance, kind: soft}
startProfile:
  provisions:
  - item: iam
    kind: module
    basis: credential
    set: {IAM_CREDENTIALS: role}
    reason:
      zh-CN: 平台约定除 svc-ec2、svc-iam 外起始状态都带实例角色（C3）
      ja: プラットフォームの取り決めにより、svc-ec2 と svc-iam 以外の開始状態にはインスタンスロールが付いています（C3）
      en: By platform convention, every start state except svc-ec2 and svc-iam includes an instance role (C3)
  - item: preview-direct-https
    kind: platform
    reason:
      zh-CN: 预览使用方案 B 的 Let's Encrypt IP 证书（03 §6.2）
      ja: プレビューには方式 B の Let's Encrypt IP 証明書を使います（03 §6.2）
      en: The preview uses the option B Let's Encrypt IP certificate (03 §6.2)
  platform:
    preview: {directHttps: 'on'}
targetModules:
- {id: audit, driver: cloudtrail}
expectedWarnings: []
platform:
  accountImpact:
  - id: cloudtrail-trail
    scope: account
    resource:
      zh-CN: CloudTrail trail
      ja: CloudTrail の証跡
      en: CloudTrail trail
    preexisting: adopt-readonly
    revert: delete
    note:
      zh-CN: 已有管理事件 trail 时只读接入
      ja: 管理イベントの証跡がすでにある場合は読み取り専用で利用します
      en: If a management-event trail already exists, it is used read-only
cost: {tier: low}
provision: {class: A}
badge: {title: { zh-CN: 谁动了 AWS, ja: AWS を操作したのは誰か, en: Who touched AWS }}
tracks: [operations, saa-main, secure]
saa:
  domains: [secure]
tags: [audit, cloudtrail]
certificate: {enabled: false}
