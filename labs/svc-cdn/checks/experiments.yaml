# 对比实验结果（04 §5.2.5）：experiments/cdn/experiment.json 的 media-load、compression
checks:
  - id: exp-media-before
    title:
      zh-CN: media-load 的 before（EC2 直出）有一条有效结果
      ja: media-load の before（EC2 から直接）に有効な結果が 1 件ある
      en: media-load has a valid before result (served directly by EC2)
    type: experiment
    module: cdn
    experiment: media-load
    label: before
    accept: [valid, simulated]

  - id: exp-media-pair
    title:
      zh-CN: media-load 的 before 与 after 都有效且可比
      ja: media-load の before と after がどちらも有効で比較可能
      en: media-load before and after are both valid and comparable
    type: experiment
    module: cdn
    experiment: media-load
    pair: [before, after]
    accept: [valid, simulated]

  - id: exp-compression
    title:
      zh-CN: compression 的 after 有一条有效结果
      ja: compression の after に有効な結果が 1 件ある
      en: compression has a valid after result
    type: experiment
    module: cdn
    experiment: compression
    label: after
    required: false
