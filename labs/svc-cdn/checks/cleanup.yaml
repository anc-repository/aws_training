# 回收后的验证（04 §3.2.12）：只允许 aws-readonly + expectError，结果写进报告的“清理”一节
checks:
  - id: dist-gone
    title: 本会话的 CloudFront 分配已删除
    type: aws-readonly
    service: cloudfront
    action: GetDistribution
    region: global
    params: { Id: '{{ var.distributionId }}' }
    expectError: NoSuchDistribution
    required: false
    explain: 回收完成后按分配 ID 查询，期望返回 NoSuchDistribution。
    reproduce: { run: 'aws cloudfront get-distribution --id {{ var.distributionId }}', runsOn: workstation }
    manualFallback:
      where: { breadcrumb: [CloudFront, 分配], region: global }
      observed:
        question: 列表中还能找到这个分配吗？
        options:
          - { value: gone, label: 找不到, expected: true }
          - { value: present, label: 还在（可能正在禁用或删除）, fixHint: 回收会先禁用再删除分配，需要一段时间 }
