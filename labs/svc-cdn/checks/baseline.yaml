# 起始状态（before）断言：一律 drift once（C3、04 §3.5 第 9 条）
checks:
  - id: cdn-off
    title:
      zh-CN: 起始状态：cdn 未启用，应用由 EC2 直出
      ja: 開始状態：cdn は無効で、アプリは EC2 から直接配信されている
      en: "Start state: cdn is off and EC2 serves the app directly"
    type: capability
    module: cdn
    drift: { policy: once }
    assert:
      - { path: $.driver, op: eq, value: direct, label: { zh-CN: 驱动, ja: ドライバー, en: Driver } }
      - { path: $.status, op: eq, value: 'off', label: { zh-CN: 状态, ja: 状態, en: Status } }
    explain:
      zh-CN: 启用 cdn 之前，应用的媒体与静态资源都由 EC2 的 Nginx 直接返回。
      ja: cdn を有効にする前は、アプリのメディアと静的リソースはすべて EC2 の Nginx が直接返します。
      en: Before cdn is enabled, Nginx on EC2 returns all of the app's media and static assets directly.

  - id: entry-direct-baseline
    title:
      zh-CN: 起始状态：直连弹性 IP 的响应没有 X-Cache，入口链只有 nginx
      ja: 開始状態：Elastic IP への直接アクセスのレスポンスに X-Cache がなく、入口チェーンは nginx だけ
      en: "Start state: direct responses from the Elastic IP have no X-Cache, and the entry chain is only nginx"
    type: http-header
    from: platform
    target: public-ip
    path: '/assets/{{ sample.assetPath }}'
    method: HEAD
    drift: { policy: once }
    assert:
      - { path: $.status, op: eq, value: 200, label: { zh-CN: 状态码, ja: ステータスコード, en: Status code } }
      - { path: $.headers.x-cache, op: absent, label: { zh-CN: 没有 X-Cache, ja: X-Cache なし, en: No X-Cache } }
      - { path: $.pathSegments.entry, op: eq, value: nginx, label: { zh-CN: 入口链, ja: 入口チェーン, en: Entry chain } }
    explain:
      zh-CN: 平台从公网请求实验机弹性 IP 上的一个静态资源，确认它由 Nginx 直接返回。
      ja: プラットフォームがインターネット側からラボ用インスタンスの Elastic IP にある静的リソースをリクエストし、Nginx が直接返していることを確認します。
      en: The platform requests a static asset on the lab instance's Elastic IP from the internet and confirms that Nginx returns it directly.
    reproduce: { run: 'curl -skI "https://{{ target.publicIp }}/" | grep -iE "^(x-cache|x-cloudalbum-path):"', runsOn: workstation }
