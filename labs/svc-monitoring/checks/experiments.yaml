checks:
  - id: exp-tta-before
    title:
      zh-CN: time-to-alert 的 before（只有本地评估器）有一条有效结果
      ja: time-to-alert の before（ローカル評価器のみ）に有効な結果が 1 件ある
      en: time-to-alert has one valid before result (local evaluator only)
    type: experiment
    module: monitoring
    experiment: time-to-alert
    label: before
    accept: [valid]

  - id: exp-kill-before
    title:
      zh-CN: kill-test 的 before（停服务，本地评估器）有一条有效结果
      ja: kill-test の before（サービス停止、ローカル評価器）に有効な結果が 1 件ある
      en: kill-test has one valid before result (services stopped, local evaluator)
    type: experiment
    module: monitoring
    experiment: kill-test
    label: before
    accept: [valid]

  - id: exp-tta-pair
    title:
      zh-CN: time-to-alert 的 before 与 after 都有效且可比
      ja: time-to-alert の before と after がどちらも有効で比較できる
      en: time-to-alert before and after are both valid and comparable
    type: experiment
    module: monitoring
    experiment: time-to-alert
    pair: [before, after]
    accept: [valid]

  - id: exp-kill-pair
    title:
      zh-CN: kill-test 的 before 与 after（都只停服务）都有效且可比
      ja: kill-test の before と after（どちらもサービス停止のみ）がどちらも有効で比較できる
      en: kill-test before and after (both stopping services only) are both valid and comparable
    type: experiment
    module: monitoring
    experiment: kill-test
    pair: [before, after]
    accept: [valid]

  - id: exp-stop-instance
    title:
      zh-CN: kill-test 的一次性变体 stop-instance（停实例）有一条有效结果
      ja: kill-test の 1 回限りのバリエーション stop-instance（インスタンス停止）に有効な結果が 1 件ある
      en: kill-test's one-off variant stop-instance (instance stop) has one valid result
    type: experiment
    module: monitoring
    experiment: kill-test
    label: stop-instance
    required: false
    accept: [valid]

  - id: exp-mem-visibility
    title:
      zh-CN: mem-visibility 的 after 有一条有效结果
      ja: mem-visibility の after に有効な結果が 1 件ある
      en: mem-visibility has one valid after result
    type: experiment
    module: monitoring
    experiment: mem-visibility
    label: after
    required: false
    accept: [valid]

  - id: exp-resolution
    title:
      zh-CN: resolution 的 after 有一条有效结果
      ja: resolution の after に有効な結果が 1 件ある
      en: resolution has one valid after result
    type: experiment
    module: monitoring
    experiment: resolution
    label: after
    required: false
    accept: [valid]
