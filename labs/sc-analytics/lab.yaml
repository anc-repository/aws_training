  supported: [ap-northeast-1]
services:
- {id: firehose, role: primary, module: analytics}
- id: athena
  role: supporting
  creditBy: [query-athena]
- {id: glue, role: supporting}
- {id: s3, role: supporting}
- {id: iam, role: context, module: iam}
