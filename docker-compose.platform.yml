# ATL platform dev services (ATL_DEV_MODE=1). Only DynamoDB Local; everything else runs in-process.
#   npm run platform:db:up        start (waits for the health check)
#   npm run platform:db:init      create atl-main + cloudalbum-lab-locks (01 §7.1, §3.11) and seed a dev PlatformConfig
#   ATL_IT=1 npm run platform:test   DynamoDB Local integration tests (*.int.test.ts)
#   npm run platform:db:down      stop and delete the data
#
# -inMemory: nothing is written to disk (no volume on C:). Port 58000 (ATL_DEV_DDB_ENDPOINT=http://127.0.0.1:58000).
# Own compose project name: `down -v` never touches the CloudAlbum test services (docker-compose.test.yml).
name: atl-platform
services:
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "127.0.0.1:58000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
