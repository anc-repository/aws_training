<title>AWS Training Lab</title>
<style>
/* 布局：工程笔记本——48px 顶栏（会话胶囊 + 进度 + 账号区域）+ 全宽内容区（≤1440px）+ 28px 页脚状态条；
   工作台例外：SessionBar + 左手册 / 右终端分屏。颜色只表达语义，单一强调色“青瓷”只用于当前、你在这里、推荐与焦点环。
   字体：不加载网络字体（平台 CSP 不允许，08 §6.7），中文用系统黑体，id / ARN / 命令 / 计时用等宽。 */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#EFEEE8; --border:#DAD8D0; --border-strong:#8A867B;
  --text:#1C1D1F; --text-2:#4A4D55; --text-3:#63666E; --ink:#1C1D1F; --on-ink:#FFFFFF;
  --accent:#0F6E6E; --accent-soft:#DDEFEC; --code-bg:#EFEFEC; --danger-edge:#B3261E;
  --st-pass:#1B703F; --st-pass-soft:#E2F2E7;
  --st-manual:#6A3EA1; --st-manual-soft:#EFE7F8;
  --st-fail:#B3261E; --st-fail-soft:#FBE5E3;
  --st-drift:#A8380A; --st-drift-soft:#FCE9DD;
  --st-pending:#1F5FAD; --st-pending-soft:#E3ECF8;
  --st-error:#5A606B; --st-error-soft:#EAEBED;
  --st-needs:#6A3EA1;
  --st-stale:#8A6100; --st-stale-soft:#F7EED6;
  --st-locked:#8C9098; --st-locked-soft:#EFEFEC;
  --viz-before:#8C8F96; --viz-after:#0F6E6E; --viz-third:#9A6B1F; --viz-grid:#E4E2DA;
  --host-lab:#9A6B1F; --host-ws:#0F6E6E;
  --term-bg:#1B1C1F; --term-fg:#E9E7E2; --term-dim:#9C9A94; --term-cursor:#4FB3A9; --term-selection:rgb(79 179 169 / .35);
  --term-ovl:rgb(20 21 23 / .88); --term-green:#7CC79A; --term-red:#F0827B; --term-yellow:#E3B866; --term-cyan:#6CC3D6; --term-bar:#26272B;
  --cat-base:#4A4D55; --cat-a:#2F6690; --cat-b:#8A3B5C; --cat-c:#6B7A2A; --cat-d:#A35A12; --cat-e:#56677A; --cat-f:#7A5C2E;
  --ses-prep:var(--st-pending); --ses-live:var(--accent); --ses-warn:var(--st-drift); --ses-critical:var(--st-fail);
  --ses-wind:var(--text-2); --ses-kept:var(--st-stale);
  --urg-1-bg:var(--st-drift-soft); --urg-2-bg:var(--st-fail-soft);
  --proto-bg:#E9E7F3; --proto-fg:#3E3566;
  --scrim:rgb(28 29 31 / .38);
  --shadow:0 8px 24px rgb(0 0 0 / .12);
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,"Noto Sans Mono CJK SC",Menlo,monospace;
  --topbar-h:48px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1B1C1F; --surface-2:#232428; --border:#34363B; --border-strong:#6E7179;
    --text:#E9E7E2; --text-2:#B6B4AE; --text-3:#96948F; --ink:#E9E7E2; --on-ink:#141517;
    --accent:#4FB3A9; --accent-soft:#16302D; --code-bg:#1F2023; --danger-edge:#F0716A;
    --st-pass:#4CB97A; --st-pass-soft:#163222; --st-manual:#B08BE0; --st-manual-soft:#2A2138;
    --st-fail:#F0716A; --st-fail-soft:#3A1C1A; --st-drift:#F08A4B; --st-drift-soft:#3A2214;
    --st-pending:#6FA3E6; --st-pending-soft:#172A40; --st-error:#9AA0AA; --st-error-soft:#26282C;
    --st-needs:#B08BE0; --st-stale:#D9A93A; --st-stale-soft:#33290F; --st-locked:#6F737B; --st-locked-soft:#202124;
    --viz-before:#7D8088; --viz-after:#4FB3A9; --viz-third:#D1A45A; --viz-grid:#2C2E32;
    --host-lab:#D1A45A; --host-ws:#4FB3A9; --term-bg:#141517; --term-bar:#202124;
    --cat-base:#B6B4AE; --cat-a:#7FB2DE; --cat-b:#D98AAE; --cat-c:#B5C46A; --cat-d:#E6A35E; --cat-e:#9FB0C2; --cat-f:#C9A66B;
    --proto-bg:#24213A; --proto-fg:#C9C0F0;
    --scrim:rgb(0 0 0 / .6); --shadow:0 8px 24px rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1B1C1F; --surface-2:#232428; --border:#34363B; --border-strong:#6E7179;
  --text:#E9E7E2; --text-2:#B6B4AE; --text-3:#96948F; --ink:#E9E7E2; --on-ink:#141517;
  --accent:#4FB3A9; --accent-soft:#16302D; --code-bg:#1F2023; --danger-edge:#F0716A;
  --st-pass:#4CB97A; --st-pass-soft:#163222; --st-manual:#B08BE0; --st-manual-soft:#2A2138;
  --st-fail:#F0716A; --st-fail-soft:#3A1C1A; --st-drift:#F08A4B; --st-drift-soft:#3A2214;
  --st-pending:#6FA3E6; --st-pending-soft:#172A40; --st-error:#9AA0AA; --st-error-soft:#26282C;
  --st-needs:#B08BE0; --st-stale:#D9A93A; --st-stale-soft:#33290F; --st-locked:#6F737B; --st-locked-soft:#202124;
  --viz-before:#7D8088; --viz-after:#4FB3A9; --viz-third:#D1A45A; --viz-grid:#2C2E32;
  --host-lab:#D1A45A; --host-ws:#4FB3A9; --term-bg:#141517; --term-bar:#202124;
  --cat-base:#B6B4AE; --cat-a:#7FB2DE; --cat-b:#D98AAE; --cat-c:#B5C46A; --cat-d:#E6A35E; --cat-e:#9FB0C2; --cat-f:#C9A66B;
  --proto-bg:#24213A; --proto-fg:#C9C0F0;
  --scrim:rgb(0 0 0 / .6); --shadow:0 8px 24px rgb(0 0 0 / .45);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; height:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:var(--font-sans); font-size:14px; line-height:1.6;
  padding-inline:16px; padding-block:0}
@media (min-width:768px){ body{padding-inline:24px} }
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600}
h1{font-size:20px; line-height:1.4} h2{font-size:15px; line-height:1.5} h3{font-size:14px; line-height:1.5}
p{margin:0}
ul,ol{margin:0; padding-left:20px}
a{color:var(--accent); text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
code,kbd,pre,.mono{font-family:var(--font-mono)}
.mono{font-size:.92em}
code{font-size:.9em; background:var(--surface-2); padding:0 4px; border-radius:3px; overflow-wrap:anywhere}
kbd{font-size:11.5px; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:3px; padding:0 4px; background:var(--surface); color:var(--text-2)}
.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,main:focus,section[tabindex="-1"]:focus,div[tabindex="-1"]:focus{outline:none}
::selection{background:var(--accent-soft)}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:12px} .xs{font-size:11.5px}
.nowrap{white-space:nowrap} .wrap-any{overflow-wrap:anywhere}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.row>*{min-width:0}
.stack{display:grid; gap:12px; min-width:0} .stack-4{display:grid; gap:4px; min-width:0} .stack-8{display:grid; gap:8px; min-width:0}
.stack-16{display:grid; gap:16px; min-width:0} .stack-24{display:grid; gap:24px; min-width:0}
.stack>*,.stack-4>*,.stack-8>*,.stack-16>*,.stack-24>*{min-width:0}
.spacer{flex:1 1 auto}
.ico{width:16px; height:16px; flex:none; display:inline-block; vertical-align:-3px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.shp{width:12px; height:12px; flex:none; display:inline-block; vertical-align:-1px}
hr.rule{border:0; border-top:1px solid var(--border); margin:0}
[hidden]{display:none!important}

/* ---------- 原型标识 ---------- */
.proto-ribbon{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--proto-fg); background:var(--proto-bg);
  margin-inline:-16px; padding:3px 16px; border-bottom:1px solid var(--border)}
@media (min-width:768px){ .proto-ribbon{margin-inline:-24px; padding-inline:24px} }
.proto-ribbon b{font-weight:600}
@media (max-width:767px){ .proto-ribbon .long{display:none} }
.proto-ribbon a,.proto-ribbon button{color:inherit}
.proto-ribbon button{background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:2px; font-size:12px}
.proto-ribbon .rb-links{margin-left:auto; display:flex; gap:12px}
.proto-fab{position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:60; border:1px solid var(--border-strong);
  background:var(--proto-bg); color:var(--proto-fg); border-radius:4px; padding:4px 10px; font-size:12px; box-shadow:var(--shadow)}
@media (max-width:1023px){ .proto-fab{display:none} }
.proto-tag{display:inline-block; font-size:11px; padding:0 5px; border-radius:3px; background:var(--proto-bg); color:var(--proto-fg); border:1px dashed var(--proto-fg); font-weight:400}
/* 原型注：规格内部说明、回写依赖、实现细节，与产品文案在视觉上分开（正式界面中不出现） */
.proto-note{display:flex; gap:6px; align-items:flex-start; font-size:11.5px; color:var(--proto-fg); background:var(--proto-bg); border:1px dashed var(--proto-fg); border-radius:4px; padding:3px 8px; margin:0}
.proto-note .proto-tag{border:0; padding:0; flex:none; font-weight:600}

/* ---------- 全局顶栏 GlobalBar ---------- */
.skip{position:absolute; left:-9999px; top:8px; z-index:100; background:var(--ink); color:var(--on-ink); padding:6px 10px; border-radius:4px}
.skip:focus{left:16px}
.gbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); margin-inline:-16px; padding-inline:16px;
  border-bottom:1px solid var(--border); min-height:48px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:6px}
@media (min-width:768px){ .gbar{margin-inline:-24px; padding-inline:24px} }
@media (max-width:767px){ .gbar{position:static} }
.brand{display:flex; align-items:center; gap:8px; color:var(--text); text-decoration:none; font-weight:600; white-space:nowrap}
.brand .mark{width:22px; height:22px}
.brand .unofficial{font-size:11px; font-weight:400; color:var(--text-2); border:1px solid var(--border-strong); border-radius:3px; padding:0 4px}
.gnav{display:flex; gap:2px}
.gnav a{color:var(--text-2); text-decoration:none; padding:6px 10px; border-radius:4px; white-space:nowrap}
.gnav a:hover{background:var(--surface-2); color:var(--text)}
.gnav a[aria-current="page"]{color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); border-radius:0}
.gbar .right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}
.gbar .menu-btn{display:none}
@media (max-width:1023px){ .gnav{display:none} .gbar .menu-btn{display:inline-flex} .hide-md{display:none!important} }
@media (max-width:767px){ .hide-sm{display:none!important} .brand .bname{display:none} }

/* 会话胶囊 */
.spill{display:inline-flex; align-items:stretch; border:1px solid var(--border-strong); border-radius:4px; background:var(--surface); min-width:0; max-width:100%}
.spill a{display:flex; align-items:center; gap:6px; padding:3px 8px; color:var(--text); text-decoration:none; min-width:0; white-space:nowrap; overflow:hidden}
.spill button{border:0; border-left:1px solid var(--border); background:none; padding:0 6px; color:var(--text-2)}
.spill .cd{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px}
.spill.u-live{background:var(--accent-soft); border-color:var(--ses-live)}
.spill.u-prep{background:var(--st-pending-soft); border-color:var(--ses-prep)}
.spill.u1{background:var(--urg-1-bg); border-color:var(--ses-warn)}
.spill.u2{background:var(--urg-2-bg); border:2px solid var(--ses-critical)}
.spill.u4,.spill.u-wind{background:var(--surface-2)}
.spill.u-kept{background:var(--st-stale-soft); border-color:var(--ses-kept)}
.spill.u-fail{background:var(--st-fail-soft); border:2px solid var(--ses-critical)}

/* 浮层菜单 */
.pop-anchor{position:relative}
.popover{position:absolute; right:0; top:calc(100% + 6px); z-index:40; background:var(--surface); border:1px solid var(--border-strong); border-radius:6px;
  box-shadow:var(--shadow); min-width:240px; width:max-content; max-width:min(380px,calc(100vw - 32px)); padding:12px; display:grid; gap:8px}
.popover.left{left:0; right:auto}
.popover .mi{display:block; width:100%; text-align:left; background:none; border:0; padding:6px 8px; border-radius:4px; color:var(--text); text-decoration:none}
.popover .mi:hover{background:var(--surface-2)}
.popover .mi[aria-disabled="true"]{color:var(--text-3); cursor:not-allowed}

/* ---------- 横幅 ---------- */
.banners{display:grid; gap:6px; padding-block:8px 0}
.banner{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 10px; align-items:start; border:1px solid var(--border); border-left-width:4px; border-radius:4px; padding:8px 12px; background:var(--surface)}
.banner .b-body{min-width:0}
@media (max-width:767px){ .banner .b-act{grid-column:2 / -1} }
.banner .b-act{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.banner.red{border-left-color:var(--st-fail); background:var(--st-fail-soft)}
.banner.amber{border-left-color:var(--st-drift); background:var(--st-drift-soft)}
.banner.grey{border-left-color:var(--text-2); background:var(--surface-2)}
.banner.blue{border-left-color:var(--st-pending); background:var(--st-pending-soft)}
.banner.kept{border-left-color:var(--st-stale); background:var(--st-stale-soft)}
.banner .b-shape{padding-top:3px}
.banner.red .b-shape{color:var(--st-fail)} .banner.amber .b-shape{color:var(--st-drift)} .banner.blue .b-shape{color:var(--st-pending)} .banner.kept .b-shape{color:var(--st-stale)}
.more-banners{font-size:12px}

/* ---------- 页面 ---------- */
.crumbs{font-size:12px; color:var(--text-2); padding-top:10px; display:flex; gap:6px; flex-wrap:wrap}
.crumbs a{color:var(--text-2)}
main.page{max-width:1440px; margin-inline:auto; padding-block:16px 48px; min-width:0}
.ph{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:16px}
.ph .sub{color:var(--text-2); font-size:13px}
.sec{display:grid; gap:10px; min-width:0}
.sec>*,details{min-width:0}
.sec>h2{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-bottom:6px; border-bottom:1px solid var(--border)}
.sec>h2 .aside{margin-left:auto; font-weight:400; font-size:12px; color:var(--text-2)}
.box{background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px 14px; min-width:0}
.box.inset{background:var(--surface-2); border-color:transparent}
.grid-2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:16px}
.grid-2>*,.grid-3>*{min-width:0}
.two-col{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:1023px){ .two-col{grid-template-columns:minmax(0,1fr)} }
.sticky-aside{position:sticky; top:calc(var(--topbar-h) + 12px)}
@media (max-width:1023px){ .sticky-aside{position:static} }
footer.foot{display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--text-2); border-top:1px solid var(--border);
  margin-inline:-16px; padding:4px 16px; min-height:28px}
@media (min-width:768px){ footer.foot{margin-inline:-24px; padding-inline:24px} }
@media (max-width:767px){ footer.foot .hide-sm{display:none} }
.live-dot{color:var(--st-pass)}

/* ---------- 控件 ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:32px; padding:4px 12px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text); border-radius:4px; text-decoration:none; white-space:nowrap; line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent); color:var(--on-ink); border-color:var(--accent)}
.btn.ghost{border-color:transparent; background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--st-fail); border-color:var(--st-fail)}
.btn.danger.solid{background:var(--st-fail); color:var(--on-ink)}
.btn.sm{min-height:26px; padding:2px 8px; font-size:12.5px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
.btn.busy{cursor:progress}
.btn.icon{padding-inline:6px}
label.btn:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.linkbtn{background:none; border:0; padding:0; color:var(--accent); text-decoration:underline; text-underline-offset:2px}
/* 触屏：所有可点区域 ≥ 44×44px（08 §6.8、§8.9） */
@media (pointer:coarse){
  .btn,.btn.sm{min-height:44px; min-width:44px}
  .spill button{min-width:44px}
  .seg button,.seg a,.tabs [role="tab"],.tabs a,.rtabs [role="tab"],.facet,.popover .mi,.stage>button.sh,.steprail button{min-height:44px}
  .seg button,.seg a{display:inline-flex; align-items:center}
  .linkbtn,.proto-ribbon a,.proto-ribbon button{display:inline-flex; align-items:center; min-height:44px; padding-inline:4px}
  .idchip .subtabs button{min-width:44px; min-height:44px}
  .kbd-hint{display:none}
}
.field{display:grid; gap:4px; min-width:0}
.field label,.flabel{font-size:12.5px; color:var(--text-2)}
.input,select.input,textarea.input{width:100%; min-height:32px; border:1px solid var(--border-strong); border-radius:4px; background:var(--surface); padding:4px 8px}
textarea.input{min-height:72px; resize:vertical}
.input[aria-invalid="true"]{border-color:var(--st-fail)}
.ferr{font-size:12px; color:var(--st-fail)}
.chk{display:flex; gap:8px; align-items:flex-start}
.chk input{margin-top:4px; width:16px; height:16px; accent-color:var(--accent); flex:none}
.radio-row{display:flex; gap:14px; flex-wrap:wrap}
.radio-row label{display:flex; gap:6px; align-items:center}
.radio-row input{accent-color:var(--accent)}
.seg{justify-self:start; display:inline-flex; border:1px solid var(--border-strong); border-radius:4px; overflow:hidden; max-width:100%; flex-wrap:wrap}
.seg button,.seg a{border:0; background:var(--surface); padding:4px 12px; color:var(--text-2); text-decoration:none; white-space:nowrap}
.seg button+button,.seg a+a{border-left:1px solid var(--border)}
.seg [aria-pressed="true"],.seg [aria-selected="true"],.seg [aria-current="page"]{background:var(--accent-soft); color:var(--text); box-shadow:inset 0 -2px 0 var(--accent)}
.tabs{display:flex; gap:0; border-bottom:1px solid var(--border); flex-wrap:wrap}
.tabs [role="tab"],.tabs a{border:0; background:none; padding:6px 12px; color:var(--text-2); text-decoration:none; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tabs [aria-selected="true"],.tabs [aria-current="page"]{color:var(--text); border-bottom-color:var(--accent)}
.facet{border:1px solid var(--border-strong); background:var(--surface); border-radius:3px; padding:1px 8px; font-size:12.5px; color:var(--text)}
.facet[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.facet .n{color:var(--text-3); font-variant-numeric:tabular-nums; margin-left:4px}
.facet.zero{opacity:.55}

/* 标签与胶囊 */
.tag{display:inline-flex; align-items:center; gap:4px; font-size:12px; border:1px solid var(--border); border-radius:3px; padding:0 6px; color:var(--text-2); background:var(--surface); white-space:nowrap}
.tag.warn{border-color:var(--st-drift); color:var(--st-drift)}
.tag.info{border-color:var(--st-pending); color:var(--st-pending)}
.st{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}

.cat-base{--cat:var(--cat-base)} .cat-a{--cat:var(--cat-a)} .cat-b{--cat:var(--cat-b)} .cat-c{--cat:var(--cat-c)} .cat-d{--cat:var(--cat-d)} .cat-e{--cat:var(--cat-e)} .cat-f{--cat:var(--cat-f)}

/* 服务地图 */

.note.red{background:var(--st-fail-soft); color:var(--text)} .note.red .shp{color:var(--st-fail)}

.chkrow.cr>.st:first-child{grid-area:sh} .chkrow.cr .meta{display:contents} .chkrow.cr .how{grid-area:how} .chkrow.cr .srcc{grid-area:src}
.chkrow.cr .ttl{grid-area:ttl} .chkrow.cr .res{grid-area:res} .chkrow.cr .tm{grid-area:tm}

@media (max-width:560px){
  .chkrow.cr{grid-template-columns:20px minmax(0,1fr) auto; grid-template-areas:"sh ttl res" ". meta tm"; row-gap:2px; align-items:start; padding-block:6px}

}

  .dlg>footer{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))} .dlg>footer>.btn{flex:1 1 auto} .dlg>footer>.btn.primary,.dlg>footer>.btn.solid{flex:1 1 100%; order:-1} }

/* ---------- 工作台 ---------- */
#app.mode-ws{height:100dvh; display:flex; flex-direction:column}
