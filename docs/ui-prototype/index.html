async function runStep(mid, sid, quiet){
  const g = GUIDES[mid]; const s = g.steps.find(x=>x.id===sid);
  if (!s || s.running || MOD[mid].life==='locked' || !(s.checks||[]).length || !stepApplies(s)) return;
  s.running = true; ST.stepMsg = null;
  if (!quiet) announce(`开始检测：${mid} 步骤 ${s.no}`);
  await runChecks(s.checks.filter(c=>checkApplies(c)));
  s.running = false;
  const st = stepState(s);
  const newly = ['done','done_manual'].includes(st) && !s.at;
  if (newly) s.at = '10/13 '+ts();
  updateModuleLife(mid);
  const cs = s.checks;
  const pass = cs.filter(c=>['pass','manual','manual_evidence'].includes(c.res)).length, fail = cs.filter(c=>c.res==='fail').length, err = cs.filter(c=>c.res==='error').length, una = cs.filter(c=>c.res==='unavailable').length;
  let text = `本步检测完成：${pass} 项通过${fail?`，${fail} 项未通过`:''}${err?`，${err} 项检测器出错`:''}${una?`，${una} 项待手动核对`:''}。`;
  if (st==='drifted') text += '仍处于漂移：修复后再测一次，漂移标记会自动解除。';
  else if (st==='error') text += '检测器出错不是你的配置问题：可以把它改为手动核对。';
  else if (st==='failed') text += '展开命中的常见错误看看原因。';
  if (newly) text = `步骤 ${s.no} 已达成${st==='done_manual'?'（含手动确认）':''}。即将进入下一步。`;
  ST.stepMsg = {key:mid+'.'+sid, ok:newly || ['done','done_manual'].includes(st), text};
  if (quiet) return;
  refresh(); announce(text);
  if (newly){
    const next = g.steps[s.no+1];
    setTimeout(()=>{ const r = ST.route; if (next && r.name==='module' && r.id===mid && r.tab==='guide'){ location.hash = `#module.${mid}.guide.${next.id}`; } }, 1300);
  }
}
async function runModule(mid){
  ST.modCheck[mid] = 'running'; refresh();
  const steps = GUIDES[mid].steps.filter(s=>(s.checks||[]).length && !s.opt && stepApplies(s));

  const all = steps.flatMap(s=>s.checks.filter(c=>checkApplies(c)));
  ST.modCheck[mid] = `检测整个模块完成：${all.length} 项，通过 ${all.filter(c=>c.res==='pass').length}，未通过 ${all.filter(c=>c.res==='fail').length}，检测器出错 ${all.filter(c=>c.res==='error').length}，待核对 ${all.filter(c=>c.res==='unavailable').length}，手动 ${all.filter(c=>c.res.startsWith('manual')).length}。`;

document.addEventListener('change', changeHandler);
document.addEventListener('submit', e=>{ e.preventDefault(); });
/* 方向键在图形节点之间移动：按屏幕几何位置找该方向上最近的节点（学习路线、架构图共用） */
function spatialNext(cur, sel, dir){
  const r0 = cur.getBoundingClientRect(); const cx = r0.left + r0.width/2, cy = r0.top + r0.height/2;
  let best = null, bestD = Infinity;
  $$(sel).forEach(n=>{ if (n===cur) return; const r = n.getBoundingClientRect(); if (!r.width) return; const x = r.left + r.width/2, y = r.top + r.height/2; const dx = x-cx, dy = y-cy;
    const ok = dir==='ArrowRight' ? dx>4 : dir==='ArrowLeft' ? dx<-4 : dir==='ArrowDown' ? dy>4 : dy<-4; if (!ok) return;
    const along = (dir==='ArrowRight'||dir==='ArrowLeft') ? Math.abs(dx) : Math.abs(dy), across = (dir==='ArrowRight'||dir==='ArrowLeft') ? Math.abs(dy) : Math.abs(dx);
    const d = along + across*2.5; if (d<bestD){ bestD = d; best = n; } });
  return best;
}
/* 课程大纲（role=tree）的键盘模型 */
function treeKey(e, t){
  const items = $$('#sidebar [role="treeitem"]');
  const i = items.indexOf(t); if (i<0) return false;
  const focus = n=>{ if (!n) return; items.forEach(x=>x.setAttribute('tabindex','-1')); n.setAttribute('tabindex','0'); ST.olFocus = n.dataset.ti; n.focus(); };
  const isLab = t.getAttribute('aria-level')==='1';
  if (e.key==='ArrowDown'){ focus(items[i+1]); return true; }
  if (e.key==='ArrowUp'){ focus(items[i-1]); return true; }
  if (e.key==='Home'){ focus(items[0]); return true; }
  if (e.key==='End'){ focus(items[items.length-1]); return true; }
  if (e.key==='ArrowRight'){ if (isLab){ if (t.getAttribute('aria-expanded')!=='true') A.outline(t); else focus(items[i+1]); } return true; }
  if (e.key==='ArrowLeft'){ if (isLab){ if (t.getAttribute('aria-expanded')==='true') A.outline(t); } else { const lab = t.closest('li[role="none"]').parentElement.closest('li[role="none"]'); focus(lab && lab.querySelector('[aria-level="1"]')); } return true; }
  if (e.key==='Enter' || e.key===' '){ if (isLab){ if (e.key==='Enter'){ location.hash = '#lab.'+t.dataset.lab; } else A.outline(t); } else location.hash = t.getAttribute('href'); return true; }
  return false;
}
let gPending = false, gTimer = null;
document.addEventListener('keydown', e=>{
  const t = e.target;
  const typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); A.palette(); return; }
  if (e.key==='Escape'){
    if (ST.dialog || ST.drawer){ e.preventDefault(); closeOverlay(); return; }
    if (ST.popOpen){ const k = ST.popOpen; ST.popOpen = null; renderTopbar(ST.route && ['setup','login','forbidden'].includes(ST.route.name)); const b = $(`[data-act="pop"][data-pop="${k}"]`); b && b.focus(); return; }
    if (ST.sidebarOpen){ ST.sidebarOpen = false; renderSidebar(ST.route); renderTopbar(false); $('.menu-btn') && $('.menu-btn').focus(); return; }
  }
  // 焦点限制在覆盖层内
  if (e.key==='Tab' && (ST.dialog || ST.drawer)){
    const boxes = $$('#overlay .dialog, #overlay .drawer'); const box = boxes[boxes.length-1];
    if (box){ const f = $$('a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])', box); if (f.length){ const first = f[0], last = f[f.length-1]; if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } else if (!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); } } }
  }
  if (ST.dialog && ST.dialog.type==='palette' && ['ArrowDown','ArrowUp','Enter'].includes(e.key)){
    const items = $$('#pal-list a'); if (!items.length) return;
    if (e.key==='Enter'){ e.preventDefault(); const a = items[ST.palI||0]; if (a) paletteRun(a); return; }
    e.preventDefault(); ST.palI = ((ST.palI||0) + (e.key==='ArrowDown'?1:-1) + items.length) % items.length; items.forEach((a,i)=>{ a.classList.toggle('act', i===ST.palI); a.setAttribute('aria-selected', String(i===ST.palI)); }); items[ST.palI].scrollIntoView({block:'nearest'}); return;
  }
  // 课程大纲树
  if (t && t.closest && t.closest('#sidebar [role="tree"]') && t.getAttribute('role')==='treeitem'){ if (treeKey(e, t)) { e.preventDefault(); return; } }
  // 学习路线 / 架构图的节点：方向键在相邻节点间移动
  if (t && t.matches && ['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key) && (t.matches('.lg-n') || t.matches('.m-n[tabindex], .m-badge[tabindex], .m-guard[tabindex]'))){
    e.preventDefault(); const sel = t.matches('.lg-n') ? '.lg-n' : '.m-n[tabindex], .m-badge[tabindex]'; const n = spatialNext(t, sel, e.key); if (n){ if (t.matches('.lg-n')){ ST.pathSel = +n.dataset.lab; refresh(); const k = $(`.lg-n[data-lab="${ST.pathSel}"]`); k && k.focus(); } else n.focus(); } return;
  }
  // 小测：单选框上按 Enter 提交
  if (e.key==='Enter' && t && t.dataset && t.dataset.act==='quiz-pick'){ e.preventDefault(); if (ST.quiz.pick[ST.quiz.i]==null) A['quiz-pick'](t); A['quiz-submit'](); return; }
  // SVG 节点、表格行：Enter / 空格
  if ((e.key==='Enter' || e.key===' ') && t && t.getAttribute && t.getAttribute('role')==='button' && t.tagName!=='BUTTON'){ e.preventDefault(); if (e.key==='Enter' && t.dataset.act==='path-sel' && ST.pathSel===+t.dataset.lab){ location.hash = '#lab.'+t.dataset.lab; return; } t.dispatchEvent(new MouseEvent('click', {bubbles:true})); return; }
  if (e.key==='Enter' && t && t.matches && t.matches('tr[data-go]')){ location.hash = t.dataset.go; return; }
  if (e.key==='Enter' && t && t.dataset && t.dataset.act==='var-input'){ e.preventDefault(); commitVar(t); return; }
  if (e.key==='Enter' && t && t.dataset && t.dataset.act==='tr-sel'){ A['tr-sel'](t); return; }
  // 真正的 tablist（做法、对比实验视图、读取方式）：←→ 切换并保持焦点在新选中的 tab 上
  if ((e.key==='ArrowRight' || e.key==='ArrowLeft' || e.key==='Home' || e.key==='End') && t && t.getAttribute && t.getAttribute('role')==='tab'){
    const tabs = $$('[role="tab"]', t.closest('[role="tablist"]')); const i = tabs.indexOf(t);
    const j = e.key==='Home' ? 0 : e.key==='End' ? tabs.length-1 : (i + (e.key==='ArrowRight'?1:-1) + tabs.length) % tabs.length;
    const n = tabs[j]; if (n){ e.preventDefault(); n.click(); const again = n.id ? document.getElementById(n.id) : null; (again||n).focus(); } return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || ST.dialog || ST.drawer) return;
  if (!ST.shortcutsOn) return;   // 单键快捷键可以在 设置 › 账号 中关闭（WCAG 2.1.4）
  const k = e.key.toLowerCase();
  if (gPending){ gPending = false; clearTimeout(gTimer); const map = {o:'#overview', p:'#path', m:'#modules', a:'#map', c:continueTarget().href}; if (map[k]){ e.preventDefault(); location.hash = map[k]; } return; }
  if (k==='g'){ gPending = true; gTimer = setTimeout(()=>{ gPending = false; }, 1200); return; }
  if (e.key==='?'){ e.preventDefault(); A.shortcuts(); return; }
  const r = ST.route;
  if (r && r.name==='module' && r.tab==='guide'){
    const g = GUIDES[r.id]; const s = g.steps.find(x=>x.id===r.step) || firstOpenStep(r.id); const i = g.steps.indexOf(s);
    if (k==='j' && g.steps[i+1]){ location.hash = `#module.${r.id}.guide.${g.steps[i+1].id}`; }
    if (k==='k' && g.steps[i-1]){ location.hash = `#module.${r.id}.guide.${g.steps[i-1].id}`; }
    if (k==='r'){ e.preventDefault(); runStep(r.id, s.id); }
  }
});
window.addEventListener('hashchange', ()=>{
  const prev = ST.route;
  ST.sidebarOpen = false; ST.popOpen = null; ST.varEdit = null; ST.varErr = null;
  const r = parseHash();
  if (!(prev && r.name===prev.name && r.id===prev.id && r.step===prev.step) && !ST.pendingHl) { ST.hlSub = null; }
  if (r.name==='module' && r.tab==='guide' && prev && !(prev.name==='module' && prev.id===r.id && prev.tab==='guide')) ST.guidePane = 'content';
  if (ST.drawer || ST.dialog){ ST.drawer = null; ST.dialog = null; }
  const hadHl = !!ST.pendingHl;
  render(true);
  if (hadHl && !ST.pendingHl) return;   // 已经把焦点放到被高亮的小步上
  const h = $('#view h1'); if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
});
window.addEventListener('resize', ()=>{ syncTopbarH(); });

/* ---------- 启动 ---------- */
try { document.documentElement.lang = 'zh-CN'; } catch(e){}
initData();
applyTheme();
render(false);
try { if (window.ResizeObserver){ new ResizeObserver(()=>syncTopbarH()).observe($('#topbar')); } } catch(e){}

</script>
