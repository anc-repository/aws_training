<title>CloudAlbum 学习控制台</title>
<style>
/* 布局：工程笔记本——48px 顶栏状态条 + 248px 左栏（导航 + 课程大纲）+ 以表格为主的内容区；
   颜色只表达语义，单一强调色“青瓷”只用于：你在这里 / 当前 / 推荐 / 焦点环。
   字体：不加载网络字体（L0 下控制台不依赖外部 CDN），中文用系统黑体，ID/ARN/命令用等宽。 */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#EFEEE8; --border:#DAD8D0; --border-strong:#8A867B;
  --text:#1C1D1F; --text-2:#4A4D55; --text-3:#63666E; --ink:#1C1D1F; --on-ink:#FFFFFF;
  --accent:#0F6E6E; --accent-soft:#DDEFEC; --code-bg:#EFEFEC; --danger-edge:#B3261E;
  --st-pass:#1B703F; --st-pass-soft:#E2F2E7;
  --st-manual:#6A3EA1; --st-manual-soft:#EFE7F8;
  --st-fail:#B3261E; --st-fail-soft:#FBE5E3;
  --st-drift:#A8380A; --st-drift-soft:#FCE9DD;
  --st-pending:#1F5FAD; --st-pending-soft:#E3ECF8;
  --st-error:#5A606B; --st-error-soft:#EAEBED;
  --st-needs:#6A3EA1;
  --st-stale:#8A6100; --st-stale-soft:#F7EED6;
  --st-locked:#8C9098; --st-locked-soft:#EFEFEC;
  --st-cleaned:#7A5E2E;
  --viz-before:#8C8F96; --viz-after:#0F6E6E; --viz-third:#9A6B1F; --viz-grid:#E4E2DA;
  --scrim:rgb(28 29 31 / .32);
  --shadow:0 8px 24px rgb(0 0 0 / .12);
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,"Noto Sans Mono CJK SC","Menlo",monospace;
  --topbar-h:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1B1C1F; --surface-2:#232428; --border:#34363B; --border-strong:#6E7179;
    --text:#E9E7E2; --text-2:#B6B4AE; --text-3:#96948F; --ink:#E9E7E2; --on-ink:#141517;
    --accent:#4FB3A9; --accent-soft:#16302D; --code-bg:#1F2023; --danger-edge:#F0716A;
    --st-pass:#4CB97A; --st-pass-soft:#163222;
    --st-manual:#B08BE0; --st-manual-soft:#2A2138;
    --st-fail:#F0716A; --st-fail-soft:#3A1C1A;
    --st-drift:#F08A4B; --st-drift-soft:#3A2214;
    --st-pending:#6FA3E6; --st-pending-soft:#172A40;
    --st-error:#9AA0AA; --st-error-soft:#26282C;
    --st-needs:#B08BE0;
    --st-stale:#D9A93A; --st-stale-soft:#33290F;
    --st-locked:#6F737B; --st-locked-soft:#202124;
    --st-cleaned:#C9AE7A;
    --viz-before:#7D8088; --viz-after:#4FB3A9; --viz-third:#D1A45A; --viz-grid:#2C2E32;
    --scrim:rgb(0 0 0 / .55);
    --shadow:0 8px 24px rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1B1C1F; --surface-2:#232428; --border:#34363B; --border-strong:#6E7179;
  --text:#E9E7E2; --text-2:#B6B4AE; --text-3:#96948F; --ink:#E9E7E2; --on-ink:#141517;
  --accent:#4FB3A9; --accent-soft:#16302D; --code-bg:#1F2023; --danger-edge:#F0716A;
  --st-pass:#4CB97A; --st-pass-soft:#163222;
  --st-manual:#B08BE0; --st-manual-soft:#2A2138;
  --st-fail:#F0716A; --st-fail-soft:#3A1C1A;
  --st-drift:#F08A4B; --st-drift-soft:#3A2214;
  --st-pending:#6FA3E6; --st-pending-soft:#172A40;
  --st-error:#9AA0AA; --st-error-soft:#26282C;
  --st-needs:#B08BE0;
  --st-stale:#D9A93A; --st-stale-soft:#33290F;
  --st-locked:#6F737B; --st-locked-soft:#202124;
  --st-cleaned:#C9AE7A;
  --viz-before:#7D8088; --viz-after:#4FB3A9; --viz-third:#D1A45A; --viz-grid:#2C2E32;
  --scrim:rgb(0 0 0 / .55);
  --shadow:0 8px 24px rgb(0 0 0 / .4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:14px; line-height:1.6;
  padding-inline:clamp(16px,2vw,24px); padding-block:0;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600}
h1{font-size:20px; line-height:1.4}
h2{font-size:15px; line-height:1.5}
h3{font-size:14px}
p{margin:0}
a{color:var(--accent); text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
code,kbd,pre,.mono{font-family:var(--font-mono)}
.mono{font-size:.92em}
.num,td.num,.tnum{font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
::selection{background:var(--accent-soft)}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
/* 视觉隐藏的文件选择框获得键盘焦点时，把焦点环画在紧随其后的 label 按钮上 */
.sr:focus-visible+label{outline:2px solid var(--accent); outline-offset:2px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:12px} .xs{font-size:11.5px}
.nowrap{white-space:nowrap}
.wrap-any{overflow-wrap:anywhere}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}
.row.between{justify-content:space-between}
.stack{display:grid; gap:12px; min-width:0}
.stack-8{display:grid; gap:8px; min-width:0}
.stack-16{display:grid; gap:16px; min-width:0}
.stack-24{display:grid; gap:24px; min-width:0}
/* 网格子项默认 min-width:auto，会被表格等内容撑宽：统一清零，长内容在各自的 overflow-x 容器里滚动 */
.stack>*,.stack-8>*,.stack-16>*,.stack-24>*,.grid-2>*,.grid-3>*,.split>*{min-width:0}
.spacer{flex:1 1 auto}
.ico{width:16px; height:16px; flex:none; display:inline-block; vertical-align:-3px}
.ico-20{width:20px; height:20px}
hr.rule{border:0; border-top:1px solid var(--border); margin:0}

/* ---------- 顶栏 ---------- */
.skip{position:absolute; left:-9999px; top:8px; z-index:100; background:var(--ink); color:var(--on-ink); padding:6px 10px; border:0; border-radius:4px}
.skip:focus{left:16px}
/* 顶栏：目标是单行 48px。实际高度由 ResizeObserver 写入 --topbar-h，左栏、检测栏的吸顶偏移都读这个变量，
   所以即使折行也不会压住内容；<1440px 隐藏次要标签文字，<768px 顶栏不吸顶（见响应式一节）。 */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--border);
  min-height:48px; display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; padding-block:6px;
}
.tb .lbl-x{white-space:nowrap}
.brand{display:flex; align-items:center; gap:8px; min-width:0; color:var(--text); text-decoration:none; font-weight:600; white-space:nowrap}
.brand svg{width:22px; height:22px}
.tag{display:inline-flex; align-items:center; gap:4px; height:20px; padding-inline:6px; border:1px solid var(--border); border-radius:3px; font-size:11.5px; color:var(--text-2); white-space:nowrap; background:var(--surface)}
.tag-sample{border-style:dashed; color:var(--st-stale); border-color:var(--st-stale); background:var(--st-stale-soft)}
.tb{display:inline-flex; align-items:center; gap:6px; height:32px; padding-inline:8px; border:1px solid transparent; border-radius:4px; background:transparent; font-size:13px; color:var(--text); text-decoration:none; white-space:nowrap; position:relative}
.tb:hover{border-color:var(--border)}
.tb-continue{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); max-width:min(300px,100%); min-width:0}
.tb-continue .lbl{overflow:hidden; text-overflow:ellipsis; min-width:0}
.tb-continue.fix{border-color:var(--st-drift); color:var(--st-drift); background:var(--st-drift-soft)}
.tb-tier{font-family:var(--font-mono); font-size:12.5px; border-color:var(--border)}
.tb-tier b{font-weight:600}
.menu-btn{display:none}
.has-pop{position:relative}
.pop{
  display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:40; min-width:280px; max-width:min(380px,calc(100vw - 32px));
  background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow);
  padding:10px 12px; font-size:12.5px; color:var(--text); white-space:normal; text-align:left; line-height:1.55;
}
.pop.right{left:auto; right:0}
/* 纯说明型浮层（不含可交互元素）才随悬停 / 聚焦显示，并使用 role=tooltip；
   含链接或按钮的浮层一律是 disclosure：点击按钮展开（aria-expanded），不随悬停自动展开 */
.has-tip:hover>.pop,.has-tip:focus-within>.pop,.has-pop.open>.pop{display:block}
.pop h4{font-size:12.5px; margin-bottom:4px}
.pop .kvs{display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 10px}
.menu{display:grid; gap:2px; min-width:220px}
.menu button,.menu a{display:flex; align-items:center; gap:8px; width:100%; min-height:32px; padding-inline:8px; border:0; border-radius:4px; background:transparent; text-align:left; color:var(--text); text-decoration:none; font-size:13px}
.menu button:hover,.menu a:hover{background:var(--surface-2)}
.menu .sep{border-top:1px solid var(--border); margin-block:4px}
.menu [aria-checked="true"]::after{content:"✓"; margin-left:auto; color:var(--accent)}

/* ---------- 外框 ---------- */
.shell{display:grid; grid-template-columns:248px minmax(0,1fr); gap:0 24px; align-items:start}
.sidebar{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--topbar-h)); max-height:calc(100dvh - var(--topbar-h) - 28px);
  overflow:auto; padding-block:12px 24px; padding-inline:0 12px; border-right:1px solid var(--border); font-size:13px;
}
.nav-group{margin-bottom:10px}
.nav-group>.gl{font-size:11.5px; color:var(--text-3); letter-spacing:.06em; padding-inline:8px; margin-bottom:2px}
.nav a{display:flex; align-items:center; gap:8px; min-height:32px; padding-inline:8px; border-radius:4px; color:var(--text); text-decoration:none}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
.nav .cnt{margin-left:auto; font-size:11.5px; min-width:20px; height:18px; padding-inline:5px; border-radius:9px; display:inline-grid; place-items:center; font-variant-numeric:tabular-nums}
.cnt-fail{background:var(--st-fail-soft); color:var(--st-fail)}
.cnt-warn{background:var(--st-stale-soft); color:var(--st-stale)}
.outline{border-top:1px solid var(--border); padding-top:10px; margin-top:6px}
.outline .oh{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--text-3); letter-spacing:.06em; padding-inline:8px; margin-bottom:4px}
.ol-lab{display:flex; align-items:center; gap:6px; width:100%; min-height:30px; padding-inline:6px; border:0; border-radius:4px; background:transparent; text-align:left; font-size:13px; cursor:pointer}
.ol-lab:focus-visible,.ol-mods a:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.ol-tree,.ol-tree [role="group"]{list-style:none; margin:0; padding:0}
.ol-track{font-size:11.5px; color:var(--text-2); padding-inline:8px; margin-bottom:4px}
.ol-lab:hover{background:var(--surface-2)}
.ol-lab .chev{transition:transform .15s; color:var(--text-3)}
.ol-lab[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ol-lab .reddot{width:6px; height:6px; border-radius:50%; background:var(--st-drift); margin-left:auto}
.ol-mods{display:grid; padding-left:18px}
.ol-mods a{display:flex; align-items:center; gap:6px; min-height:28px; padding-inline:6px; border-radius:4px; color:var(--text); text-decoration:none; font-size:12.5px}
.ol-mods a:hover{background:var(--surface-2)}
.ol-mods a.cur{box-shadow:inset 2px 0 0 var(--accent); background:var(--accent-soft)}
.ol-mods .steps{margin-left:auto; color:var(--text-3); font-size:11.5px; font-variant-numeric:tabular-nums}
.proto-index{border-top:1px solid var(--border); padding-top:10px; margin-top:10px}
.proto-index a{font-size:12px}

main{min-width:0; padding-block:16px 56px; outline:none}
.statusbar{
  display:flex; flex-wrap:wrap; gap:2px 14px; align-items:center; min-height:28px; padding-block:4px;
  border-top:1px solid var(--border); font-family:var(--font-mono); font-size:11.5px; color:var(--text-3);
}
.statusbar .live::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--st-pass); margin-right:4px; vertical-align:1px}

/* ---------- 横幅 ---------- */
.banners{display:grid; gap:8px; margin-bottom:12px}
.banner{display:flex; align-items:flex-start; gap:10px; border:1px solid var(--border); border-radius:6px; padding-block:8px; padding-inline:12px; font-size:13px; background:var(--surface); min-width:0}
.banner .bt{flex:1 1 auto; min-width:0}
.banner .ba{display:flex; gap:6px; flex-wrap:wrap; flex:none}
.banner.b-drift{border-color:var(--st-drift); background:var(--st-drift-soft)}
.banner.b-drift>.ico{color:var(--st-drift)}
.banner.b-fail{border-color:var(--st-fail); background:var(--st-fail-soft)}
.banner.b-fail>.ico{color:var(--st-fail)}
.banner.b-warn{border-color:var(--st-stale); background:var(--st-stale-soft)}
.banner.b-warn>.ico{color:var(--st-stale)}
.banner.b-info{border-color:var(--st-pending); background:var(--st-pending-soft)}
.banner.b-info>.ico{color:var(--st-pending)}
.banner.b-muted{background:var(--st-error-soft); border-color:var(--border-strong)}
.banner.b-muted>.ico{color:var(--st-error)}
.banner.b-ok{border-color:var(--st-pass); background:var(--st-pass-soft)}
.banner.b-ok>.ico{color:var(--st-pass)}
.banner.b-accent{border-color:var(--accent); background:var(--accent-soft)}
.banner.b-accent>.ico{color:var(--accent)}
.more-banners{font-size:12.5px; border:0; background:transparent; color:var(--text-2); text-align:left; padding:0; text-decoration:underline; text-underline-offset:2px}

/* ---------- 页面标题 ---------- */
.crumbs{font-size:12px; color:var(--text-3); margin-bottom:6px; display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.crumbs a{color:var(--text-2); text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.ph{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px 16px; margin-bottom:16px}
.ph-t{min-width:0}
.ph-meta{font-size:13px; color:var(--text-2); margin-top:2px}
.section-t{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.section-t h2 .faint{font-weight:400}
.eyebrow{font-size:11.5px; letter-spacing:.06em; color:var(--text-3)}

/* ---------- 面板、网格 ---------- */
.panel{background:var(--surface); border:1px solid var(--border); border-radius:6px; min-width:0}
.panel-h{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-block:10px; padding-inline:14px; border-bottom:1px solid var(--border)}
.panel-h h2{font-size:14px}
.panel-b{padding-block:12px; padding-inline:14px; min-width:0}
.panel.flat{background:transparent}
.panel.hl{border-color:var(--accent); box-shadow:inset 2px 0 0 var(--accent)}
.grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.grid-auto{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.kv{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:6px 14px; font-size:13px; margin:0}
.kv dt{color:var(--text-3)}
.kv dd{margin:0; min-width:0; overflow-wrap:anywhere}
.split{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}

/* ---------- 表格 ---------- */
.tw{overflow-x:auto; border:1px solid var(--border); border-radius:6px; background:var(--surface); max-width:100%}
table.t{width:100%; border-collapse:collapse; font-size:13px; line-height:1.5}
table.t th{background:var(--surface-2); color:var(--text-2); font-weight:600; text-align:left; padding:8px 10px; white-space:nowrap; font-size:12.5px}
table.t td{padding:8px 10px; border-top:1px solid var(--border); vertical-align:top}
table.t tr.cur td{background:var(--accent-soft)}
/* 高亮行（当前行、警告行）里的辅助文字一律用 --text-2，保证对比度 ≥ 4.5:1 */
table.t tr.cur .faint,table.t tr.warn .faint,table.t tr.cur .src,table.t tr.warn .src,.rail-i.cur .tm{color:var(--text-2)}
table.t tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
table.t tr.warn td{background:var(--st-drift-soft)}
table.t tbody tr[data-go]{cursor:pointer}
table.t tbody tr[data-go]:hover td{background:var(--surface-2)}
table.t tbody tr[data-go]:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
table.t td.mono,table.t .idc{font-family:var(--font-mono); font-size:12.5px}
table.t caption{caption-side:bottom; text-align:left; font-size:12px; color:var(--text-3); padding:8px 10px}

/* ---------- 状态徽章、来源标签、运行圆点 ---------- */
.sb{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; white-space:nowrap; line-height:1.3}
.sb svg{width:15px; height:15px; flex:none}
.sb-pass{color:var(--st-pass)} .sb-manual{color:var(--st-manual)} .sb-fail{color:var(--st-fail)}
.sb-drift{color:var(--st-drift)} .sb-pending{color:var(--st-pending)} .sb-error{color:var(--st-error)}
.sb-needs{color:var(--st-needs)} .sb-stale{color:var(--st-stale)} .sb-locked{color:var(--text-3)}
.sb-cleaned{color:var(--st-cleaned)} .sb-avail{color:var(--text-2)} .sb-skip{color:var(--text-3)} .sb-read{color:var(--text-3)}
.sb .sfx{color:var(--text-3); font-size:11.5px}
.src{display:inline-flex; align-items:center; gap:3px; height:18px; padding-inline:4px; border:1px solid var(--border); border-radius:3px; font-family:var(--font-mono); font-size:11px; color:var(--text-2); background:var(--surface); white-space:nowrap}
.src svg{width:10px; height:10px}
.src.off{text-decoration:line-through; color:var(--text-3)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; vertical-align:1px}
.dot-ok{background:var(--st-pass)} .dot-degraded{background:var(--st-stale)} .dot-error{background:var(--st-fail)}
.dot-off{background:transparent; border:1.5px dashed var(--st-locked)}
.dot-unk{background:transparent; border:1.5px solid var(--text-3)}
.pill{display:inline-flex; align-items:center; gap:4px; height:20px; padding-inline:6px; border-radius:3px; font-size:11.5px; white-space:nowrap; border:1px solid var(--border); color:var(--text-2); background:var(--surface-2)}
.pill.focus{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.pill.hourly{border-color:var(--st-stale); color:var(--st-stale); background:var(--st-stale-soft)}
.pill.opt{border-style:dashed}
.pill.sim{border-style:dashed; color:var(--st-manual); border-color:var(--st-manual)}
.pill.bad{border-color:var(--st-fail); color:var(--st-fail); background:var(--st-fail-soft)}
.pill.ok{border-color:var(--st-pass); color:var(--st-pass); background:var(--st-pass-soft)}

/* ---------- 进度条 ---------- */
.segbar{display:flex; height:8px; width:96px; border-radius:2px; overflow:hidden; background:var(--surface-2); border:1px solid var(--border); flex:none}
.segbar.block{width:100%; height:10px}
.segbar>span{display:block; height:100%; transition:width .2s}
.s-auto{background:var(--st-pass)}
.s-man{background:repeating-linear-gradient(135deg,var(--st-manual) 0 2px,var(--st-manual-soft) 2px 4px)}
.s-prog{background:var(--st-pending-soft); box-shadow:inset 0 0 0 1px var(--st-pending)}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--text-2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:4px}

/* ---------- 按钮与控件 ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:32px; padding-inline:12px; border:1px solid var(--border-strong); border-radius:4px; background:var(--surface); color:var(--text); font-size:13px; text-decoration:none; white-space:nowrap; transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn-ink{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.btn-ink:hover{background:var(--ink); opacity:.9}
.btn-accent{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.btn-accent:hover{background:var(--accent-soft); border-color:var(--accent); opacity:.9}
.btn-danger{border-color:var(--st-fail); color:var(--st-fail)}
.btn-sm{min-height:26px; padding-inline:8px; font-size:12px}
.btn-ghost{border-color:transparent; background:transparent}
.btn-ghost:hover{border-color:var(--border)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
.btn .kbd{margin-left:2px}
.kbd{display:inline-grid; place-items:center; min-width:18px; height:18px; padding-inline:4px; font-family:var(--font-mono); font-size:11px; border:1px solid var(--border-strong); border-radius:3px; background:var(--surface-2); color:var(--text-2); line-height:1}
.linkbtn{border:0; background:transparent; color:var(--accent); padding:0; text-decoration:underline; text-underline-offset:2px; font-size:inherit}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=search],input[type=date],select,textarea{
  min-height:32px; border:1px solid var(--border-strong); border-radius:4px; background:var(--surface); color:var(--text); padding-inline:8px; font-size:13px; max-width:100%;
}
textarea{padding-block:6px; resize:vertical; width:100%}
input.mono{font-family:var(--font-mono)}
input[aria-invalid="true"]{border-color:var(--st-fail)}
input[type=radio],input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px; margin:0; vertical-align:-2px}
label.opt{display:flex; align-items:flex-start; gap:8px; padding-block:4px; cursor:pointer; min-width:0}
.field{display:grid; gap:4px; min-width:0}
.field>.fl{font-size:12px; color:var(--text-2)}
.err-t{color:var(--st-fail); font-size:12.5px}
.ok-t{color:var(--st-pass); font-size:12.5px}
/* 选中下划线用 inset 阴影画在标签内部，不用负外边距，避免在 overflow-x:auto 的容器里产生 1px 纵向溢出 */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); overflow-x:auto; overflow-y:hidden; scrollbar-width:thin}
.tab{display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border:0; background:transparent; color:var(--text-2); font-size:13px; white-space:nowrap; text-decoration:none}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"],.tab[aria-current="page"]{color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); font-weight:600}
.tab:focus-visible{outline-offset:-2px}
.tab .att{width:6px; height:6px; border-radius:50%; background:var(--st-drift)}
.seg{display:inline-flex; border:1px solid var(--border-strong); border-radius:4px; overflow:hidden; flex:none; max-width:100%}
.seg button{border:0; background:var(--surface); padding-inline:10px; min-height:28px; font-size:12.5px; color:var(--text-2); white-space:nowrap}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--on-ink)}
.chip{display:inline-flex; align-items:center; gap:4px; min-height:26px; padding-inline:8px; border:1px solid var(--border-strong); border-radius:3px; background:var(--surface); font-size:12.5px; color:var(--text-2); white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.chip .n{font-variant-numeric:tabular-nums; color:var(--text-3)}
.filters{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-bottom:12px}
.filters .fl{font-size:12px; color:var(--text-3)}

/* ---------- 命令块 ---------- */
.cmd{border:1px solid var(--border); border-radius:4px; background:var(--code-bg); min-width:0}
.cmd.danger{border-left:3px solid var(--danger-edge)}
.cmd-h{display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; padding-block:4px; padding-inline:8px; border-bottom:1px solid var(--border); font-size:12px; color:var(--text-2); min-width:0}
.cmd-h .spacer{flex:1}
.cmd pre{margin:0; padding-block:10px; padding-inline:12px; overflow-x:auto; font-size:13px; line-height:1.55; white-space:pre; tab-size:2}
.cmd .cx{font-size:12.5px; color:var(--text-2); padding-block:0 8px; padding-inline:12px}
.cmd details{border-top:1px dashed var(--border); font-size:12px}
.cmd details summary{padding-block:4px; padding-inline:12px; color:var(--text-3); cursor:pointer}
.cmd details pre{font-size:12px; color:var(--text-2); padding-top:0}
.v{border-bottom:1px dotted var(--accent)}
.vm{color:var(--st-fail); outline:1px dashed var(--st-fail); outline-offset:1px; border-radius:2px; padding-inline:2px}
.vs{color:var(--text-3); font-style:italic}
.copy-btn{display:inline-flex; align-items:center; gap:4px; min-height:24px; padding-inline:6px; border:1px solid var(--border-strong); border-radius:3px; background:var(--surface); font-size:12px; color:var(--text)}
.copy-btn.warn{border-color:var(--st-fail); color:var(--st-fail)}
.copy-btn.done{border-color:var(--st-pass); color:var(--st-pass)}
.runs-on{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--text-2); min-width:0; flex-wrap:wrap}
.cmd-note{font-size:12px; color:var(--st-fail); padding-block:4px; padding-inline:12px; border-top:1px solid var(--border)}
.cmd-confirm{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding-block:6px; padding-inline:12px; border-top:1px solid var(--danger-edge); background:var(--st-fail-soft); font-size:12.5px; color:var(--text)}
.cmd-confirm b{color:var(--st-fail)}

/* ---------- 检查结果行 ---------- */
.cks{display:grid}
.ck{display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:2px 8px; padding-block:8px; border-top:1px solid var(--border); align-items:start}
.ck:first-child{border-top:0}
.ck>.ic{padding-top:2px}
.ck>.ic svg{width:16px; height:16px}
.ck-t{font-size:13px; line-height:1.45}
.ck-m{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; font-size:11.5px; color:var(--text-3); margin-top:2px}
.ck-ea{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:0 8px; font-size:12px; margin-top:4px}
.ck-ea dt{color:var(--text-3)}
.ck-ea dd{margin:0; font-family:var(--font-mono); font-size:11.5px; overflow-wrap:anywhere}
.ck-ea dd.bad{color:var(--st-fail)}
.ck-a{font-size:12px; white-space:nowrap}
.ck.fresh{animation:fadein .12s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.spin{animation:spin 0.9s linear infinite; transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.waittimer{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--st-pending); font-variant-numeric:tabular-nums}

/* ---------- 配置指南三栏 ---------- */
.varstrip{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:12.5px; padding-block:8px; padding-inline:10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); margin-bottom:12px}
.varchip{display:inline-flex; align-items:center; gap:4px; min-width:0; max-width:100%; border:1px solid var(--border); border-radius:3px; padding-inline:6px; min-height:24px; background:var(--surface-2)}
.varchip .k{color:var(--text-3)}
.varchip .val{font-family:var(--font-mono); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.varchip .from{font-size:10.5px; color:var(--text-3); border-left:1px solid var(--border); padding-left:4px}
.varchip.miss{border:1px dashed var(--st-fail); background:var(--st-fail-soft)}
.varchip.miss .val{color:var(--st-fail)}
.varchip input{min-height:22px; width:170px; font-size:12px}
.guide{display:grid; grid-template-columns:232px minmax(0,1fr) 320px; gap:16px; align-items:start}
.gcol{min-width:0}
.gtabs{display:none; margin-bottom:12px}
.rail{display:grid; gap:2px}
/* 吸顶加在栏本身（网格子项、align-self:start），它的包含块是整个 .guide，才能真正吸住 */
.guide .railcol{position:sticky; top:calc(var(--topbar-h) + 12px); align-self:start}
.rail-i{display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:6px; align-items:center; min-height:34px; padding-inline:8px; border:0; border-radius:4px; background:transparent; text-align:left; font-size:13px; color:var(--text); text-decoration:none}
.rail-i:hover{background:var(--surface-2)}
.rail-i.cur{background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent); font-weight:600}
.rail-i .tm{font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums; font-weight:400}
.rail-i .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rail-i.opt .ttl::after{content:" 选做"; font-size:11px; color:var(--text-3); font-weight:400}
.rail-x{border-top:1px solid var(--border); margin-top:8px; padding-top:8px; display:grid; gap:2px; font-size:12.5px}
.rail-x a{display:flex; justify-content:space-between; gap:8px; padding-inline:8px; min-height:28px; align-items:center; border-radius:4px; text-decoration:none; color:var(--text-2)}
.rail-x a:hover{background:var(--surface-2)}
.stepcard .why{color:var(--text-2); font-size:13.5px; max-width:68ch}
.notice{display:flex; gap:8px; align-items:flex-start; padding-block:8px; padding-inline:10px; border-radius:4px; font-size:12.5px; border:1px solid var(--border)}
.notice.hourly{border-color:var(--st-stale); background:var(--st-stale-soft)}
.notice.hourly>.ico{color:var(--st-stale)}
.notice.info{border-color:var(--st-pending); background:var(--st-pending-soft)}
.notice.lock{border-style:dashed; border-color:var(--border-strong); background:var(--st-locked-soft)}
.notice.accent{border-color:var(--accent); background:var(--accent-soft)}
.crumbpath{display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:12.5px}
.crumbpath b{font-weight:600}
.crumbpath .sepc{color:var(--text-3)}
ol.substeps{margin:0; padding-left:22px; display:grid; gap:6px; font-size:13.5px}
ol.substeps li{padding-block:2px; padding-inline:6px; border-radius:3px; margin-left:-6px}
ol.substeps li.hl{background:var(--st-drift-soft); outline:1px solid var(--st-drift)}
ol.substeps code,.inline-code{font-family:var(--font-mono); font-size:12.5px; background:var(--code-bg); border:1px solid var(--border); border-radius:3px; padding-inline:3px; overflow-wrap:anywhere}
details.fold{border:1px solid var(--border); border-radius:4px; background:var(--surface)}
details.fold>summary{list-style:none; cursor:pointer; padding-block:6px; padding-inline:10px; display:flex; gap:8px; align-items:center; font-size:13px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸"; color:var(--text-3); width:10px}
details.fold[open]>summary::before{content:"▾"}
details.fold>.fb{padding-block:0 10px; padding-inline:28px 12px; font-size:13px; color:var(--text-2); display:grid; gap:6px}
/* 总览：回访摘要折叠成一行；“你在这里”左右两栏；其余区块用分隔线而不是卡片 */
details.fold.ret{border-color:var(--border); background:var(--surface-2)}
details.fold.ret>summary{flex-wrap:wrap; row-gap:2px; min-height:32px}
details.fold.ret>summary>span{min-width:0}
.yah-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,300px); gap:24px; align-items:start}
.yah-done{border-left:1px solid var(--border); padding-left:20px; min-width:0}
.ov-sec{border-top:1px solid var(--border); padding-top:12px; min-width:0}
.ov-sec h2{margin:0}
.pit-dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--st-drift); flex:none}
.pit-dot.hit{background:var(--st-drift)}
.saa-d{font-size:11px; padding-inline:5px; border-radius:3px; border:1px solid var(--border-strong); color:var(--text-2); white-space:nowrap}
.gnav{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding-block:10px; border-top:1px solid var(--border); margin-top:16px; font-size:12.5px; color:var(--text-3)}
.checkcol{position:sticky; top:calc(var(--topbar-h) + 12px)}
.minimap svg{width:100%; height:auto; display:block}
.delta{display:grid; gap:4px; min-width:0}
.delta .drow{display:grid; grid-template-columns:2.6em minmax(0,1fr); gap:6px; align-items:center}
.dchain{display:flex; flex-wrap:wrap; align-items:center; gap:4px; min-width:0}
.dchain .dn{border:1px solid var(--border-strong); background:var(--surface); border-radius:4px; padding-inline:6px; font-size:12px; line-height:22px; white-space:nowrap}
.dchain .dn.new{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.dchain .da{color:var(--text-3); font-size:12px}
.dchain .dx{color:var(--st-fail); font-weight:700}

/* ---------- 模块矩阵 ---------- */
/* 紧凑格子（默认）：每组一行，最小宽 108px、高约 58px，1280×800 下 40 个格子基本一屏放下；“标准”密度为大格子 */
.mx{display:grid; gap:6px}
.mrow{display:grid; grid-template-columns:118px minmax(0,1fr); gap:8px; align-items:start}
.mrow>.gname{font-size:12px; color:var(--text-2); padding-top:6px; line-height:1.35}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:6px}
.tile{position:relative; display:grid; gap:3px; text-align:left; padding-block:6px; padding-inline:8px; border:1px solid var(--border); border-radius:4px; background:var(--surface); min-height:58px; color:var(--text); min-width:0}
.tile:hover{border-color:var(--border-strong)}
.tile .tid{font-family:var(--font-mono); font-size:12px; font-weight:600; display:flex; gap:4px; align-items:center; padding-right:12px; min-width:0}
.tile .tid span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .tid .sb svg{width:13px; height:13px}
.tile .tfn{font-size:11px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .tst{font-size:11px; display:flex; justify-content:space-between; gap:4px; align-items:center; color:var(--text-2)}
.tile>.dot{position:absolute; top:8px; right:8px}
.tile .tbar{height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; display:flex; flex:1 1 auto; min-width:24px}
.mx.comfortable .tiles{grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px}
.mx.comfortable .tile{min-height:84px; padding-block:8px; padding-inline:9px}
.t-done{background:var(--st-pass-soft)} .t-man{background:var(--st-manual-soft)} .t-prog{background:var(--st-pending-soft)}
.t-locked{background:var(--st-locked-soft); border-style:dashed}
.t-opt{border-style:dashed}
.t-drift{border:2px solid var(--st-drift); padding-block:5px; padding-inline:7px}
.t-clean{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 12px)}
.tile.sel{outline:2px solid var(--accent); outline-offset:1px}
.tile .bill{font-family:var(--font-mono); font-size:11px; color:var(--st-stale)}
.evmix{display:inline-flex; flex-wrap:wrap; gap:2px 6px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-2)}
.evmix span{display:inline-flex; align-items:center; gap:2px; white-space:nowrap}
.evmix svg{width:10px; height:10px}

/* ---------- 抽屉、对话框、浮层 ---------- */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:55}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw); background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow); z-index:60; display:flex; flex-direction:column; animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(24px); opacity:.6}to{transform:none; opacity:1}}
.drawer-h{display:flex; align-items:flex-start; gap:8px; padding-block:12px; padding-inline:16px; border-bottom:1px solid var(--border); padding-top:calc(12px + env(safe-area-inset-top,0px))}
.drawer-h h2{flex:1; min-width:0}
.drawer-b{overflow:auto; padding-block:12px 24px; padding-inline:16px; display:grid; gap:14px; align-content:start; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.dialog{position:fixed; left:50%; top:5vh; transform:translateX(-50%); width:min(700px,calc(100vw - 32px)); max-height:90vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow); z-index:70}
.dialog .drawer-h{position:sticky; top:0; background:var(--surface); z-index:1; padding-top:12px}
.dialog-f{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; padding-block:12px; padding-inline:16px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface)}
.toast{position:fixed; left:50%; bottom:calc(40px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--on-ink); padding-block:6px; padding-inline:12px; border-radius:4px; font-size:13px; z-index:90; box-shadow:var(--shadow); max-width:calc(100vw - 32px)}
.palette-list{display:grid; gap:2px; max-height:52vh; overflow:auto}
.palette-list .pg{font-size:11.5px; color:var(--text-3); padding-block:6px 2px; padding-inline:8px}
.palette-list a{display:flex; gap:8px; align-items:center; min-height:32px; padding-inline:8px; border-radius:4px; color:var(--text); text-decoration:none; font-size:13px}
.palette-list a:hover,.palette-list a.act{background:var(--accent-soft)}

/* ---------- 架构图 ---------- */
.mapwrap{overflow-x:auto; border:1px solid var(--border); border-radius:6px; background:var(--surface)}
.mapwrap svg{display:block; min-width:880px; width:100%; height:auto}
svg text{font-family:var(--font-sans); fill:var(--text)}
svg .mono{font-family:var(--font-mono)}
.m-box{fill:none; stroke:var(--border-strong); stroke-width:1}
.m-box.vpc{stroke-dasharray:5 4}
.m-boxt{font-size:11px; fill:var(--text-3)}
.m-ec2{fill:var(--surface-2); stroke:var(--st-pass); stroke-width:1.5}
.m-n rect.b{fill:var(--surface); stroke:var(--st-locked); stroke-width:1.2; stroke-dasharray:4 3}
.m-n text.l{font-size:12px; font-weight:600}
.m-n text.s{font-size:10px; fill:var(--text-3)}
.m-n text.c{font-size:9.5px; fill:var(--text-3); font-family:var(--font-mono)}
.m-n.ok rect.b{fill:var(--st-pass-soft); stroke:var(--st-pass); stroke-dasharray:none; stroke-width:1.5}
.m-n.deg rect.b{fill:var(--st-stale-soft); stroke:var(--st-stale); stroke-dasharray:none; stroke-width:1.5}
.m-n.err rect.b{fill:var(--st-drift-soft); stroke:var(--st-drift); stroke-dasharray:none; stroke-width:2}
.m-n.off text.l,.m-n.lock text.l,.m-n.opt text.l{fill:var(--text-3); font-weight:400}
.m-n.prog rect.b{stroke:var(--accent); stroke-width:1.5; stroke-dasharray:5 3; fill:var(--surface)}
.m-n.prog text.l{fill:var(--accent)}
.m-n.lock rect.b{fill:var(--st-locked-soft); stroke-dasharray:2 3}
.m-n.opt{opacity:.7}
.m-n.clean rect.b{stroke:var(--st-cleaned); stroke-dasharray:none; fill:var(--surface)}
.m-n.dim{opacity:.28}
.m-n.sel rect.b{stroke:var(--accent); stroke-width:2.5}
.m-n{cursor:pointer}
.m-n:focus{outline:none}
.m-n:focus-visible rect.b{stroke:var(--accent); stroke-width:3}
.m-n .ring{fill:none; stroke:var(--accent); stroke-width:2; opacity:0}
.m-n.rec .ring{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{opacity:.4}100%{opacity:0}}
.m-g-ok{fill:var(--st-pass)} .m-g-deg{fill:var(--st-stale)} .m-g-err{fill:var(--st-drift)} .m-g-off{fill:none; stroke:var(--st-locked); stroke-width:1.2; stroke-dasharray:2 2}
.m-g-lock{fill:none; stroke:var(--text-3); stroke-width:1.3}
.m-ring-bg{fill:none; stroke:var(--viz-grid); stroke-width:3}

/* 表达式（§5.6 的子集，不用 eval）：env.<module>.<KEY>、cap.<module>.<path>、driver.<id>、runtime.<id>、done.<id>、
   profile.hasDomain、true / false；运算符 == / != / ! / && / ||（原型不支持括号嵌套）。env 键不存在时取空串 */
const EXPRV = {'env.cdn.CDN_ORIGIN_TYPE':'ec2', 'env.cdn.CDN_MEDIA_ORIGIN':'s3', 'env.cdn.CDN_DIRECT_ACCESS':'open', 'env.network.NETWORK_PLACEMENT':'default', 'cap.network.data.placement':'default'};
function exprVal(k){
  if (k.startsWith('driver.')){ const mm = MOD[k.slice(7)]; return mm ? (mm.run==='off' ? 'local' : mm.driver.split('@')[0]) : ''; }
  return EXPRV[k]!==undefined ? EXPRV[k] : '';
}
function exprTerm(t){
  let neg = false;
  while (t.startsWith('!')){ neg = !neg; t = t.slice(1).trim(); }
  let r;
  const m = /^([\w.-]+)\s*(==|!=)\s*'([^']*)'$/.exec(t);
  if (m){ const v = exprVal(m[1]); r = m[2]==='==' ? v===m[3] : v!==m[3]; }
  else if (t==='true' || t==='false') r = t==='true';
  else if (t==='profile.hasDomain') r = !!PROFILE.hasDomain;
  else if (t.startsWith('runtime.')) r = isRunning(t.slice(8));
  else if (t.startsWith('done.')){ const mm = MOD[t.slice(5)]; r = !!mm && DONE_LIVES.includes(mm.life); }
  else { console.warn('无法解析的表达式片段：'+t); r = false; }
  return neg ? !r : r;
}
function exprTrue(expr){
  if (!expr) return true;
  return expr.split('||').some(or=>or.split('&&').every(term=>exprTerm(term.trim())));
}
function stepApplies(s){ return !s.when || exprTrue(s.when); }
function checkApplies(c){ return !(c.superseded && exprTrue(c.superseded.when)); }
function reqSteps(g){ return g.steps.filter(s=>!s.opt && stepApplies(s)); }
function recomputeAll(){ MODULES.forEach(m=>{ const g = GUIDES[m.id]; const req = reqSteps(g); m.tot = req.length; m.ach = req.filter(s=>['done','done_manual','drifted','cleaned'].includes(stepState(s))).length; }); }

/* 步骤状态（§4.4）：先剔除不适用 / 被取代的检查；“未解锁”只作用于还没达成的步骤 */
function stepState(s){
  const m = MOD[s.mod];
  if (!stepApplies(s) || s.skipped) return 'skipped';
  const achieved = !!s.at;
  if (achieved && m.life==='cleaned') return 'cleaned';
  if (!achieved && (m.life==='locked' || (m.opt==='domain' && m.precond))) return 'locked';
  if (s.running) return 'verifying';
  const eff = (s.checks||[]).filter(c=>(c.req!==false || s.opt) && checkApplies(c)).map(c=>c.res);
  if (!eff.length) return achieved ? 'done' : 'available';
  if (eff.some(r=>r==='fail')) return achieved ? 'drifted' : 'failed';
  if (eff.some(r=>r==='pending'||r==='running'||r==='queued')) return 'verifying';
  if (eff.some(r=>r==='error')) return 'error';
  if (eff.some(r=>r==='unavailable')) return 'needs_manual';
  if (eff.every(r=>r==='pass')) return 'done';
  if (eff.every(r=>['pass','manual','manual_evidence'].includes(r))) return 'done_manual';
  return 'available';
}
const DONE_LIVES = ['done','done_manual','cleaned'];
/* 模块徽章（§4.5）：已完成 / 已清理优先于“未解锁”；漂移叠加在完成之上 */
function modState(m){
  if (m.opt==='domain' && m.precond) return 'opt_na';
  if (DONE_LIVES.includes(m.life)) return m.drift ? 'drifted' : m.life;
  if (m.life==='locked') return 'locked';
  if (m.drift) return 'drifted';

}
function isRunning(id){ const m = MOD[id]; return !!m && (m.run==='ok' || m.run==='degraded'); }
function depOk(d){

  return isRunning(d);
}
function depLabel(d){ if (Array.isArray(d)) return d.join(' 或 '); if (d && typeof d==='object') return `${d.m}（${d.d}）`; return d; }
function depIds(d){ if (Array.isArray(d)) return d; if (d && typeof d==='object') return [d.m]; return [d]; }
function firstOpenStep(mid){ const g = GUIDES[mid]; return g.steps.find(s=>!s.opt && stepApplies(s) && !['done','done_manual','skipped','read'].includes(stepState(s))) || g.steps[g.steps.length-1]; }

function labState(l){

  if (l.optLab) return l.mods.some(id=>['in_progress','verifying'].includes(MOD[id].life)) ? 'in_progress' : 'opt_lab';
  if (l.mods.some(id=>['in_progress','verifying','done','done_manual'].includes(MOD[id].life))) return 'in_progress';

function effSrc(c){ return c.src==='aws' && (c.res==='unavailable' || c.manualDone) ? 'aws-manual' : c.src; }
function checkRow(c, o={}){
  const sup = c.superseded && exprTrue(c.superseded.when);
  const st = sup ? 'superseded' : (c.running ? 'running' : (c.queued ? 'queued' : c.res));
  const label = c.running ? '检测中' : (STL[st]||[])[2];
  const showEA = !sup && o.ea!==false && !['not_run'].includes(c.res) && !c.running && !c.queued && (c.res!=='pass' || o.eaAll);
  const isDrift = !sup && c.res==='fail' && c.step && c.step.at;
  const icon = isDrift ? badge('drifted',{compact:true}) : badge(st,{compact:true, label});
  let action = '';
  if (o.actions!==false && !sup){
    if (c.res==='error' && c.manual) action = `<button type="button" class="linkbtn" data-act="confirm" data-id="${c.gid}">改为手动核对</button>`;
    else if (c.res==='unavailable') action = `<button type="button" class="linkbtn" data-act="confirm" data-id="${c.gid}">去核对</button>`;
    else if (['fail','error'].includes(c.res)) action = `<button type="button" class="linkbtn" data-act="drawer-check" data-id="${c.gid}">排错</button>`;
  }
  return `<div class="ck${c.fresh?' fresh':''}" data-gid="${c.gid}">
    <span class="ic">${icon}</span>
    <div style="min-width:0"><div class="ck-t">${esc(c.title)}</div>
      <div class="ck-m">${srcTag(effSrc(c))}${c.api?`<span class="mono">${esc(c.api)}</span>`:''}<span>${c.running?'运行中…':(c.at?esc(c.at):'尚未检测')}${c.dur&&!c.running?' · '+esc(c.dur):''}</span>${isDrift?`<span class="sb sb-drift">曾于 ${esc(c.drift?c.drift.then:c.step.first)} 通过</span>`:''}${c.stale?'<span class="sb sb-stale">·过期</span>':''}${c.code?`<span class="mono">${esc(c.code)}</span>`:''}</div>
      ${sup?`<div class="ck-m">被 ${esc(c.superseded.by)} 取代：当前不适用，不计入分母，也不算漂移</div>`:''}
      ${showEA?`<dl class="ck-ea"><dt>期望</dt><dd>${esc(c.exp)}</dd><dt>实际</dt><dd class="${['fail','error'].includes(c.res)?'bad':''}">${esc(c.act)}</dd></dl>`:''}
      ${c.noCred?'<div class="ck-m">最近一次检测未能执行（无凭证），有效结果仍为之前的通过</div>':''}
      ${c.lastErr?`<div class="ck-m">最近一次检测未能完成（${esc(c.lastErr)}），有效结果仍为通过</div>`:''}
      ${c.note?`<div class="ck-m">${esc(c.note)}</div>`:''}

    </div>
    <span class="ck-a">${action}</span>
  </div>`;
}

/* ---------- 架构变化小图（HTML 链，窄栏里可换行） ---------- */
function chain(nodes, base){
  return `<span class="dchain">${nodes.map((n,i)=>{
    if (n==='✕') return '<span class="dx" aria-label="不通">✕</span>';
    const isNew = base && !base.includes(n);
    const arrow = i<nodes.length-1 && nodes[i+1]!=='✕' ? '<span class="da" aria-hidden="true">→</span>' : '';
    return `<span class="dn${isNew?' new':''}">${esc(n)}</span>${arrow}`; }).join('')}</span>`;
}
function mapDelta(d){
  if (!d) return '';
  return `<div class="delta" role="img" aria-label="架构变化：之前 ${esc(d.before.join(' → '))}；之后 ${esc(d.after.join(' → '))}">
    <div class="drow"><span class="xs faint">之前</span>${chain(d.before)}</div>

}

/* ---------- 依赖锁 ---------- */
function dependencyLock(m){
  if (m.life!=='locked' && !(m.opt==='domain' && m.precond)) return '';
  const rows = [];
  if (m.precond) rows.push(`<li>${badge('locked',{compact:true})} 前置条件不成立：${esc(m.precond)} → <a href="#settings.route">在学习路线中添加域名</a></li>`);
  if (m.block) rows.push(`<li>${badge('locked',{compact:true})} 注册表规则阻止启用：${esc(m.block)}</li>`);
  if (m.mutex) rows.push(`<li>${badge('locked',{compact:true})} 与 <span class="mono">${m.mutex}</span> 互斥（MUTEX-001）：${m.mutex} 当前为 s3。需要按 x-efs-asg 变体单独练习</li>`);
  (m.deps||[]).forEach(d=>{
    const ok = depOk(d); const ids = depIds(d);
    const first = MOD[ids[0]];
    const how = ok ? '运行中' : (first.life==='in_progress' ? `进行中 ${first.ach}/${first.tot}` : (first.life==='available' ? `未开始（Lab ${first.lab}${first.bill==='hourly'?'，按小时计费':''}）` : (DONE_LIVES.includes(first.life)?'已学过但没有以该驱动运行':'未解锁')));
    rows.push(`<li>${badge(ok?'pass':'locked',{compact:true})} 硬依赖 <a class="mono" href="#module.${ids[0]}">${esc(depLabel(d))}</a>：${ok?'<span class="ok-t">已满足 · '+how+'</span>':'<span class="err-t">缺少 · '+how+'</span>'}</li>`);
  });
  (m.soft||[]).forEach(s=>{ const sm = MOD[s]; rows.push(`<li>${badge(sm.drift?'drifted':(DONE_LIVES.includes(sm.life)?'pass':'available'),{compact:true})} 软依赖 <a class="mono" href="#module.${s}">${s}</a>：${sm.drift?'当前漂移':(DONE_LIVES.includes(sm.life)?'已学过':'建议先学')}${s==='cache'&&m.id==='autoscaling'?'（ASG-004：进程内缓存会导致多实例不一致）':''}</li>`); });
  const missing = (m.deps||[]).filter(d=>!depOk(d)).map(depLabel);
  return `<div class="notice lock" role="note">${ic('lock')}<div class="stack-8" style="min-width:0">
    <b>${m.opt==='domain'&&m.precond?'选做模块，当前不可用':'未解锁'}${missing.length?'：缺少 '+missing.map(x=>`<span class="mono">${esc(x)}</span>`).join('、'):(m.block?'：'+esc(m.block.split('：')[0]):'')}</b>
    <ul style="margin:0; padding-left:0; list-style:none; display:grid; gap:4px">${rows.join('')}</ul>
    <div class="small faint">可以预览指南，检测按钮在依赖满足前禁用。依赖被清理后，下游模块的未达成步骤会重新变为“未解锁”；已达成的步骤保持达成，只加“重建需要先恢复依赖”的提示。</div></div></div>`;
}

/* ============================================================

function modMatch(m, f){
  if (f==='track') return trackReq().includes(m);
  if (f==='focus') return !!m.focus;
  if (f==='todo') return ['available','in_progress','verifying'].includes(m.life) && !m.opt;
  if (f==='manual') return m.life==='done_manual' || GUIDES[m.id].steps.some(s=>(s.checks||[]).some(c=>c.res==='unavailable' || (c.res==='error'&&c.manual)));
  if (f==='drift') return !!m.drift;
  if (f==='billing') return m.bill==='hourly' && isRunning(m.id);
  return true;
}
function tileClass(m){

}

  const count = k=>MODULES.filter(m=>modMatch(m,k)).length;

    const sub = m.precond ? '选做 · 无域名' : (s==='locked' ? (m.block ? m.block.split('：')[0] : '需要 '+(m.mutex?'与 storage 互斥':(m.deps||[]).filter(d=>!depOk(d)).map(depLabel).join('、'))) : (m.drift ? '6379 规则缺失' : m.fn));
    return `<button type="button" class="tile ${tileClass(m)}${ST.modSel===m.id?' sel':''}" style="${match?'':'opacity:.35'}" data-act="mod-sel" data-id="${m.id}" aria-pressed="${ST.modSel===m.id}" aria-label="${m.id}，${esc(m.svc)}，学习：${esc((STL[s]||[])[2])}${m.precond?'':'，'+m.ach+'/'+m.tot+' 步'}，运行：${m.run}${m.bill==='hourly'&&isRunning(m.id)?'，正在按小时计费':''}" title="${esc(m.svc)} · ${esc(sub)}">
      <span class="tid"><span>${m.id}</span>${m.focus?'<span class="faint" aria-hidden="true">★</span>':''}${m.opt?'<span class="faint" aria-hidden="true">*</span>':''}</span>
      <span class="tfn">${esc(m.short)}${comfy?' · '+esc(sub):''}</span>

      ${c.fields?`<div class="tw"><table class="t"><thead><tr><th>字段</th><th>填什么</th><th>为什么</th></tr></thead><tbody>${c.fields.map(f=>`<tr><td class="nowrap">${esc(f[0])}</td><td class="mono small wrap-any" style="min-width:14em">${subst(f[1])}</td><td class="small" style="min-width:12em">${esc(f[2])}</td></tr>`).join('')}</tbody></table></div>`:''}

  } else if (mt==='cli' && M.cli){

  } else if (mt==='script' && M.script){

    mbody = `<div class="stack">${ST.guideRoute==='M' && PROFILE.method==='console' ? `<div class="notice info">${ic('info')}<span>当前路线是“先手动后接管”：建议先在控制台手动做一遍，再用脚本重建一次。</span></div>`:''}
      <div class="panel flat"><div class="panel-b stack-8"><div class="eyebrow">变更预览（--dry-run）</div>

      ${cmdBlock({run:sc.preview, runsOn:sc.runsOn, explain:'先看预览：会创建哪些资源、是否开始按小时计费、要附加哪些策略。'})}

  } else if (mt==='code' && M.code){

      <div><div class="eyebrow">预期结果</div><p class="small">${subst(s.expected||'—',false)}</p></div>
      ${pits.length?`<div class="stack-8"><div class="eyebrow">常见错误${anyFail?`（已命中 ${pits.filter(p=>p.hit).length} 条）`:''}</div>${pits.map((p,i)=>`<details class="fold" ${p.hit&&anyFail?'open':''}><summary><span class="pit-dot${p.hit&&anyFail?' hit':''}" aria-hidden="true"></span>${esc(p.symptom)}${p.hit&&anyFail?' <span class="sb sb-drift">已命中</span>':''}</summary><div class="fb"><span>原因：${esc(p.cause)}</span>${pitAction(p.act, m.id, s)}</div></details>`).join('')}</div>`:''}
      ${(s.saa||[]).length?`<details class="fold"><summary>为什么（SAA）</summary><div class="fb">${s.saa.map(x=>`<p><span class="saa-d">${x.d}</span> ${esc(x.t)}${x.conf?` <span class="faint">易混：${esc(x.conf)}</span>`:''}</p>`).join('')}</div></details>`:''}
    </div></article>`;
  const cks = s.checks||[];
  const running = s.running;
  const lastAt = cks.map(c=>c.at).filter(Boolean)[0];
  const firstBad = cks.find(c=>['fail','error'].includes(c.res) && checkApplies(c));
  const checkPanel = `<section class="panel" aria-labelledby="ck-t"><div class="panel-h"><h2 id="ck-t">本步检测</h2><span class="row"><span class="small faint">轮询：${s.wait?'自动':'关'}</span><button type="button" class="btn btn-sm btn-ink" id="btn-run" data-act="run-step" data-mod="${m.id}" data-step="${s.id}" ${locked||running||!stepApplies(s)?'disabled':''} title="快捷键 R">${ic('play')}${running?'检测中…':'检测'} <span class="kbd">R</span></button></span></div>
    <div class="panel-b">
      ${locked?'<p class="small faint">依赖满足前不能运行检测（预览模式）。</p>':''}

      ${cks.length?`<p class="small faint" style="margin-top:8px">上次 ${esc(lastAt||'—')} · 执行于 ${ENV.instanceId}（${ENV.azId}）</p>`:''}
      ${firstBad?`<button type="button" class="btn btn-sm" data-act="drawer-check" data-id="${firstBad.gid}" style="margin-top:8px">查看详情与排错</button>`:''}
      ${s.wait&&running?`<div class="waittimer" style="margin-top:8px">已等待 0:${String(8+Math.floor(Math.random()*40)).padStart(2,'0')} · 通常 ${s.wait.typical} 分钟 · 下次检测 0:30</div>`:''}
      ${s.readWhileWaiting?`<details class="fold" style="margin-top:10px"><summary>等待时读一读</summary><div class="fb"><p>${esc(s.readWhileWaiting)}</p></div></details>`:''}
      ${s.delta?`<hr class="rule" style="margin-block:12px"><div class="eyebrow" style="margin-bottom:6px">本步完成后架构变化</div>${mapDelta(s.delta)}`:''}
    </div></section>`;
  const nextHint = ['done','done_manual','skipped'].includes(sState) || !next ? '' : '本步尚未达成：可以先看下一步，但下一步的检测结果仅供参考';
  return `${top.join('')}
  <div class="row between" style="margin-block:${top.length?'12px':'0'} 8px"><div class="seg" role="group" aria-label="做法路线"><button type="button" aria-pressed="${ST.guideRoute==='M'}" data-act="route" data-v="M">先手动后接管</button><button type="button" aria-pressed="${ST.guideRoute==='S'}" data-act="route" data-v="S">直接用脚本</button></div>
    <span class="small faint">指南 v${esc(g.version)} · guides/${m.id}.yaml${g.generic?'（占位）':''}</span></div>
  ${ST.guideRoute==='S'?`<div class="notice info" style="margin-bottom:12px">${ic('info')}<span>路线 S：在第一个配置步骤执行 <span class="mono">scripts/module enable ${m.id}</span>，脚本一次满足多个步骤；之后的配置步骤变成“核对”：读懂模板片段，再点“检测”。两条路线验证的是同一组资源。</span></div>`:''}
  ${varStrip}

  <div class="guide" data-pane="${ST.guidePane}">
    <div class="gcol railcol">${rail}</div>
    <div class="gcol contentcol">${content}</div>
    <div class="gcol checkcol">${checkPanel}</div>
  </div>
  <div class="gnav sticky-sm">${prev?`<a class="btn" href="#module.${m.id}.guide.${prev.id}" title="快捷键 K">${ic('arrowl')}上一步</a>`:'<span></span>'}<span class="hide-sm">${esc(nextHint)}</span><button type="button" class="btn btn-ink only-sm" data-act="run-step" data-mod="${m.id}" data-step="${s.id}" ${locked||running?'disabled':''}>${ic('play')}检测</button>${next?`<a class="btn" href="#module.${m.id}.guide.${next.id}" title="快捷键 J">下一步${ic('arrow')}</a>`:'<span></span>'}</div>`;
}
function pitAction(a, mid, s){
  if (!a || a.kind==='none') return '';
  if (a.kind==='jump') return `<span><button type="button" class="btn btn-sm" data-act="jump-sub" data-sub="${a.sub}" data-key="${mid}.${s.id}">跳到第 ${a.sub+1} 小步（控制台做法）</button></span>`;
  if (a.kind==='jump-step') return `<span><a class="btn btn-sm" href="#module.${mid}.guide.${a.step}">跳到步骤 ${GUIDES[mid].steps.find(x=>x.id===a.step).no}</a></span>`;
  if (a.kind==='method') return `<span><button type="button" class="btn btn-sm" data-act="method" data-m="${a.m}" data-key="${mid}.${s.id}">看 ${METHOD_L[a.m]} 做法</button></span>`;
  if (a.kind==='var') return `<span><button type="button" class="btn btn-sm" data-act="var-edit" data-k="${a.k}">修改变量</button></span>`;
  if (a.kind==='link') return `<span><a class="btn btn-sm" href="${a.href}">${esc(a.label)}</a></span>`;
  if (a.kind==='copy') return cmdBlock({run:a.run, runsOn:'ops'});
  return '';
}

/* ---------- S06-3 对比实验（摘要） ---------- */
function noRecord(m, e){
  const stages = e && e.stages;
  return `<div class="stack-8"><div class="notice info">${ic('info')}<div class="stack-8"><b>还没有记录。实验要在启用模块<u>之前</u>先跑 before。</b><span>${isRunning(m.id)?'模块已经启用：可以用旁路头补测“模拟基线”（标注 simulated），或者先禁用再测。':`${esc(m.id)} 现在是本地实现（${esc(m.driver)}），正是录 before 的时候。`}</span></div></div>
    ${stages?`<div class="tw"><table class="t"><thead><tr><th>档</th><th>驱动</th><th>说明</th></tr></thead><tbody>${stages.map(st=>`<tr><td class="mono">${esc(st[0])}</td><td class="mono small">${esc(st[1])}</td><td class="small">${esc(st[2])}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${cmdBlock({run:`npm run exp -- ${m.id} --label before${e&&e.exp&&!PHEN[m.id]?' --scenario '+e.exp:''} --upload`, runsOn:'ops'})}</div>`;
}
function compareSummary(m){
  const e = EXPS[m.id], ph = PHEN[m.id];
  if (m.id==='ec2') return emptyState('ec2 是基础模块：没有对比实验，也没有“接入应用”步骤。','');
  if (ph && !e){
    if (!(m.cmp && m.cmp.st==='done')) return `<section class="panel"><div class="panel-h"><h2>现象对比卡（定性模块）</h2>${badge('available',{label:'还没有记录'})}</div><div class="panel-b stack-8">${noRecord(m)}<p class="small faint">记录后会对比：</p>${phenCard(m.id)}</div></section>`;
    return `<section class="panel"><div class="panel-h"><h2>现象对比卡（定性模块）</h2>${badge('pass',{label:'before/after 已记录'})}</div><div class="panel-b">${phenCard(m.id)}</div></section><p style="margin-top:12px"><a class="btn" href="#exp.${m.id}">打开完整对比 ${ic('arrow')}</a></p>`;
  }
  if (!e || e.empty) return noRecord(m, e);
  const before = e.cols[0], after = e.cols[e.cols.length-1];
  const key = e.metrics.slice(0,3);
  const col = (c,i)=>c.run ? `<div class="stack-8">${badge('pass',{label:c.run})}<div class="tw"><table class="t"><tbody>${key.map(k=>`<tr><td>${esc(k.l)}</td><td class="num">${k.text?esc(k.v[i]):fmt(k.v[i],k.dec||0)} ${k.text?'':esc(k.u)}</td></tr>`).join('')}</tbody></table></div><span class="pathsig">${(i===0?e.paths.before:e.paths.after).split(';').map(x=>`<span class="${/error/.test(x)?'err':(/cloudfront|s3|rds|elasticache|cognito|sqs/.test(x)?'aws':'')}">${esc(x)}</span>`).join('')}</span></div>`
    : `<div class="stack-8"><p class="small muted">还没有记录。前提：${m.id}=ok ${badge(isRunning(m.id)?'pass':'available',{compact:true})} · 已接入 ${badge(GUIDES[m.id].steps.some(s=>s.type==='wire'&&s.at)?'pass':'available',{compact:true})}</p>${cmdBlock({run:`npm run exp -- ${m.id} --label ${i===0?'before':'after'} --scenario ${e.exp} --upload`, runsOn:'ops'})}</div>`;
  return `<p class="muted" style="margin-bottom:12px">${esc(e.title)}（实验 ${e.exp}：${esc(e.desc)}）</p>
    ${m.cmp&&m.cmp.maybeStale?`<div class="notice hourly" style="margin-bottom:12px">${ic('warn')}<span>${esc(e.staleNote)}</span></div>`:''}
    <div class="cmp-cols"><section class="panel"><div class="panel-h"><h2>before：${esc(before.label)}</h2></div><div class="panel-b">${col(before,0)}</div></section>
    <section class="panel"><div class="panel-h"><h2>after：${esc(after.label)}</h2></div><div class="panel-b">${col(after, e.cols.length-1)}</div></section></div>
    ${e.conclusion&&after.run?`<p style="margin-top:12px"><b>结论：</b>${esc(e.conclusion.split('。')[0])}。</p>`:''}
    <div class="row" style="margin-top:12px">${e.ab?`<span class="small faint">实时 A/B（仅管理员，不计入完成判定）：${esc(e.ab.header)}</span>`:'<span class="small faint">实时 A/B：不支持（权威数据端口不能按请求切换）</span>'}<span class="spacer"></span><a class="btn" href="#exp.${m.id}">打开完整对比 ${ic('arrow')}</a></div>`;
}

/* ---------- S06-5 清理 ---------- */
function cleanupView(m){
  if (m.id==='ec2') return emptyState('ec2 是唯一必需组件：清理它等于彻底拆除整个环境。不练习时可以停止实例（停止后 EBS 和公网 IPv4 仍然计费）。', `<div class="row"><a class="btn btn-danger" href="#cleanup.all">彻底拆除（先导出学习报告）</a><a class="btn" href="#cleanup.l0">回到 L0</a></div>`);
  const cu = GUIDES[m.id].cleanup || {cmds:[{run:`scripts/module disable ${m.id}`, runsOn:'ops', danger:true}], risk:['—'], manual:[], reEnable:15};
  if (!isRunning(m.id) && m.id!=='auth') return emptyState(`当前没有运行中的资源。${DONE_LIVES.includes(m.life)?'学习记录保留。':''}`, '');

function deltaCell(k, a, b){
  if (k.text || a==null || b==null) return '<span class="delta-c">—</span>';
  if (a===0 && b===0) return '<span class="delta-c">持平</span>';
  const pct = a===0 ? null : (b-a)/a*100;
  const dir = b<a ? '▼' : (b>a ? '▲' : '＝');
  const small = pct!=null && Math.abs(pct)<5;
  let word = small ? '差异小于噪声' : '';
  if (!small){ if (k.u==='ms'||k.u==='s') word = b<a?'更快':'更慢'; else word = b<a?'更少':'更多'; }
  return `<span class="delta-c" title="Δ 不预设好坏：颜色统一，只用箭头和文字表示方向">${dir} ${pct==null?'—':Math.abs(pct).toFixed(0)+'%'}（${word}）</span>`;
}
function distChart(e){

  const niceMax = Math.ceil(max/500)*500 || 10;
  const x = i=>L + (W-L-R)*i/n, y = v=>T + (H-T-B)*(1 - v/niceMax);
  const ticks = [0, niceMax/2, niceMax];
  let g = ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="c-grid"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end" class="c-axis">${fmt(t)}</text>`).join('');

const CHK_STATUS = [['attention','需要处理'],['all','全部'],['fail','未通过'],['drift','漂移'],['error','检测器出错'],['confirm','待确认'],['manual','已手动'],['stale','过期'],['pass','通过'],['not_run','未运行']];
function chkMatch(c){
  const F = ST.chk;
  if (F.req && !c.req) return false;
  if (F.status!=='all' && !(checkApplies(c) && stepApplies(c.step))) return false;
  const drift = c.res==='fail' && c.step.at;
  const s = F.status;
  if (s==='attention' && !(c.res==='fail' || c.res==='error' || c.res==='unavailable' || c.stale)) return false;
  if (s==='fail' && !(c.res==='fail' && !drift)) return false;
  if (s==='drift' && !drift) return false;
  if (s==='error' && c.res!=='error') return false;
  if (s==='confirm' && !(c.res==='unavailable' || (c.res==='error' && c.manual))) return false;
  if (s==='manual' && !['manual','manual_evidence'].includes(c.res)) return false;
  if (s==='stale' && !c.stale) return false;
  if (s==='pass' && c.res!=='pass') return false;
  if (s==='not_run' && c.res!=='not_run') return false;
  if (F.source!=='all' && c.src!==F.source) return false;
  if (F.module!=='all' && c.mod!==F.module) return false;
  if (F.lab!=='all' && String(MOD[c.mod].lab)!==F.lab) return false;
  return true;
}
function chkSummary(c){
  if (c.res==='fail') return `期望 ${c.exp}，实际 ${c.act}`;
  if (c.res==='error') return `${c.code||'ERROR'}（检测器问题）`;
  if (c.res==='unavailable') return '无凭证，待手动核对';
  if (c.res==='manual' || c.res==='manual_evidence') return c.act;
  if (c.stale) return '通过（已过期）';
  if (c.res==='not_run') return '尚未检测';
  return c.act;
}
function scrChecks(){
  const cs = checkStats();
  const F = ST.chk;
  const rows = Object.values(CK).filter(c=>c.req!==undefined && c.step && c.step.no!==undefined).filter(chkMatch);
  const order = {fail:0, error:1, unavailable:2, pending:3, manual:4, manual_evidence:4, pass:5, not_run:6};
  /* 漂移（曾经达成、现在 fail）排最前，然后按结果，再把过期的排前面；布尔值显式转成 0/1，不对时间字符串做减法 */
  const isDrift = c=>+!!(c.res==='fail' && c.step.at);
  rows.sort((a,b)=>(isDrift(b)-isDrift(a)) || ((order[a.res]??7)-(order[b.res]??7)) || ((b.stale?1:0)-(a.stale?1:0)));
  const groupKey = c=>F.group==='module'?c.mod:(F.group==='lab'?'Lab '+MOD[c.mod].lab:(F.group==='source'?(SRC[c.src]||[c.src])[0]:''));
  let lastG = null;
  const body = rows.slice(0,160).map(c=>{
    const g = groupKey(c); let gh = '';

    const drift = c.res==='fail' && c.step.at;
    let act;
    if (c.res==='unavailable' || (c.res==='error' && c.manual)) act = `<button type="button" class="linkbtn" data-act="confirm" data-id="${c.gid}">${c.res==='error'?'改为手动':'去核对'}</button>`;
    else if (['fail','error'].includes(c.res)) act = `<button type="button" class="linkbtn" data-act="drawer-check" data-id="${c.gid}">排错</button>`;
    else if (c.stale || c.res==='not_run') act = `<button type="button" class="linkbtn" data-act="rerun-check" data-id="${c.gid}">检测</button>`;
    else act = `<button type="button" class="linkbtn" data-act="drawer-check" data-id="${c.gid}">查看</button>`;
    return gh + `<tr class="${drift?'warn':''}"><td><input type="checkbox" aria-label="选择 ${esc(c.title)}" data-act="chk-pick" data-id="${c.gid}" ${ST.chkSel.has(c.gid)?'checked':''}></td>
      <td class="nowrap">${c.running?badge('running'):(drift?badge('drifted'):(c.stale&&c.res==='pass'?badge('stale',{label:'·过期'}):badge(c.res)))}</td>
      <td>${esc(c.title)}<div class="mono xs faint">${c.gid}</div></td><td class="small nowrap"><a class="mono" href="#module.${c.mod}.guide.${c.step.id}">${c.mod}</a> · ${c.step.no} ${esc(c.step.title.replace(/（.*?）/g,'').slice(0,14))}</td>
      <td>${srcTag(effSrc(c))}</td><td class="small nowrap faint">${esc(c.at||'—')}</td><td class="small" style="max-width:280px">${esc(chkSummary(c))}</td><td class="nowrap">${act}</td></tr>`;
  }).join('');
  const sel = [...ST.chkSel];
  return `<div class="ph"><div class="ph-t"><h1>检测报告</h1><p class="ph-meta">上次全量检测 10:31 · 检测能力：部分（缺 3 项权限）· 完成度的明细账，也是排错入口</p></div>
    <div class="row"><button type="button" class="btn" data-act="recheck-all" ${ST.recheckAll?'disabled':''}>${ic('refresh')}${ST.recheckAll?'复核中…':'复核全部'}</button><button type="button" class="btn" data-act="export-checks" data-v="json">导出 JSON</button><button type="button" class="btn" data-act="export-checks" data-v="csv">导出 CSV</button></div></div>
  ${ST.chkOut?`<div class="panel" style="margin-bottom:12px"><div class="panel-h"><h2>导出内容（复制后保存为文件）</h2><span class="row"><button type="button" class="copy-btn" data-act="copy-raw" data-text="${esc(ST.chkOut)}">${ic('copy')}复制</button><button type="button" class="btn btn-sm btn-ghost" data-act="close-out" aria-label="关闭">${ic('x')}</button></span></div><div class="panel-b"><pre class="mdout">${esc(ST.chkOut)}</pre></div></div>`:''}
  ${ST.recheckMsg?`<div class="notice info" role="status" style="margin-bottom:12px">${ic('info')}<span>${esc(ST.recheckMsg)}</span></div>`:''}
  <div class="grid-3" style="margin-bottom:16px">
    <section class="panel"><div class="panel-b stack-8"><div class="eyebrow">必需检查 ${cs.total}</div><div class="row"><b class="tnum" style="font-size:18px">${cs.satisfied}</b><span class="small faint">已满足（${Math.round(100*cs.satisfied/cs.total)}%）</span></div>${segbar(cs.pass, cs.manual, 0, cs.total, true)}</div></section>
    <section class="panel"><div class="panel-b stack-8"><div class="eyebrow">按结果</div><div class="row small tnum">${badge('pass',{label:'通过 '+cs.pass})}${badge('manual',{label:'含手动 '+cs.manual})}${badge('fail',{label:'未通过 '+(cs.fail-cs.drift)})}${badge('drifted',{label:'漂移 '+cs.drift})}${badge('error',{label:'检测器出错 '+cs.error})}${badge('unavailable',{label:'待核对 '+cs.needs})}${badge('pending',{label:'等待中 '+cs.pending})}</div><div class="small faint tnum">过期 ${cs.stale} · 未运行 ${cs.notRun}</div></div></section>
    <section class="panel"><div class="panel-b stack-8"><div class="eyebrow">按来源</div><div class="small tnum">${srcTag('local')} ${cs.srcLocal} · ${srcTag('probe')} ${cs.srcProbe} · ${srcTag('aws')} ${cs.srcAws} · ${srcTag('exp')} ${cs.srcExp} · ${srcTag('manual')} ${cs.srcManual}</div></div></section>
  </div>
  <div class="filters" role="group" aria-label="筛选">
    <label class="row small">状态 <select id="f-status" data-act="chk-f" data-k="status">${CHK_STATUS.map(([k,l])=>`<option value="${k}" ${F.status===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="row small">来源 <select id="f-source" data-act="chk-f" data-k="source"><option value="all">全部</option>${Object.entries(SRC).filter(([k])=>k!=='aws-manual').map(([k,v])=>`<option value="${k}" ${F.source===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>
    <label class="row small">模块 <select id="f-module" data-act="chk-f" data-k="module"><option value="all">全部</option>${MODULES.map(m=>`<option value="${m.id}" ${F.module===m.id?'selected':''}>${m.id}</option>`).join('')}</select></label>
    <label class="row small">Lab <select id="f-lab" data-act="chk-f" data-k="lab"><option value="all">全部</option>${COURSE.filter(l=>!l.bonus).map(l=>`<option value="${l.n}" ${F.lab===String(l.n)?'selected':''}>Lab ${l.n}</option>`).join('')}</select></label>
    <label class="opt small"><input type="checkbox" id="f-req" data-act="chk-req" ${F.req?'checked':''}>仅必需</label>
    <span class="seg" role="group" aria-label="分组">${[['flat','平铺'],['module','模块'],['lab','Lab'],['source','来源']].map(([k,l])=>`<button type="button" aria-pressed="${F.group===k}" data-act="chk-group" data-v="${k}">${l}</button>`).join('')}</span>
  </div>
  <div class="row between" style="margin-bottom:8px"><span class="small faint">${rows.length} 项${rows.length>160?'（显示前 160 项）':''} · 没有批量确认：手动确认必须逐项填写看到的值</span><button type="button" class="btn btn-sm" data-act="run-selected" ${sel.length?'':'disabled'}>${ic('play')}检测所选（${sel.length}）</button></div>
  ${rows.length?`<div class="tw"><table class="t"><thead><tr><th><span class="sr">选择</span></th><th>状态</th><th>检查</th><th>模块 · 步骤</th><th>来源</th><th>上次</th><th>摘要</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>`
    : emptyState('没有符合条件的检查。', `<button type="button" class="btn" data-act="chk-clear">清除筛选</button>`)}`;
}
function checkDrawer(gid){
  const c = CK[gid]; if (!c) return '';
  VARCTX.mid = c.mod;
  const s = c.step, g = GUIDES[c.mod];
  const drift = c.res==='fail' && s.at;
  const pits = (s.pitfalls||[]).map((p,i)=>({...p, score: p.hit ? 0.9 : 0.2 - i*0.03})).sort((a,b)=>b.score-a.score);
  const hist = c.history || (c.at ? [[c.at, c.res]] : []);
  return `<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t">
    <div class="drawer-h"><span style="padding-top:2px">${drift?badge('drifted',{compact:true}):badge(c.res,{compact:true})}</span><h2 id="dr-t">${esc(c.title)}</h2>
      <button type="button" class="btn btn-sm" data-act="rerun-check" data-id="${c.gid}" ${c.running||MOD[c.mod].life==='locked'?'disabled':''}>${c.running?'检测中…':'再测一次'}</button>
      <button type="button" class="btn btn-sm" data-act="copy-diag" data-id="${c.gid}">复制诊断包</button>
      <button type="button" class="btn btn-sm btn-ghost" data-act="close-overlay" aria-label="关闭（Esc）">${ic('x')}</button></div>
    <div class="drawer-b">
      ${c.conflict?`<div class="banner b-fail">${ic('warn')}<div class="bt">你在 ${esc(c.conflict)} 手动确认过，但自动检测发现不一致，需要重新处理。</div></div>`:''}
      <div class="small"><span class="mono">${c.gid}</span> · ${c.req?'必需':'可选'} · 来源：${(SRC[effSrc(c)]||[c.src])[0]}${c.api?'（<span class="mono">'+esc(c.api)+'</span>）':''} · 指南 v${esc(g.version)}</div>
      <div class="small faint">${esc(c.at||'尚未检测')}${c.dur?' · '+esc(c.dur):''} · run 01JA9${(c.gid.length*7%97).toString(36).toUpperCase()}… · 执行于 ${ENV.instanceId}（${ENV.azId}）· 触发：${c.at?'进入步骤时自动':'—'}</div>
      <section><div class="eyebrow" style="margin-bottom:4px">期望 vs 实际</div><div class="tw"><table class="t"><thead><tr><th>字段</th><th>期望</th><th>实际</th><th></th></tr></thead><tbody><tr><td>${esc(c.title.split('（')[0].slice(0,18))}</td><td class="mono small">${esc(c.exp)}</td><td class="mono small ${['fail','error'].includes(c.res)?'err-t':''}">${esc(c.act)}</td><td>${badge(c.res==='pass'||c.res.startsWith('manual')?'pass':(c.res==='error'?'error':(c.res==='not_run'?'not_run':'fail')),{compact:true})}</td></tr></tbody></table></div></section>
      ${c.drift?`<section><div class="eyebrow" style="margin-bottom:4px">证据对比（漂移）</div><div class="cmp-cols"><div><div class="small faint">上次通过 ${esc(c.drift.then)}</div><pre class="mdout">${esc(c.drift.thenEv)}</pre></div><div><div class="small faint">现在 ${esc(c.at)}</div><pre class="mdout" style="border-color:var(--st-drift)">${esc(c.drift.nowEv)}</pre></div></div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm" data-act="drift-ack" data-id="${c.mod}">${ST.driftAck?'已标记为有意改动（24 小时内不提醒）':'我是有意改动的（24 小时内不提醒）'}</button></div></section>`:''}
      <section><div class="eyebrow">判定逻辑</div><p class="small">${esc(c.explain || ('按断言比较：'+c.exp))}</p></section>
      ${c.reproduce?`<section><div class="eyebrow" style="margin-bottom:4px">复现命令（等价的只读命令）</div>${cmdBlock({run:c.reproduce, runsOn:c.runsOn||'ops'})}</section>`:''}
      <details class="fold"><summary>证据（已脱敏）</summary><div class="fb"><pre class="mdout">${esc(JSON.stringify({result:c.res, actual:c.act, expected:c.exp, source:c.src, api:c.api||null, at:c.at||null, guideVersion:g.version, checkHash:'sha256:'+(c.gid.length*2654435761>>>0).toString(16)}, null, 2))}</pre></div></details>
      ${['fail','error'].includes(c.res)?`<section><div class="eyebrow" style="margin-bottom:4px">可能原因（按匹配度排序）</div>${pits.length?`<ol style="margin:0; padding-left:18px; display:grid; gap:6px">${pits.slice(0,3).map(p=>`<li><b>${esc(p.symptom)}</b>${p.hit?' <span class="sb sb-drift">已命中</span>':''}<div class="small muted">${esc(p.cause)}</div>${p.act&&p.act.kind==='jump'?`<a class="btn btn-sm" href="#module.${c.mod}.guide.${s.id}" data-act="jump-sub-link" data-sub="${p.act.sub}" data-key="${c.mod}.${s.id}">跳到步骤 ${s.no} 第 ${p.act.sub+1} 小步（控制台做法）</a>`:(p.act&&p.act.kind==='link'?`<a class="btn btn-sm" href="${p.act.href}">${esc(p.act.label)}</a>`:'')}</li>`).join('')}</ol>`

      ${c.manualDone?`<section class="notice accent">${ic('check')}<div class="stack-8"><b>已手动确认</b><span class="small">${esc(c.act)}</span>${ST.undoAsk===c.gid?`<label class="small" for="undo-reason">撤销原因（必填，至少 4 个字，写入 console_events）</label><input type="text" id="undo-reason" placeholder="例如：选错了选项"><div class="row"><button type="button" class="btn btn-sm btn-danger" data-act="undo-go" data-id="${c.gid}">确认撤销</button><button type="button" class="btn btn-sm" data-act="undo-cancel">取消</button></div>`:`<button type="button" class="btn btn-sm btn-danger" data-act="undo-confirm" data-id="${c.gid}">撤销（需要填写原因）</button>`}</div></section>`:''}
    </div></div>`;
}

const SCREENS = {overview:scrOverview, setup:scrSetup, login:scrLogin, forbidden:scrForbidden, path:scrPath, lab:scrLab, modules:scrModules, module:scrModule,
  map:scrMap, experiments:scrExperiments, exp:scrExp, traffic:scrTraffic, checks:scrChecks, cost:scrCost, cleanup:scrCleanup, report:scrReport, settings:scrSettings,
  notfound:()=>`<h1>没有这个画面</h1>`+emptyState('没有这个画面。', `<a class="btn" href="#overview">回到总览</a>`)};
const LEGACY = {'lab':['map','/lab → /console/map'], 'lab.results':['experiments','/lab/results → /console/experiments'], 'lab.trace':['traffic','/lab/trace → /console/traffic'], 'lab.compare':['exp.cache','/lab/compare → /console/experiments/cache']};
function parseHash(){
  let h = location.hash.replace(/^#/,''); try { h = decodeURIComponent(h); } catch(e){}
  if (!h || h==='console') return {name:'overview'};
  if (LEGACY[h]) return {name:'legacy', to:LEGACY[h]};
  if (/^lab\.m\./.test(h)) return {name:'legacy', to:['module.'+h.slice(6), '/lab/m/'+h.slice(6)+' → /console/modules/'+h.slice(6)]};
  const p = h.split('.');
  switch (p[0]){
    case 'overview': return {name:'overview'};
    case 'setup': return {name:'setup'};
    case 'login': return {name:'login'};
    case 'forbidden': return {name:'forbidden'};
    case 'path': return {name:'path'};
    case 'lab': { const n = parseInt(p[1],10); return {name:'lab', lab:Number.isFinite(n) ? Math.min(COURSE.length-1, Math.max(0, n)) : 8, quiz:p[2]==='quiz'}; }
    case 'modules': return {name:'modules'};
    case 'module': return {name:'module', id:MOD[p[1]]?p[1]:'auth', tab:['guide','compare','exam','cleanup'].includes(p[2])?p[2]:'', step:p[3]};
    case 'map': return {name:'map'};
    case 'experiments': return {name:'experiments'};
    case 'exp': return {name:'exp', id:MOD[p[1]]?p[1]:'cache'};
    case 'traffic': return {name:'traffic'};
    case 'checks': return {name:'checks'};
    case 'cost': return {name:'cost'};
    case 'cleanup': return {name:'cleanup', scope:p.slice(1).join('.')||'l0'};
    case 'report': return {name:'report'};
    case 'settings': return {name:'settings', tab:['detection','route','guides','data','account'].includes(p[1])?p[1]:'detection'};
    default: return {name:'notfound'};
  }
}
function render(scrollTop){
  const r = parseHash();
  if (r.name==='legacy'){ toast(`原 ${r.to[1]}（301）`); location.replace('#'+r.to[0]); return; }
  ST.route = r;
  const bare = ['setup','login','forbidden'].includes(r.name);
  document.body.dataset.mode = bare ? 'bare' : 'console';
  renderTopbar(bare);
  if (!bare) renderSidebar(r);
  renderBanners(bare, r);
  renderStatusbar();
  VARCTX.mid = r.name==='module' ? r.id : null;
  let html;
  try { html = (SCREENS[r.name]||SCREENS.notfound)(r); }
  catch(e){ console.error(e); html = `<h1>渲染出错</h1><div class="banner b-fail">${ic('warn')}<div class="bt">渲染出错：${esc(e.message)}</div></div>`; }
  $('#view').innerHTML = html;
  renderOverlay();
  applyPendingHl();
  if (scrollTop) window.scrollTo(0,0);
}
/* 重绘后恢复焦点：先按 id，再按“焦点键”（data-act + 其余 data-* + 单选框的 value）找回同一个控件。
   单选组里用方向键改变选择时，焦点会回到新选中的那一项。 */
function focusKey(el){
  if (!el || el===document.body) return null;
  if (el.id) return '#'+el.id;
  const d = el.dataset || {};
  if (d.ti) return 'ti:'+d.ti;
  if (!d.act) return null;
  const parts = Object.keys(d).filter(k=>k!=='act').sort().map(k=>k+'='+d[k]);
  if (el.type==='radio' || el.type==='checkbox') parts.push('value='+el.value);
  return 'act:'+d.act+'|'+parts.join('|');
}
function findByKey(k){
  if (!k) return null;
  if (k[0]==='#') return document.getElementById(k.slice(1));
  if (k.startsWith('ti:')) return $(`[data-ti="${k.slice(3)}"]`);
  const act = k.slice(4).split('|')[0];
  return $$(`[data-act="${act}"]`).find(el=>focusKey(el)===k) || null;
}
function refresh(){
  const y = window.scrollY;
  const a = document.activeElement;
  const key = focusKey(a);
  const sel = a && (a.selectionStart!=null) ? [a.selectionStart, a.selectionEnd] : null;
  render(false);
  window.scrollTo(0, y);
  const el = findByKey(key);
  if (el && !el.disabled){ el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} }
}
/* “跳到第 k 小步”：切到控制台做法、高亮该小步并滚动到它；跨过 hashchange 时用 pendingHl 保存 */
function applyPendingHl(){
  const p = ST.pendingHl; const r = ST.route;
  if (!p || !r || r.name!=='module' || r.tab!=='guide') return;
  const [mid, sid] = p.key.split('.');
  if (r.id!==mid || (r.step && r.step!==sid)) return;
  ST.hlSub = p; ST.pendingHl = null;
  const li = $('#sub-'+p.sub);
  if (li){ li.classList.add('hl'); setTimeout(()=>{ li.scrollIntoView({block:'center'}); li.setAttribute('tabindex','-1'); li.focus({preventScroll:true}); }, 30); }
}
function announce(t){ const l = $('#live'); l.textContent = ''; setTimeout(()=>{ l.textContent = t; }, 30); }
let toastTimer = null;
function toast(t){ let el = $('#toast'); if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.hidden = true; }, 2600); }
function applyTheme(){ const t = ST.theme; if (t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* ---------- 模拟检测 ---------- */
function runChecks(cks, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    cks.forEach(c=>{ c.queued = true; c.fresh = false; });
    refresh();
    let i = 0;
    const tick = ()=>{
      if (i>=cks.length){ resolve(); return; }
      const c = cks[i]; c.queued = false; c.running = true; refresh();
      setTimeout(()=>{
        c.running = false; c.fresh = true;
        if (c.src==='aws' && ST.credMode==='local'){
          /* 仅本地：AWS 只读检查执行不了；之前的 pass 保持有效，其余记为待手动核对 */
          if (c.res==='pass') c.noCred = true; else { c.res = 'unavailable'; c.act = '无凭证：AWS 只读检查无法执行，改为手动核对'; c.code = null; }
        } else {
          let n = c.next || (c.res==='not_run' ? {res:'fail', act:'不满足期望（示例：资源尚未创建）'} : null);
          if (ST.credMode==='full' && c.code==='ACCESS_DENIED') n = {res:c.fullRes||'pass', act:c.fullAct||c.act};
          if (n){ c.res = n.res; c.act = n.act; if (n.res!=='error') c.code = null; }
        }
        c.at = '10/13 '+ts(); c.dur = (0.4 + ((i*7)%15)/10).toFixed(1)+'s';
        c.history = [[c.at.replace('10/13 ',''), c.res], ...(c.history||[])].slice(0,10);
        if (c.stale) c.stale = false;
        i++; tick();
      }, opts.fast ? 160 : 520 + ((i*13)%5)*90);
    };
    setTimeout(tick, 220);
  });
}
function updateModuleLife(mid){
  recomputeAll();
