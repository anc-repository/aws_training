# GENERATED by platform/infra/build/workstation-template.ts from atl-workstation.src.yaml + ../bootstrap/user-data.sh — do not edit.
# Workstation stack atl-ws-<sid> (03 §4.4), deployed by the runner (ATL_OP=workstation-up).
AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Training Lab workstation atl-ws-<sid> (03 §4.4): one small EC2 per session in the default VPC, learner CLI via ATLLearnerRole'

Parameters:
  SessionId:
    Type: String
    AllowedPattern: '^s[0-9a-hjkmnp-tv-z]{12}$'
  EnvName:
    Type: String
    AllowedPattern: '^e[0-9a-z]{7}$'
  EnvId:
    Type: String
    AllowedPattern: '^[0-9a-hjkmnp-tv-z]{26}$'
  LabId:
    Type: String
    AllowedPattern: '^(svc|sc)-[a-z0-9]+(-[a-z0-9]+)*$'
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedPattern: '^[a-z0-9]+\.[a-z0-9]+$'
  ImageId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: 'the default VPC of the lab region (01 §4.1)'
  SubnetId:
    Type: 'AWS::EC2::Subnet::Id'
    Description: 'a default (public) subnet of the default VPC'
  InstanceProfile:
    Type: String
    Default: ATLWorkstationRole
    AllowedValues: [ATLWorkstationRole]
  BundleUri:
    Type: String
    AllowedPattern: '^s3://atl-artifacts-[0-9]{12}-[a-z0-9-]+/releases/[A-Za-z0-9._-]+/atl-workstation\.tar\.gz$'
  BundleSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'atl-ws-${SessionId}-sg'
      GroupDescription: !Sub 'ATL workstation of ${SessionId} (environment ${EnvName}): no inbound rules, terminal via Session Manager'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: 'all outbound' }
      Tags:
        - { Key: Name, Value: !Sub 'atl-ws-${SessionId}-sg' }
        - { Key: 'atl:session-id', Value: !Ref SessionId }
        - { Key: 'atl:lab-id', Value: !Ref LabId }
        - { Key: 'atl:env-id', Value: !Ref EnvId }
        - { Key: 'atl:component', Value: workstation }
        - { Key: Project, Value: CloudAlbum }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      CreditSpecification: { CPUCredits: standard }
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
        InstanceMetadataTags: enabled
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          AssociatePublicIpAddress: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      PropagateTagsToVolumeOnCreation: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # platform/workstation/bootstrap/user-data.sh — workstation User Data (03 §4.5). This file is a CloudFormation Fn::Sub
            # template embedded into templates/atl-workstation.yaml by platform/infra/build/workstation-template.ts: the only Fn::Sub
            # references are the stack values Region, BundleUri and BundleSha256 (dollar-brace form); shell variables are written $NAME.
            # It only verifies the bootstrap bundle (whole-file SHA-256 from the stack parameter, then every file against manifest.json)
            # and hands over to the bundle's atl-ws-install.sh (bootstrap/install.sh): the installation itself travels with the release.
            # Session-independent installation only; the session wiring is ATL-WorkstationSetup (03 §4.6).
            set -euo pipefail
            exec > >(tee -a /var/log/atl-workstation-bootstrap.log) 2>&1
            install -d -m 0755 /etc/atl /var/lib/atl /opt/atl /opt/atl/bin
            echo workstation > /etc/atl/host-role
            hostnamectl set-hostname atl-ws || true

            dnf -y install git jq tmux tar gzip openssh-clients nmap-ncat bind-utils nodejs22 nodejs22-npm
            alternatives --set node /usr/bin/node-22 || true

            W=$(mktemp -d)
            for i in 1 2 3 4 5; do aws s3 cp --only-show-errors --region "${Region}" "${BundleUri}" "$W/atl-workstation.tar.gz" && break; sleep $((i * 5)); done
            echo "${BundleSha256}  $W/atl-workstation.tar.gz" | sha256sum -c -
            tar -xzf "$W/atl-workstation.tar.gz" -C "$W"
            ( cd "$W" && jq -r '.files[] | "\(.sha256)  \(.name)"' manifest.json | sha256sum -c --quiet - )
            bash "$W/atl-ws-install.sh" "$W"
            rm -rf "$W"
            echo "ATL workstation bootstrap finished"
          - Region: !Ref 'AWS::Region'
      Tags:
        - { Key: Name, Value: !Sub 'atl-ws-${SessionId}' }
        - { Key: 'atl:session-id', Value: !Ref SessionId }
        - { Key: 'atl:lab-id', Value: !Ref LabId }
        - { Key: 'atl:env-id', Value: !Ref EnvId }
        - { Key: 'atl:component', Value: workstation }
        - { Key: 'atl:role', Value: workstation }
        - { Key: Project, Value: CloudAlbum }

Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  PublicIp:
    Value: !GetAtt Instance.PublicIp
