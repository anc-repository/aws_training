# 30-api — HTTP API atl-api with the four route families of 01 §5.3 (JWT / agent IAM / internal IAM / public) plus the
# fallback upload route (01 §5.3, closed by default in atl-agent). The Lambda functions and their log groups are generated by
# build/template-parts.ts (FUNCTION_DEFS) because all twelve share the same shape.
Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: atl-api
      ProtocolType: HTTP
      Description: 'AWS Training Lab API (/api/v1)'
      DisableExecuteApiEndpoint: false
      Tags:
        'atl:component': platform
        Project: ATL

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: atl-cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        # access tokens carry client_id instead of aud; the JWT authorizer accepts either (01 §5.3)
        Audience: [!Ref WebClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /atl/apigw-access
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: 'atl:component', Value: platform }
        - { Key: Project, Value: ATL }

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # request metadata only — no tokens, no bodies (01 §10.4)
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","ip":"$context.identity.sourceIp","method":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error","caller":"$context.identity.userArn"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      RouteSettings:
        'GET /api/v1/public/{proxy+}': { ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5 }
        'ANY /api/v1/agent/{proxy+}': { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
        'ANY /api/v1/internal/{proxy+}': { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
        'PUT /api/v1/agent-fallback/runs/{runId}/result': { ThrottlingBurstLimit: 5, ThrottlingRateLimit: 2 }
      Tags:
        'atl:component': platform
        Project: ATL
    DependsOn: [BrowserRoute, AgentRoute, InternalRoute, PublicRoute, AgentFallbackRoute]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  PublicIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PublicFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000
  AgentIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  BrowserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/v1/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'
  AgentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/v1/agent/{proxy+}'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${AgentIntegration}'
  InternalRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/v1/internal/{proxy+}'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${AgentIntegration}'
  PublicRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/v1/public/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${PublicIntegration}'
  AgentFallbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /api/v1/agent-fallback/runs/{runId}/result'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${AgentIntegration}'

  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  PublicFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PublicFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  AgentFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
