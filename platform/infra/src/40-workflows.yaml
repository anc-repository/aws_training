# 40-workflows — CodeBuild atl-runner (01 §3.4, 02 §4.3), Scheduler groups atl-sessions / atl-system and the atl-sweeper
# schedule (created DISABLED, 01 §3.5), the dead-letter queue atl-timer-dlq. The six state machines and their log groups are
# generated by build/template-parts.ts from platform/workflows/statemachines/*.asl.json (DefinitionSubstitutions derived
# from the keys of DEV_SUBSTITUTIONS, so dev and prod use the same placeholders).
Resources:
  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/codebuild/atl-runner
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: 'atl:component', Value: platform }
        - { Key: Project, Value: ATL }

  RunnerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: atl-runner
      Description: 'ATL runner: executes scripts/module for the platform (ATL_OP, 01 §3.4)'
      ServiceRole: !GetAtt RunnerServiceRole.Arn
      # source = the pinned release in atl-artifacts; the buildspec ships inside it (never read from a learner-writable place)
      Source:
        Type: S3
        Location: !Sub '${ArtifactsBucket}/releases/${ReleaseVersion}/cloudalbum-infra.zip'
        BuildSpec: platform/workflows/runner/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        # managed Amazon Linux aarch64 standard image (current version per the CodeBuild docs, 07 V1-12)
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - { Name: ATL_RELEASE, Type: PLAINTEXT, Value: !Ref ReleaseVersion }
          - { Name: ATL_PLATFORM_VERSION, Type: PLAINTEXT, Value: '@@ATL_VERSION@@' }
          - { Name: ATL_REGION, Type: PLAINTEXT, Value: !Ref 'AWS::Region' }
          - { Name: ATL_ACCOUNT_ID, Type: PLAINTEXT, Value: !Ref 'AWS::AccountId' }
          - { Name: ATL_DR_REGION, Type: PLAINTEXT, Value: !Ref DrRegion }
          - { Name: ATL_ARTIFACTS_BUCKET, Type: PLAINTEXT, Value: !Ref ArtifactsBucket }
          - { Name: ATL_RELEASE_PREFIX, Type: PLAINTEXT, Value: !Sub 'releases/${ReleaseVersion}/' }
          - { Name: ATL_DATA_BUCKET, Type: PLAINTEXT, Value: !Ref DataBucket }
          - { Name: ATL_WEB_BUCKET, Type: PLAINTEXT, Value: !Ref WebBucket }
          - { Name: ATL_LAB_STATE_BUCKET, Type: PLAINTEXT, Value: !Ref LabStateBucket }
          - { Name: ATL_LOCKS_TABLE, Type: PLAINTEXT, Value: !Ref LabLockTable }
          - { Name: ATL_PROVISIONER_ROLE_ARN, Type: PLAINTEXT, Value: !GetAtt ProvisionerRole.Arn }
          - { Name: ATL_WORKLOAD_BOUNDARY_ARN, Type: PLAINTEXT, Value: !Ref WorkloadBoundary }
          - { Name: ATL_AGENT_API_ENDPOINT, Type: PLAINTEXT, Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
          - { Name: ATL_ASG_MAX_SIZE_LIMIT, Type: PLAINTEXT, Value: !Ref AsgMaxSizeLimit }
          - { Name: ATL_WORKSTATION_INSTANCE_TYPE, Type: PLAINTEXT, Value: !Ref WorkstationInstanceType }
          - { Name: ATL_WORKSTATION_INSTANCE_PROFILE, Type: PLAINTEXT, Value: !Ref WorkstationInstanceProfile }
          - { Name: ATL_WORKSTATION_BUNDLE_URI, Type: PLAINTEXT, Value: !Sub 's3://${ArtifactsBucket}/releases/${ReleaseVersion}/atl-workstation.tar.gz' }
          - { Name: ATL_WORKSTATION_BUNDLE_SHA256, Type: PLAINTEXT, Value: !GetAtt CopyArtifacts.WorkstationBundleSha256 }
          - { Name: ATL_CHECKS_BUNDLE_DIGEST, Type: PLAINTEXT, Value: !GetAtt CopyArtifacts.ChecksBundleDigest }
      TimeoutInMinutes: !Ref RunnerTimeoutMinutes
      QueuedTimeoutInMinutes: 60
      ConcurrentBuildLimit: 2
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref RunnerLogGroup }
      Tags:
        - { Key: 'atl:component', Value: platform }
        - { Key: Project, Value: ATL }

  SessionsScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: atl-sessions
      Tags:
        - { Key: 'atl:component', Value: platform }
        - { Key: Project, Value: ATL }
  SystemScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: atl-system
      Tags:
        - { Key: 'atl:component', Value: platform }
        - { Key: Project, Value: ATL }

  TimerDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: atl-timer-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: 'atl:component', Value: platform }
        - { Key: Project, Value: ATL }

  # periodic watchdog: enabled only while there is something to sweep (atl-api / atl-timer toggle it, 01 §3.5)
  SweeperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: atl-sweeper
      GroupName: !Ref SystemScheduleGroup
      ScheduleExpression: 'rate(5 minutes)'
      ScheduleExpressionTimezone: UTC
      State: DISABLED
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt TimerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"kind":"SWEEP"}'
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 300 }
        DeadLetterConfig: { Arn: !GetAtt TimerDlq.Arn }
